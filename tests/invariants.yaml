# Boltrig binding-invariant catalogue (the K-29/K-30 ratchet input).
#
# Each entry is a binding invariant: a one-line meaning plus the pytest node ids
# that bind it (path::test_name). scripts/check_invariants.py cross-checks this
# file against the @pytest.mark.invariant(...) markers in tests/: every declared
# invariant MUST have at least one real test (no unbound claims), and every
# marker in the tests MUST be declared here (no undeclared invariants). Binding
# debt may only ever decrease. See docs/invariants.md for the human-readable map.
#
# Structure (parsed by a tiny stdlib reader; keep this exact shape):
#   invariants:
#     <ID>:
#       description: <one line>
#       tests:
#         - <path::test_name>
#
# Canonical source (per [2026] VJS-CC NANKLE-CONSOLIDATION 001, D2): every K-* id
# below is the canonical invariant id from agent-kernel-doctrine Appendix A
# (volume-1-the-rust-kernel/appendices/appendix-A-invariant-catalog.md). Boltrig
# binds these ids to tests; it does not define or renumber them. P*/SEC*/FR* ids
# are Boltrig-local (from the SRS) and never restate a K-*.

invariants:
  FR-ARC-01:
    description: Thin orchestration has a build-red accidental-dependency gate - direct imports and common dynamic-import forms in domain, ports, and application code may point only to their declared inward layers and the standard library.
    tests:
      - tests/unit/test_architecture_gate.py::test_thin_orchestration_layers_depend_inward_only
  SEC-144:
    description: An effective-authority value permits a verb only when every supplied current ceiling permits it - parent, profile, selected-skill requirements, workspace policy, and approval - while skill selection alone cannot widen the immutable value.
    tests:
      - tests/unit/test_orchestration_contracts.py::test_effective_authority_requires_every_current_ceiling
      - tests/unit/test_orchestration_contracts.py::test_skill_selection_cannot_widen_authority_and_refs_are_immutable
  SEC-145:
    description: Every runtime thread, turn, and normalized event uses non-empty identifiers and is bound to one exact Boltrig phase assignment; cross-assignment lifecycle responses or event correlations fail closed.
    tests:
      - tests/unit/test_orchestration_contracts.py::test_phase_lifecycle_rejects_a_cross_assignment_thread
      - tests/unit/test_orchestration_contracts.py::test_runtime_event_rejects_cross_assignment_thread_or_turn
  SEC-146:
    description: Runtime boundary JSON is copied into finite canonical immutable documents, while ephemeral bearer credentials are redacted, slot-isolated, and deliberately non-serializable.
    tests:
      - tests/unit/test_orchestration_contracts.py::test_canonical_json_is_copied_finite_and_immutable
      - tests/unit/test_orchestration_contracts.py::test_ephemeral_bearer_is_explicitly_revealed_but_not_serializable
  SEC-147:
    description: Every legacy spawn path treats selected-skill tool grants as requirements and intersects them with the current parent context before exposing tools, even when no optional extra ceiling is supplied.
    tests:
      - tests/integration/test_fleet_spawn.py::test_every_spawn_caps_skill_requirements_to_parent_authority
  SEC-148:
    description: Production AI execution never falls through to ambient process credentials, and a configured but unavailable sealed credential fails closed in every environment instead of silently using an env key.
    tests:
      - tests/security/test_ai_keys.py::test_production_runtime_refuses_ambient_ai_key_fallback
      - tests/security/test_ai_keys.py::test_configured_missing_ai_key_never_falls_through_to_ambient
  SEC-149:
    description: Legacy MCP run tokens are random, stored only by SHA-256 digest, expire within a bounded mandatory TTL, and become unusable immediately when revoked.
    tests:
      - tests/security/test_mcp_face.py::test_run_tokens_are_hashed_expiring_and_immediately_revocable
  SEC-150:
    description: The first Codex App Server client admits only the pinned stable omitted-jsonrpc protocol over a bounded local transport, hard-enforces a read-only sandbox with local approvals disabled, binds lifecycle responses to exact requested identifiers and policy, rejects every untyped server request fail closed, and never exposes peer payloads in errors.
    tests:
      - tests/unit/test_codex_app_server.py::test_read_only_lifecycle_uses_exact_monotonic_stable_shapes
      - tests/unit/test_codex_app_server.py::test_server_request_failure_is_generic_and_sanitized
  SEC-151:
    description: Effective runtime authority is the exact scope-bound intersection of the parent grant, profile ceiling, selected-skill requirements, workspace policy, and current durable approval state; no skill, approval, prompt, message, or mismatched tenant/workspace policy may widen it.
    tests:
      - tests/unit/test_effective_authority_evaluator.py::test_all_five_layers_reduce_candidates_in_fixed_explainable_order
      - tests/unit/test_effective_authority_evaluator.py::test_selected_skill_requirements_can_never_grant_parent_authority
  SEC-152:
    description: Codex and Opbox workers receive only opaque short-lived grant bearers bound to one exact tenant, workspace, root, phase, assignment, policy generation, and immutable authority evaluation; durable state contains only the token digest and concrete verbs, while expiry, replacement, assignment cancellation, and root cancellation fail closed immediately.
    tests:
      - tests/unit/test_run_grant_leases.py::test_issue_uses_trusted_snapshot_and_persists_only_digest
      - tests/unit/test_run_grant_leases.py::test_exact_and_assignment_cancellation_revoke_immediately
  FR-RUN-19:
    description: Boltrig admits only the exact reviewed Codex 0.144.3 Linux binary and canonical stable-v2 App Server schema, keeps experimental APIs disabled, and permits only stdio or a private Unix socket rather than a remote WebSocket listener.
    tests:
      - tests/unit/test_codex_protocol_pin.py::test_checked_in_codex_protocol_pin_is_exact
      - tests/unit/test_codex_protocol_pin.py::test_cli_verification_generates_only_stable_schema
  FR-RUN-20:
    description: Boltrig owns one canonical, exactly scoped and versioned root-run to phase to work-item to assignment to result to verification ledger with explicit legal transitions, durable terminal metadata, store-assigned event order, and transactional-outbox delivery state.
    tests:
      - tests/unit/test_execution_ledger_models.py::test_root_phase_work_assignment_are_scoped_pinned_and_boltrig_owned
      - tests/unit/test_execution_ledger_models.py::test_lifecycle_matrices_and_terminal_metadata_fail_closed
      - tests/unit/test_execution_transport_models.py::test_pending_recorded_event_and_outbox_keep_scopes_and_keys_distinct
  SEC-153:
    description: Organisation users and phase modes have one exact canonical vocabulary across orchestration and storage; runtime identities are credential-free tenant-workspace composites, and every Codex binding is a Boltrig-owned scoped observation that cannot mutate ledger authority.
    tests:
      - tests/unit/test_execution_ledger_models.py::test_runtime_identity_is_composite_scoped_and_contains_no_auth_state
      - tests/unit/test_execution_ledger_models.py::test_fleet_and_ledger_share_one_exact_principal_and_phase_mode_vocabulary
      - tests/unit/test_execution_transport_models.py::test_codex_bindings_are_scoped_boltrig_owned_and_explicitly_observational
  SEC-154:
    description: Execution commands use a server-computed canonical digest for replay/conflict decisions, while normalized event payloads and counters are bounded, canonical, control-safe, signed-BIGINT-safe, and reject credential-bearing keys before persistence.
    tests:
      - tests/unit/test_execution_transport_models.py::test_command_digest_is_server_computed_and_models_replay_vs_conflict
      - tests/unit/test_execution_transport_models.py::test_event_payload_is_exact_bounded_sensitive_free_and_normalized
      - tests/unit/test_execution_transport_models.py::test_durable_values_reject_controls_and_signed_bigint_overflow
  SEC-155:
    description: Every Codex phase receives a bounded deterministic read-only workspace snapshot that excludes nested repository and Codex control layers and rejects symlinks, special files, traversal, overlap, races, and allocation overflow before the runtime starts.
    tests:
      - tests/unit/test_skill_artifacts.py::test_workspace_projection_excludes_control_layers_at_every_depth
      - tests/unit/test_skill_artifacts.py::test_workspace_rejects_symlinks_and_special_files
  SEC-156:
    description: Boltrig materializes only exact digest-pinned selected skills, force-reloads Codex discovery, and admits a thread only when the enabled name, path, scope, and bytes exactly match the generation-bound allowlist; unselected built-ins, errors, drift, and skills/changed invalidate the receipt fail closed.
    tests:
      - tests/unit/test_skill_artifacts.py::test_materializes_only_exact_digest_pinned_selected_skills
      - tests/unit/test_skill_attestation.py::test_exact_enabled_allowlist_attests_with_disabled_system_skill_visible
      - tests/unit/test_skill_attestation.py::test_skills_changed_invalidates_until_a_new_attestation_is_accepted
      - tests/unit/test_skill_discovery.py::test_unselected_bundled_skill_must_be_disabled
      - tests/unit/test_skill_discovery.py::test_digest_drift_after_materialization_fails_closed
  SEC-159:
    description: Codex runtime configuration is deterministically composed from a private revalidated request snapshot with secretless command authentication, read-only sandboxing, approvals and every reviewed dynamic surface disabled, lexically cell-local helper and skill paths, and exact receipt-to-TOML coherence; coherent forgeries cannot widen helper or skill policy, request repr is redacted and pickle/copy serialization is blocked, and production readiness remains false until trusted-root, no-symlink, and evidence verification are wired.
    tests:
      - tests/unit/test_codex_runtime_config.py::test_composes_exact_secretless_read_only_config_and_receipt
      - tests/unit/test_codex_runtime_config.py::test_caller_constructible_surface_digests_never_grant_dynamic_surfaces
      - tests/unit/test_codex_runtime_config_adversarial.py::test_compose_revalidates_a_request_mutated_after_construction
      - tests/unit/test_codex_runtime_config_adversarial.py::test_compose_uses_a_private_snapshot_after_validation
      - tests/unit/test_codex_runtime_config_adversarial.py::test_self_consistent_receipt_cannot_move_helper_outside_cell
      - tests/unit/test_codex_runtime_config_adversarial.py::test_self_consistent_receipt_cannot_widen_skill_policy
  SEC-161:
    description: Capability-effect attestations can only reject an existing exact assignment authority snapshot - admission binds tenant, workspace, root, phase, assignment, authority evaluation id/digest/generation, catalog generation/digest, and the complete verb-definition/classification set; only READ_ONLY_NO_EXTERNAL_EFFECT with LOW consequence, or an exact empty no-tool set, admits, while egress, mutation, high consequence, drift, partial/broader evidence, subclass spoofing, and malformed evidence fail closed.
    tests:
      - tests/unit/test_capability_attestation.py::test_exact_safe_set_admits_only_the_existing_authority_snapshot
      - tests/unit/test_capability_attestation_adversarial.py::test_attestations_can_only_reject_and_never_seed_authority
  SEC-162:
    description: Root routing is fused with insert-once persistence into one governed admission - every root obtains exactly one authoritative persisted decision through a single admit surface (no route-only or peek bypass), replaying the same trusted facts returns the identical persisted object without a second record, concurrent admission of one root resolves to one winner plus exact replays sharing one identity, and facts that drifted from immutable history are rejected without overwriting the retained decision.
    tests:
      - tests/unit/test_root_admission.py::test_root_admission_persists_one_decision_and_replays_the_same_object
      - tests/unit/test_root_admission.py::test_concurrent_admission_resolves_to_one_persisted_identity
      - tests/unit/test_root_admission.py::test_drifted_root_facts_are_rejected_without_overwrite
      - tests/unit/test_root_admission.py::test_admission_exposes_no_route_only_or_peek_bypass
  SEC-163:
    description: Minting an assignment's capability-attestation evidence is fused with persisting the assignment into one governed admission - an assignment reaches the ledger only with a retained attestation set behind it, the set is minted against a binding DERIVED from the assignment record rather than one handed in, the reference the record carries is built from the set the store retained rather than the local copy submitted to it, evidence the finished record cannot name fails closed, a refused ledger leaves a benign orphaned set and never a dangling reference, and re-admitting the same trusted facts replays over both the memory and PostgreSQL stores without a duplicate or a conflict.
    tests:
      - tests/unit/test_assignment_admission.py::test_admission_mints_attests_and_persists_one_assignment
      - tests/unit/test_assignment_admission.py::test_admitting_the_same_trusted_facts_twice_replays
      - tests/unit/test_assignment_admission.py::test_admission_exposes_no_binding_pin_or_mint_only_bypass
      - tests/unit/test_assignment_admission.py::test_the_reference_carried_is_the_stores_retained_set_not_the_local_copy
      - tests/unit/test_assignment_admission.py::test_a_retained_set_the_assignment_cannot_name_fails_closed
      - tests/unit/test_assignment_admission.py::test_a_refused_ledger_leaves_an_orphaned_set_and_no_dangling_reference
      - tests/store/test_postgres_assignment_admission.py::test_postgres_admission_mints_attests_and_persists
      - tests/store/test_postgres_assignment_admission.py::test_postgres_admitting_the_same_trusted_facts_twice_replays
  SEC-170:
    description: The Codex read-only ledger scaffold is a total no-op behind BOLTRIG_CODEX_LEDGER - flag off (the default) constructs nothing and parks None on app.state.platform, so no admission service exists and nothing calls admit; flag on constructs both the root-routing and assignment admission services behind an OFF policy and still calls nothing.
    tests:
      - tests/unit/test_codex_execution.py::test_codex_ledger_defaults_off_and_builds_no_stack
      - tests/unit/test_codex_execution.py::test_flag_on_constructs_both_admission_services
      - tests/integration/test_codex_execution_platform.py::test_platform_parks_none_when_flag_off
  SEC-171:
    description: Capabilities are reconciled scoped-declaratively - a manifest apply is declarative over the capabilities it authored (source='manifest') and additive over governed control-plane grants; a manifest-sourced capability a redeployed manifest no longer declares is soft-deactivated (and can no longer be routed to) while a control-plane grant survives, a name re-declared by the manifest reclaims manifest ownership and reconciles thereafter, and the mass-deactivation guard aborts the whole apply (nothing committed) on an empty manifest or an over-threshold drop unless an explicit confirm overrides.
    tests:
      - tests/integration/test_manifest_reconciliation.py::test_dropped_manifest_capability_deactivates_and_stops_routing
      - tests/integration/test_manifest_reconciliation.py::test_control_plane_capability_survives_a_manifest_that_omits_it
      - tests/integration/test_manifest_reconciliation.py::test_name_from_both_paths_becomes_manifest_and_reconciles
      - tests/integration/test_manifest_reconciliation.py::test_empty_manifest_aborts_without_confirm_and_succeeds_with_it
      - tests/integration/test_manifest_reconciliation.py::test_over_threshold_drop_aborts_without_confirm_and_succeeds_with_it
  P9:
    description: Backend unavailability degrades gracefully, never crashes (graceful degradation).
    tests:
      - tests/kernel/test_ratelimit_degraded.py::test_degraded_mode_when_backend_down
  FR-OPS-01:
    description: Alembic is the authoritative ordered schema chain - its immutable baseline plus head revisions produce the same PostgreSQL catalogue as schema.sql bootstrap.
    tests:
      - tests/integration/test_migration_parity.py::test_alembic_baseline_is_immutable
      - tests/integration/test_migration_parity.py::test_alembic_head_matches_bootstrap_schema
      - tests/integration/test_migration_parity.py::test_data_bearing_rls_database_upgrades_from_previous_head
      - tests/unit/test_bootstrap_store.py::test_runtime_store_never_replays_mutable_bootstrap
  US-IAM-02:
    description: Row-level department isolation - an engineer cannot list another department's queue.
    tests:
      - tests/security/test_department_isolation.py::test_engineer_sees_only_their_department
      - tests/security/test_department_isolation.py::test_engineer_cannot_see_other_department
  US-KER-05:
    description: Discovery is caller-scoped - capabilities omit verbs outside the caller's grants.
    tests:
      - tests/security/test_discovery_scope.py::test_scoped_caller_sees_only_scoped_verbs
  US-FLT-04:
    description: Spawn selects a preferred capable capability when requested, otherwise the cheapest capable runtime for a child agent.
    tests:
      - tests/integration/test_fleet_spawn.py::test_cheapest_capable_runtime_chosen
      - tests/integration/test_fleet_spawn.py::test_preferred_capability_chosen_when_capable
  US-FLT-05:
    description: A pending work item is claimed exactly once across concurrent claimers and an expired lease is reclaimable (attempts increments per claim).
    tests:
      - tests/store/test_durable_delegation.py::test_pending_item_claimed_exactly_once_concurrently
      - tests/store/test_durable_delegation.py::test_expired_lease_is_reclaimable_and_attempts_increment
      - tests/store/test_durable_delegation.py::test_claim_is_tenant_scoped_and_skips_unclaimable
  US-FLT-06:
    description: A filed work item completes through the org - the pump claims it, the Chief of Staff routes it, a department head decomposes and spawns child work items, the results join onto the parent, and the status walks pending -> in_flight -> done with the steps checkpointed and the spawns audited.
    tests:
      - tests/integration/test_delegation_pump.py::test_filed_work_item_completes_through_the_org
      - tests/integration/test_delegation_pump.py::test_durable_lane_enqueues_the_same_registered_body
  US-FLT-07:
    description: Degraded results are first-class - a degraded runtime result is marked degraded end to end (spawn result, audit row, chat reply, persisted work item) and is never presented as ordinary success; a convergent item whose aggregate is degraded parks for a human, never DONE.
    tests:
      - tests/integration/test_degraded_honesty.py::test_spawn_without_runtime_is_marked_degraded_and_audited
      - tests/integration/test_degraded_honesty.py::test_agent_invoker_runtime_failure_is_marked_degraded_not_echoed
      - tests/integration/test_degraded_honesty.py::test_chat_turn_surfaces_a_degraded_spawn
      - tests/store/test_durable_delegation.py::test_work_item_degraded_result_attempts_roundtrip
      - tests/integration/test_delegation_pump.py::test_convergent_degraded_aggregate_parks_for_a_human_never_done
      - tests/integration/test_delegation_pump.py::test_chat_turn_persists_new_work_items_and_stamps_degraded
  US-EXE-05:
    description: Executor selection is honest and optionally fail-closed - with BOLTRIG_REQUIRE_DURABLE set a durable-engine failure refuses to boot instead of silently falling back, and the selected executor's durability is recorded.
    tests:
      - tests/integration/test_executor_selection.py::test_require_durable_refuses_to_fall_back
      - tests/integration/test_executor_selection.py::test_default_falls_back_to_local_with_durable_false
      - tests/integration/test_executor_selection.py::test_local_enqueue_runs_inline_and_push_event_records
  US-EXE-06:
    description: Retries are capped - a transient failure re-queues the item until max_attempts then fails it with the error recorded; blocked / cap-breach work escalates to a human (AWAITING_HUMAN + HITL) instead of retrying forever.
    tests:
      - tests/integration/test_delegation_pump.py::test_transient_failure_requeues_until_the_cap_then_fails
      - tests/integration/test_delegation_pump.py::test_cap_breach_escalates_to_a_human_and_requeue_restores_it
  US-EXE-07:
    description: Fan-out caps are enforced by atomic store-backed counters shared across workers - the increment past the cap is refused, including under concurrency and across pump instances sharing one store.
    tests:
      - tests/store/test_durable_delegation.py::test_fanout_cap_refuses_the_increment_past_cap
      - tests/store/test_durable_delegation.py::test_fanout_cap_holds_under_concurrent_increments
      - tests/integration/test_delegation_pump.py::test_two_pumps_over_one_store_cannot_jointly_exceed_the_fanout_cap
  SEC-29:
    description: Test-spawns/eval run under the initiator's grants - no escalation.
    tests:
      - tests/security/test_round_three.py::test_test_spawn_cannot_escalate
  SEC-30:
    description: A personal agent acts only with the owner's delegated authority (on-behalf-of, capped).
    tests:
      - tests/security/test_round_three.py::test_personal_agent_is_delegated_only
  SEC-31:
    description: Memory is scope-isolated - cross-user/cross-department reads are denied.
    tests:
      - tests/security/test_round_three.py::test_memory_scope_isolation
  SEC-32:
    description: Authoring/admin is RBAC-gated and audited with the actor.
    tests:
      - tests/security/test_round_three.py::test_authoring_requires_role_and_is_audited
  SEC-33:
    description: Cost/audit/runs insight is scope-filtered - a department cannot read another's run or reconstruct it through the audit tree; unknown and out-of-scope run ids are indistinguishable 404s.
    tests:
      - tests/security/test_round_three.py::test_audit_and_runs_are_scope_filtered
      - tests/security/test_audit_tree_scope.py::test_audit_tree_denies_cross_department_root_and_prunes_every_hidden_node
      - tests/security/test_audit_tree_scope.py::test_audit_tree_unknown_and_foreign_tenant_are_indistinguishable_404s
      - tests/security/test_audit_tree_scope.py::test_audit_tree_rejects_parent_only_when_root_rows_were_scope_filtered
  FR-OBS-02:
    description: The audit browser and execution tree are scope-filtered (and search/run links preserved); every tree node and aggregate is computed only from authorized rows while unrestricted callers retain the complete tree.
    tests:
      - tests/security/test_round_three.py::test_audit_and_runs_are_scope_filtered
      - tests/security/test_audit_tree_scope.py::test_audit_tree_denies_cross_department_root_and_prunes_every_hidden_node
      - tests/security/test_audit_tree_scope.py::test_audit_tree_rejects_parent_only_when_root_rows_were_scope_filtered
      - tests/security/test_audit_tree_scope.py::test_audit_tree_preserves_legitimate_child_only_root
      - tests/security/test_audit_tree_scope.py::test_unrestricted_audit_tree_preserves_complete_authorized_aggregate
  FR-OBS-08:
    description: Platform runtime status is authenticated, never public health.
    tests:
      - tests/security/test_platform_status.py::test_platform_status_requires_authentication
  FR-OBS-09:
    description: Platform runtime status is bounded and redacts URLs, keys, tokens, and credentials.
    tests:
      - tests/security/test_platform_status.py::test_platform_status_is_bounded_and_redacted
  FR-OBS-10:
    description: Platform runtime status is a snapshot endpoint and does not publish to run event streams.
    tests:
      - tests/security/test_platform_status.py::test_platform_status_does_not_publish_run_events
  FR-OBS-11:
    description: Model telemetry is authenticated, scope-filtered, bounded, aggregated from audit rows, and never exposes URLs, keys, or credentials.
    tests:
      - tests/security/test_platform_status.py::test_model_telemetry_requires_authentication
      - tests/security/test_platform_status.py::test_model_telemetry_is_aggregated_scoped_and_redacted
      - tests/integration/test_fleet_spawn.py::test_spawn_audit_records_latency_for_model_telemetry
  FR-OBS-12:
    description: Console overview is authenticated, bounded, workspace-scoped, and exposes only redacted platform/model/cost/budget/run/approval summaries.
    tests:
      - tests/security/test_console_overview.py::test_console_overview_requires_authentication
      - tests/security/test_console_overview.py::test_console_overview_is_scoped_bounded_and_redacted
  FR-OBS-13:
    description: Langfuse is an optional best-effort observability mirror; it runs only after audit persistence, never blocks spawn completion, and emits only bounded metadata without prompts, outputs, URLs, keys, tokens, or identity.
    tests:
      - tests/security/test_langfuse_sink.py::test_langfuse_payload_is_bounded_and_redacts_route_connection_data
      - tests/security/test_langfuse_sink.py::test_langfuse_sink_emits_event_and_flushes
      - tests/security/test_langfuse_sink.py::test_langfuse_sink_failure_is_swallowed
      - tests/security/test_langfuse_sink.py::test_langfuse_sink_timeout_is_swallowed
      - tests/security/test_langfuse_sink.py::test_langfuse_builder_defaults_to_noop_without_keys
      - tests/integration/test_fleet_spawn.py::test_spawn_audit_survives_observability_sink_failure
      - tests/integration/test_fleet_spawn.py::test_observability_sink_runs_after_audit_persist
  FR-EVAL-02:
    description: An eval runs through the chokepoint under a defined scope, no escalation.
    tests:
      - tests/security/test_round_three.py::test_eval_runs_without_escalation
  FR-ADM-02:
    description: Admin config round-trips to a manifest and supports rollback (C1, NFR-REL-01).
    tests:
      - tests/integration/test_round_three_studios.py::test_admin_config_round_trips
  FR-WFS-04:
    description: A registered workflow becomes a live durable run with the durable executor.
    tests:
      - tests/integration/test_round_three_studios.py::test_workflow_live_durable_registration
  FR-ADS-02:
    description: Adapter Studio binds a generated adapter's verbs only after a named review (gate).
    tests:
      - tests/integration/test_round_three_studios.py::test_adapter_studio_review_gate
  US-WFL-02:
    description: Workflow synthesis uses a reasoning runtime when present, else a deterministic fallback.
    tests:
      - tests/integration/test_workflow_synthesis.py::test_reasoned_synthesis_uses_runtime_steps
      - tests/integration/test_workflow_synthesis.py::test_reasoned_falls_back_to_deterministic_offline
  US-WFL-03:
