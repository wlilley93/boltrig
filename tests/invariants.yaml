  # --- the delegated (pump) lane runs at the requesting principal's authority ---
  SEC-164:
    description: The delegated pump lane executes a work item at the REQUESTING principal's authority, never the tenant permission ceiling - the item's on_behalf_of/workspace_id resolve through the same effective_grants_for_request the request path uses, so a low-privilege principal's item cannot receive or dispatch a verb its principal lacks even when the selected skill declares that tool grant, a principal holding the verb still gets it, a deactivated principal carries nothing, and an item naming no principal (or one with no user record) fails closed to EMPTY_GRANTS rather than inheriting the tenant ceiling. The tenant ceiling remains the separate axis GrantChecker enforces at dispatch, and on_behalf_of provenance through the tree and the audit trail is unchanged. This aligns the pump with the SEC-29 / SEC-78 / SEC-139 capping every other spawn entry point already applies.
    tests:
      - tests/security/test_pump_principal_authority.py::test_low_privilege_principals_item_cannot_execute_a_verb_it_lacks
      - tests/security/test_pump_principal_authority.py::test_a_principal_holding_the_verb_still_gets_it
      - tests/security/test_pump_principal_authority.py::test_a_tenant_wide_principal_is_still_bound_by_a_narrow_tenant_ceiling
      - tests/security/test_pump_principal_authority.py::test_an_unidentified_principal_carries_no_authority
      - tests/security/test_pump_principal_authority.py::test_a_deactivated_principal_carries_no_authority
