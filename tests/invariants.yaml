      - tests/security/test_pump_principal_authority.py::test_on_behalf_of_is_still_carried_through_the_tree_and_the_audit
  SEC-165:
    description: Pump routing fails closed - a work item routed to a department with no configured head is parked for a human (an AWAITING_HUMAN escalation) rather than silently executing under an arbitrary fallback head, because the run's context claims owner_member as its principal_scope and a mis-route would make that scope claim untrue. Nothing spawns for an unroutable item.
