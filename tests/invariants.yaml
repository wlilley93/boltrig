# Boltrig binding-invariant catalogue (the K-29/K-30 ratchet input).
#
# Each entry is a binding invariant: a one-line meaning plus the pytest node ids
# that bind it (path::test_name). scripts/check_invariants.py cross-checks this
# file against the @pytest.mark.invariant(...) markers in tests/: every declared
# invariant MUST have at least one real test (no unbound claims), and every
# marker in the tests MUST be declared here (no undeclared invariants). Binding
# debt may only ever decrease. See docs/invariants.md for the human-readable map.
#
# Structure (parsed by a tiny stdlib reader; keep this exact shape):
#   invariants:
#     <ID>:
#       description: <one line>
#       tests:
#         - <path::test_name>
#
# Canonical source (per [2026] VJS-CC NANKLE-CONSOLIDATION 001, D2): every K-* id
# below is the canonical invariant id from agent-kernel-doctrine Appendix A
# (volume-1-the-rust-kernel/appendices/appendix-A-invariant-catalog.md). Boltrig
# binds these ids to tests; it does not define or renumber them. P*/SEC*/FR* ids
# are Boltrig-local (from the SRS) and never restate a K-*.

invariants:
  P9:
    description: Backend unavailability degrades gracefully, never crashes (graceful degradation).
    tests:
      - tests/kernel/test_ratelimit_degraded.py::test_degraded_mode_when_backend_down
  US-IAM-02:
    description: Row-level department isolation - an engineer cannot list another department's queue.
    tests:
      - tests/security/test_department_isolation.py::test_engineer_sees_only_their_department
      - tests/security/test_department_isolation.py::test_engineer_cannot_see_other_department
  US-KER-05:
    description: Discovery is caller-scoped - capabilities omit verbs outside the caller's grants.
    tests:
      - tests/security/test_discovery_scope.py::test_scoped_caller_sees_only_scoped_verbs
  US-FLT-04:
    description: Spawn selects the cheapest capable runtime for a child agent.
    tests:
      - tests/integration/test_fleet_spawn.py::test_cheapest_capable_runtime_chosen
  US-FLT-05:
    description: A pending work item is claimed exactly once across concurrent claimers and an expired lease is reclaimable (attempts increments per claim).
    tests:
      - tests/store/test_durable_delegation.py::test_pending_item_claimed_exactly_once_concurrently
      - tests/store/test_durable_delegation.py::test_expired_lease_is_reclaimable_and_attempts_increment
      - tests/store/test_durable_delegation.py::test_claim_is_tenant_scoped_and_skips_unclaimable
  US-FLT-06:
    description: A filed work item completes through the org - the pump claims it, the Chief of Staff routes it, a department head decomposes and spawns child work items, the results join onto the parent, and the status walks pending -> in_flight -> done with the steps checkpointed and the spawns audited.
    tests:
      - tests/integration/test_delegation_pump.py::test_filed_work_item_completes_through_the_org
      - tests/integration/test_delegation_pump.py::test_durable_lane_enqueues_the_same_registered_body
  US-FLT-07:
    description: Degraded results are first-class - a degraded runtime result is marked degraded end to end (spawn result, audit row, chat reply, persisted work item) and is never presented as ordinary success; a convergent item whose aggregate is degraded parks for a human, never DONE.
    tests:
      - tests/integration/test_degraded_honesty.py::test_spawn_without_runtime_is_marked_degraded_and_audited
      - tests/integration/test_degraded_honesty.py::test_chat_turn_surfaces_a_degraded_spawn
      - tests/store/test_durable_delegation.py::test_work_item_degraded_result_attempts_roundtrip
      - tests/integration/test_delegation_pump.py::test_convergent_degraded_aggregate_parks_for_a_human_never_done
      - tests/integration/test_delegation_pump.py::test_chat_turn_persists_new_work_items_and_stamps_degraded
  US-EXE-05:
    description: Executor selection is honest and optionally fail-closed - with BOLTRIG_REQUIRE_DURABLE set a durable-engine failure refuses to boot instead of silently falling back, and the selected executor's durability is recorded.
    tests:
      - tests/integration/test_executor_selection.py::test_require_durable_refuses_to_fall_back
      - tests/integration/test_executor_selection.py::test_default_falls_back_to_local_with_durable_false
      - tests/integration/test_executor_selection.py::test_local_enqueue_runs_inline_and_push_event_records
  US-EXE-06:
    description: Retries are capped - a transient failure re-queues the item until max_attempts then fails it with the error recorded; blocked / cap-breach work escalates to a human (AWAITING_HUMAN + HITL) instead of retrying forever.
    tests:
      - tests/integration/test_delegation_pump.py::test_transient_failure_requeues_until_the_cap_then_fails
      - tests/integration/test_delegation_pump.py::test_cap_breach_escalates_to_a_human_and_requeue_restores_it
  US-EXE-07:
    description: Fan-out caps are enforced by atomic store-backed counters shared across workers - the increment past the cap is refused, including under concurrency and across pump instances sharing one store.
    tests:
      - tests/store/test_durable_delegation.py::test_fanout_cap_refuses_the_increment_past_cap
      - tests/store/test_durable_delegation.py::test_fanout_cap_holds_under_concurrent_increments
      - tests/integration/test_delegation_pump.py::test_two_pumps_over_one_store_cannot_jointly_exceed_the_fanout_cap
  SEC-29:
    description: Test-spawns/eval run under the initiator's grants - no escalation.
