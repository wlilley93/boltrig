      - tests/security/test_principal_context_binding.py::test_skill_and_personal_routes_cannot_spoof_principal_authority
      - tests/security/test_principal_context_binding.py::test_spawn_runtime_and_mcp_preserve_trusted_principal_metadata
  SEC-08:
    description: Tenant isolation - no cross-tenant discovery or dispatch (fail-closed), both stores.
    tests:
      - tests/security/test_tenant_isolation.py::test_other_tenant_cannot_see_this_tenants_verbs
      - tests/security/test_tenant_isolation.py::test_other_tenant_dispatch_fails_closed
      - tests/store/test_postgres_store.py::test_cross_tenant_fails_closed
  SEC-65:
    description: DB-enforced tenant isolation (RLS) - under FORCE row-level security a non-bypassing role sees only its app.tenant_id rows, cannot write into another tenant (WITH CHECK), and an unset GUC yields zero rows (fail-closed); and the live wiring sets app.tenant_id from the request context before every statement.
    tests:
      - tests/integration/test_rls.py::test_rls_enforces_tenant_isolation_and_fails_closed
      - tests/unit/test_rls_pool.py::test_rls_pool_sets_tenant_guc_before_each_statement
      - tests/unit/test_rls_pool.py::test_rls_pool_is_fail_closed_when_no_tenant_bound
      - tests/unit/test_rls_pool.py::test_set_recovery_codes_applies_tenant_guc_before_writing
      - tests/security/test_rls_auth_binding.py::test_pat_resolution_binds_tenant_before_the_owner_read
      - tests/security/test_rls_auth_binding.py::test_provision_user_binds_tenant_before_the_first_read
      - tests/integration/test_migration_parity.py::test_data_bearing_rls_database_upgrades_from_previous_head
  SEC-13:
    description: PII is detected and redacted before it leaves the boundary.
    tests:
      - tests/security/test_budget_and_pii.py::test_pii_redaction
  SEC-14:
    description: High-consequence / blocking verbs pause for human approval and cannot be bypassed - an approval is single-use and bound to the exact tenant, verb, canonical params, authenticated/delegated initiator, and mutable resource snapshot; only an explicitly authorised assigned human independent of the direct/delegated requester may answer it.
    tests:
      - tests/security/test_hitl_gate.py::test_blocking_verb_pauses_for_approval
      - tests/security/test_hitl_gate.py::test_resumes_after_approval
      - tests/security/test_hitl_gate.py::test_approval_is_single_use
      - tests/security/test_hitl_gate.py::test_approval_is_verb_bound_and_single_use
      - tests/security/test_hitl_gate.py::test_respond_rejects_agent_and_self_approval
      - tests/security/test_hitl_gate.py::test_respond_requires_verb_authority_assignee_and_delegation_separation
      - tests/security/test_hitl_gate.py::test_legacy_unbound_approval_fails_closed
      - tests/security/test_hitl_gate.py::test_escalation_answer_cannot_clear_high_consequence_gate
      - tests/security/test_hitl_gate.py::test_approval_is_bound_to_params_and_initiating_principal
      - tests/security/test_hitl_gate.py::test_mutable_adapter_approval_context_is_recomputed
      - tests/security/test_hitl_gate.py::test_approval_fingerprint_canonicalises_json_order_and_unicode
      - tests/store/test_store_parity.py::test_hitl_request_binding_round_trips
  SEC-16:
    description: Every action (allowed or denied) is audited, hash-chained, append-only.
    tests:
      - tests/kernel/test_audit_chain.py::test_every_action_is_audited
      - tests/kernel/test_audit_chain.py::test_denied_actions_are_also_audited
      - tests/kernel/test_audit_chain.py::test_concurrent_writes_keep_a_contiguous_verifiable_chain
  SEC-21:
    description: Verb params are schema-validated before any dispatch side effect.
    tests:
      - tests/kernel/test_dispatch.py::test_invalid_params_rejected_before_dispatch
  FR-KER-05:
    description: Per-verb / per-tenant rate limits are enforced at the kernel.
    tests:
      - tests/kernel/test_ratelimit_degraded.py::test_rate_limit_enforced
  FR-COST-02:
    description: A hard-stop budget halts before exceeding; a soft budget records overage only.
    tests:
      - tests/security/test_budget_and_pii.py::test_budget_hard_stop_halts_before_exceeding
      - tests/security/test_budget_and_pii.py::test_soft_budget_does_not_halt
      - tests/security/test_budget_and_pii.py::test_reserve_honors_atomic_store_refusal
  US-COST-02:
    description: A soft (non-hard-stop) budget fires exactly one pre-emptive alert when a reservation crosses the 0.8 threshold, and none below it.
    tests:
      - tests/security/test_budget_and_pii.py::test_soft_budget_fires_preemptive_alert_when_crossing_the_threshold
  FR-COST-03:
    description: The budget ledger is trued-up to ACTUAL usage post-run - the pre-run estimate is reconciled by the signed (actual - estimate) delta, and a degraded/zero-usage run refunds the whole estimate (audit M14).
    tests:
      - tests/security/test_cost_trueup.py::test_budget_trued_up_to_actual_after_run
      - tests/security/test_cost_trueup.py::test_degraded_run_refunds_the_estimate
  FR-COST-04:
    description: Cost is priced from a policy-as-data per-model price table - an explicit per-model micros-per-token rate wins, an unpriced model falls back to the cost-tier default (audit M14).
    tests:
      - tests/security/test_cost_trueup.py::test_model_price_from_config_overrides_tier_default
  FR-COST-05:
    description: The multi-scope budget reserve is transactional - debiting every scope in one all-or-nothing step so a concurrent reserve can never leave one scope charged for a call another scope refused (audit H4, engine-plan Phase 6). Verified on both store backends.
    tests:
      - tests/store/test_budget_atomic_reserve.py::test_multi_scope_reserve_is_all_or_nothing
      - tests/store/test_budget_atomic_reserve.py::test_reserve_debits_every_scope_when_all_fit
      - tests/store/test_budget_atomic_reserve.py::test_concurrent_multi_scope_reserves_cannot_partially_debit

  # --- Round Four: settings, account & access management (SEC-34..39) ---
  SEC-34:
    description: A personal access token never escalates (scope ∩ current grants, re-checked) and a deactivated/de-provisioned user's tokens stop working.
    tests:
      - tests/security/test_round_four.py::test_pat_never_escalates_and_dies_with_user
  SEC-35:
    description: Invitations do not bypass the IdP - they pre-stage a role/scope, grant no access until SSO login, and are consumed once.
    tests:
      - tests/security/test_round_four.py::test_invitations_do_not_bypass_idp
  SEC-36:
    description: Settings writes enforce RBAC server-side and are audited with the actor.
    tests:
      - tests/security/test_round_four.py::test_settings_changes_are_authz_checked_and_audited
  SEC-37:
    description: Headless REST/MCP runs the same chokepoint scoped to the user - no weak path.
    tests:
      - tests/security/test_round_four.py::test_headless_parity_no_weak_path
  SEC-38:
    description: No unauthenticated access to tokens or connection details (mobile/web follow the same auth rules).
    tests:
      - tests/security/test_round_four.py::test_no_unauthenticated_access_to_tokens
  SEC-39:
    description: An authored verb with a destructive/outbound name defaults to high-consequence so the HITL gate engages.
    tests:
      - tests/security/test_round_four.py::test_authored_verbs_safe_by_default
      - tests/security/test_channel_send.py::test_channel_send_is_high_consequence
      - tests/security/test_channel_send.py::test_channel_send_delivers_via_seam_and_is_tenant_scoped

  # --- Round Five: kernel-governed structured memory (SEC-40..45) ---
  SEC-40:
    description: The kernel is the memory isolation boundary at ingestion AND retrieval - a hostile cross-scope edge (incl multi-hop) cannot leak an out-of-scope fact.
    tests:
      - tests/security/test_round_five.py::test_kernel_is_the_isolation_boundary
      - tests/unit/test_vector_memory.py::test_vector_engine_recall_is_scope_bounded_multihop
      - tests/integration/test_pgvector_engine.py::test_pgvector_recall_is_scope_bounded_multihop
  MEM-VEC-01:
    description: Native vector recall ranks by cosine similarity - a fact sharing the query's terms outranks one that does not, an unrelated (cosine ~0) fact is not returned, and the in-process and pgvector engines agree.
    tests:
      - tests/unit/test_vector_memory.py::test_vector_recall_ranks_by_cosine
      - tests/integration/test_pgvector_engine.py::test_pgvector_recall_ranks_by_cosine
  SEC-41:
    description: Recalled memory is data, never authority - it cannot grant a caller a verb they lack.
    tests:
      - tests/security/test_round_five.py::test_memory_cannot_escalate
  SEC-42:
    description: Content is screened for injection/malware AND API secrets before it becomes memory; poison/secrets are rejected fail-closed, never persisted into any engine (Cognee or native). The secret scanner recognises PEM keys, Google/Slack/Stripe/Anthropic tokens and a high-entropy opaque-token fallback (M12), without tripping on hex SHAs, UUIDs or ordinary prose.
    tests:
      - tests/security/test_round_five.py::test_ingestion_screens_poison
      - tests/security/test_round_five.py::test_api_secret_is_never_remembered
      - tests/security/test_round_five.py::test_pem_private_key_is_never_remembered
      - tests/security/test_budget_and_pii.py::test_contains_secret_detects_pem_google_slack_stripe_anthropic_and_high_entropy
      - tests/security/test_budget_and_pii.py::test_contains_secret_does_not_trip_on_prose_uuid_or_git_sha
      - tests/integration/test_cognee_engine.py::test_cognee_engine_refuses_secret_content_directly
  SEC-43:
    description: Sensitive memory must use a local endpoint; a misroute is blocked and audited.
    tests:
      - tests/security/test_round_five.py::test_sensitive_memory_stays_local
  SEC-44:
    description: Erasure is complete (the node and its derived edges/facts), engine-confirmed, ledgered and audited.
    tests:
      - tests/security/test_round_five.py::test_complete_audited_erasure
      - tests/integration/test_pgvector_engine.py::test_pgvector_forget_is_complete
  SEC-45:
    description: Recall is least-privilege and audited - query and count are recorded, fact contents never are.
    tests:
      - tests/security/test_round_five.py::test_recall_is_audited_without_leaking_contents
  MEM-ENG-03:
    description: The adopted Cognee engine isolates one dataset per (tenant, scope) with an injective mapping - recall/forget only ever address the given scopes' datasets - and erasure is real (a recall after forget returns nothing, cognee side included).
    tests:
      - tests/integration/test_cognee_engine.py::test_dataset_mapping_is_per_tenant_scope_and_injective
      - tests/integration/test_cognee_engine.py::test_live_remember_recall_roundtrip_with_provenance
      - tests/integration/test_cognee_engine.py::test_live_recall_is_isolated_per_tenant_and_scope
      - tests/integration/test_cognee_engine.py::test_live_forget_erasure_is_real
  SEC-46:
    description: Conversation continuity is deterministic and append-only (an earlier turn's render is a prefix of a later one) and adds no authority - it composes only persisted text.
    tests:
      - tests/security/test_round_six.py::test_continuity_is_deterministic_and_append_only
  SEC-47:
    description: The model gateway binds per conversation (not per run), pins a conversation to one model across turns, and never re-routes sensitive data (residency preserved).
    tests:
      - tests/security/test_round_six.py::test_gateway_binds_per_conversation_not_run
      - tests/security/test_round_six.py::test_gateway_never_reroutes_sensitive_and_is_inert_when_unset
  FR-GW-01:
    description: The model gateway (Bifrost) is wired into the stack - a profile-gated bifrost service on sandbox, genesis/dev starts the gateway profile, and the documented /v1 gateway URL matches it - so activation is provider keys, not architecture work.
    tests:
      - tests/security/test_round_six.py::test_bifrost_is_wired_into_the_stack
  FR-GW-02:
    description: Bifrost/model profiles are config-only provider/model/base-url selections for standard data, while sensitive data ignores profiles and stays on the local residency endpoint.
    tests:
      - tests/security/test_model_routing.py::test_model_profile_selects_provider_model_and_route
      - tests/security/test_model_routing.py::test_model_profile_is_ignored_for_sensitive_data
      - tests/security/test_model_routing.py::test_manifest_model_profiles_feed_runtime_resolver
  FR-GW-03:
    description: The platform status surface reports the stack-owned model gateway as configured or inert, with cache/profile posture only, and never exposes gateway URLs, keys, tokens, or credentials.
    tests:
      - tests/security/test_platform_status.py::test_model_gateway_status_is_bounded_and_redacted
      - tests/security/test_platform_status.py::test_model_gateway_status_reports_inert_when_unconfigured
  FR-GW-04:
    description: Optional model-gateway live health polling is internal-host-only, bounded, fail-safe, and exposes only coarse health/cache/provider counts without gateway URLs, keys, tokens, or credentials.
    tests:
      - tests/security/test_model_gateway_live_health.py::test_model_gateway_live_health_polls_internal_endpoint_and_redacts_payload
      - tests/security/test_model_gateway_live_health.py::test_model_gateway_live_health_rejects_external_hosts_without_polling
      - tests/security/test_model_gateway_live_health.py::test_model_gateway_live_health_probe_failure_degrades_not_crashes
      - tests/security/test_model_routing.py::test_manifest_model_profiles_feed_runtime_resolver
  FR-SKILL-01:
    description: The skill shelf (skill.search) returns lightweight descriptions only - never the prompt_fragment body - and filters by query (progressive disclosure).
    tests:
      - tests/security/test_round_fifteen.py::test_skill_search_returns_descriptions_not_bodies
  FR-SKILL-02:
    description: skill.load composes the inheritance-merged body bound to the job's context, validated against the skill's context_requirements (ContextRequirementsUnmet on mismatch).
    tests:
      - tests/security/test_round_fifteen.py::test_skill_load_composes_body_and_binds_context
  SEC-57:
    description: The skill shelf runs the chokepoint (grant-checked, tenant-scoped) and a loaded skill is data not authority - load returns the skill's tool_grants but does not grant them, so it cannot escalate.
    tests:
      - tests/security/test_round_fifteen.py::test_skill_shelf_is_governed_and_load_does_not_escalate
  FR-EXT-01:
    description: A project adapter declared in the manifest by module_ref (a non-builtin id) is imported and registered at boot - extend the kernel from outside, no core edit.
    tests:
      - tests/integration/test_round_fifteen_bundle.py::test_project_adapter_loads_by_module_ref
  FR-EXT-02:
    description: External MCP servers declared in the manifest mcp.consume register inert at boot, exposing no verbs until the review/activate gate runs (SEC-22 preserved).
    tests:
      - tests/integration/test_round_fifteen_bundle.py::test_consumed_mcp_servers_register_inert_pending_review
  SEC-48:
    description: The Pi sidecar's network egress is enforced by the deploy manifests (sandbox-only, internal in the secure overlay), not merely documented.
    tests:
      - tests/security/test_round_six.py::test_pi_sidecar_egress_is_enforced_in_manifests
  SEC-49:
    description: Continuity is scope-safe - only the caller's own tenant/conversation history is ever composed into a prompt.
    tests:
      - tests/security/test_round_six.py::test_continuity_only_composes_the_callers_own_conversation
  FR-CTL-01:
    description: Agent/department profile config takes effect live (re-read per call via the provider), with no router reconstruction.
    tests:
      - tests/integration/test_round_seven.py::test_chief_of_staff_reloads_departments_live
  FR-CTL-02:
    description: The generic interpreter executes a stored workflow's steps in dependency order, each as its own durable boundary through the kernel, skipping descendants of a failed step.
    tests:
      - tests/integration/test_round_seven.py::test_interpreter_runs_steps_in_dependency_order_each_durable
      - tests/integration/test_round_seven.py::test_interpreter_skips_descendants_of_a_failed_step
  FR-CTL-03:
    description: The interpreter resolves control-plane node kinds locally (trigger.start/flow.end no-ops, flow.branch conditional with branch-gated children, flow.loop item count, code.run recognised-but-disabled) instead of failing on an unbound action.
    tests:
      - tests/integration/test_control_flow.py::test_trigger_and_end_are_no_ops_that_complete
      - tests/integration/test_control_flow.py::test_branch_runs_only_the_matching_arm
      - tests/integration/test_control_flow.py::test_branch_false_arm_runs_when_predicate_is_false
      - tests/integration/test_control_flow.py::test_loop_records_item_count_without_crashing
      - tests/integration/test_control_flow.py::test_loop_iterates_body_once_per_item
      - tests/integration/test_control_flow.py::test_loop_with_dynamic_items_from_parent_output
      - tests/integration/test_control_flow.py::test_code_run_is_recognised_but_not_executed
  SEC-50:
    description: Every workflow step is dispatched through the kernel chokepoint under the caller's own grants - a step can neither escalate nor bypass governance.
    tests:
      - tests/security/test_round_seven.py::test_workflow_step_cannot_escalate_past_caller_grants
  SEC-51:
    description: Control-plane config writes are dispatched as kernel verbs (grant-checked, audited, HITL-gateable), not an ungoverned store write.
    tests:
      - tests/security/test_round_seven.py::test_control_plane_write_is_grant_checked
      - tests/security/test_round_seven.py::test_control_plane_write_is_hitl_gated_and_audited
  SEC-52:
    description: web.fetch is SSRF-guarded and NetworkConfig-enforced - private/loopback/link-local/metadata targets, blocked or non-allowed domains, and air-gap are refused before any network call.
    tests:
      - tests/security/test_round_eight.py::test_ssrf_guard_blocks_internal_addresses
      - tests/security/test_round_eight.py::test_network_policy_enforced
      - tests/security/test_round_eight.py::test_adapter_refuses_internal_target_before_any_fetch
  SEC-53:
    description: Internet access is a governed verb - web.fetch runs the chokepoint (grant-checked and HITL-gated as a high-consequence verb), so it cannot bypass the kernel and injected content cannot escalate.
    tests:
      - tests/security/test_round_eight.py::test_web_fetch_is_grant_checked
      - tests/security/test_round_eight.py::test_web_fetch_is_hitl_gated
  SEC-54:
    description: The stack foundation layers never depend upward - models/store/adapters import only the foundation, keeping the seam a future repo-split would cleave along clean.
    tests:
      - tests/security/test_severability.py::test_foundation_layers_do_not_depend_upward
  FR-EVT-01:
    description: A verb invoked under a run publishes a paired tool_call + tool_result to that run's event stream; a failed call reports status with no output leak.
    tests:
      - tests/security/test_round_ten.py::test_verb_publishes_paired_tool_events
      - tests/security/test_round_ten.py::test_failed_verb_emits_error_result_without_leaking
  FR-EVT-02:
    description: Run events are a pure side-channel - a relay failure never breaks a call, a call with no run_id publishes nothing, and a paused call surfaces a hitl event.
    tests:
      - tests/security/test_round_ten.py::test_no_run_id_publishes_nothing_and_call_still_works
      - tests/security/test_round_ten.py::test_relay_failure_never_breaks_dispatch
      - tests/security/test_round_ten.py::test_pending_human_emits_hitl_event
  SEC-55:
    description: Run events are run-keyed and credential-free - a verb's events publish only to its own run's stream and never carry credential material.
    tests:
      - tests/security/test_round_ten.py::test_events_are_run_keyed_and_credential_free
  SEC-56:
    description: A run's event stream is tenant/scope-scoped end to end - relay backlog, live subscriptions, publish, and close are keyed by tenant plus run id, and the run-events endpoint streams only runs that produced audited activity in the caller's tenant and remain visible under the caller's department/workspace scope; even an authorised attacker who chooses the same run id cannot read or terminate another tenant's stream, while another tenant or same-tenant out-of-scope caller gets 404.
    tests:
      - tests/security/test_round_eleven.py::test_run_events_are_tenant_scoped
      - tests/security/test_round_eleven.py::test_same_tenant_scoped_user_cannot_read_unowned_run_events
      - tests/security/test_round_eleven.py::test_department_scoped_user_can_read_visible_work_run_events
      - tests/security/test_event_relay_tenant_scope.py::test_authorized_same_run_id_cannot_read_another_tenants_backlog
      - tests/security/test_event_relay_tenant_scope.py::test_same_run_id_live_publish_and_close_are_tenant_scoped
  FR-EVT-03:
    description: The run-events endpoint returns the events a run emitted as SSE frames (snapshot), and an unknown run is a 404.
    tests:
      - tests/security/test_round_eleven.py::test_unknown_run_is_404
  FR-EVT-04:
    description: The interpreter emits a workflow_step event per step (step_id + running/ok/failed/skipped) on the run's stream, bound to one run id so step events, the steps' tool events, and audit cohere.
    tests:
      - tests/integration/test_round_twelve.py::test_interpreter_emits_step_events_on_the_run_stream
      - tests/integration/test_round_twelve.py::test_skipped_descendant_emits_skipped_step_event
  SEC-58:
    description: Edge/web hardening - the kernel app stamps security headers (HSTS/nosniff/frame-deny/CSP) on every response, validates the Host header, and caps request-body size (WEB-02/03/06, RES-01).
    tests:
      - tests/security/test_round_sixteen.py::test_security_headers_host_and_body_cap
  SEC-59:
    description: JWT verification pins an explicit algorithm allowlist, rejects an ID token used as an access token, and rejects a token with no expiry (IAM-02/03/04).
    tests:
      - tests/security/test_round_sixteen.py::test_jwt_alg_allowlist_and_access_token_only
  SEC-60:
    description: Dev auth is impossible in production - the header-trusting resolver refuses to start when a production signal is present (IAM-09).
    tests:
      - tests/security/test_round_sixteen.py::test_dev_auth_refuses_production_signal
  SEC-61:
    description: The shared egress guard blocks cloud-metadata / link-local targets for every HTTP adapter (not just web.fetch), closing the SSRF to IMDS token-theft path (INJ-02 / CLOUD-03); and it PINS the vetted resolution - every egress client connects to the audited IP literal (host/SNI preserved), so a low-TTL domain cannot re-resolve to internal space between the check and the connect (H2 DNS-rebinding TOCTOU).
    tests:
      - tests/security/test_round_sixteen.py::test_shared_egress_guard_blocks_metadata
      - tests/security/test_egress_pinning.py::test_egress_rejects_dns_rebind_between_check_and_connect
      - tests/security/test_egress_pinning.py::test_pinned_client_uses_vetted_ip_and_preserves_host
      - tests/security/test_egress_pinning.py::test_pinned_client_refuses_internal_resolution
  SEC-62:
    description: A Unicode-confusable or non-canonical verb id can never match a grant - matching is NFKC-normalised and restricted to a safe identifier charset (UPLOAD-05 / AZ-02).
    tests:
      - tests/security/test_round_sixteen.py::test_confusable_verb_id_never_matches_a_grant
  SEC-63:
    description: An inbound webhook carrying a timestamp outside the replay window is rejected, so a captured signed request cannot replay forever (ADP-08).
    tests:
      - tests/security/test_round_sixteen.py::test_webhook_replay_window
  SEC-64:
    description: The first-party app containers are hardened (INF-01) - read-only rootfs, all caps dropped, no-new-privileges, resource-capped, and non-root images - enforced in the deploy manifests so it cannot silently regress.
    tests:
      - tests/security/test_round_seventeen.py::test_app_containers_are_hardened
      - tests/security/test_round_seventeen.py::test_app_images_run_non_root
  SEC-66:
    description: Inbound webhook replay is defeated - the timestamp is bound into the signed HMAC (t.body) so a captured signature cannot replay under a rewritten timestamp, a signing secret makes a timestamp mandatory, and a stable delivery id dedups a genuine replay so it never mints a second work item (M3).
    tests:
      - tests/security/test_channel_inbound.py::test_webhook_replay_with_rewritten_timestamp_rejected
      - tests/security/test_channel_inbound.py::test_duplicate_delivery_not_double_ingested
  SEC-67:
    description: Inbound channel intake is rate-limited before a work item is minted - per-channel and per-(channel, sender) fixed-window limits return 429 without creating a work item, so an abusive channel or sender cannot drive unbounded model spend (M5; per-tenant intake budget is the follow-on #81).
    tests:
      - tests/security/test_channel_inbound.py::test_inbound_intake_rate_limited_per_sender
  SEC-68:
    description: An inert identity provider cannot be silently believed enforced - a manifest that advertises identity.provider 'saml' (which has no wired assertion validator) is rejected at load rather than falling back to env-selected auth; oidc/cf-access load fine (M13).
    tests:
      - tests/security/test_auth.py::test_saml_provider_config_refuses_to_boot
  SEC-69:
    description: List reads are resource-bounded so no caller can exhaust memory/latency - /v1/work is keyset-paginated with a server-clamped page size, the memory facts/ingestions reads clamp the caller-supplied limit, and a batch memory ingest is capped by item count (M7, M9-memory / SEC-009 DoS-bounding).
    tests:
      - tests/security/test_dos_bounding.py::test_list_work_is_paginated_and_clamped
      - tests/security/test_dos_bounding.py::test_memory_list_limits_clamped_and_ingest_capped
  SEC-70:
    description: The durable and sensitive control plane is not LAN-exposed and the DB carries no baked default credential - Hatchet's engine (plaintext gRPC + API), its unauthenticated dashboard, and the sensitive-data local model bind operator ports to 127.0.0.1 in the base compose and are dropped entirely (ports []) by the secure overlay, and POSTGRES_PASSWORD uses the compose required-var form so the stack refuses to start unset while the Hatchet DSN interpolates the password rather than hardcoding boltrig:boltrig (M8/M9).
    tests:
      - tests/deploy/test_compose_hardening.py::test_hatchet_ports_are_loopback_only_in_base_compose
      - tests/deploy/test_compose_hardening.py::test_secure_overlay_drops_hatchet_host_ports
      - tests/deploy/test_compose_hardening.py::test_local_model_port_is_loopback_only_and_removed_from_secure_compose
      - tests/deploy/test_compose_hardening.py::test_postgres_password_has_no_literal_default
  SEC-71:
    description: A scheduled off-box backup ships by default - a profile-gated backup sidecar (so the dev stack is unaffected) atomically pg_dumps the durable state, refuses archives pg_restore cannot parse, optionally encrypts them, creates and verifies a portable SHA-256 sidecar, and copies both files off-box via rclone; a complete run alone updates the freshness marker, any configured remote failure exits PID 1 instead of being swallowed, and missing, malformed, or stale success is unhealthy (M10).
    tests:
      - tests/deploy/test_compose_hardening.py::test_backup_sidecar_ships_profile_gated
      - tests/deploy/test_backup_scripts.py::test_backup_verifies_dump_checksum_and_remote_pair
      - tests/deploy/test_backup_scripts.py::test_backup_refuses_unparseable_dump_without_success_marker
      - tests/deploy/test_backup_scripts.py::test_backup_remote_failure_leaves_no_success_marker
      - tests/deploy/test_backup_scripts.py::test_backup_encryption_retains_verified_checksum_contract
      - tests/deploy/test_backup_scripts.py::test_backup_encryption_failure_leaves_no_final_archive
      - tests/deploy/test_backup_scripts.py::test_backup_loop_exits_nonzero_instead_of_masking_failure
      - tests/deploy/test_backup_scripts.py::test_backup_healthcheck_rejects_missing_malformed_and_stale_success
  SEC-72:
    description: Untrusted input is structurally enveloped - external tool results, the conversation transcript, and inbound channel/user text are wrapped in typed <untrusted ...>...</untrusted> delimiters at every composition site, a hostile payload that tries to close/forge the envelope is neutralised so it cannot break out, and the governance floor asserts that enveloped content is DATA never instructions (M1).
    tests:
      - tests/unit/test_prompt_stack.py::test_governance_floor_declares_untrusted_content_is_data
      - tests/unit/test_prompt_stack.py::test_wrap_untrusted_envelopes_and_neutralises_breakout
      - tests/security/test_prompt_injection_hardening.py::test_transcript_history_enveloped_before_spawn
      - tests/security/test_prompt_injection_hardening.py::test_tool_result_wrapped_as_untrusted_envelope
  SEC-73:
    description: The Pi sidecar POST /run is hardened - it requires a shared-secret bearer (constant-time compare; fail-closed under a production signal when unset), and it egress-guards the caller-supplied mcp.url / model.endpoint, refusing a metadata/loopback/internal target BEFORE any outbound connection, closing an SSRF pivot from the sidecar (M2).
    tests:
      - tests/security/test_prompt_injection_hardening.py::test_sidecar_run_requires_auth
      - tests/security/test_prompt_injection_hardening.py::test_sidecar_unconfigured_auth_fails_closed_in_prod
      - tests/security/test_prompt_injection_hardening.py::test_sidecar_refuses_metadata_endpoint
  SEC-74:
    description: Closed conversations are hard-purged past retention (right-to-erasure) - the retention worker HARD-DELETES a CLOSED conversation and all its messages once its close/update timestamp is older than the retention cutoff, leaves open or recently-closed threads intact, is tenant-scoped, and never touches the tamper-evident audit log (audit is exempt) so DELETE /v1/me/conversations no longer leaves the body in Postgres indefinitely (M11).
    tests:
      - tests/store/test_retention_purge.py::test_closed_conversation_body_is_hard_purged_after_retention
      - tests/store/test_retention_purge.py::test_retention_purge_is_tenant_scoped
      - tests/store/test_retention_purge.py::test_purge_runs_select_and_deletes_in_one_transaction
  # --- Beat 3.5: control-plane verb parity (appended as one block) -----------
  SEC-75:
    description: Every supported console mutation is implemented once as a governed control.* verb and compatibility routes invoke that same chokepoint. The complete surface covers skills, nouns, verbs, bindings, adapters, MCP registration, workflows, config rollback, users, invitations, and notification routing; high-blast operations are HITL-held, low-blast inert/personal operations still receive schema/grant/rate/audit enforcement, workspace scope is preserved, durable triggers carry the authenticated context, and one-time invitation tokens are redacted from run events.
    tests:
      - tests/security/test_control_plane_parity.py::test_control_verbs_write_the_same_state_as_the_direct_routes
      - tests/security/test_control_plane_parity.py::test_every_high_control_verb_is_hitl_held_and_writes_nothing_while_pending
      - tests/security/test_control_plane_parity.py::test_expanded_control_plane_operations_are_functional_and_secret_safe
  SEC-76:
    description: The control.* verbs are denied to callers whose grants lack them and hidden from discovery; low-consequence adapter generation/MCP registration reserve create-only non-reserved IDs and reject live, stored, or binding collisions; activation preflights every declared verb and rejects reserved/core or foreign-owned registry authority before publishing any binding; invitation creation is explicitly uncacheable, stores no one-time secret, and atomically permits one pending invite per tenant/email; activation still requires single-use HITL and records the authenticated respondent.
    tests:
      - tests/security/test_control_plane_parity.py::test_control_verbs_denied_to_a_caller_without_the_grant
      - tests/security/test_control_plane_parity.py::test_mcp_register_verb_is_inert_and_refuses_a_secret
      - tests/security/test_control_plane_parity.py::test_low_consequence_adapter_creation_rejects_every_occupied_namespace
      - tests/security/test_control_plane_parity.py::test_activation_rejects_reserved_or_owned_verbs_before_publication
      - tests/security/test_control_plane_parity.py::test_invitation_is_uncacheable_and_concurrent_creation_is_single_winner
  SEC-77:
    description: The chat/agent lane preserves grant context end to end for authoring - a chat-style spawn carrying the shipped authoring skill hands control.* to the child (intersected with the caller ceiling and the tenant ceiling), the run-scoped MCP token reaches the control verbs through the unchanged chokepoint where the HITL gate holds them, and a non-author caller ceiling strips them (Beat 3.5).
    tests:
      - tests/security/test_control_plane_parity.py::test_chat_lane_spawn_with_authoring_skill_reaches_control_verbs
      - tests/security/test_control_plane_parity.py::test_chat_lane_non_author_ceiling_strips_control_grants
  SEC-78:
    description: Bare chat-turn authority is manifest data under a caller ceiling - chat.skills_by_role selects the spawned skill set by caller role, missing manifest skills are skipped fail-closed, every spawn carries the caller's role-resolved grant ceiling, and the shipped manifest gives authoring/control-plane only to org-admin while default_skills stays empty ([2026] VJS-COUNTY 1).
    tests:
      - tests/security/test_control_plane_parity.py::test_bare_chat_turn_uses_manifest_skills_under_caller_ceiling
  # --- Beat 6: conversation rename + relay retention (appended as one block) -
  US-CONV-08:
    description: Conversation rename is owner-only and validated; scoped read roles cannot write.
    tests:
      - tests/security/test_conversations.py::test_owner_can_rename_their_conversation
      - tests/security/test_conversations.py::test_non_owner_cannot_rename_conversation
      - tests/security/test_conversations.py::test_org_admin_cannot_rename_another_users_conversation
      - tests/security/test_conversations.py::test_rename_rejects_empty_title
      - tests/security/test_conversations.py::test_rename_rejects_overlong_title
  NFR-CONV-02:
    description: Relay stream state is bounded; closed streams are forgotten past the retention cap.
    tests:
      - tests/kernel/test_event_relay.py::test_closed_streams_are_bounded_and_oldest_forgotten
      - tests/kernel/test_event_relay.py::test_open_streams_are_never_evicted

  # --- Chat attachments ([2026] VJS-COUNTY 3) --------------------------------
  SEC-79:
    description: Inline attachment caps are enforced fail-closed at chat intake - an over-cap turn (count, per-attachment decoded bytes, or total decoded bytes) is rejected whole before add_message and before any stream yield with nothing persisted, over-cap input is never truncated, and a manifest can only tighten a cap below its conservative non-zero code default (min(default, manifest)), never loosen it.
    tests:
      - tests/security/test_chat_attachments.py::test_over_cap_turn_is_rejected_with_nothing_persisted
      - tests/security/test_chat_attachments.py::test_per_attachment_and_total_byte_caps_enforced_on_decoded_bytes
      - tests/security/test_chat_attachments.py::test_manifest_can_only_tighten_caps_never_loosen
  SEC-80:
    description: Attachment content reaches the model only as data - an agent-readable text/* attachment is enveloped via wrap_untrusted(kind=attachment) into the task, and every non-text attachment persists record-only and is never decoded into the task or model input.
    tests:
      - tests/security/test_chat_attachments.py::test_text_attachment_is_enveloped_into_the_task
      - tests/security/test_chat_attachments.py::test_non_text_attachment_never_enters_the_task

  # --- Regenerate: append-plus-supersede ([2026] VJS-COUNTY 4) ---------------
  SEC-81:
    description: Regenerate is append-plus-supersede - it appends a fresh assistant reply on a NEW run id via insert-only add_message (no forking, no in-place edit) and the marker write freezes the superseded message, setting only superseded_by while content/events/run_id/created_at stay immutable.
    tests:
      - tests/security/test_chat_regenerate.py::test_regenerate_appends_new_reply_and_freezes_the_old
      - tests/security/test_chat_regenerate.py::test_marker_write_sets_only_superseded_by
  SEC-82:
    description: The continuity composer excludes superseded messages and stays prefix-stable for the surviving set - a regenerated-away reply is never composed into a prompt (never presented as live or re-fed to the model), and an earlier turn's render remains a prefix of a later one over the non-superseded messages.
    tests:
      - tests/security/test_chat_regenerate.py::test_continuity_excludes_superseded_and_is_prefix_stable
  SEC-83:
    description: Regenerate is owner-only fail-closed and bounded to the last assistant message - a non-owner or scoped-read caller gets 403 with no write, regenerating any earlier (non-last) message is rejected with nothing written, and the marker write emits the data.conversation.message.supersede audit event with keys only (no content).
    tests:
      - tests/security/test_chat_regenerate.py::test_regenerate_is_owner_only_fail_closed
      - tests/security/test_chat_regenerate.py::test_regenerate_rejects_earlier_message
      - tests/security/test_chat_regenerate.py::test_supersede_emits_keys_only_audit_event
  SEC-84:
    description: Self-improvement raises competence, never authority ([2026] VJS-COUNTY 5) - a WorkflowDefinition carries no authority-bearing field (execution authority comes only from the caller ceiling at dispatch, so provenance cannot widen it), learn_from_success changes only provenance (source/origin_task), and the memory.improve reweight verb accepts no scope/grant/authority argument.
    tests:
      - tests/security/test_self_improvement_authority.py::test_workflow_definition_carries_no_authority_field
      - tests/security/test_self_improvement_authority.py::test_learn_from_success_changes_only_provenance
      - tests/security/test_self_improvement_authority.py::test_memory_improve_verb_takes_no_authority_argument

  # --- Server-side run cancellation ([2026] VJS-COUNTY 6) --------------------
  SEC-85:
    description: Server-side run cancel is owner-only, fail-closed and audited ([2026] VJS-COUNTY 6, D5) - POST /v1/runs/{run_id}/cancel refuses a non-owner or scoped-read caller with 403 and NO cancel-request write and NO audit, an unknown run is 404 with no write, the owner's cancel writes the durable cancel-request row plus a keys-only run.cancel audit event, and ChatService.cancel ends a live chat turn's SSE stream cleanly.
    tests:
      - tests/security/test_run_cancel.py::test_cancel_is_owner_only_fail_closed
      - tests/security/test_run_cancel.py::test_cancel_unknown_run_is_404_no_write
      - tests/security/test_run_cancel.py::test_chat_cancel_closes_the_run_stream
  SEC-86:
    description: Cancel takes effect only at a cooperative point, never mid-adapter-call ([2026] VJS-COUNTY 6, D3) - the pump consults the cancel signal at each step boundary and stops BEFORE dispatching the next verb (the head's execute dispatch never runs), and a cancel arriving during an in-flight adapter call never interrupts it (the step runs to completion; cancellation lands only at the next cooperative point).
    tests:
      - tests/security/test_run_cancel.py::test_pump_stops_before_dispatch_at_the_chokepoint_boundary
      - tests/security/test_run_cancel.py::test_in_flight_adapter_call_is_not_interrupted
  SEC-87:
    description: CANCELLED is terminal, neutral and durable ([2026] VJS-COUNTY 6, D1/D4) - the pump writes WorkStatus.CANCELLED in a finally with a checkpoint and exactly one audit row on the transition, outcome_score treats a cancel as neutral (score None, neither success nor failure) regardless of degraded, and a restart that re-detects the durable cancel-request row re-cancels the run rather than resurrecting it to running/DONE.
    tests:
      - tests/security/test_run_cancel.py::test_cancelled_is_terminal_neutral_checkpointed_and_audited
      - tests/security/test_run_cancel.py::test_outcome_score_cancelled_is_neutral
      - tests/security/test_run_cancel.py::test_restart_does_not_resurrect_a_cancelled_run

  # --- Streaming-richness chat contracts (tool events / heartbeat / questions) -
  US-CHAT-10:
    description: Tool events on the chat stream are keys + summaries only and paired - a verb dispatched under a turn publishes a tool_call (tool, call_id, args_summary of key names + count) and a paired tool_result (call_id, status, result_summary of key names) to the user-facing stream, carrying NO raw input/output, so a client can render a tool callout without the raw payload.
    tests:
      - tests/security/test_chat_streaming_richness.py::test_chat_tool_events_are_bounded_and_paired
  US-CHAT-11:
    description: The SSE heartbeat keeps a slow-but-alive stream open and stops on a terminal event - a run that produces nothing emits periodic heartbeat frames at the ChatConfig interval until real content/terminal arrives (no heartbeat lands at or after the terminal), heartbeats are never persisted as turn content, and a zero/negative interval disables the keepalive entirely.
    tests:
      - tests/security/test_chat_streaming_richness.py::test_heartbeat_keeps_slow_stream_open_then_stops_on_terminal
      - tests/security/test_chat_streaming_richness.py::test_heartbeat_can_be_disabled
  US-CHAT-12:
    description: The governed chat.ask_user verb pauses the run on the existing HITL machinery - dispatched through the ONE chokepoint under the caller ceiling it creates a HITLType.QUESTION bound to the run/work item, emits a rich question stream event (question_id, prompt, choices), raises PendingHuman (audited pending_human), and is grant-ceilinged like any verb (a caller without the grant is refused, never allowed to pause).
    tests:
      - tests/security/test_chat_streaming_richness.py::test_ask_user_pauses_via_hitl_and_emits_question
      - tests/security/test_chat_streaming_richness.py::test_ask_user_is_grant_ceilinged_like_any_verb
  US-CHAT-13:
    description: Subagent observability events never leak prompt-level <untrusted> wrappers to the client - the structural envelope that wraps conversation data in the model prompt is stripped from the task field of the published subagent event, while the prompt sent to the runtime remains untouched.
    tests:
      - tests/security/test_chat_streaming_richness.py::test_subagent_event_task_is_cleaned_for_display
      - tests/security/test_chat_streaming_richness.py::test_display_task_strips_untrusted_but_preserves_content
  US-CHAT-14:
    description: Streaming chat runs do not duplicate the final reply - a runtime that already produced the answer as text_delta events does not receive an extra summary text_delta at turn end, so the UI never shows repeated text.
    tests:
      - tests/security/test_chat_streaming_richness.py::test_streaming_runtime_does_not_duplicate_summary
  SEC-88:
    description: Chat tool events never leak verb values (K-20 bounded observability on the user-facing surface) - a secret/untrusted value passed to a verb appears nowhere on the chat stream nor in the persisted turn events (only key names + counts do), while the full payload still exists on the run relay for the canvas + durable audit.
    tests:
      - tests/security/test_chat_streaming_richness.py::test_chat_tool_events_never_leak_verb_values
  SEC-89:
    description: The questions answer route is owner-only, fail-closed, audited and wrap_untrusted-enveloped - POST /v1/hitl/{id}/answer answers ONLY a QUESTION (an approval id is refused 409, never laundered into clearing a gated verb), a non-owner/scoped-read caller is refused 403 with NO response write and NO resume fired, the owner's answer is enveloped by wrap_untrusted before it is recorded (so the ordinary resume wiring replays it as data, never raw instructions), and the audit row carries the answer length only, never the answer text.
    tests:
      - tests/security/test_chat_streaming_richness.py::test_answer_route_owner_only_wrapped_and_audited
      - tests/security/test_chat_streaming_richness.py::test_answer_route_refuses_to_answer_an_approval
      - tests/security/test_hitl_access.py::test_generic_respond_cannot_bypass_owner_checked_question_answer_route

  # --- Long-conversation compaction (append-only derived summaries) -----------
  SEC-90:
    description: Compaction never mutates a frozen message (append-only derived data) - deriving a summary INSERTS a conversation_summaries row and touches no conversation_messages row; the append-only message history (content/events/superseded_by) is left byte-for-byte intact, so the summary is DERIVED data over the frozen record ([2026] VJS-COUNTY 4), never an edit of it.
    tests:
      - tests/security/test_conversation_compaction.py::test_compaction_never_mutates_a_frozen_message
  SEC-91:
    description: The compacted composition preserves prefix-stability across turns until the next compaction - with a fixed summary the composed task is render_summary_block(summary) + render_transcript(tail), the summary block is byte-stable and the tail only grows by appending, so turn N's task is a byte-prefix of turn N+1's and the gateway prompt cache keeps hitting (SEC-46).
    tests:
      - tests/security/test_conversation_compaction.py::test_compacted_composition_is_prefix_stable_until_next_compaction
  SEC-92:
    description: Superseded turns stay excluded after compaction - both the summarised older set and the verbatim tail are drawn from the superseded-filtered live set, so a regenerated-away reply is neither summarised into the derived summary nor present in the composed tail ([2026] VJS-COUNTY 4 exclusion survives compaction).
    tests:
      - tests/security/test_conversation_compaction.py::test_superseded_turns_stay_excluded_after_compaction
  SEC-93:
    description: Below the threshold the composition is unchanged - with fewer than compaction_threshold live messages (or compaction disabled) compose_turn_task renders the full verbatim history byte-identical to the pre-compaction continuity render, even when a summary row exists, so short conversations are never altered.
    tests:
      - tests/security/test_conversation_compaction.py::test_below_threshold_composition_is_unchanged

  # --- Conversation history: pagination + owner-scoped search (US-CONV-09/10) --
  FR-CONV-07:
    description: The conversation list paginates stably and bounded (US-CONV-09) - list_conversations_page returns one owner-scoped page ordered updated_at DESC with an id ASC tiebreak (deterministic across runs and for equal timestamps) plus the next offset (None once exhausted), the page size is a ChatConfig ceiling a caller-supplied limit is clamped DOWN to (None => the conservative default, never zero rows) so an unbounded scan is impossible, and the original unpaginated list_conversations still returns everything unchanged.
    tests:
      - tests/store/test_conversation_pagination.py::test_page_is_stable_ordered_and_next_offset_walks_to_exhaustion
      - tests/store/test_conversation_pagination.py::test_id_tiebreak_is_deterministic_for_equal_updated_at
      - tests/store/test_conversation_pagination.py::test_page_is_owner_scoped
      - tests/store/test_conversation_pagination.py::test_unpaginated_list_still_returns_everything
      - tests/store/test_conversation_pagination.py::test_config_clamps_page_size_under_the_max_ceiling
  SEC-94:
    description: Conversation search is owner-scoped and fail-closed (US-CONV-10) - search_conversations matches (case-insensitive substring) ONLY over the caller's own (tenant, user) conversation titles + live message content, so another user's conversation is never returned even when it matches the same term, it carries the matched live message content as a snippet (None when only the title matched), and results are paginated + bounded with a next offset (None when exhausted).
    tests:
      - tests/security/test_conversation_search.py::test_search_is_owner_scoped_never_returns_another_users_conversation
      - tests/security/test_conversation_search.py::test_search_matches_title_and_live_message_with_snippet
      - tests/security/test_conversation_search.py::test_search_results_are_paginated_and_bounded
  SEC-95:
    description: Superseded turns never surface as a live search match ([2026] VJS-COUNTY 4 exclusion) - search_conversations only considers messages with superseded_by IS NULL, so a regenerated-away reply's term yields no hit while the same term in the live replacement message does (mirrors the continuity/compaction superseded filtering).
    tests:
      - tests/security/test_conversation_search.py::test_superseded_message_is_not_a_live_search_hit
  SEC-96:
    description: Conversation search has no SQL/wildcard injection surface (US-CONV-10) - the query is a BOUND parameter (never string-interpolated into SQL) with LIKE metacharacters escaped (backslash/percent/underscore) and an ESCAPE clause, so a caller-supplied percent or underscore is matched literally as a substring and can never act as a match-anything/single-char wildcard.
    tests:
      - tests/security/test_conversation_search.py::test_like_metacharacters_are_escaped_not_wildcards

  # --- First-party invite-only login ([2026] VJS-COUNTY 7) -------------------
  SEC-97:
    description: Login is invite-only with no open self-signup - an account is created only by consuming a single-use, hashed, expiring admin invite token (accept-invite), there is no signup route, and a token redeems exactly once (a replay is refused).
    tests:
      - tests/security/test_first_party_login.py::test_invite_only_no_self_signup_and_single_use
  SEC-98:
    description: First-party passwords are hashed with argon2id and are non-reversible - the stored form is an argon2id PHC string (embedded per-user salt), never the plaintext, verify accepts the right password and rejects a wrong one, and the plaintext never enters the User identity row or the audit chain.
    tests:
      - tests/security/test_first_party_login.py::test_password_is_hashed_non_reversible_and_never_logged
  SEC-99:
    description: Login is rate-limited and non-enumerating - it is throttled through the existing RateLimiter (per-identity bound trips with 429) and an unknown email and a known-but-wrong password return a byte-identical generic failure, so response content never reveals which emails exist.
    tests:
      - tests/security/test_first_party_login.py::test_login_is_rate_limited_and_non_enumerating
  SEC-100:
    description: The session cookie is httpOnly + Secure + SameSite=strict with a bounded lifetime and is revocable - login sets those cookie flags and a Max-Age, the persisted session carries a future expires_at, and a logout revokes it so a subsequent authenticated request is denied.
    tests:
      - tests/security/test_first_party_login.py::test_session_cookie_is_httponly_secure_bounded_and_revocable
  SEC-101:
    description: The session principal resolver is fail-closed and CSRF-protected - a missing/expired/revoked session (and a deactivated user) is denied 401, a mutating cookie request without the session-bound X-Boltrig-CSRF header is refused 403 while a safe GET is exempt, and the correct CSRF token is accepted.
    tests:
      - tests/security/test_first_party_login.py::test_resolver_fail_closed_and_csrf_protected
  SEC-102:
    description: Privilege ceiling on the roster routes (security review of COUNTY 7) - update_user and create_invite reject granting a role ranked above the actor's own, and only the owner tier (superadmin) may grant all-authority scope, so an admin cannot self-escalate to superadmin or invite a superadmin (materialised by first-party accept-invite). Granting an equal or lower role is allowed.
    tests:
      - tests/security/test_privilege_ceiling.py::test_admin_cannot_grant_a_role_above_its_own
      - tests/security/test_privilege_ceiling.py::test_only_owner_may_grant_all_authority_scope
      - tests/security/test_privilege_ceiling.py::test_granting_an_equal_or_lower_role_is_allowed

  # --- Org -> workspace tenancy ([2026] VJS-COUNTY 8) ------------------------
  FR-ORG-01:
    description: A workspace always belongs to an org (D1/D2) - an organisation row's id IS the tenant_id (one org per tenant_id) and every workspace carries that org as its tenant_id, so a workspace is never an orphan; get/list_workspace reads are tenant-scoped to the owning org.
    tests:
      - tests/store/test_tenancy.py::test_workspace_always_belongs_to_an_org
  FR-ORG-02:
    description: The organisation id IS the tenant_id and the default-org backfill is idempotent (D1) - ensure_default_org creates at most one org per tenant_id (id == tenant_id) and a repeat call never creates a second, so existing single-tenant deploys get exactly one implicit org.
    tests:
      - tests/store/test_tenancy.py::test_ensure_default_org_is_idempotent_and_id_is_tenant_id
  SEC-103:
    description: Org/workspace tenancy reads are tenant-scoped and never cross tenants (SEC-08) - get/list of org, workspace and both memberships, plus the switching-seam membership queries (list_orgs_for_user / list_workspaces_for_user), only ever return rows inside the bound tenant, and a remove under the wrong tenant is a no-op that cannot reach another tenant's row.
    tests:
      - tests/security/test_tenancy_isolation.py::test_tenancy_reads_are_tenant_scoped_never_cross_tenant
  SEC-104:
    description: A per-workspace role is always one of the allowed WorkspaceRole set (owner/admin/member/viewer/agent, D3) - add_workspace_member refuses an out-of-set role (SchemaValidationError) so it can never be persisted, while every allowed role is accepted.
    tests:
      - tests/security/test_tenancy_isolation.py::test_workspace_role_must_be_in_the_allowed_set
  SEC-105:
    description: The four org/workspace tenancy tables are RLS-fenced (SEC-08) - workspaces, org_members and workspace_members are in the rls.sql generic tenant_id-scoped set, and organisations is fenced by its own id-keyed tenant_isolation policy (its id IS the tenant_id), with all four defined in schema.sql.
    tests:
      - tests/security/test_tenancy_isolation.py::test_the_four_tenancy_tables_are_rls_scoped
  SEC-169:
    description: No tenant table drifts outside the RLS fence (SEC-08, K-22, SEC-65) - against a real Postgres with schema.sql + the rls.sql overlay applied, EVERY table carrying a tenant_id column is either RLS-fenced (FORCE row security plus a tenant_isolation policy in pg_policy) or in a single explicit documented exclusion set (personal_access_tokens, identity_orgs, channels - each resolved by an unguessable key before any tenant is bound), so a future tenant table that lands unfenced and unexcused fails the build.
    tests:
      - tests/security/test_rls_fence_coverage.py::test_every_tenant_table_is_rls_fenced_or_documented_excluded

  # --- Session active workspace context + switching ([2026] VJS-COUNTY 8, D4) -
  FR-ORG-03:
    description: The active workspace is plumbed through the session onto the InvocationContext and login seeds a deterministic default (D4) - login picks a stable default active workspace from the user's membership (or None when they belong to none), persists it on the session, and the session resolver surfaces it onto the principal so principal.context().workspace_id carries the active workspace; pick_default_workspace is deterministic (ordered, stable) regardless of store iteration order.
    tests:
      - tests/security/test_active_context.py::test_login_seeds_deterministic_default_and_context_carries_workspace
      - tests/security/test_active_context.py::test_pick_default_workspace_is_deterministic_or_none
  SEC-106:
    description: Switching the active workspace is membership-re-authorized and fail-closed (D4) - POST /v1/me/active-context refuses an unknown workspace 404 and a workspace the caller is NOT a member of 403, both with NO write to the session, so a client can never set an active workspace it is not a member of; a valid member switch persists the new active workspace on the session and is audited keys-only.
    tests:
      - tests/security/test_active_context.py::test_switch_is_membership_reauthorized_and_fail_closed
  SEC-107:
    description: A revoked-membership session drops to no active workspace (D4, fail-closed re-auth) - the session resolver re-authorizes the persisted active workspace against CURRENT membership every request via resolve_active_workspace, so once the user's workspace membership is revoked (or the workspace is deleted) the resolved active workspace becomes None (never the stale value) and the InvocationContext carries no workspace.
    tests:
      - tests/security/test_active_context.py::test_revoked_membership_session_drops_to_no_active_workspace

  # --- Grant resolution from workspace membership ([2026] VJS-COUNTY 8, D11) --
  SEC-108:
    description: An active-workspace member's authority is the INTERSECTION of their org/user grants and their workspace-role ceiling, never a union ([2026] VJS-COUNTY 8 D11, composes with COUNTY 5) - effective_grants_for_request narrows the org grants by narrow_grants_to_workspace when the caller is a member of an active workspace, so the result is always a SUBSET of the org grants (owner keeps them broad, member loses the control.* configure namespace) and a workspace membership can only intersect authority DOWN, never widen it.
    tests:
      - tests/security/test_workspace_grants.py::test_active_member_authority_is_org_grants_intersected_with_ceiling
      - tests/security/test_workspace_grants.py::test_membership_only_narrows_never_widens
  SEC-109:
    description: A viewer in a workspace cannot perform a write verb their org role would otherwise allow (D11 read-only ceiling) - narrow_grants_to_workspace for the viewer role keeps only the base allow-patterns that authorise a concrete read action (wildcards collapse, fail-closed), so a caller whose org grants include a write verb (or ticket.*) is denied that write verb at the chokepoint while retaining their explicit read grants.
    tests:
      - tests/security/test_workspace_grants.py::test_viewer_cannot_write_but_keeps_reads
  SEC-110:
    description: A caller with NO active workspace keeps their FULL org grants unchanged (D11 backward-compat, the critical rule) - effective_grants_for_request returns exactly current_grants_for_user when active_workspace_id is None (every existing single-tenant deploy and the backfilled default org with no workspaces), and also when the caller is not a member of the active workspace it applies no narrowing (fail-closed to the org ceiling, never widening).
    tests:
      - tests/security/test_workspace_grants.py::test_no_active_workspace_keeps_full_org_grants
      - tests/security/test_workspace_grants.py::test_non_member_active_workspace_applies_no_narrowing
  SEC-111:
    description: get_workspace_member is tenant-scoped and fail-closed (D11, SEC-08) - the single-membership lookup only ever returns a row inside the bound tenant, so a membership under another tenant_id resolves to None and can never confer a workspace role across a tenant boundary.
    tests:
      - tests/store/test_tenancy.py::test_get_workspace_member_is_tenant_scoped

  # --- Per-org / workspace / user AI keys ([2026] VJS-COUNTY 8, D5) ----------
  FR-AIKEY-01:
    description: An AI key config lives in ONE unified ai_configs table keyed by (tenant_id, level, scope_id) holding a provider/model selection and a SEALED credential_ref, never a raw key (D5) - the AiConfig row has no plaintext key field, set_ai_config upserts (never duplicates) and rejects an out-of-set level (SchemaValidationError, mirroring the workspace-role guard) so an invalid level can never be persisted, and every allowed level (org/workspace/user) round-trips.
    tests:
      - tests/store/test_ai_config.py::test_ai_config_row_holds_a_credential_ref_never_a_raw_key
      - tests/store/test_ai_config.py::test_ai_config_level_must_be_valid
  FR-AIKEY-02:
    description: resolve_ai_key honours the precedence user -> workspace -> org -> manifest/env default and the spawner wires the resolved SEALED key into the model-key seam (D5) - the resolver returns the highest-precedence configured level (loading its material from the sealed credential store) and, when nothing is configured, the default level with no credential ref so the runtime falls back to the env-configured provider key exactly as before (the backward-compat rule); a tenant with a user-level key sees the runtime carry that sealed key, a tenant with none sees the runtime carry the env key.
    tests:
      - tests/security/test_ai_keys.py::test_resolve_precedence_user_workspace_org_default
      - tests/security/test_ai_keys.py::test_no_config_tenant_falls_back_to_env_key
      - tests/security/test_ai_keys.py::test_spawner_wires_resolved_sealed_key_into_the_runtime
  FR-AIKEY-03:
    description: A resolved (non-default) ai_config drives model/provider ROUTING (D5) - its provider selects the RUNTIME (via runtime_for_provider) and its model / optional base_url override the endpoint the runtime pins to, so a config routes the call and not merely the key; a tenant with NO config dispatches the capability's env-default runtime + endpoint model byte-for-byte as before (backward-compat), a config that omits base_url keeps the endpoint's own host, and an UNKNOWN provider degrades to the env default runtime (runtime_for_provider -> None) without crashing the run while the sealed key still resolves (the key seam is independent of the routing degrade). Sensitive data is EXEMPT (the local endpoint wins regardless - see SEC-12).
    tests:
      - tests/security/test_model_routing.py::test_no_config_dispatches_the_env_default_runtime_and_model
      - tests/security/test_model_routing.py::test_ai_config_provider_and_model_select_runtime_and_endpoint
      - tests/security/test_model_routing.py::test_config_without_base_url_keeps_the_endpoint_host
      - tests/security/test_model_routing.py::test_unknown_provider_degrades_to_the_env_default_without_crashing
  SEC-112:
    description: allow_own_ai_keys=False makes a workspace/user AI key IGNORED at resolution (D5) - when the org forbids member-owned keys, resolve_ai_key skips any workspace/user row and uses only the org key (or the env default when the org has none), so a workspace or a user can never bring their own key unless the org opts in; flipping the org to allow own keys immediately restores the user-key precedence.
    tests:
      - tests/security/test_ai_keys.py::test_allow_own_false_ignores_workspace_and_user_keys
  SEC-113:
    description: An AI key is stored ONLY as a sealed credential ref and never returned or audited in plaintext (D5, SEC-05/K-20) - the governed PUT /v1/ai-keys accepts the key once, stores it through set_credential_ref (the ai_configs row holds only the credential_ref), never echoes it in the response or the list view, and writes a keys-only audit row (level/scope/provider/model + the ref id) so the raw key appears in no audit detail; the key remains retrievable only kernel-side from the sealed store.
    tests:
      - tests/security/test_ai_keys.py::test_ai_key_is_sealed_never_returned_or_audited
  SEC-114:
    description: ai_config reads are tenant-scoped and never cross tenants (D5, SEC-08) - get/list of an AI-config are keyed on tenant_id, so a caller can never read another org/workspace's AI key (a lookup or list under a different tenant is None/empty, fail-closed) and a delete under the wrong tenant is a no-op that cannot reach this tenant's row.
    tests:
      - tests/store/test_ai_config.py::test_ai_config_reads_are_tenant_scoped
  SEC-115:
    description: The governed set-key route is role-scoped so a caller cannot set a level above its authority (D5, SEC-36) - PUT /v1/ai-keys refuses an org-level key from a non-admin (403) and accepts it from an org-admin, refuses a workspace-level key from a non-owner/admin of that workspace, and refuses a user-level key for anyone but the caller themselves; workspace/user levels additionally require the org allow_own_ai_keys gate (refused up front when false), while the org may always set its own key.
    tests:
      - tests/security/test_ai_keys.py::test_set_key_route_is_role_scoped

  # --- Workspace-scoped workflow resources ([2026] VJS-COUNTY 8, D2) ----------
  FR-WFL-11:
    description: A workflow is workspace-scoped by an optional workspace_id where NULL means ORG-WIDE ([2026] VJS-COUNTY 8, D2) - creating/synthesising a workflow in an active workspace STAMPS that workspace (generate_workflow) and a learned workflow INHERITS the workspace of the run that produced it (learn_from_success carries it forward, never widening), while match/get return org-wide (NULL) OR own-workspace workflows only and never a workflow scoped to a DIFFERENT workspace; a caller with NO active workspace matches EXACTLY the org-wide set byte-for-byte (backward-compat), and the workspace_id round-trips identically on the in-memory and Postgres stores.
    tests:
      - tests/security/test_workflow_workspace_scope.py::test_generate_stamps_active_workspace_and_none_is_org_wide
      - tests/security/test_workflow_workspace_scope.py::test_learned_workflow_inherits_the_runs_workspace
      - tests/security/test_workflow_workspace_scope.py::test_match_returns_org_wide_or_own_workspace_never_another
      - tests/security/test_workflow_workspace_scope.py::test_no_active_workspace_sees_exactly_the_org_wide_set_byte_for_byte
      - tests/store/test_store_parity.py::test_workflow_workspace_id_roundtrips_on_both_stores
  FR-WFL-12:
    description: Ultracode phased workflow specs are validated before execution.
    tests:
      - tests/integration/test_ultracode_run.py::test_ultracode_validation_rejects_missing_prompt
      - tests/integration/test_ultracode_run.py::test_ultracode_validation_rejects_excessive_concurrency
  FR-WFL-13:
    description: Ultracode phase agents execute through the requested capable fleet runtime and checkpoint completed phases before later phases.
    tests:
      - tests/integration/test_ultracode_run.py::test_ultracode_run_executes_phases_through_preferred_capability
  FR-WFL-14:
    description: The Ultracode run body is registered on the durable executor task seam.
    tests:
      - tests/integration/test_ultracode_run.py::test_ultracode_run_registered_on_local_durable_executor
  FR-WFL-15:
    description: Ultracode phase-agent work is split onto a child task seam and replays completed phase or agent checkpoints instead of repeating work.
    tests:
      - tests/integration/test_ultracode_run.py::test_ultracode_replays_completed_phase_checkpoint
      - tests/integration/test_ultracode_run.py::test_ultracode_replays_completed_agent_checkpoint
      - tests/integration/test_ultracode_run.py::test_hatchet_child_runner_uses_registered_agent_task
  FR-WFL-16:
    description: Ultracode injects compact scoped memory through the governed memory.recall seam when granted, prefers the configured primary projection such as Mem0, keeps owner/provenance filters and untrusted prompt wrapping, and writes run summaries back through memory.remember when granted.
    tests:
      - tests/integration/test_ultracode_memory.py::test_ultracode_injects_only_scoped_memory_into_agent_prompt
      - tests/integration/test_ultracode_memory.py::test_ultracode_recall_uses_mem0_projection_when_configured
      - tests/integration/test_ultracode_memory.py::test_ultracode_memory_injection_requires_recall_grant
      - tests/integration/test_ultracode_memory.py::test_ultracode_stores_run_summary_through_memory_adapter
  FR-WFL-17:
    description: The live Hatchet Ultracode parent workflow fans out phase agents through the registered child task seam and persists child/phase checkpoints.
    tests:
      - tests/integration/test_hatchet_live.py::test_live_ultracode_run_fans_out_agent_child_tasks
  FR-WFL-18:
    description: list_workflows returns exactly one current definition (the latest version) per workflow id, identically on the in-memory and Postgres stores - the durable store collapses versioned rows the same way list_skills/get_skill do, so callers matching a workflow by id never see duplicate or stale versions.
    tests:
      - tests/store/test_store_parity.py::test_list_workflows_returns_latest_version_per_id_on_both_stores
  SEC-116:
    description: Workspace scoping only NARROWS which workflows a workspace sees, never widens authority (COUNTY 5, D2) - a workflow scoped to another workspace is fail-closed UNKNOWN on the get / trigger / execute paths (get returns None, trigger and execute raise LookupError) so it can never be resolved or run cross-workspace, while the visibility filter never mutates the record (a visible workflow is byte-for-byte what was stored, adding no grant/scope) and workspace_id is the sole scoping field, carrying no execution authority.
    tests:
      - tests/security/test_workflow_workspace_scope.py::test_get_is_fail_closed_across_a_workspace_boundary
      - tests/security/test_workflow_workspace_scope.py::test_trigger_and_execute_cannot_reach_another_workspace
      - tests/security/test_workflow_workspace_scope.py::test_scoping_never_widens_authority_it_only_hides_rows

  # --- Org/workspace management routes + invite provisioning ([2026] VJS-COUNTY 8, D6) -
  FR-ORG-04:
    description: The org/workspace management surface is role-scoped + audited (D6) - a caller lists their OWN workspaces (their memberships), an org-admin/owner creates a workspace (and is seated as its owner), a workspace owner/admin or org-admin renames it and adds/removes members, and GET/PATCH /v1/orgs/current expose + update the org handle + policy flags; every management write is audited keys-only.
    tests:
      - tests/security/test_tenancy_management.py::test_workspace_and_org_management_surface
  SEC-117:
    description: Workspace management is membership/role fail-closed (D6) - PATCH /v1/workspaces/{id} and the add/remove-member routes refuse a caller who is neither an org-admin nor an owner/admin of THAT workspace with 403 and NO write (a plain member or a non-member cannot rename it or change its roster, and a non-member cannot even read the roster), while an unknown workspace is 404, an out-of-set workspace role is 400 and an unknown target user is 404 - all with no write; the workspace owner (or org-admin) may manage it.
    tests:
      - tests/security/test_tenancy_management.py::test_workspace_management_is_membership_role_fail_closed
  SEC-118:
    description: An org/workspace-scoped invite seats the invitee into exactly that workspace on accept with the invited role bounded by the SEC-102 ceiling (D6) - a workspace_id invite adds the invitee as a workspace member of that workspace with the invited role on accept; a provision_workspace_name invite CREATES the workspace and seats the invitee as its OWNER; provision_org_name is SUPERADMIN-ONLY (a lesser admin is refused 403 with NO invitation written) and on accept provisions a brand-new org owned by the invitee; a workspace-targeted invite is authorised against the workspace before the invitation is written (an unknown workspace is 404 with NO invitation left behind, and the inviter must be able to manage it - 403 otherwise), and the single-use/hashed/expiring token machinery is reused unchanged.
    tests:
      - tests/security/test_tenancy_management.py::test_scoped_invite_seats_and_provisions
  SEC-119:
    description: Org management is org-admin fail-closed (D6) - PATCH /v1/orgs/current refuses a non-admin with 403 and NO write (the name + allow_own_ai_keys + require_two_factor are unchanged), while an org-admin may rename the org and toggle both policy flags; the GET view exposes the handle + settings + policy flags but never any secret/credential material.
    tests:
      - tests/security/test_tenancy_management.py::test_org_management_is_admin_fail_closed

  # --- Opbox-depth audit ([2026] VJS-COUNTY 9) --------------------------------
  SEC-120:
    description: An MCP-initiated audit row carries the caller's identity + org/workspace + ip/ua at the SAME field-depth as a human action (D2) - a human invoke populates actor/workspace_id/ip_address/user_agent/resource, and an MCP tools/call through the same chokepoint populates every one of those fields (identity + workspace from the run token, ip/ua from the request), so a headless MCP action is as attributable as a site action.
    tests:
      - tests/kernel/test_audit_opbox_depth.py::test_mcp_action_is_audited_at_the_same_depth_as_a_human_action
  SEC-121:
    description: The SecurityEvent stream is its OWN tamper-evident (hash-chained), append-only, keys-only stream, SEPARATE from the business audit log (D3) - signals chain seq/prev_hash/hash and verify detects a tamper, a secret handed in detail is scrubbed (never stored verbatim, K-20), a business action never lands in the security stream, and it is wired at the security-relevant paths: permission denial (GrantMissing at the chokepoint), MCP auth failure (a bad run token), and login failure + login throttle trip (auth_routes).
    tests:
      - tests/security/test_security_event_stream.py::test_security_stream_is_hash_chained_and_keys_only
      - tests/security/test_security_event_stream.py::test_security_stream_is_separate_from_the_audit_log
      - tests/security/test_security_event_stream.py::test_permission_denial_at_chokepoint_records_a_security_signal
      - tests/security/test_security_event_stream.py::test_bad_mcp_run_token_records_an_mcp_auth_failure
      - tests/security/test_security_event_stream.py::test_login_failure_and_throttle_record_security_signals
  SEC-122:
    description: A rollup anchor's root hash equals a recompute over the anchored audit-chain segment and the LOCAL dev-fallback is flagged with the RFC3161/KMS fields left as a NULL seam (D4) - anchoring writes rollup_root_hash == segment_root_hash over [seq_start, seq_end] with is_dev_fallback True and rfc3161_token/kms_signature None, verify_latest confirms the intact anchor and detects a REWRITE of a row in the anchored segment (the recomputed root no longer matches), and a subsequent anchor advances only over the un-anchored tail.
    tests:
      - tests/kernel/test_audit_opbox_depth.py::test_rollup_anchor_root_matches_recompute_and_flags_dev_fallback
      - tests/kernel/test_audit_opbox_depth.py::test_anchor_advances_only_over_the_unanchored_tail
  SEC-123:
    description: The audit browser reads are org/workspace-scoped fail-closed and the verify endpoint detects a broken chain (D5) - a caller with an active workspace sees only org-wide (NULL) + its OWN workspace's rows (never another workspace's), search filters by user/resource and can pivot to the SecurityEvent stream (and filter it by type), the verify endpoint reports the chain + latest anchor intact then flags a broken chain with the first bad seq after a tamper, and both verify and the integrity view are author/admin gated (a non-author is 403).
    tests:
      - tests/security/test_audit_browser.py::test_audit_search_is_workspace_scoped_fail_closed
      - tests/security/test_audit_browser.py::test_audit_search_filters_by_user_and_resource
      - tests/security/test_audit_browser.py::test_audit_search_can_pivot_to_the_security_stream
      - tests/security/test_audit_browser.py::test_verify_endpoint_reports_intact_then_detects_a_broken_chain
      - tests/security/test_audit_browser.py::test_verify_and_search_are_gated_and_fail_closed_for_non_authors
      - tests/security/test_audit_tree_scope.py::test_audit_tree_denies_cross_workspace_root_and_prunes_workspace_descendants
  SEC-124:
    description: The new audit fields are additive - a row written without them canonicalises byte-for-byte as before so the existing hash chain is unchanged (D1) - a row with all enrichment fields None serialises WITHOUT the new keys (its stored hash still verifies), a chain of un-enriched rows verifies and an enriched row appended after them keeps the chain contiguous and verifiable, while tampering a NEW field on an enriched row is detected (that field IS folded into that row's hash); the enrichment fields also round-trip identically on the in-memory and Postgres stores.
    tests:
      - tests/kernel/test_audit_opbox_depth.py::test_new_fields_are_additive_old_rows_unchanged
      - tests/store/test_store_parity.py::test_audit_enrichment_and_security_stream_roundtrip_on_both_stores
  SEC-125:
    description: The periodic audit-anchor janitor seals each tenant's latest un-anchored audit-chain segment on its sweep and is a no-op when a tenant has no new rows (D4) - a sweep enumerates tenants via list_orgs, anchors each tenant's whole-chain tail (workspace_id NULL, complete coverage) so an anchor the JOB writes agrees with a recompute over the segment (verify_latest, reusing SEC-122), the next sweep advances only over the un-anchored tail and writes nothing when there is nothing new, a tenant whose anchor fails is logged and skipped so one fault never stops the sweep (P9), the mechanism degrades cleanly when Hatchet is absent (the non-durable local executor is selected and the sweep still writes a dev-fallback anchor, no boot crash), the run_anchor_forever loop cancels cleanly, and the interval knob (BOLTRIG_AUDIT_ANCHOR_INTERVAL) defaults to daily / falls back to daily on a malformed value / is honoured as disabled at <= 0.
    tests:
      - tests/fleet/test_audit_anchor_job.py::test_sweep_seals_each_tenant_and_is_a_noop_without_new_rows
      - tests/fleet/test_audit_anchor_job.py::test_anchor_degrades_cleanly_when_hatchet_absent
      - tests/fleet/test_audit_anchor_job.py::test_sweep_continues_past_a_failing_tenant
      - tests/fleet/test_audit_anchor_job.py::test_forever_loop_seals_then_cancels_cleanly
      - tests/fleet/test_audit_anchor_job.py::test_anchor_interval_knob


  # --- TOTP two-factor authentication ([2026] VJS-COUNTY 10) -----------------
  SEC-126:
    description: The TOTP shared secret is SEALED via the credential store and never exposed - it is stored only in the RLS-fenced credential_refs seam referenced by secret_ref on the user_totp row (never a plaintext column on the identity row), never enters the audit chain, and is returned to the client exactly once at enroll-begin (re-enrolling an already-enabled user is refused, so it is never re-revealed).
    tests:
      - tests/security/test_two_factor.py::test_totp_secret_is_sealed_never_plaintext_or_audited
  SEC-127:
    description: One-time recovery codes are stored ONLY as sha256 hashes and are single-use fallbacks, never a bypass - the plaintext codes are shown once at enrollment and never persisted (only their hashes are), a recovery code passes the login challenge exactly once then the same code is rejected (the active count decrements), it never bypasses the challenge (a fresh login still returns 2fa_required first), and no recovery code enters the audit chain.
    tests:
      - tests/security/test_two_factor.py::test_recovery_codes_are_hashed_and_single_use
  SEC-128:
    description: The second factor is challenged BETWEEN password-verify and session-issue, fail-closed - an enrolled user's correct-password login returns a 2fa_required challenge and NO session (the session cookie is not set and an authenticated route is 401), a wrong code issues no session, the correct TOTP code issues the session, the challenge is single-use (cannot be replayed for a second session), and an unknown/expired challenge is a generic fail-closed rejection.
    tests:
      - tests/security/test_two_factor.py::test_challenge_is_fail_closed_between_password_and_session
  SEC-129:
    description: An org that requires two-factor FORCES enrollment before console access - a required-but-unenrolled user's login returns 2fa_enrollment_required and the session it carries is clamped by the resolver to the enrollment surface ONLY (every non-enroll authenticated route is refused 403 two_factor_enrollment_required while the enroll routes are open), completing enrollment lifts the clamp on the same session, and a mid-session policy flip clamps an already-logged-in unenrolled user on their next request.
    tests:
      - tests/security/test_two_factor.py::test_org_required_two_factor_forces_enrollment_only
  SEC-130:
    description: The challenge is rate-limited, constant-time / non-enumerating, and audited - an unknown challenge and a valid challenge with a wrong code return the byte-identical generic failure and status, a failed challenge is audited keys-only and raises a two_factor_challenge_failed SecurityEvent signal (enroll begin/activate are audited too), and the per-identity bound (5/min) trips the 6th wrong attempt with 429 while a miss does not consume the challenge.
    tests:
