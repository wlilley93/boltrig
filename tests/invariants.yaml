# Boltrig binding-invariant catalogue (the K-29/K-30 ratchet input).
#
# Each entry is a binding invariant: a one-line meaning plus the pytest node ids
# that bind it (path::test_name). scripts/check_invariants.py cross-checks this
# file against the @pytest.mark.invariant(...) markers in tests/: every declared
# invariant MUST have at least one real test (no unbound claims), and every
# marker in the tests MUST be declared here (no undeclared invariants). Binding
# debt may only ever decrease. See docs/invariants.md for the human-readable map.
#
# Structure (parsed by a tiny stdlib reader; keep this exact shape):
#   invariants:
#     <ID>:
#       description: <one line>
#       tests:
#         - <path::test_name>
#
# Canonical source (per [2026] VJS-CC NANKLE-CONSOLIDATION 001, D2): every K-* id
# below is the canonical invariant id from agent-kernel-doctrine Appendix A
# (volume-1-the-rust-kernel/appendices/appendix-A-invariant-catalog.md). Boltrig
# binds these ids to tests; it does not define or renumber them. P*/SEC*/FR* ids
# are Boltrig-local (from the SRS) and never restate a K-*.

invariants:
  P9:
    description: Backend unavailability degrades gracefully, never crashes (graceful degradation).
    tests:
      - tests/kernel/test_ratelimit_degraded.py::test_degraded_mode_when_backend_down
  US-IAM-02:
    description: Row-level department isolation - an engineer cannot list another department's queue.
    tests:
      - tests/security/test_department_isolation.py::test_engineer_sees_only_their_department
      - tests/security/test_department_isolation.py::test_engineer_cannot_see_other_department
  US-KER-05:
    description: Discovery is caller-scoped - capabilities omit verbs outside the caller's grants.
    tests:
      - tests/security/test_discovery_scope.py::test_scoped_caller_sees_only_scoped_verbs
  US-FLT-04:
    description: Spawn selects the cheapest capable runtime for a child agent.
    tests:
      - tests/integration/test_fleet_spawn.py::test_cheapest_capable_runtime_chosen
  US-FLT-07:
    description: Degraded results are first-class - a degraded runtime result is marked degraded end to end (spawn result, audit row, chat reply) and is never presented as ordinary success.
    tests:
      - tests/integration/test_degraded_honesty.py::test_spawn_without_runtime_is_marked_degraded_and_audited
      - tests/integration/test_degraded_honesty.py::test_chat_turn_surfaces_a_degraded_spawn
  US-EXE-05:
    description: Executor selection is honest and optionally fail-closed - with BOLTRIG_REQUIRE_DURABLE set a durable-engine failure refuses to boot instead of silently falling back, and the selected executor's durability is recorded.
    tests:
      - tests/integration/test_executor_selection.py::test_require_durable_refuses_to_fall_back
      - tests/integration/test_executor_selection.py::test_default_falls_back_to_local_with_durable_false
      - tests/integration/test_executor_selection.py::test_local_enqueue_runs_inline_and_push_event_records
  SEC-29:
    description: Test-spawns/eval run under the initiator's grants - no escalation.
    tests:
      - tests/security/test_round_three.py::test_test_spawn_cannot_escalate
  SEC-30:
    description: A personal agent acts only with the owner's delegated authority (on-behalf-of, capped).
    tests:
      - tests/security/test_round_three.py::test_personal_agent_is_delegated_only
  SEC-31:
    description: Memory is scope-isolated - cross-user/cross-department reads are denied.
    tests:
      - tests/security/test_round_three.py::test_memory_scope_isolation
  SEC-32:
    description: Authoring/admin is RBAC-gated and audited with the actor.
    tests:
      - tests/security/test_round_three.py::test_authoring_requires_role_and_is_audited
  SEC-33:
    description: Cost/audit/runs insight is scope-filtered - a dept cannot read another's.
    tests:
      - tests/security/test_round_three.py::test_audit_and_runs_are_scope_filtered
  FR-OBS-02:
    description: The audit browser is scope-filtered (and search/run links preserved).
    tests:
      - tests/security/test_round_three.py::test_audit_and_runs_are_scope_filtered
  FR-EVAL-02:
    description: An eval runs through the chokepoint under a defined scope, no escalation.
    tests:
      - tests/security/test_round_three.py::test_eval_runs_without_escalation
  FR-ADM-02:
    description: Admin config round-trips to a manifest and supports rollback (C1, NFR-REL-01).
    tests:
      - tests/integration/test_round_three_studios.py::test_admin_config_round_trips
  FR-WFS-04:
    description: A registered workflow becomes a live durable run with the durable executor.
    tests:
      - tests/integration/test_round_three_studios.py::test_workflow_live_durable_registration
  FR-ADS-02:
    description: Adapter Studio binds a generated adapter's verbs only after a named review (gate).
    tests:
      - tests/integration/test_round_three_studios.py::test_adapter_studio_review_gate
  US-WFL-02:
    description: Workflow synthesis uses a reasoning runtime when present, else a deterministic fallback.
    tests:
      - tests/integration/test_workflow_synthesis.py::test_reasoned_synthesis_uses_runtime_steps
      - tests/integration/test_workflow_synthesis.py::test_reasoned_falls_back_to_deterministic_offline
  US-ADP-01:
    description: An adapter is generated from an OpenAPI spec, deriving its verbs.
    tests:
      - tests/integration/test_generated_adapter.py::test_generator_derives_verbs_from_openapi
  SEC-22:
    description: A generated / consumed adapter is inert until a human review gate activates it.
    tests:
      - tests/integration/test_generated_adapter.py::test_generated_adapter_inert_until_reviewed
      - tests/integration/test_mcp_consumer.py::test_consumed_server_inert_until_reviewed
  FR-MCP-03:
    description: An external MCP server is consumed as an adapter - its tools register as verbs.
    tests:
      - tests/integration/test_mcp_consumer.py::test_consume_external_mcp_server_as_verbs
  SEC-01:
    description: Real auth - an invalid/missing bearer is rejected 401; a valid token is scoped.
    tests:
      - tests/security/test_auth.py::test_missing_bearer_rejected
      - tests/security/test_auth.py::test_invalid_bearer_rejected
      - tests/security/test_auth.py::test_valid_bearer_yields_scoped_principal
      - tests/security/test_cf_access_auth.py::test_missing_assertion_rejected
      - tests/security/test_cf_access_auth.py::test_unverifiable_assertion_rejected
      - tests/security/test_cf_access_auth.py::test_superadmin_gets_full_authority
      - tests/security/test_cf_access_auth.py::test_member_can_operate_but_not_author
      - tests/security/test_cf_access_auth.py::test_authenticated_but_unmapped_email_is_denied
      - tests/security/test_cf_access_auth.py::test_email_case_and_mapping_are_normalised
      - tests/security/test_channel_gateway.py::test_bound_sender_resolves_to_its_internal_principal
      - tests/security/test_channel_gateway.py::test_unbound_sender_is_denied_fail_closed
      - tests/security/test_channel_gateway.py::test_unknown_tier_binding_is_denied
      - tests/security/test_channel_gateway.py::test_binding_is_tenant_and_channel_scoped
      - tests/security/test_channel_inbound.py::test_signed_inbound_creates_governed_work_item
      - tests/security/test_channel_inbound.py::test_unsigned_inbound_rejected
      - tests/security/test_channel_inbound.py::test_verified_but_unbound_sender_denied
      - tests/security/test_channel_inbound.py::test_unknown_channel_404
      - tests/security/test_channel_governance.py::test_member_cannot_connect_or_pair
      - tests/security/test_channel_governance.py::test_connect_stores_secret_kernel_side_never_returns_it
      - tests/security/test_channel_governance.py::test_disconnect_removes_channel_and_cascades
      - tests/security/test_channel_governance.py::test_pairing_code_consumes_and_binds_unknown_sender
      - tests/security/test_channel_governance.py::test_wrong_pairing_code_locks_out_after_cap
      - tests/security/test_channel_governance.py::test_expired_pairing_is_denied
  NFR-REL-01:
    description: A blocking HITL pause is durable - survives a restart and resumes on approval.
    tests:
      - tests/store/test_postgres_store.py::test_blocking_pause_survives_restart_and_resumes
  SEC-12:
    description: Sensitive data routes only to local endpoints - a misroute is blocked and audited.
    tests:
      - tests/security/test_sensitive_routing.py::test_sensitive_data_blocked_from_hosted_and_audited
      - tests/security/test_sensitive_routing.py::test_sensitive_data_routes_to_local_endpoint
      - tests/security/test_sensitive_routing.py::test_spawn_blocks_sensitive_on_hosted_capability
  SEC-15:
    description: Idempotent replay - a repeated idempotency key never re-executes a side-effecting verb.
    tests:
      - tests/kernel/test_idempotency.py::test_repeated_key_replays_without_reexecuting
      - tests/kernel/test_idempotency.py::test_distinct_key_executes_again
  FR-EXE-03:
    description: Recursion depth is bounded - a spawn past the capability max depth is refused.
    tests:
      - tests/integration/test_fleet_spawn.py::test_depth_limit_enforced
  K-2:
    description: The tenant permission ceiling caps caller grants (intersection, not union).
    tests:
      - tests/security/test_grant_enforcement.py::test_tenant_ceiling_caps_caller_grants
  K-5:
    description: Deny dominates allow in a GrantSet (a deny beats a covering allow).
    tests:
      - tests/unit/test_grants_model.py::test_deny_dominates_allow
  K-9:
    description: Grant wildcards match on the noun namespace, never a bare prefix collision.
    tests:
      - tests/unit/test_grants_model.py::test_wildcard_does_not_match_prefix_collision
  K-13:
    description: Fail-closed - empty grants deny everything and an unknown verb has no binding.
    tests:
      - tests/kernel/test_dispatch.py::test_unknown_verb_fails_closed
      - tests/unit/test_grants_model.py::test_empty_grants_deny_everything
  K-19:
    description: The audit chain is tamper-evident - a re-derive detects any reorder, drop, or edit.
    tests:
      - tests/kernel/test_audit_chain.py::test_chain_verifies_and_detects_tampering
  K-20:
    description: Bounded observability - the audit writer scrubs secrets / identity in detail.
    tests:
      - tests/security/test_credential_isolation.py::test_audit_scrubs_secret_in_detail
  SEC-05:
    description: Resolved credential material never enters the audit log.
    tests:
      - tests/security/test_credential_isolation.py::test_secret_material_never_enters_audit
  FR-MCP-01:
    description: The kernel MCP face lists granted verbs (with schemas) as tools.
    tests:
      - tests/security/test_mcp_face.py::test_tools_list_is_granted_only_with_schemas
  FR-MCP-02:
    description: An MCP run-scoped token exposes only that run's tools.
    tests:
      - tests/security/test_mcp_face.py::test_out_of_scope_verb_not_listed_and_denied
  SEC-23:
    description: A Pi/MCP run is exposed only its granted verbs; out-of-scope calls are denied.
    tests:
      - tests/security/test_mcp_face.py::test_out_of_scope_verb_not_listed_and_denied
  SEC-26:
    description: Chokepoint parity - every MCP-originated call runs the full dispatch order + audit.
    tests:
      - tests/security/test_mcp_face.py::test_tools_call_runs_chokepoint_and_audits
      - tests/security/test_mcp_face.py::test_mcp_hitl_gate_parity
  FR-RUN-01:
    description: A 'pi' capability resolves via build_runtime to PiRuntime.
    tests:
      - tests/security/test_pi_runtime.py::test_build_runtime_resolves_pi
  FR-RUN-02:
    description: The Pi sidecar receives only the scoped MCP connection + model - no native tools/creds.
    tests:
      - tests/security/test_pi_runtime.py::test_sidecar_request_carries_no_tool_credentials
  FR-RUN-03:
    description: A Pi run's tool call passes the full kernel chokepoint (out-of-scope denied).
    tests:
      - tests/security/test_pi_runtime.py::test_pi_run_tool_call_passes_chokepoint
  FR-RUN-05:
    description: PiRuntime degrades (never crashes) when the sidecar or model is absent.
    tests:
      - tests/security/test_pi_runtime.py::test_pi_degrades_without_sidecar
  SEC-24:
    description: The Pi sidecar is sandboxed - no native tools, egress only to the kernel + model.
    tests:
      - tests/integration/test_round_two_manifest.py::test_pi_sidecar_sandbox_is_declared_restrictive
  SEC-27:
    description: No tool credential is ever sent to Pi - only a model key and a run-scoped MCP token.
    tests:
      - tests/security/test_pi_runtime.py::test_sidecar_request_carries_no_tool_credentials
  SEC-28:
    description: Severability - the kernel and models import nothing from Pi or the sidecar.
    tests:
      - tests/security/test_severability.py::test_kernel_and_models_have_no_pi_or_sidecar_coupling
  FR-CONV-04:
    description: Inline HITL and run events stream into a chat turn and are recorded.
    tests:
      - tests/integration/test_chat.py::test_chat_streams_events_and_persists
      - tests/integration/test_chat.py::test_inline_hitl_event_streams_and_is_recorded
  FR-CONV-06:
    description: Conversation access control - only the owner and scoped roles may read a thread.
    tests:
      - tests/security/test_conversations.py::test_other_user_cannot_read_conversation
  SEC-25:
    description: Conversation confidentiality - cross-user read/continue within a tenant is denied.
    tests:
      - tests/security/test_conversations.py::test_other_user_cannot_read_conversation
      - tests/security/test_conversations.py::test_other_user_cannot_continue_conversation
  SEC-07:
    description: A verb is denied unless the caller holds the matching grant.
    tests:
      - tests/security/test_grant_enforcement.py::test_ungranted_verb_is_denied
      - tests/security/test_grant_enforcement.py::test_grant_for_other_verb_does_not_authorise
  SEC-08:
    description: Tenant isolation - no cross-tenant discovery or dispatch (fail-closed), both stores.
    tests:
      - tests/security/test_tenant_isolation.py::test_other_tenant_cannot_see_this_tenants_verbs
      - tests/security/test_tenant_isolation.py::test_other_tenant_dispatch_fails_closed
      - tests/store/test_postgres_store.py::test_cross_tenant_fails_closed
  SEC-65:
    description: DB-enforced tenant isolation (RLS) - under FORCE row-level security a non-bypassing role sees only its app.tenant_id rows, cannot write into another tenant (WITH CHECK), and an unset GUC yields zero rows (fail-closed); and the live wiring sets app.tenant_id from the request context before every statement.
    tests:
      - tests/integration/test_rls.py::test_rls_enforces_tenant_isolation_and_fails_closed
      - tests/unit/test_rls_pool.py::test_rls_pool_sets_tenant_guc_before_each_statement
      - tests/unit/test_rls_pool.py::test_rls_pool_is_fail_closed_when_no_tenant_bound
      - tests/security/test_rls_auth_binding.py::test_pat_resolution_binds_tenant_before_the_owner_read
      - tests/security/test_rls_auth_binding.py::test_provision_user_binds_tenant_before_the_first_read
  SEC-13:
    description: PII is detected and redacted before it leaves the boundary.
    tests:
      - tests/security/test_budget_and_pii.py::test_pii_redaction
  SEC-14:
    description: High-consequence / blocking verbs pause for human approval and cannot be bypassed - the approval is verb-bound, single-use (no replay or cross-verb reuse), and a human decision the requester cannot self-approve.
    tests:
      - tests/security/test_hitl_gate.py::test_blocking_verb_pauses_for_approval
      - tests/security/test_hitl_gate.py::test_resumes_after_approval
      - tests/security/test_hitl_gate.py::test_approval_is_single_use
      - tests/security/test_hitl_gate.py::test_approval_is_verb_bound_and_single_use
      - tests/security/test_hitl_gate.py::test_respond_rejects_agent_and_self_approval
  SEC-16:
    description: Every action (allowed or denied) is audited, hash-chained, append-only.
    tests:
      - tests/kernel/test_audit_chain.py::test_every_action_is_audited
      - tests/kernel/test_audit_chain.py::test_denied_actions_are_also_audited
      - tests/kernel/test_audit_chain.py::test_concurrent_writes_keep_a_contiguous_verifiable_chain
  SEC-21:
    description: Verb params are schema-validated before any dispatch side effect.
    tests:
      - tests/kernel/test_dispatch.py::test_invalid_params_rejected_before_dispatch
  FR-KER-05:
    description: Per-verb / per-tenant rate limits are enforced at the kernel.
    tests:
      - tests/kernel/test_ratelimit_degraded.py::test_rate_limit_enforced
  FR-COST-02:
    description: A hard-stop budget halts before exceeding; a soft budget records overage only.
    tests:
      - tests/security/test_budget_and_pii.py::test_budget_hard_stop_halts_before_exceeding
      - tests/security/test_budget_and_pii.py::test_soft_budget_does_not_halt

  # --- Round Four: settings, account & access management (SEC-34..39) ---
  SEC-34:
    description: A personal access token never escalates (scope ∩ current grants, re-checked) and a deactivated/de-provisioned user's tokens stop working.
    tests:
      - tests/security/test_round_four.py::test_pat_never_escalates_and_dies_with_user
  SEC-35:
    description: Invitations do not bypass the IdP - they pre-stage a role/scope, grant no access until SSO login, and are consumed once.
    tests:
      - tests/security/test_round_four.py::test_invitations_do_not_bypass_idp
  SEC-36:
    description: Settings writes enforce RBAC server-side and are audited with the actor.
    tests:
      - tests/security/test_round_four.py::test_settings_changes_are_authz_checked_and_audited
  SEC-37:
    description: Headless REST/MCP runs the same chokepoint scoped to the user - no weak path.
    tests:
      - tests/security/test_round_four.py::test_headless_parity_no_weak_path
  SEC-38:
    description: No unauthenticated access to tokens or connection details (mobile/web follow the same auth rules).
    tests:
      - tests/security/test_round_four.py::test_no_unauthenticated_access_to_tokens
  SEC-39:
    description: An authored verb with a destructive/outbound name defaults to high-consequence so the HITL gate engages.
    tests:
      - tests/security/test_round_four.py::test_authored_verbs_safe_by_default
      - tests/security/test_channel_send.py::test_channel_send_is_high_consequence
      - tests/security/test_channel_send.py::test_channel_send_delivers_via_seam_and_is_tenant_scoped

  # --- Round Five: kernel-governed structured memory (SEC-40..45) ---
  SEC-40:
    description: The kernel is the memory isolation boundary at ingestion AND retrieval - a hostile cross-scope edge (incl multi-hop) cannot leak an out-of-scope fact.
    tests:
      - tests/security/test_round_five.py::test_kernel_is_the_isolation_boundary
      - tests/unit/test_vector_memory.py::test_vector_engine_recall_is_scope_bounded_multihop
      - tests/integration/test_pgvector_engine.py::test_pgvector_recall_is_scope_bounded_multihop
  MEM-VEC-01:
    description: Native vector recall ranks by cosine similarity - a fact sharing the query's terms outranks one that does not, an unrelated (cosine ~0) fact is not returned, and the in-process and pgvector engines agree.
    tests:
      - tests/unit/test_vector_memory.py::test_vector_recall_ranks_by_cosine
      - tests/integration/test_pgvector_engine.py::test_pgvector_recall_ranks_by_cosine
  SEC-41:
    description: Recalled memory is data, never authority - it cannot grant a caller a verb they lack.
    tests:
      - tests/security/test_round_five.py::test_memory_cannot_escalate
  SEC-42:
    description: Content is screened for injection/malware AND API secrets before it becomes memory; poison/secrets are rejected fail-closed, never persisted into any engine (Cognee or native).
    tests:
      - tests/security/test_round_five.py::test_ingestion_screens_poison
      - tests/security/test_round_five.py::test_api_secret_is_never_remembered
  SEC-43:
    description: Sensitive memory must use a local endpoint; a misroute is blocked and audited.
    tests:
      - tests/security/test_round_five.py::test_sensitive_memory_stays_local
  SEC-44:
    description: Erasure is complete (the node and its derived edges/facts), engine-confirmed, ledgered and audited.
    tests:
      - tests/security/test_round_five.py::test_complete_audited_erasure
      - tests/integration/test_pgvector_engine.py::test_pgvector_forget_is_complete
  SEC-45:
    description: Recall is least-privilege and audited - query and count are recorded, fact contents never are.
    tests:
      - tests/security/test_round_five.py::test_recall_is_audited_without_leaking_contents
  SEC-46:
    description: Conversation continuity is deterministic and append-only (an earlier turn's render is a prefix of a later one) and adds no authority - it composes only persisted text.
    tests:
      - tests/security/test_round_six.py::test_continuity_is_deterministic_and_append_only
  SEC-47:
    description: The model gateway binds per conversation (not per run), pins a conversation to one model across turns, and never re-routes sensitive data (residency preserved).
    tests:
      - tests/security/test_round_six.py::test_gateway_binds_per_conversation_not_run
      - tests/security/test_round_six.py::test_gateway_never_reroutes_sensitive_and_is_inert_when_unset
  FR-GW-01:
    description: The model gateway (Bifrost) is wired into the stack - a profile-gated bifrost service on :8080 and the documented gateway URL matches it - so activation is one env line plus provider keys.
    tests:
      - tests/security/test_round_six.py::test_bifrost_is_wired_into_the_stack
  FR-SKILL-01:
    description: The skill shelf (skill.search) returns lightweight descriptions only - never the prompt_fragment body - and filters by query (progressive disclosure).
    tests:
      - tests/security/test_round_fifteen.py::test_skill_search_returns_descriptions_not_bodies
  FR-SKILL-02:
    description: skill.load composes the inheritance-merged body bound to the job's context, validated against the skill's context_requirements (ContextRequirementsUnmet on mismatch).
    tests:
      - tests/security/test_round_fifteen.py::test_skill_load_composes_body_and_binds_context
  SEC-57:
    description: The skill shelf runs the chokepoint (grant-checked, tenant-scoped) and a loaded skill is data not authority - load returns the skill's tool_grants but does not grant them, so it cannot escalate.
    tests:
      - tests/security/test_round_fifteen.py::test_skill_shelf_is_governed_and_load_does_not_escalate
  FR-EXT-01:
    description: A project adapter declared in the manifest by module_ref (a non-builtin id) is imported and registered at boot - extend the kernel from outside, no core edit.
    tests:
      - tests/integration/test_round_fifteen_bundle.py::test_project_adapter_loads_by_module_ref
  FR-EXT-02:
    description: External MCP servers declared in the manifest mcp.consume register inert at boot, exposing no verbs until the review/activate gate runs (SEC-22 preserved).
    tests:
      - tests/integration/test_round_fifteen_bundle.py::test_consumed_mcp_servers_register_inert_pending_review
  SEC-48:
    description: The Pi sidecar's network egress is enforced by the deploy manifests (sandbox-only, internal in the secure overlay), not merely documented.
    tests:
      - tests/security/test_round_six.py::test_pi_sidecar_egress_is_enforced_in_manifests
  SEC-49:
    description: Continuity is scope-safe - only the caller's own tenant/conversation history is ever composed into a prompt.
    tests:
      - tests/security/test_round_six.py::test_continuity_only_composes_the_callers_own_conversation
  FR-CTL-01:
    description: Agent/department profile config takes effect live (re-read per call via the provider), with no router reconstruction.
    tests:
      - tests/integration/test_round_seven.py::test_chief_of_staff_reloads_departments_live
  FR-CTL-02:
    description: The generic interpreter executes a stored workflow's steps in dependency order, each as its own durable boundary through the kernel, skipping descendants of a failed step.
    tests:
      - tests/integration/test_round_seven.py::test_interpreter_runs_steps_in_dependency_order_each_durable
      - tests/integration/test_round_seven.py::test_interpreter_skips_descendants_of_a_failed_step
  SEC-50:
    description: Every workflow step is dispatched through the kernel chokepoint under the caller's own grants - a step can neither escalate nor bypass governance.
    tests:
      - tests/security/test_round_seven.py::test_workflow_step_cannot_escalate_past_caller_grants
  SEC-51:
    description: Control-plane config writes are dispatched as kernel verbs (grant-checked, audited, HITL-gateable), not an ungoverned store write.
    tests:
      - tests/security/test_round_seven.py::test_control_plane_write_is_grant_checked
      - tests/security/test_round_seven.py::test_control_plane_write_is_hitl_gated_and_audited
  SEC-52:
    description: web.fetch is SSRF-guarded and NetworkConfig-enforced - private/loopback/link-local/metadata targets, blocked or non-allowed domains, and air-gap are refused before any network call.
    tests:
      - tests/security/test_round_eight.py::test_ssrf_guard_blocks_internal_addresses
      - tests/security/test_round_eight.py::test_network_policy_enforced
      - tests/security/test_round_eight.py::test_adapter_refuses_internal_target_before_any_fetch
  SEC-53:
    description: Internet access is a governed verb - web.fetch runs the chokepoint (grant-checked and HITL-gated as a high-consequence verb), so it cannot bypass the kernel and injected content cannot escalate.
    tests:
      - tests/security/test_round_eight.py::test_web_fetch_is_grant_checked
      - tests/security/test_round_eight.py::test_web_fetch_is_hitl_gated
  SEC-54:
    description: The stack foundation layers never depend upward - models/store/adapters import only the foundation, keeping the seam a future repo-split would cleave along clean.
    tests:
      - tests/security/test_severability.py::test_foundation_layers_do_not_depend_upward
  FR-EVT-01:
    description: A verb invoked under a run publishes a paired tool_call + tool_result to that run's event stream; a failed call reports status with no output leak.
    tests:
      - tests/security/test_round_ten.py::test_verb_publishes_paired_tool_events
      - tests/security/test_round_ten.py::test_failed_verb_emits_error_result_without_leaking
  FR-EVT-02:
    description: Run events are a pure side-channel - a relay failure never breaks a call, a call with no run_id publishes nothing, and a paused call surfaces a hitl event.
    tests:
      - tests/security/test_round_ten.py::test_no_run_id_publishes_nothing_and_call_still_works
      - tests/security/test_round_ten.py::test_relay_failure_never_breaks_dispatch
      - tests/security/test_round_ten.py::test_pending_human_emits_hitl_event
  SEC-55:
    description: Run events are run-keyed and credential-free - a verb's events publish only to its own run's stream and never carry credential material.
    tests:
      - tests/security/test_round_ten.py::test_events_are_run_keyed_and_credential_free
  SEC-56:
    description: A run's event stream is tenant-scoped - the run-events endpoint streams only runs that produced audited activity in the caller's tenant; another tenant gets 404.
    tests:
      - tests/security/test_round_eleven.py::test_run_events_are_tenant_scoped
  FR-EVT-03:
    description: The run-events endpoint returns the events a run emitted as SSE frames (snapshot), and an unknown run is a 404.
    tests:
      - tests/security/test_round_eleven.py::test_unknown_run_is_404
  FR-EVT-04:
    description: The interpreter emits a workflow_step event per step (step_id + running/ok/failed/skipped) on the run's stream, bound to one run id so step events, the steps' tool events, and audit cohere.
    tests:
      - tests/integration/test_round_twelve.py::test_interpreter_emits_step_events_on_the_run_stream
      - tests/integration/test_round_twelve.py::test_skipped_descendant_emits_skipped_step_event
  SEC-58:
    description: Edge/web hardening - the kernel app stamps security headers (HSTS/nosniff/frame-deny/CSP) on every response, validates the Host header, and caps request-body size (WEB-02/03/06, RES-01).
    tests:
      - tests/security/test_round_sixteen.py::test_security_headers_host_and_body_cap
  SEC-59:
    description: JWT verification pins an explicit algorithm allowlist, rejects an ID token used as an access token, and rejects a token with no expiry (IAM-02/03/04).
    tests:
      - tests/security/test_round_sixteen.py::test_jwt_alg_allowlist_and_access_token_only
  SEC-60:
    description: Dev auth is impossible in production - the header-trusting resolver refuses to start when a production signal is present (IAM-09).
    tests:
      - tests/security/test_round_sixteen.py::test_dev_auth_refuses_production_signal
  SEC-61:
    description: The shared egress guard blocks cloud-metadata / link-local targets for every HTTP adapter (not just web.fetch), closing the SSRF to IMDS token-theft path (INJ-02 / CLOUD-03).
    tests:
      - tests/security/test_round_sixteen.py::test_shared_egress_guard_blocks_metadata
  SEC-62:
    description: A Unicode-confusable or non-canonical verb id can never match a grant - matching is NFKC-normalised and restricted to a safe identifier charset (UPLOAD-05 / AZ-02).
    tests:
      - tests/security/test_round_sixteen.py::test_confusable_verb_id_never_matches_a_grant
  SEC-63:
    description: An inbound webhook carrying a timestamp outside the replay window is rejected, so a captured signed request cannot replay forever (ADP-08).
    tests:
      - tests/security/test_round_sixteen.py::test_webhook_replay_window
  SEC-64:
    description: The first-party app containers are hardened (INF-01) - read-only rootfs, all caps dropped, no-new-privileges, resource-capped, and non-root images - enforced in the deploy manifests so it cannot silently regress.
    tests:
      - tests/security/test_round_seventeen.py::test_app_containers_are_hardened
      - tests/security/test_round_seventeen.py::test_app_images_run_non_root
