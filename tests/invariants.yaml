  # --- no new domain effect begins after a run is revoked ---
  SEC-166:
    description: The pump re-reads the cancellation marker at boundary 2 - the cooperative point immediately AFTER a completed step - so no new domain effect BEGINS after revocation ([2026] VJS-COUNTY 6, D3). A cancel arriving during the in-flight head.handle previously went unseen for the whole of that step's duration, because the run then acted on the marker as read BEFORE dispatch: the cancelled run went on to persist the step's new_work_items as fresh PENDING children (which the pump would subsequently claim and execute, growing a tree of live work out of a revoked run) and to promote its GENERATED workflow into the reusable library (mutating the flywheel durably, beyond the run's own lifetime). Refreshed at boundary 2, a cancel suppresses both downstream effects and the terminal state reflects the refreshed marker rather than the stale pre-dispatch one. The completed step's own record is NOT discarded - it really ran, so the head's aggregate (children/spawned) is preserved on the item beneath the neutral cancel outcome - and the step itself is still never interrupted (D3 forbids a mid-step hard kill; boundary 2 is a cooperative check at a boundary the step has already crossed, exactly like the pre-existing boundary 1 refresh). An uncancelled run is unaffected: it still spawns follow-on work and still learns.
    tests:
      - tests/security/test_run_cancel.py::test_a_cancel_during_the_step_spawns_no_follow_on_work
      - tests/security/test_run_cancel.py::test_a_cancel_during_the_step_learns_no_workflow
      - tests/security/test_run_cancel.py::test_the_completed_steps_own_record_survives_the_cancel
      - tests/security/test_run_cancel.py::test_an_uncancelled_run_is_completely_unaffected
      - tests/security/test_run_cancel.py::test_in_flight_adapter_call_is_not_interrupted

  SEC-167:
    description: The MCP consumer's bearer is the credential the KERNEL resolved for that call, never material held on the adapter instance. The adapter carries no token (the token= constructor param is gone), so the per-call credential dispatch already resolves and passes is authoritative rather than silently inert: two calls on one instance present the two different credentials they were handed, and rotating the stored credential ref changes the next call's bearer with no adapter rebuild. A call with no credential, or with material carrying no usable token, FAILS CLOSED with an UNAUTHORISED refusal and reaches the transport not at all, rather than posting an empty bearer as an unauthenticated request. Registration puts a REFERENCE on the credential seam (set_credential_ref plus bind_adapter_credential, mirroring the manifest adapter-credential path, SEC-04/05) and refuses raw secret material outright, so the secret is never an audited control-plane param and never lives outside the kernel. The SEC-22 review gate is checked first and still refuses an unreviewed server holding a valid credential, and SEC-61 SSRF pinning still refuses a blocked destination before the bearer can leave.
    tests:
      - tests/security/test_mcp_consumer_credential.py::test_the_kernels_per_call_credential_is_the_bearer
      - tests/security/test_mcp_consumer_credential.py::test_a_second_call_uses_the_second_credential_not_the_first
      - tests/security/test_mcp_consumer_credential.py::test_no_credential_fails_closed_even_with_a_static_token_planted
      - tests/security/test_mcp_consumer_credential.py::test_empty_credential_material_also_fails_closed
      - tests/security/test_mcp_consumer_credential.py::test_the_adapter_holds_no_token_to_fall_back_on
      - tests/security/test_mcp_consumer_credential.py::test_rotating_the_stored_ref_changes_the_next_calls_bearer
      - tests/security/test_mcp_consumer_credential.py::test_registration_binds_the_ref_and_refuses_raw_material

  # --- chain verification re-derives the WHOLE chain, never a tail window ---
  SEC-168:
    description: Audit-chain and security-chain verification re-derives the ENTIRE per-tenant chain from seq 1 through the ascending store scan seam (audit_scan/security_scan return rows with seq > after_seq, oldest first, up to limit), never a bounded tail window. The old verify read only the newest 10_000 rows and seeded prev=None, so an UNTAMPERED chain longer than the window failed at the window's first row (tamper-evidence crying wolf), and tampering any row below the window was never re-derived at all (tampering an old row went unseen). Now an untampered chain of any length verifies OK across every page boundary, tampering a row in the OLDEST page is caught with the correct first_bad_seq, and both hold identically on the in-memory and Postgres stores, while audit_query/security_query keep their existing tail semantics for the observability and /v1/audit callers that depend on them.
    tests:
      - tests/kernel/test_audit_chain.py::test_a_chain_longer_than_the_old_window_verifies_ok
      - tests/kernel/test_audit_chain.py::test_tampering_below_the_old_window_is_still_caught
      - tests/security/test_security_event_stream.py::test_a_long_security_chain_verifies_ok
      - tests/security/test_security_event_stream.py::test_security_tamper_below_the_old_window_is_caught
      - tests/store/test_store_parity.py::test_audit_verify_walks_every_page_of_a_long_chain
      - tests/store/test_store_parity.py::test_audit_tamper_in_the_oldest_page_is_caught
      - tests/store/test_store_parity.py::test_audit_scan_pages_ascending_and_query_keeps_tail
      - tests/store/test_store_parity.py::test_security_verify_and_scan_page_the_whole_chain
