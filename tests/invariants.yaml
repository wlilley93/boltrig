# Nankle binding-invariant catalogue (the K-29/K-30 ratchet input).
#
# Each entry is a binding invariant: a one-line meaning plus the pytest node ids
# that bind it (path::test_name). scripts/check_invariants.py cross-checks this
# file against the @pytest.mark.invariant(...) markers in tests/: every declared
# invariant MUST have at least one real test (no unbound claims), and every
# marker in the tests MUST be declared here (no undeclared invariants). Binding
# debt may only ever decrease. See docs/invariants.md for the human-readable map.
#
# Structure (parsed by a tiny stdlib reader; keep this exact shape):
#   invariants:
#     <ID>:
#       description: <one line>
#       tests:
#         - <path::test_name>
#
# Canonical source (per [2026] VJS-CC NANKLE-CONSOLIDATION 001, D2): every K-* id
# below is the canonical invariant id from agent-kernel-doctrine Appendix A
# (volume-1-the-rust-kernel/appendices/appendix-A-invariant-catalog.md). Nankle
# binds these ids to tests; it does not define or renumber them. P*/SEC*/FR* ids
# are Nankle-local (from the SRS) and never restate a K-*.

invariants:
  P9:
    description: Backend unavailability degrades gracefully, never crashes (graceful degradation).
    tests:
      - tests/kernel/test_ratelimit_degraded.py::test_degraded_mode_when_backend_down
  US-IAM-02:
    description: Row-level department isolation - an engineer cannot list another department's queue.
    tests:
      - tests/security/test_department_isolation.py::test_engineer_sees_only_their_department
      - tests/security/test_department_isolation.py::test_engineer_cannot_see_other_department
  US-KER-05:
    description: Discovery is caller-scoped - capabilities omit verbs outside the caller's grants.
    tests:
      - tests/security/test_discovery_scope.py::test_scoped_caller_sees_only_scoped_verbs
  US-FLT-04:
    description: Spawn selects the cheapest capable runtime for a child agent.
    tests:
      - tests/integration/test_fleet_spawn.py::test_cheapest_capable_runtime_chosen
  SEC-29:
    description: Test-spawns/eval run under the initiator's grants - no escalation.
    tests:
      - tests/security/test_round_three.py::test_test_spawn_cannot_escalate
  SEC-30:
    description: A personal agent acts only with the owner's delegated authority (on-behalf-of, capped).
    tests:
      - tests/security/test_round_three.py::test_personal_agent_is_delegated_only
  SEC-31:
    description: Memory is scope-isolated - cross-user/cross-department reads are denied.
    tests:
      - tests/security/test_round_three.py::test_memory_scope_isolation
  SEC-32:
    description: Authoring/admin is RBAC-gated and audited with the actor.
    tests:
      - tests/security/test_round_three.py::test_authoring_requires_role_and_is_audited
  SEC-33:
    description: Cost/audit/runs insight is scope-filtered - a dept cannot read another's.
    tests:
      - tests/security/test_round_three.py::test_audit_and_runs_are_scope_filtered
  FR-OBS-02:
    description: The audit browser is scope-filtered (and search/run links preserved).
    tests:
      - tests/security/test_round_three.py::test_audit_and_runs_are_scope_filtered
  FR-EVAL-02:
    description: An eval runs through the chokepoint under a defined scope, no escalation.
    tests:
      - tests/security/test_round_three.py::test_eval_runs_without_escalation
  FR-ADM-02:
    description: Admin config round-trips to a manifest and supports rollback (C1, NFR-REL-01).
    tests:
      - tests/integration/test_round_three_studios.py::test_admin_config_round_trips
  FR-WFS-04:
    description: A registered workflow becomes a live durable run with the durable executor.
    tests:
      - tests/integration/test_round_three_studios.py::test_workflow_live_durable_registration
  FR-ADS-02:
    description: Adapter Studio binds a generated adapter's verbs only after a named review (gate).
    tests:
      - tests/integration/test_round_three_studios.py::test_adapter_studio_review_gate
  US-WFL-02:
    description: Workflow synthesis uses a reasoning runtime when present, else a deterministic fallback.
    tests:
      - tests/integration/test_workflow_synthesis.py::test_reasoned_synthesis_uses_runtime_steps
      - tests/integration/test_workflow_synthesis.py::test_reasoned_falls_back_to_deterministic_offline
  US-ADP-01:
    description: An adapter is generated from an OpenAPI spec, deriving its verbs.
    tests:
      - tests/integration/test_generated_adapter.py::test_generator_derives_verbs_from_openapi
  SEC-22:
    description: A generated / consumed adapter is inert until a human review gate activates it.
    tests:
      - tests/integration/test_generated_adapter.py::test_generated_adapter_inert_until_reviewed
      - tests/integration/test_mcp_consumer.py::test_consumed_server_inert_until_reviewed
  FR-MCP-03:
    description: An external MCP server is consumed as an adapter - its tools register as verbs.
    tests:
      - tests/integration/test_mcp_consumer.py::test_consume_external_mcp_server_as_verbs
  SEC-01:
    description: Real auth - an invalid/missing bearer is rejected 401; a valid token is scoped.
    tests:
      - tests/security/test_auth.py::test_missing_bearer_rejected
      - tests/security/test_auth.py::test_invalid_bearer_rejected
      - tests/security/test_auth.py::test_valid_bearer_yields_scoped_principal
  NFR-REL-01:
    description: A blocking HITL pause is durable - survives a restart and resumes on approval.
    tests:
      - tests/store/test_postgres_store.py::test_blocking_pause_survives_restart_and_resumes
  SEC-12:
    description: Sensitive data routes only to local endpoints - a misroute is blocked and audited.
    tests:
      - tests/security/test_sensitive_routing.py::test_sensitive_data_blocked_from_hosted_and_audited
      - tests/security/test_sensitive_routing.py::test_sensitive_data_routes_to_local_endpoint
      - tests/security/test_sensitive_routing.py::test_spawn_blocks_sensitive_on_hosted_capability
  SEC-15:
    description: Idempotent replay - a repeated idempotency key never re-executes a side-effecting verb.
    tests:
      - tests/kernel/test_idempotency.py::test_repeated_key_replays_without_reexecuting
      - tests/kernel/test_idempotency.py::test_distinct_key_executes_again
  FR-EXE-03:
    description: Recursion depth is bounded - a spawn past the capability max depth is refused.
    tests:
      - tests/integration/test_fleet_spawn.py::test_depth_limit_enforced
  K-2:
    description: The tenant permission ceiling caps caller grants (intersection, not union).
    tests:
      - tests/security/test_grant_enforcement.py::test_tenant_ceiling_caps_caller_grants
  K-5:
    description: Deny dominates allow in a GrantSet (a deny beats a covering allow).
    tests:
      - tests/unit/test_grants_model.py::test_deny_dominates_allow
  K-9:
    description: Grant wildcards match on the noun namespace, never a bare prefix collision.
    tests:
      - tests/unit/test_grants_model.py::test_wildcard_does_not_match_prefix_collision
  K-13:
    description: Fail-closed - empty grants deny everything and an unknown verb has no binding.
    tests:
      - tests/kernel/test_dispatch.py::test_unknown_verb_fails_closed
      - tests/unit/test_grants_model.py::test_empty_grants_deny_everything
  K-19:
    description: The audit chain is tamper-evident - a re-derive detects any reorder, drop, or edit.
    tests:
      - tests/kernel/test_audit_chain.py::test_chain_verifies_and_detects_tampering
  K-20:
    description: Bounded observability - the audit writer scrubs secrets / identity in detail.
    tests:
      - tests/security/test_credential_isolation.py::test_audit_scrubs_secret_in_detail
  SEC-05:
    description: Resolved credential material never enters the audit log.
    tests:
      - tests/security/test_credential_isolation.py::test_secret_material_never_enters_audit
  FR-MCP-01:
    description: The kernel MCP face lists granted verbs (with schemas) as tools.
    tests:
      - tests/security/test_mcp_face.py::test_tools_list_is_granted_only_with_schemas
  FR-MCP-02:
    description: An MCP run-scoped token exposes only that run's tools.
    tests:
      - tests/security/test_mcp_face.py::test_out_of_scope_verb_not_listed_and_denied
  SEC-23:
    description: A Pi/MCP run is exposed only its granted verbs; out-of-scope calls are denied.
    tests:
      - tests/security/test_mcp_face.py::test_out_of_scope_verb_not_listed_and_denied
  SEC-26:
    description: Chokepoint parity - every MCP-originated call runs the full dispatch order + audit.
    tests:
      - tests/security/test_mcp_face.py::test_tools_call_runs_chokepoint_and_audits
      - tests/security/test_mcp_face.py::test_mcp_hitl_gate_parity
  FR-RUN-01:
    description: A 'pi' capability resolves via build_runtime to PiRuntime.
    tests:
      - tests/security/test_pi_runtime.py::test_build_runtime_resolves_pi
  FR-RUN-02:
    description: The Pi sidecar receives only the scoped MCP connection + model - no native tools/creds.
    tests:
      - tests/security/test_pi_runtime.py::test_sidecar_request_carries_no_tool_credentials
  FR-RUN-03:
    description: A Pi run's tool call passes the full kernel chokepoint (out-of-scope denied).
    tests:
      - tests/security/test_pi_runtime.py::test_pi_run_tool_call_passes_chokepoint
  FR-RUN-05:
    description: PiRuntime degrades (never crashes) when the sidecar or model is absent.
    tests:
      - tests/security/test_pi_runtime.py::test_pi_degrades_without_sidecar
  SEC-24:
    description: The Pi sidecar is sandboxed - no native tools, egress only to the kernel + model.
    tests:
      - tests/integration/test_round_two_manifest.py::test_pi_sidecar_sandbox_is_declared_restrictive
  SEC-27:
    description: No tool credential is ever sent to Pi - only a model key and a run-scoped MCP token.
    tests:
      - tests/security/test_pi_runtime.py::test_sidecar_request_carries_no_tool_credentials
  SEC-28:
    description: Severability - the kernel and models import nothing from Pi or the sidecar.
    tests:
      - tests/security/test_severability.py::test_kernel_and_models_have_no_pi_or_sidecar_coupling
  FR-CONV-04:
    description: Inline HITL and run events stream into a chat turn and are recorded.
    tests:
      - tests/integration/test_chat.py::test_chat_streams_events_and_persists
      - tests/integration/test_chat.py::test_inline_hitl_event_streams_and_is_recorded
  FR-CONV-06:
    description: Conversation access control - only the owner and scoped roles may read a thread.
    tests:
      - tests/security/test_conversations.py::test_other_user_cannot_read_conversation
  SEC-25:
    description: Conversation confidentiality - cross-user read/continue within a tenant is denied.
    tests:
      - tests/security/test_conversations.py::test_other_user_cannot_read_conversation
      - tests/security/test_conversations.py::test_other_user_cannot_continue_conversation
  SEC-07:
    description: A verb is denied unless the caller holds the matching grant.
    tests:
      - tests/security/test_grant_enforcement.py::test_ungranted_verb_is_denied
      - tests/security/test_grant_enforcement.py::test_grant_for_other_verb_does_not_authorise
  SEC-08:
    description: Tenant isolation - no cross-tenant discovery or dispatch (fail-closed), both stores.
    tests:
      - tests/security/test_tenant_isolation.py::test_other_tenant_cannot_see_this_tenants_verbs
      - tests/security/test_tenant_isolation.py::test_other_tenant_dispatch_fails_closed
      - tests/store/test_postgres_store.py::test_cross_tenant_fails_closed
  SEC-13:
    description: PII is detected and redacted before it leaves the boundary.
    tests:
      - tests/security/test_budget_and_pii.py::test_pii_redaction
  SEC-14:
    description: High-consequence / blocking verbs pause for human approval and cannot be bypassed.
    tests:
      - tests/security/test_hitl_gate.py::test_blocking_verb_pauses_for_approval
      - tests/security/test_hitl_gate.py::test_resumes_after_approval
  SEC-16:
    description: Every action (allowed or denied) is audited, hash-chained, append-only.
    tests:
      - tests/kernel/test_audit_chain.py::test_every_action_is_audited
      - tests/kernel/test_audit_chain.py::test_denied_actions_are_also_audited
  SEC-21:
    description: Verb params are schema-validated before any dispatch side effect.
    tests:
      - tests/kernel/test_dispatch.py::test_invalid_params_rejected_before_dispatch
  FR-KER-05:
    description: Per-verb / per-tenant rate limits are enforced at the kernel.
    tests:
      - tests/kernel/test_ratelimit_degraded.py::test_rate_limit_enforced
  FR-COST-02:
    description: A hard-stop budget halts before exceeding; a soft budget records overage only.
    tests:
      - tests/security/test_budget_and_pii.py::test_budget_hard_stop_halts_before_exceeding
      - tests/security/test_budget_and_pii.py::test_soft_budget_does_not_halt

  # --- Round Four: settings, account & access management (SEC-34..39) ---
  SEC-34:
    description: A personal access token never escalates (scope ∩ current grants, re-checked) and a deactivated/de-provisioned user's tokens stop working.
    tests:
      - tests/security/test_round_four.py::test_pat_never_escalates_and_dies_with_user
  SEC-35:
    description: Invitations do not bypass the IdP - they pre-stage a role/scope, grant no access until SSO login, and are consumed once.
    tests:
      - tests/security/test_round_four.py::test_invitations_do_not_bypass_idp
  SEC-36:
    description: Settings writes enforce RBAC server-side and are audited with the actor.
    tests:
      - tests/security/test_round_four.py::test_settings_changes_are_authz_checked_and_audited
  SEC-37:
    description: Headless REST/MCP runs the same chokepoint scoped to the user - no weak path.
    tests:
      - tests/security/test_round_four.py::test_headless_parity_no_weak_path
  SEC-38:
    description: No unauthenticated access to tokens or connection details (mobile/web follow the same auth rules).
    tests:
      - tests/security/test_round_four.py::test_no_unauthenticated_access_to_tokens
  SEC-39:
    description: An authored verb with a destructive/outbound name defaults to high-consequence so the HITL gate engages.
    tests:
      - tests/security/test_round_four.py::test_authored_verbs_safe_by_default
