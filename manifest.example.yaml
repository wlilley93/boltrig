# Boltrig fleet manifest (SRS S11.2). Copy to manifest.yaml and edit.
#
#   cp manifest.example.yaml manifest.yaml
#
# This file is the ONE place an organisation is configured: who they are, how
# they authenticate, which models and integrations they use, the agent org
# chart, the spawn rules, the HITL policy, and the network / privacy posture.
# Adding an org, a model, a capability, or an integration is a manifest edit
# (plus an adapter/skill/workflow in libraries/) - never a core code change
# (P1/P7). ${ENV} references are interpolated from the process environment
# (boltrig/config/manifest.py).

organisation: ${BOLTRIG_ORGANISATION:-Your organisation}
tenant_id: ${BOLTRIG_TENANT_ID:-default}
locale_default: en
timezone_default: UTC

# --- Boltrig v2 chosen stack ------------------------------------------------
# This is the accepted target architecture map. Codex is the agent runtime;
# retired third-party agent runtimes are absent rather than held as rollback
# dependencies (decision 0012 and the 2026-08-14 retirement addendum).
stack:
  cockpit: boltrig_ui
  orchestration: boltrig
  durability: hatchet
  runtime_sandbox: codex_supervisor
  coding_agent: codex
  browser_automation: browser_cli
  memory_primary: pgvector
  knowledge_compiler: cognee
  model_routing: bifrost
  observability: langfuse
  tool_protocol: mcp_kernel

# --- identity: OIDC + IdP-group -> role/scope mappings (US-IAM-01/02) --------
identity:
  provider: oidc
  issuer: ${OIDC_ISSUER}
  audience: ${OIDC_AUDIENCE}
  jwks_uri: ${OIDC_JWKS_URI}
  role_mappings:
    # Org admins get the tenant-wide verb ceiling ("*"). Replace these group
    # names with the groups from the organisation's own identity provider.
    - idp_group: boltrig-admins
      role: org-admin
      scope:
        all: true
    # Engineering dept heads: ticket + jira authority, scoped to their dept.
    - idp_group: boltrig-engineering
      role: department-head
      scope:
        departments: ["engineering"]
        nouns: ["ticket", "jira"]
    # Members can read and write tickets only.
    - idp_group: boltrig-members
      role: agent
      scope:
        verbs: ["ticket.read", "ticket.create"]

# --- models: inference back ends + routing (P4, SEC-12) ---------------------
models:
  endpoints:
    # Bifrost is the only standard-data route in the public template. The model
    # name is deliberately blank until the operator configures Bifrost and
    # selects an advertised model through Settings; no provider key or model
    # belonging to the repository owner is bundled here.
    - id: standard
      kind: bifrost
      model: ${BOLTRIG_DEFAULT_MODEL:-}
      base_url: ${BOLTRIG_MODEL_GATEWAY_URL:-http://bifrost:8080/v1}
      data_class: standard
    - id: local-sensitive
      kind: vllm
      base_url: ${BOLTRIG_LOCAL_MODEL_URL:-http://local-model:8000/v1}
      model: ${BOLTRIG_LOCAL_MODEL:-}
      data_class: sensitive
  default: standard
  # Sensitive-classified data is routed to the on-box endpoint (never egresses).
  sensitive_endpoint: local-sensitive
  # --- per-model price table (policy-as-data, FR-COST-04 / audit M14) --------
  # The rate table cost accounting bills from: a model listed here is charged at
  # its real price for budget reservations and the post-run true-up.
  #
  # UNIT: MICROS PER TOKEN, and the rate is a FLOAT - a fraction is the NORMAL
  # case. A micro is $0.000001, so micros-per-token and dollars-per-1M-tokens are
  # the SAME NUMBER: ($P per 1,000,000 tokens) / $0.000001 = P micros/token.
  #     $0.35 per 1M tokens -> 0.35      $3.00 per 1M -> 3.0      $15 per 1M -> 15
  # Do NOT round to an integer. 0.35 written as 0 prices that model FREE and the
  # tenant's cost ledger silently stays empty.
  #
  # The KEY is the endpoint's `model:` string above (what the runtime reports),
  # NOT the endpoint id - the `standard` endpoint is priced under its model name.
  #
  # A rate is EITHER a single number (one blended rate charged on every token) OR
  # the published rate card's input/output pair. PREFER THE PAIR wherever the
  # runtime reports a split (Codex does): the two legs commonly differ by more
  # than 2x, and an agent turn is heavily input-weighted, so one rate set at the
  # output price over-bills it substantially. A model priced as a pair whose
  # runtime reports no split is charged on the higher leg - conservative, and
  # never free.
  #
  # LEAVING THIS UNSET IS NOT NEUTRAL. With no entry for a model, cost falls back
  # to the capability's cost_tier default (boltrig/kernel/cost.py):
  #     cheap = 1, standard = 5, expensive = 25 micros/token
  # i.e. $1 / $5 / $25 per 1M tokens - far above real inference prices. An
  # unpriced deployment therefore systematically OVER-BILLS and trips its
  # hard-stop budgets early, and nothing errors, so it shows up on the invoice.
  #
  # THE KEY IS THE MODEL NAME; THE RATE IS THE PROVIDER'S. These come apart, and the
  # gap is expensive. The same model served by two providers has two different rate
  # cards: gpt-oss-120b is $0.15/$0.60 per 1M on Groq but $0.35/$0.75 on Cerebras, so
  # pricing a Cerebras-routed tenant off the Groq card UNDER-bills by 2.3x. The runtime
  # reports a bare model name and says nothing about who served it, so the key here
  # cannot tell you the rate - only your own routing can. Look up the rate for the
  # provider this deployment's `base_url` actually points at, and say which one it was
  # in a comment beside the entry, because the next reader cannot derive it.
  #
  # No rate ships as a default: the real number is your provider contract, so it
  # has to be set per deployment. Uncomment one line per model you actually route
  # to and replace the illustrative figures with your contracted rates:
  # prices:
  #   claude-sonnet-4-6: 3.0             # e.g. $3.00 per 1M tokens, one rate
  #   cerebras/gpt-oss-120b:             # e.g. $0.35 in / $0.75 out per 1M
  #     input: 0.35
  #     output: 0.75
  #   Qwen/Qwen2.5-7B-Instruct: 0.0      # self-hosted: no per-token charge
  prices: {}   # EMPTY = every model on the cost-tier fallback above. Fill this in.

# --- agents: flat durable peer federation -----------------------------------
# Every named agent is an addressable tier-1 peer with a durable logical session
# and mailbox. `default` receives unaddressed work but is not a parent tier. Each
# peer can delegate bounded work directly to the ephemeral runtimes below.
agents:
  default: chief-of-staff
  named:
  - name: chief-of-staff
    address: chief-of-staff
    runtime: codex
    model_endpoint: standard
    max_depth: 4
    supported_skills: ["*"]
    cost_tier: standard
    budget:
      cost_limit_micros: 50000000
      hard_stop: true
      window: daily
  - name: head-of-engineering
    address: engineering
    scope_id: engineering
    runtime: codex
    model_endpoint: standard
    max_depth: 3
    supported_skills: ["analysis/*", "integration/*"]
    cost_tier: standard
    budget:
      cost_limit_micros: 20000000
      hard_stop: true
      window: daily
  - name: head-of-marketing
    address: marketing
    scope_id: marketing
    runtime: codex
    model_endpoint: standard
    max_depth: 3
    supported_skills: ["writing/*", "analysis/*"]
    cost_tier: standard

# --- ephemeral runtimes: short-lived child agents the fleet spawns -----------
# Every DEFAULT lane targets `codex`, the only wired governed leaf runtime
# (decision 0012). A stale capability naming a retired lane receives a typed
# unavailable result; no environment flag can bring third-party runtimes back.
ephemeral_runtimes:
  - name: worker-cheap
    runtime: codex
    model_endpoint: standard
    supported_skills: ["*"]
    max_depth: 2
    cost_tier: cheap
  - name: worker-sensitive
    runtime: codex
    model_endpoint: local-sensitive
    supported_skills: ["*"]
    max_depth: 2
    cost_tier: standard
  # Trusted read-only Codex ([2026] VJS-CC-VJS 2): a single, hard-walled analysis
  # lane. Inert unless BOLTRIG_CODEX_TRUSTED + binary + stack root are configured;
  # otherwise the runtime degrades to a deterministic script run.
  - name: codex-worker
    runtime: codex
    model_endpoint: standard
    supported_skills: ["analysis/*"]
    max_depth: 2
    cost_tier: standard

# --- spawn rules: all listed intent tags match; unique highest priority wins --
# Equal-priority matches fail closed. Rules may add skills but never bypass the
# caller-grant intersection, and max_depth can only tighten the capability cap.
spawn_rules:
  - name: decompose-tickets
    priority: 400
    match:
      intent_tags: ["planning", "decomposition"]
    capability: worker-cheap
    skills: ["analysis/ticket-decomposition"]
    max_depth: 2
  - name: write-back-to-jira
    priority: 300
    match:
      intent_tags: ["integration", "jira"]
    capability: worker-cheap
    skills: ["integration/jira-writer"]
  - name: long-form-writing
    priority: 200
    match:
      intent_tags: ["content", "writing"]
    capability: worker-cheap
    skills: ["writing/long-form"]
  # Route read-only analysis/research to the trusted Codex lane ([2026] VJS-CC-VJS 2).
  - name: read-only-analysis
    priority: 100
    match:
      intent_tags: ["analysis", "research"]
    capability: codex-worker
    skills: ["analysis/research"]
    max_depth: 2

# --- adapters: the integrations this tenant uses + their credential refs -----
# ids are the builtin adapters (boltrig/adapters/builtin/*); credential refs map
# to the JSON env vars in .env. memory-tickets needs no credential.
adapters:
  # A PROJECT adapter (Round Fifteen, the extension contract): a non-builtin id
  # with its own module_ref is imported + registered from the bundle, so a project
  # adds an integration with no core edit. (Builtin ids below map to known modules.)
  # - id: trello
  #   runtime: http
  #   module_ref: billandben.adapters.trello:build   # the project's importable pkg
  #   credential: { id: TRELLO_API, store: env, kind: api_key }
  - id: ms-graph
    runtime: http
    credential:
      id: GRAPH_APP
      store: env
      kind: oauth
  - id: jira
    runtime: http
    credential:
      id: JIRA_OAUTH
      store: env
      kind: api_key
  - id: crm-sql
    runtime: sql
    credential:
      id: CRM_SQL
      store: env
      kind: basic
  - id: memory-tickets
    runtime: script
  # Boltrig v2 GPU-control seam. The API key is a credential ref and is never
  # returned to agents or status endpoints.
  - id: runpod
    runtime: http
    credential:
      id: RUNPOD_API
      store: env
      kind: api_key
  # Boltrig v2 browser automation seam. The Browser Use CLI owns its own browser
  # auth/session; Boltrig only exposes governed, narrow browser verbs.
  - id: browser-cli
    runtime: script
  # Optional BYO speech providers. Credentials are connected through the
  # write-only onboarding/integration setup path, never embedded here.
  - id: deepgram-audio
    runtime: http
    module_ref: boltrig.adapters.builtin.cloud_audio:build_deepgram
  - id: elevenlabs-audio
    runtime: http
    module_ref: boltrig.adapters.builtin.cloud_audio:build_elevenlabs
  - id: openai-audio
    runtime: http
    module_ref: boltrig.adapters.builtin.cloud_audio:build_openai
  - id: openai-compatible-audio
    runtime: http
    module_ref: boltrig.adapters.builtin.cloud_audio:build_openai_compatible
  - id: fish-audio
    runtime: http
    module_ref: boltrig.adapters.builtin.fish_audio:build
  # xAI voice (TTS/STT) seam. Registered via module_ref (the extension
  # contract) so no core _BUILTIN_MODULES edit is needed. The API key is a
  # credential ref, resolved kernel-side only and never returned to agents.
  - id: xai-voice
    runtime: http
    module_ref: boltrig.adapters.builtin.xai_voice:build

# --- DEV-MODE EGRESS LOOPBACK ------------------------------------------------
# Diverts governed outbound sends (channel.send) into the stack's OWN intake, so
# nothing reaches a real recipient while a tenant is being built. Authority:
# [2026] VJS-CC-BOLTRIG-DEV-EGRESS-LOOPBACK-001, PERMITTED on five conditions.
#
# It does not widen what may leave the system; it prevents anything leaving. The
# approval is still raised, still routed, still answered by a human - and the
# request, the notification and the approval card each state that the declared
# recipient will NOT be messaged, because an approval obtained on a false
# description of its effect is not an approval.
#
# Declaring it is NOT enough to make it run. It is refused outright when a
# production signal is present, when the environment declares no affirmative
# development signal, when any real ingress posture is configured (OIDC /
# Cloudflare Access / session login), when expires_at is absent or past, or when
# loopback_url is blank. Any of those and every send goes out for real.
#
# LIMITATION, and it must not be forgotten: the loopback substitutes the final
# transport leg. A dev-mode success is NOT evidence that the real transport works.
#
# dev_egress_loopback:
#   enabled: true
#   expires_at: "2026-09-11T00:00:00Z"   # MANDATORY; an expired tag fails closed
#   loopback_url: "http://kernel:8000/v1/channels/inbound/loopback"
#   declared_by: "you@example.com"
#   reason: "building the tenant; no recipient should be contacted yet"

# --- HITL: routing + the verbs that ALWAYS require human approval (P5) -------
hitl:
  primary_channel: teams
  notify_via: ["teams"]
  approval_timeout_seconds: 3600
  escalation_chain: ["head-of-engineering", "chief-of-staff"]
  # These verbs are gated at the kernel regardless of consequence (SEC-14).
  blocking_verbs:
    - jira.delete
    - crm.write
    - ms-graph.sendMail

# --- network: egress posture for adapter calls (US-DEP-04, SEC) -------------
network:
  air_gapped: ${AIR_GAPPED:-false}
  https_proxy: ${HTTPS_PROXY:-}
  ca_bundle: ${CA_BUNDLE:-}
  allowed_domains:
    - graph.microsoft.com
    - api.x.ai
    - api.deepgram.com
    - api.elevenlabs.io
    - api.openai.com
  blocked_domains: []

# --- privacy: data-handling posture (US-PRIV-02, SEC-13) --------------------
privacy:
  pii_redaction: true
  data_residency: eu
  retention_days: 365
  redact_fields:
    - email
    - phone

# === Round Two compatibility additions (S9) =================================

# --- model gateway ----------------------------------------------------------
runtimes:
  # --- model gateway (Round Six gap 3.2) - cost/cache routing for STANDARD data.
  # When base_url is set, standard (non-sensitive) conversation traffic is routed
  # through the gateway and pinned to one model per conversation so the gateway's
  # prompt cache stays warm across turns (SEC-47). Sensitive data is NEVER routed
  # here - it goes to its local endpoint directly (residency, SEC-43). Maps to
  # BOLTRIG_MODEL_GATEWAY_URL / BOLTRIG_MODEL_GATEWAY_TTL.
  gateway:
    base_url: ${BOLTRIG_MODEL_GATEWAY_URL:-http://bifrost:8080/v1}
    cache_ttl_seconds: 900                   # sync to the gateway's own cache TTL
    health:
      enabled: false                         # exports BOLTRIG_MODEL_GATEWAY_HEALTH
      path: /health                          # derives from base_url; no secrets here
    # Model identity and provider keys are intentionally absent here. The
    # governed Models settings surface reads Bifrost's live catalogue and lets
    # each deployment author its own routes without exposing keys to the UI.

# --- expose the kernel as an MCP server, and optionally consume external ones
mcp:
  server:
    enabled: true                            # granted verbs exposed as MCP tools
  # External MCP servers a project consumes (Round Fifteen): each registers an
  # INERT consumer at boot (no verbs until the review/activate gate, SEC-22).
  # credential_ref NAMES the secret (a secret-store key - here an env var name);
  # it is never the secret itself and is never ${ENV}-interpolated. The kernel
  # resolves it per call and hands it to the adapter (SEC-04/05), so rotating the
  # secret takes effect on the next call and no agent ever sees the material.
  consume: []                                # e.g.:
    # - id: linear-mcp
    #   url: https://linear-mcp.internal
    #   credential_ref: LINEAR_MCP_TOKEN     # env var NAME, not ${LINEAR_MCP_TOKEN}

# --- the conversational layer (Epic CONV) -----------------------------------
chat:
  enabled: true
  transport: sse                             # sse | websocket
  retention_days: 365
  panel: true                                # show the Chat panel in the UI
  continuity: true                           # compose prior turns into the prompt
                                             # (Round Six gap 3.1; BOLTRIG_CONTINUITY)
  # Direct chat stays on the designated conversational worker instead of the
  # generic cheapest-capability fallback. Deployments may name a different
  # active conversational capability here.
  default_capability: worker-cheap
  # Bare-turn authority ([2026] VJS-COUNTY 1): the skill set a bare chat turn
  # spawns with, per caller role; an unmapped role gets default_skills. This
  # example manifest carries the shipped default (policy-as-data, P7; the
  # ChatConfig code defaults stay empty so a manifest-less boot is fail-closed).
  # Grounded in identity.role_mappings above: org-admin is the only role whose
  # scope reaches the control noun ({all: true} -> the "*" grant); the
  # department-head and agent scopes name ticket/jira only, so they resolve to
  # []. Every chat spawn also intersects the caller's role-resolved grants, so
  # this knob can only reduce authority, never widen it.
  skills_by_role:
    org-admin: ["authoring/control-plane"]
  default_skills: []
  # Inline attachment caps ([2026] VJS-COUNTY 3). These are enforced on DECODED
  # bytes/count at chat intake; the whole turn is refused (nothing persisted) if a
  # cap is breached, never truncated. A manifest may only TIGHTEN a cap below its
  # conservative code default (min(default, manifest)), never loosen it - attachments
  # are inline blobs on the message row, so the ceiling keeps row growth bounded.
  attachments:
    max_count: 8            # <= code default 8
    max_bytes: 262144       # <= code default 256 KiB per attachment (decoded)
    max_total_bytes: 1048576  # <= code default 1 MiB total per turn (decoded)
  # SSE keepalive (US-CHAT-11): a live chat stream emits a heartbeat frame every
  # this many seconds, so a slow-but-alive turn never trips a client idle guard.
  # 0 or below disables it.
  heartbeat_seconds: 15
  # Long-conversation compaction (append-only derived summaries). Past `threshold`
  # live (non-superseded) messages the continuity composer sends [summary of older
  # turns] + [the most recent `keep_recent` verbatim turns], preserving prompt-cache
  # prefix-stability (the summary + prefix stay byte-stable between compactions). A
  # manifest may only TIGHTEN these (a lower threshold, fewer recent turns), never
  # grow the verbatim window. `threshold: 0` disables compaction (full verbatim).
  compaction:
    threshold: 40           # <= code default 40 live messages
    keep_recent: 12         # <= code default 12 verbatim recent turns

# --- v2 orchestration/runtime/observability homes (inert until adapters bind) -
mastra:
  enabled: false
  role: orchestration_contract
  plan_contract: boltrig.mastra.v1
  compile_to: hatchet

browser_cli:
  enabled: true
  role: browser_automation
  cloud_policy: disabled

langfuse:
  enabled: false
  role: observability_sink
  endpoint: ${LANGFUSE_HOST:-}
  public_key: ${LANGFUSE_PUBLIC_KEY:-}
  secret_key_ref: LANGFUSE_SECRET_KEY

# === Round Three additions (S10) - the manifest stays the source of truth (C1)
# --- evaluation harness (Epic EVAL) -----------------------------------------
evaluation:
  enabled: true
  suites:
    - { id: onboarding-skills, target_kind: skill, target_ref: "ops/*" }

# --- notification routing (Epic NOT) ----------------------------------------
notifications:
  defaults:
    approval:     { channel: teams }
    escalation:   { channel: teams }
    budget_alert: { channel: email }

# --- personal agents (Epic PA) - delegated-only -----------------------------
# The default is `codex-worker`. NOTE: `default_runtime:` names a CAPABILITY under
# ephemeral_runtimes, NOT a runtime - `codex-worker` resolves to `runtime: codex`.
# The Pi rollback worker is retired and is no longer the default; the cutover has
# passed. Anything judging this field (a lint, a guard, a reviewer) must resolve it
# through ephemeral_runtimes before judging its runtime - reading `default_runtime`
# as a runtime literal is a false positive.
personal_agents:
  enabled: true
  default_runtime: codex-worker
  default_skills: ["writing/*", "analysis/*"]

# --- memory - governed interpretation, distinct from source documents --------
# The Boltrig memory ledger and native engine are authoritative. No external
# memory projection ships by default; Cognee's separate, rebuildable compiler
# role is configured under `knowledge`.
memory:
  enabled: true                        # opt-in per installation
  engine: local                        # executable kernel engine: local | vector | pgvector | cognee
  store: postgres                      # reuse the existing Postgres instance
  authority: kernel_ledger             # backends are projections, not authority
  primary_projection: null             # native engine is the ordinary recall path
  projections: []
  fanout:
    mode: ledger_then_projection       # commit once, then write projections
    execution: inline                  # inline | queued; queued uses Hatchet/local executor tasks
    # READ since 2026-07-31 (task #40; build_memory_projection_fanout). True:
    # under `execution: queued` failed operations retry within the bounded budget
    # (max_operation_attempts, 3); under `execution: inline` a failed backend
    # call gets exactly ONE bounded reattempt - inline runs on the request path,
    # so a retry LOOP would turn a down backend into a hung verb. False: a single
    # attempt in both modes, failing fast, and the status row records
    # max_operation_attempts=1 so a reader can see fast-fail was chosen.
    retry_failed: true
    # record_projection_status was DELETED 2026-07-31 (task #40): status is
    # recorded unconditionally (memory/projection_delivery_attempts.py), which is
    # the receipt discipline GOALS 1-2 mandate - a knob to switch observability
    # off is not a feature. An existing manifest still carrying the key parses;
    # the key is simply not read, and never was.
  embedding_endpoint: local-sensitive  # sensitive-safe default (SEC-43)
  extraction_endpoint: local-sensitive # entity/relationship extraction model
  local_endpoints: [local-sensitive]   # endpoints treated as on-box for residency
  default_owner_scope: user            # user | department | org
  cross_scope_edges: forbidden         # forbidden | governed
  ingest:
    on_session_end: true               # distil a conversation when it closes
    # NOT READ (2026-07-30). A thread is distilled ONCE and never revisited, so a
    # conversation that continues after distillation keeps a summary of only its
    # earlier messages. Task #43; this is the flag that should govern the fix.
    incremental: true                  # process only new/changed content
    schedule: null                     # optional tz-aware cron for document corpora
    screen_content: true               # anti-poisoning screen (SEC-42)
  retrieval:
    default_mode: primary              # primary | similarity | graph_completion
    max_hops: 4
    max_results: 20
  # Typed memory planes (decision 0029): semantic/episodic/procedural memory
  # behind the write gate (memory.propose / memory.bundle / memory.resolve /
  # memory.candidates.review). These keys shape only the BUNDLE defaults; a
  # call may override per-plane toggles via memory.bundle's config param (the
  # ablation matrix). Episodes are append-only; exactly one active value per
  # semantic/procedural slot (DB-enforced, migration 0076).
  typed:
    semantic: true
    episodic: true
    procedural: true
    source_knowledge: true
    budget:                           # character budgets (~4 chars/token; no tokenizer dep)
      semantic_chars: 4800
      episodic_chars: 6000
      procedural_chars: 10000
      source_chars: 12000
  retention_days: 365

# --- knowledge - canonical sources plus rebuildable provider projections -----
# Originals and immutable revisions remain in ObjectVault + Postgres/pgvector.
# Cognee is the only shipped rebuildable knowledge compiler. The canonical
# catalogue and originals remain in Postgres/pgvector and ObjectVault.
knowledge:
  enabled: true
  vault:
    kind: filesystem                   # filesystem | s3
    # root defaults to the platform's per-user data directory. Set
    # BOLTRIG_KNOWLEDGE_VAULT for a managed deployment.
  providers:
    - id: cognee
      enabled: true
  cognee:
    # cognee_root defaults beside the per-user Knowledge data. Set
    # BOLTRIG_COGNEE_ROOT for a managed deployment.
    # Enrichment reuses each caller's governed chat model connection through
    # Bifrost; embeddings run locally and require no second API key.

# --- sleep distillation (decision 0023) --------------------------------------
# Nightly consolidation: derive a corpus from the governed record, train a
# candidate LoRA from the PINNED base on the local sidecar, gate mechanically,
# promote or hold - an audit row either way. Disabled by default; enabling it
# without a base_pin registers nothing (an unpinned base would make promotion
# state underivable). The sidecar URL is operator-owned, never agent input.
distill:
  enabled: false
  sidecar_url: http://host.orb.internal:8930
  base_pin: mlx-community/Qwen2.5-7B-Instruct-4bit@main
