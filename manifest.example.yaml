# Boltrig fleet manifest (SRS S11.2). Copy to manifest.yaml and edit.
#
#   cp manifest.example.yaml manifest.yaml
#
# This file is the ONE place an organisation is configured: who they are, how
# they authenticate, which models and integrations they use, the agent org
# chart, the spawn rules, the HITL policy, and the network / privacy posture.
# Adding an org, a model, a capability, or an integration is a manifest edit
# (plus an adapter/skill/workflow in libraries/) - never a core code change
# (P1/P7). ${ENV} references are interpolated from the process environment
# (boltrig/config/manifest.py).

organisation: Acme Corp
tenant_id: acme
locale_default: en
timezone_default: Europe/London

# --- Boltrig v2 chosen stack ------------------------------------------------
# This is the target architecture map. Some entries are config homes for adapters
# that are not executable yet; legacy Pi/Hermes-compatible runtimes below stay in
# the example so the current test/offline boot path remains green.
stack:
  cockpit: herdr
  orchestration: mastra
  durability: hatchet
  runtime_sandbox: rivet_agentos
  coding_agent: opencode
  browser_automation: browser_cli
  memory_primary: mem0
  memory_projection: cognee
  model_routing: bifrost
  observability: langfuse
  tool_protocol: mcp_kernel

# --- identity: OIDC + IdP-group -> role/scope mappings (US-IAM-01/02) --------
identity:
  provider: oidc
  issuer: ${OIDC_ISSUER}
  audience: ${OIDC_AUDIENCE}
  jwks_uri: ${OIDC_JWKS_URI}
  role_mappings:
    # Org admins get the tenant-wide verb ceiling ("*").
    - idp_group: acme-admins
      role: org-admin
      scope:
        all: true
    # Engineering dept heads: ticket + jira authority, scoped to their dept.
    - idp_group: acme-engineering
      role: department-head
      scope:
        departments: ["engineering"]
        nouns: ["ticket", "jira"]
    # Members can read and write tickets only.
    - idp_group: acme-staff
      role: agent
      scope:
        verbs: ["ticket.read", "ticket.create"]

# --- models: inference back ends + routing (P4, SEC-12) ---------------------
models:
  endpoints:
    - id: standard
      kind: anthropic
      model: claude-sonnet-4-6
      data_class: standard
    - id: local-sensitive
      kind: vllm
      base_url: http://local-model:8000/v1
      model: ${LOCAL_MODEL:-Qwen/Qwen2.5-7B-Instruct}
      data_class: sensitive
    - id: opencode-ornith
      kind: opencode
      # Optional warm `opencode serve` URL. Leave unset to let OpenCode start its
      # own local server, or set to http://127.0.0.1:4096 for attach mode.
      # In compose, OpenCode state/config is rooted at BOLTRIG_OPENCODE_HOME so
      # the shipped stack never reads a developer user's ~/.config/opencode.
      base_url: ${OPENCODE_ATTACH_URL:-}
      # OpenCode expects provider/model here, not merely the upstream HF id.
      model: ${OPENCODE_MODEL:-ornith/deepreinforce-ai/Ornith-1.0-35B}
      data_class: standard
  default: standard
  # Sensitive-classified data is routed to the on-box endpoint (never egresses).
  sensitive_endpoint: local-sensitive
  # Per-model price table (policy-as-data, FR-COST-04 / audit M14): micros per
  # token. A model listed here is charged at its real price for budgets and the
  # post-run cost true-up; a model absent here falls back to its capability's
  # cost-tier default. Replaces static tier micros as the accounting source.
  prices:
    claude-sonnet-4-6: 9

# --- hierarchy: durable agent org chart -------------------------------------
# Current runnable compatibility path: these tier runtimes still use Hermes-
# compatible names. Boltrig v2 orchestration should be introduced through the
# `mastra` -> Hatchet -> Rivet/OpenCode seams above, not by expanding Hermes.
hierarchy:
  tier1:
    name: chief-of-staff
    runtime: hermes
    model_endpoint: standard
    max_depth: 4
    supported_skills: ["*"]
    cost_tier: standard
    budget:
      cost_limit_micros: 50000000
      hard_stop: true
      window: daily
  tier2:
    - name: head-of-engineering
      department: engineering
      runtime: hermes
      model_endpoint: standard
      max_depth: 3
      supported_skills: ["analysis/*", "integration/*"]
      cost_tier: standard
      budget:
        cost_limit_micros: 20000000
        hard_stop: true
        window: daily
    - name: head-of-marketing
      department: marketing
      runtime: hermes
      model_endpoint: standard
      max_depth: 3
      supported_skills: ["writing/*", "analysis/*"]
      cost_tier: standard

# --- ephemeral runtimes: short-lived child agents the fleet spawns -----------
# `pi-worker` remains a compatibility sandbox path until the Rivet AgentOS
# adapter is bound. New v2 non-coding/tool agents should target Rivet AgentOS.
ephemeral_runtimes:
  - name: worker-cheap
    runtime: hermes
    model_endpoint: standard
    supported_skills: ["*"]
    max_depth: 2
    cost_tier: cheap
  - name: worker-sensitive
    runtime: hermes
    model_endpoint: local-sensitive
    supported_skills: ["*"]
    max_depth: 2
    cost_tier: standard
  # Round Two: a Pi-backed ephemeral runtime (Epic RUN)
  - name: pi-worker
    runtime: pi
    model_endpoint: standard
    supported_skills: ["*"]
    max_depth: 2
    cost_tier: standard
  # Boltrig v2: Rivet AgentOS as the sandboxed non-coding/tool-agent runtime.
  - name: rivet-worker
    runtime: rivet_agentos
    model_endpoint: standard
    supported_skills: ["analysis/*", "integration/*", "browser/*"]
    max_depth: 2
    cost_tier: standard
  # Boltrig v2: OpenCode as the coding-agent runtime. The endpoint's model is
  # the OpenCode provider/model id and base_url is an optional opencode serve URL.
  - name: opencode-worker
    runtime: opencode
    model_endpoint: opencode-ornith
    supported_skills: ["*"]
    max_depth: 2
    cost_tier: standard

# --- spawn rules: match a task to a runtime + skill set (S6) -----------------
spawn_rules:
  - name: decompose-tickets
    match:
      intent_tags: ["planning", "decomposition"]
    capability: worker-cheap
    skills: ["analysis/ticket-decomposition"]
    max_depth: 2
  - name: write-back-to-jira
    match:
      intent_tags: ["integration", "jira"]
    capability: worker-cheap
    skills: ["integration/jira-writer"]
  - name: long-form-writing
    match:
      intent_tags: ["content", "writing"]
    capability: worker-cheap
    skills: ["writing/long-form"]

# --- adapters: the integrations this tenant uses + their credential refs -----
# ids are the builtin adapters (boltrig/adapters/builtin/*); credential refs map
# to the JSON env vars in .env. memory-tickets needs no credential.
adapters:
  # A PROJECT adapter (Round Fifteen, the extension contract): a non-builtin id
  # with its own module_ref is imported + registered from the bundle, so a project
  # adds an integration with no core edit. (Builtin ids below map to known modules.)
  # - id: trello
  #   runtime: http
  #   module_ref: billandben.adapters.trello:build   # the project's importable pkg
  #   credential: { id: TRELLO_API, store: env, kind: api_key }
  - id: ms-graph
    runtime: http
    credential:
      id: GRAPH_APP
      store: env
      kind: oauth
  - id: jira
    runtime: http
    credential:
      id: JIRA_OAUTH
      store: env
      kind: api_key
  - id: crm-sql
    runtime: sql
    credential:
      id: CRM_SQL
      store: env
      kind: basic
  - id: memory-tickets
    runtime: script
  # Boltrig v2 host-control seam: Herdr is governed through verbs, not a
  # privileged console side door. Mutating verbs still need grants/HITL policy.
  # In compose, Herdr state/config is rooted at BOLTRIG_HERDR_HOME rather than
  # a developer user's ~/.config/herdr.
  - id: herdr
    runtime: script
  # Boltrig v2 GPU-control seam. The API key is a credential ref and is never
  # returned to agents or status endpoints.
  - id: runpod
    runtime: http
    credential:
      id: RUNPOD_API
      store: env
      kind: api_key
  # Boltrig v2 browser automation seam. The Browser Use CLI owns its own browser
  # auth/session; Boltrig only exposes governed, narrow browser verbs.
  - id: browser-cli
    runtime: script

# --- HITL: routing + the verbs that ALWAYS require human approval (P5) -------
hitl:
  primary_channel: teams
  notify_via: ["teams"]
  approval_timeout_seconds: 3600
  escalation_chain: ["head-of-engineering", "chief-of-staff"]
  # These verbs are gated at the kernel regardless of consequence (SEC-14).
  blocking_verbs:
    - jira.delete
    - crm.write
    - ms-graph.sendMail

# --- network: egress posture for adapter calls (US-DEP-04, SEC) -------------
network:
  air_gapped: ${AIR_GAPPED:-false}
  https_proxy: ${HTTPS_PROXY:-}
  ca_bundle: ${CA_BUNDLE:-}
  allowed_domains:
    - graph.microsoft.com
    - your-org.atlassian.net
  blocked_domains: []

# --- privacy: data-handling posture (US-PRIV-02, SEC-13) --------------------
privacy:
  pii_redaction: true
  data_residency: eu
  retention_days: 365
  redact_fields:
    - email
    - phone

# === Round Two compatibility additions (S9) =================================

# --- runtime sidecars: Pi compatibility sandbox path (Epic RUN) --------------
runtimes:
  pi:
    enabled: true
    sidecar_url: http://pi-sidecar:8090
    model_endpoint: standard                 # pins Pi's model via the endpoints above
    max_steps: 12                            # per-run reasoning/tool-call cap
    sandbox:
      network_allow: [kernel_mcp, model_endpoint]   # nothing else (SEC-24)
      native_tools: false                    # no Pi filesystem/bash/network tools

  # --- model gateway (Round Six gap 3.2) - cost/cache routing for STANDARD data.
  # When base_url is set, standard (non-sensitive) conversation traffic is routed
  # through the gateway and pinned to one model per conversation so the gateway's
  # prompt cache stays warm across turns (SEC-47). Sensitive data is NEVER routed
  # here - it goes to its local endpoint directly (residency, SEC-43). Maps to
  # BOLTRIG_MODEL_GATEWAY_URL / BOLTRIG_MODEL_GATEWAY_TTL. Unset => inert.
  gateway:
    base_url:                                # e.g. http://bifrost:8080/v1 (empty = off)
    cache_ttl_seconds: 900                   # sync to the gateway's own cache TTL
    health:
      enabled: false                         # exports BOLTRIG_MODEL_GATEWAY_HEALTH
      path: /health                          # derives from base_url; no secrets here
    # Optional config-only model profiles. apply_manifest exports this object as
    # BOLTRIG_MODEL_PROFILES unless the process env already overrides it.
    # Workflows select one with context/defaults/agent model_profile: code/deep/etc.
    model_profiles:
      fast:
        provider: bifrost
        model: ${BOLTRIG_FAST_MODEL:-qwen-3-coder}
        base_url: ${BOLTRIG_MODEL_GATEWAY_URL:-http://bifrost:8080/v1}
      code:
        provider: bifrost
        model: ${BOLTRIG_CODE_MODEL:-kimi-k2.7}
        base_url: ${BOLTRIG_MODEL_GATEWAY_URL:-http://bifrost:8080/v1}
      deep:
        provider: bifrost
        model: ${BOLTRIG_DEEP_MODEL:-kimi-k2.7}
        base_url: ${BOLTRIG_MODEL_GATEWAY_URL:-http://bifrost:8080/v1}
      cheap:
        provider: bifrost
        model: ${BOLTRIG_CHEAP_MODEL:-gpt-5-mini}
        base_url: ${BOLTRIG_MODEL_GATEWAY_URL:-http://bifrost:8080/v1}
      local:
        provider: vllm
        model: ${LOCAL_MODEL:-Qwen/Qwen2.5-7B-Instruct}
        base_url: http://local-model:8000/v1

# --- expose the kernel as an MCP server, and optionally consume external ones
mcp:
  server:
    enabled: true                            # granted verbs exposed as MCP tools
  # External MCP servers a project consumes (Round Fifteen): each registers an
  # INERT consumer at boot (no verbs until the review/activate gate, SEC-22).
  # credential_ref NAMES the secret (a secret-store key - here an env var name);
  # it is never the secret itself and is never ${ENV}-interpolated. The kernel
  # resolves it per call and hands it to the adapter (SEC-04/05), so rotating the
  # secret takes effect on the next call and no agent ever sees the material.
  consume: []                                # e.g.:
    # - id: linear-mcp
    #   url: https://linear-mcp.internal
    #   credential_ref: LINEAR_MCP_TOKEN     # env var NAME, not ${LINEAR_MCP_TOKEN}

# --- the conversational layer (Epic CONV) -----------------------------------
chat:
  enabled: true
  transport: sse                             # sse | websocket
  retention_days: 365
  panel: true                                # show the Chat panel in the UI
  continuity: true                           # compose prior turns into the prompt
                                             # (Round Six gap 3.1; BOLTRIG_CONTINUITY)
  # Bare-turn authority ([2026] VJS-COUNTY 1): the skill set a bare chat turn
  # spawns with, per caller role; an unmapped role gets default_skills. This
  # example manifest carries the shipped default (policy-as-data, P7; the
  # ChatConfig code defaults stay empty so a manifest-less boot is fail-closed).
  # Grounded in identity.role_mappings above: org-admin is the only role whose
  # scope reaches the control noun ({all: true} -> the "*" grant); the
  # department-head and agent scopes name ticket/jira only, so they resolve to
  # []. Every chat spawn also intersects the caller's role-resolved grants, so
  # this knob can only reduce authority, never widen it.
  skills_by_role:
    org-admin: ["authoring/control-plane"]
  default_skills: []
  # Inline attachment caps ([2026] VJS-COUNTY 3). These are enforced on DECODED
  # bytes/count at chat intake; the whole turn is refused (nothing persisted) if a
  # cap is breached, never truncated. A manifest may only TIGHTEN a cap below its
  # conservative code default (min(default, manifest)), never loosen it - attachments
  # are inline blobs on the message row, so the ceiling keeps row growth bounded.
  attachments:
    max_count: 8            # <= code default 8
    max_bytes: 262144       # <= code default 256 KiB per attachment (decoded)
    max_total_bytes: 1048576  # <= code default 1 MiB total per turn (decoded)
  # SSE keepalive (US-CHAT-11): a live chat stream emits a heartbeat frame every
  # this many seconds, so a slow-but-alive turn never trips a client idle guard.
  # 0 or below disables it.
  heartbeat_seconds: 15
  # Long-conversation compaction (append-only derived summaries). Past `threshold`
  # live (non-superseded) messages the continuity composer sends [summary of older
  # turns] + [the most recent `keep_recent` verbatim turns], preserving prompt-cache
  # prefix-stability (the summary + prefix stay byte-stable between compactions). A
  # manifest may only TIGHTEN these (a lower threshold, fewer recent turns), never
  # grow the verbatim window. `threshold: 0` disables compaction (full verbatim).
  compaction:
    threshold: 40           # <= code default 40 live messages
    keep_recent: 12         # <= code default 12 verbatim recent turns

# --- v2 orchestration/runtime/observability homes (inert until adapters bind) -
mastra:
  enabled: false
  role: orchestration_contract
  plan_contract: boltrig.mastra.v1
  compile_to: hatchet

rivet_agentos:
  enabled: true
  role: sandbox_runtime
  network_allow: [kernel_mcp, model_endpoint]
  native_tools: false

browser_cli:
  enabled: true
  role: browser_automation
  runtime: rivet_agentos
  cloud_policy: disabled

langfuse:
  enabled: false
  role: observability_sink
  endpoint: ${LANGFUSE_HOST:-}
  public_key: ${LANGFUSE_PUBLIC_KEY:-}
  secret_key_ref: LANGFUSE_SECRET_KEY

# === Round Three additions (S10) - the manifest stays the source of truth (C1)
# --- evaluation harness (Epic EVAL) -----------------------------------------
evaluation:
  enabled: true
  suites:
    - { id: onboarding-skills, target_kind: skill, target_ref: "ops/*" }

# --- notification routing (Epic NOT) ----------------------------------------
notifications:
  defaults:
    approval:     { channel: teams }
    escalation:   { channel: teams }
    budget_alert: { channel: email }

# --- personal agents (Epic PA) - delegated-only -----------------------------
# Current default uses the Pi compatibility worker. The v2 target is a delegated
# Rivet AgentOS worker once that adapter is live.
personal_agents:
  enabled: true
  default_runtime: pi-worker
  default_skills: ["writing/*", "analysis/*"]

# --- memory & knowledge - kernel-governed, opt-in ---------------------------
# Boltrig v2 uses kernel-led fanout: the Boltrig memory ledger is authoritative,
# Mem0 is the primary operational recall projection, and Cognee is the optional
# graph/corpus enrichment projection. `engine: local` plus disabled projections
# remains the executable offline default; enable Mem0/Cognee per deployment.
memory:
  enabled: true                        # opt-in per installation
  engine: local                        # executable kernel engine: local | vector | pgvector | cognee
  store: postgres                      # reuse the existing Postgres instance
  authority: kernel_ledger             # backends are projections, not authority
  primary_projection: mem0             # v2 target for ordinary recall
  projections:
    - id: mem0
      role: primary_recall
      enabled: false                   # set true with mem0ai installed + MEM0_API_KEY
      status: available_adapter
    - id: cognee
      role: graph_enrichment
      enabled: false                   # set true with cognee installed + LLM/embedding config
      status: optional_projection
  fanout:
    mode: ledger_then_projection       # commit once, then write projections
    execution: inline                  # inline | queued; queued uses Hatchet/local executor tasks
    retry_failed: true
    record_projection_status: true
  embedding_endpoint: local-sensitive  # sensitive-safe default (SEC-43)
  extraction_endpoint: local-sensitive # entity/relationship extraction model
  local_endpoints: [local-sensitive]   # endpoints treated as on-box for residency
  default_owner_scope: user            # user | department | org
  cross_scope_edges: forbidden         # forbidden | governed
  ingest:
    on_session_end: true               # distil a conversation when it closes
    incremental: true                  # process only new/changed content
    schedule: null                     # optional tz-aware cron for document corpora
    screen_content: true               # anti-poisoning screen (SEC-42)
  retrieval:
    default_mode: primary              # primary | similarity | graph_completion
    max_hops: 4
    max_results: 20
  retention_days: 365
