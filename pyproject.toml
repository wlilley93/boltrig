[project]
name = "nankle"
version = "0.1.0"
description = "Nankle - a thin, secure agent-orchestration kernel and fleet (Hermes Fleet platform)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "redis>=5.1",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "authlib>=1.3",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
# Durable execution. Optional so the core can run and be tested without a live engine.
durable = ["hatchet-sdk>=0.47"]
# Pluggable inference back ends. None are required by the core (P4).
inference = ["anthropic>=0.39", "openai>=1.54"]
sql-adapters = ["psycopg[binary]>=3.2", "pymysql>=1.1"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "aiosqlite>=0.20",
    "ruff>=0.7",
]

[project.scripts]
nankle = "nankle.api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nankle"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: fast pure-Python model and schema tests",
    "kernel: dispatch, rate limiting, degraded mode, audit chain, cost/budget",
    "security: grant enforcement, credential isolation, tenant isolation, HITL gates, PII",
    "invariant(id): a binding invariant (P-/SEC-/K-) the test covers",
]

[tool.ruff]
line-length = 100
target-version = "py312"
