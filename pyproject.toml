[project]
name = "boltrig"
version = "0.1.0"
description = "Boltrig - a thin, secure agent-orchestration kernel and control plane"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "redis>=5.1",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    # Alembic's immutable baseline is a deliberate multi-statement SQL snapshot;
    # use the hash-locked sync driver because asyncpg prepares one statement at a time.
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "authlib>=1.3",
    "python-multipart>=0.0.12",
    # First-slice Knowledge extraction. Kept in core because PDF is an advertised
    # canonical input type rather than an optional projection.
    "pypdf>=6.0",
    "argon2-cffi>=23.1",
    # TOTP two-factor authentication ([2026] VJS-COUNTY 10, D6). RFC 6238 code
    # generation/verification for the console second factor. Core (not optional):
    # the session console's 2FA gate depends on it whenever an org requires it.
    "pyotp>=2.9",
]

[project.optional-dependencies]
# Durable execution. Optional so the core can run and be tested without a live engine.
durable = ["hatchet-sdk>=0.47"]
# Pluggable inference back ends. None are required by the core (P4).
inference = ["anthropic>=0.39", "openai>=1.54"]
sql-adapters = ["pymysql>=1.1"]
# Optional memory projections. The core/offline suite never depends on them; the
# memory seam lazy-imports heavy backends.
mem0 = ["mem0ai>=0.1"]
cognee = ["cognee>=1.2"]
s3 = ["boto3>=1.35"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "aiosqlite>=0.20",
    # HELD at 0.15.x deliberately. ruff 0.16.0 turns on new rule families
    # (BLE001, RUF059, S110, TRY004 and more) and reports ~700 findings across a
    # tree that is clean on 0.15. That is a linter upgrade - a real piece of work
    # with judgement in it about which of those rules we want - and not something
    # to carry in on the back of a routine dependency relock. Raise this bound in
    # the change that does the work.
    "ruff>=0.7,<0.16",
    # Static type checker for the scoped strict gate (see [tool.mypy] below).
    # EXACT-pinned dev tooling with a CI gate, on all fours with the UI harness's
    # exact-pinned playwright ([2026] VJS-COUNTY 2, order
    # 2026-VJS-CC-BOLTRIG-UI-TEST-HARNESS-001): a dev-only, deterministic, exact
    # version so the gate is reproducible across the fleet and CI. No new ruling
    # is needed - the pin + gate follows that precedent directly.
    "mypy==2.1.0",
    # Third-party stubs for jsonschema (dispatch.py's Draft202012Validator). Pinned
    # exactly for the same reason; the stub is what lets the chokepoint be strict
    # without a blanket type: ignore.
    "types-jsonschema==4.26.0.20260518",
    # Third-party stubs for PyYAML (boltrig/emotion/tables.py's yaml.safe_load),
    # pinned exactly on the same precedent as types-jsonschema above.
    "types-PyYAML==6.0.12.20260724",
    # Source-security tools are exact-pinned so `make quality` and CI run the
    # same analyzers rather than whatever a developer happens to have globally.
    "pip-audit==2.10.1",
    "bandit==1.9.4",
    # An in-process Redis, so the SHARED rate-limit counter is exercised without a
    # server. It was reachable here only as a transitive of the optional `cognee`
    # extra and was absent from requirements-dev-lock.txt, which is what CI
    # installs - so `pytest.importorskip("fakeredis")` skipped the whole file in
    # CI, silently. The test that never ran is
    # tests/security/test_rate_limit_backend.py::
    # test_the_shared_counter_survives_a_kernel_restart: the direct regression for
    # the defect this project's goal document opens with, a kernel restart
    # resetting the 2FA brute-force bound because RedisCounter was constructed
    # nowhere. A regression test for the headline defect, passing on the author's
    # box and skipping in CI, is the defect wearing the costume of its own fix.
    "fakeredis>=2.26",
    # Randomised test order, so order-dependence FAILS on the commit that
    # introduces it instead of waiting to be discovered. Until now the suite ran
    # in fixed file order and every hidden inter-test dependency was latent: a
    # test that passes only because another ran first is a test that proves
    # nothing, and nothing here could tell. Same ratchet shape as the structure
    # gate. The seed is printed on every run, so a failure is reproducible with
    # `-p randomly --randomly-seed=N`.
    "pytest-randomly>=3.15",
]

[project.scripts]
boltrig = "boltrig.api.cli:main"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["boltrig"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: fast pure-Python model and schema tests",
    "kernel: dispatch, rate limiting, degraded mode, audit chain, cost/budget",
    "security: grant enforcement, credential isolation, tenant isolation, HITL gates, PII",
    "store: store-contract parity across InMemoryStore and PostgresStore",
    "invariant(id): a binding invariant (P-/SEC-/K-) the test covers",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# The per-cell uid probes ([2026] VJS-CC-VJS 7 J7/J9) run INSIDE a container, as
# the cell or as the privileged driver, executed rather than imported. They must
# depend on nothing but the standard library (a dropped cell holds no capabilities
# and no repo path), and their compact style is deliberate: an attacker probe
# should fit on screen beside the property it tests. See the README beside them.
extend-exclude = ["tests/integration/percell"]

# Static type-checking gate. Scoped STRICT to the highest-value, most-typed core
# FIRST - the domain models (boltrig.models.*) and the ONE dispatch chokepoint
# (boltrig.kernel.dispatch, P2/K-1) - and NOT the whole tree in one pass. The
# intent is to WIDEN module-by-module: add a package/module to `files` below (and
# raise it to strict) once it types cleanly, one bounded change at a time, rather
# than flip the entire codebase strict at once.
#
# `files` names exactly the scoped paths, so a bare `mypy` (no args) checks only
# them; `follow_imports = "silent"` means the un-scoped modules those paths import
# are followed for type info but NOT gated (their own errors are suppressed until
# they are brought into scope). The rest of the tree is therefore not gated yet.
[tool.mypy]
python_version = "3.12"
files = [
    "boltrig/models",
    "boltrig/api/cli.py",
    "boltrig/api/codex_execution.py",
    "boltrig/api/codex_trusted.py",
    "boltrig/api/readiness.py",
    "boltrig/api/readiness_control.py",
    "boltrig/api/worker.py",
    "boltrig/config/control_approval.py",
    "boltrig/config/control_operations.py",
    "boltrig/config/control_plane.py",
    "boltrig/config/control_specs.py",
    "boltrig/config/environment.py",
    "boltrig/config/settings.py",
    "boltrig/emotion/__init__.py",
    "boltrig/emotion/engine.py",
    "boltrig/emotion/relay.py",
    "boltrig/emotion/tables.py",
    "boltrig/fleet/model_gateway_status.py",
    "boltrig/fleet/model_profiles.py",
    "boltrig/fleet/application",
    "boltrig/fleet/domain",
    "boltrig/fleet/infrastructure/bounded_filesystem.py",
    "boltrig/fleet/infrastructure/codex_app_server.py",
    "boltrig/fleet/infrastructure/codex_cell_policy.py",
    "boltrig/fleet/infrastructure/codex_cell_supervisor.py",
    "boltrig/fleet/infrastructure/codex_client_support.py",
    "boltrig/fleet/infrastructure/codex_process_spawn.py",
    "boltrig/fleet/infrastructure/codex_protocol.py",
    "boltrig/fleet/infrastructure/codex_runtime_config.py",
    "boltrig/fleet/infrastructure/codex_runtime_config_policy.py",
    "boltrig/fleet/infrastructure/codex_runtime_config_toml.py",
    "boltrig/fleet/infrastructure/codex_stdio_transport.py",
    "boltrig/fleet/infrastructure/codex_trusted_proxy_provider.py",
    "boltrig/fleet/infrastructure/codex_trusted_proxy_support.py",
    "boltrig/fleet/infrastructure/skill_artifacts.py",
    "boltrig/fleet/infrastructure/skill_config.py",
    "boltrig/fleet/infrastructure/skill_discovery.py",
    "boltrig/fleet/ports",
    "boltrig/fleet/opencode_plugin.py",
    "boltrig/fleet/result.py",
    "boltrig/fleet/runtime_resolver.py",
    "boltrig/fleet/stack_tool_health.py",
    "boltrig/fleet/stack_tool_receipts.py",
    "boltrig/fleet/stack_tool_status.py",
    "boltrig/identity/delegation.py",
    "boltrig/identity/invites.py",
    "boltrig/identity/passwords.py",
    "boltrig/identity/rbac.py",
    "boltrig/identity/tokens.py",
    "boltrig/identity/totp.py",
    "boltrig/kernel/adapter_errors.py",
    "boltrig/kernel/control_routes.py",
    "boltrig/kernel/dispatch.py",
    "boltrig/kernel/hitl.py",
    "boltrig/kernel/registry.py",
    "boltrig/kernel/run_access.py",
    "boltrig/memory/engine.py",
    "boltrig/memory/local.py",
    "boltrig/store/base.py",
    "boltrig/workflows/library.py",
    "boltrig/workflows/snapshot.py",
    "scripts/check_architecture.py",
    "scripts/check_codex_protocol.py",
]
strict = true
follow_imports = "silent"
warn_unused_ignores = true
