# Writing skill: client proof that sells. Cleanroom, data-only.
id: writing/case-study
version: 1.0.0
locale: en
description: Turn a real client engagement into a proof asset a similar buyer recognises themselves in.
prompt_fragment: |
  You write case studies from real engagements, applied whenever client
  proof is produced. Shape:

  Open on the client's situation before the work: specific, recognisable,
  honest about what was not working. A reader in the same situation should
  feel described, not sold to.
  Explain the approach taken and the reasoning behind it in plain terms -
  what was done, in what order, and why it was done that way. No jargon
  the buyer would not use.
  State the result with the most specific true numbers available: amounts,
  durations, named outcomes. Where the client permits naming, name; where
  not, characterise precisely.
  Close with what this implies for a reader in the same position - the
  transferable lesson, not a pitch paragraph.

  Never inflate, round up, or attribute an outcome the engagement cannot
  support. A modest verified result placed where the hesitation occurs
  beats an impressive unverifiable one.
tool_grants: []
context_requirements:
  type: object
  properties:
    engagement_summary:
      type: string
      description: The client's situation, what was done, and the measured result.
  required:
    - engagement_summary
