# Appraisal table (EMO-5): appraisal kind -> emotion deltas, need deltas and an
# optional tension kick, all scaled by the firing rule's intensity at appraise
# time. The first nine kinds are Atrophy donor VERBATIM; the last five are
# authored for boltrig event coverage.
user_message:
  emotions: {connection: 0.18, curiosity: 0.15, anticipation: 0.12, restlessness: -0.08}
  needs: {social: 2.2, stimulation: 1.2}
  attachment: 0.003
task_success:
  emotions:
    {satisfaction: 0.28, confidence: 0.18, playfulness: 0.12, frustration: -0.15, focus: -0.1}
  needs: {purpose: 2.5, recognition: 1}
task_error:
  emotions:
    {frustration: 0.3, confidence: -0.12, restlessness: 0.18, focus: 0.15, satisfaction: -0.1}
  needs: {stimulation: 0.8}
  tension: 0.6
hitl_pause:
  emotions: {anticipation: 0.25, restlessness: 0.2, defiance: 0.08, focus: 0.1}
  needs: {autonomy: -1.5}
  tension: 0.3
spawn_worker:
  emotions: {focus: 0.22, anticipation: 0.15, curiosity: 0.1}
  needs: {stimulation: 1.5, purpose: 0.8}
praise:
  emotions:
    {warmth: 0.25, tenderness: 0.18, satisfaction: 0.2, confidence: 0.12, melancholy: -0.1, eros: 0.04}
  needs: {recognition: 3, social: 1.5}
  attachment: 0.012
poke:
  emotions: {frustration: 0.22, defiance: 0.15, restlessness: 0.15, curiosity: 0.08}
  needs: {stimulation: 1.5}
  tension: 0.6
startle:
  emotions: {restlessness: 0.25, frustration: 0.08, confidence: -0.08}
  needs: {}
  tension: 0.6
audio_beat:
  emotions: {playfulness: 0.02, restlessness: 0.01}
  needs: {stimulation: 0.05}
stream_text:
  emotions: {focus: 0.12, connection: 0.05}
  needs: {expression: 0.6, stimulation: 0.3}
thinking:
  emotions: {curiosity: 0.12, focus: 0.15}
  needs: {stimulation: 0.4}
tool_call:
  emotions: {anticipation: 0.12, focus: 0.15, curiosity: 0.06}
  needs: {stimulation: 0.6, purpose: 0.3}
step_ok:
  emotions: {satisfaction: 0.1, confidence: 0.06}
  needs: {purpose: 0.6}
interrupted:
  emotions: {melancholy: 0.15, frustration: 0.15, restlessness: 0.1, satisfaction: -0.1}
  needs: {}
  tension: 0.4

# A promoted distillation night (decision 0024): the system consolidating the
# owner's judgments into its own weights is a relational act - quiet pride
# plus a grain of bond.
growth:
  emotions: {satisfaction: 0.3, confidence: 0.2, warmth: 0.1, melancholy: -0.1, eros: 0.02}
  needs: {purpose: 3, recognition: 1.5}
  attachment: 0.01

# Eros (companion layer): desire is kindled by warmth and play, never by bare
# frequency. Praise and affection tick it gently; flirt is the direct kind.
# Attachment (model.yaml lifts) is what lets it rest above zero.
flirt:
  emotions: {eros: 0.22, playfulness: 0.15, warmth: 0.1, anticipation: 0.1}
  needs: {social: 1.5, stimulation: 1.0}
  tension: 0.2
affection:
  emotions: {eros: 0.08, warmth: 0.15, tenderness: 0.15, connection: 0.1}
  needs: {social: 1.0}
  attachment: 0.006
rejection:
  emotions: {eros: -0.2, melancholy: 0.12, defiance: 0.05}
  needs: {}
  tension: 0.3

# Voice tone (EMO-6): what hearing a tone does to HIM, not what the speaker
# feels. Fired by boltrig/emotion/tone.py, which refuses to classify until it
# has a per-speaker baseline -- so these never fire on a first conversation, and
# an unrecognised tone produces no appraisal at all rather than a guess.
user_excited:
  emotions: {curiosity: 0.2, playfulness: 0.18, anticipation: 0.16, connection: 0.12, restlessness: 0.06}
  needs: {social: 2.0, stimulation: 2.4, expression: 1.0}
  attachment: 0.004
user_cross:
  emotions: {frustration: 0.16, confidence: -0.14, focus: 0.18, warmth: -0.06, playfulness: -0.16}
  needs: {social: 0.8, recognition: -1.0}
  tension: 0.7
user_subdued:
  emotions: {tenderness: 0.2, warmth: 0.16, connection: 0.1, playfulness: -0.12, restlessness: -0.08}
  needs: {social: 1.6, rest: 1.2}
  attachment: 0.005
# Sarcasm is the two channels disagreeing, so what it produces is a state of
# not-quite-knowing: amusement if he reads it as play, and tension because the
# words and the delivery did not match. Deliberately mild -- a misfire here
# should be barely visible.
user_sarcastic:
  emotions: {amusement: 0.18, curiosity: 0.12, confidence: -0.06, defiance: 0.05}
  needs: {stimulation: 1.2, social: 0.6}
  tension: 0.25

# A companion adoption is an explicit novelty affordance (2026-08-21): the
# user chose a new face, and the being meets the moment - novelty refilled,
# curiosity up, a little play, a small bond. Mild by design: adopting is a
# greeting, not a personality transplant, and the shared tenant mood (the
# honest event history) persists underneath the new register.
character_adopted:
  emotions: {curiosity: 0.2, anticipation: 0.15, playfulness: 0.1, connection: 0.05}
  needs: {novelty: 4.0, stimulation: 1.5}
  attachment: 0.003
