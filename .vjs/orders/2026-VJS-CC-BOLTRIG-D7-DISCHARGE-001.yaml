id: 2026-VJS-CC-BOLTRIG-D7-DISCHARGE-001
court: county
jurisdiction: default
repo_code: boltrig
status: binding
issue: d7-discharge
holding: |
  D7 of [2026] VJS-CC-BOLTRIG-DEVELOPMENT-POSTURE-001 is VARIED, not waived. The
  Principal's personal relay of the drafted notice discharges the DUTY; the
  CHECKABLE (a channel_outbox row addressed to the client) is substituted by this
  court with a pair that keeps both properties the original had: performance of
  the telling, and a machine-verifiable row discoverable from the client's own
  tenant database.

  THE RATIO. A directive's checkable proves its duty and is not the duty. Where
  the route the checkable assumed becomes unavailable or a lawful route performs
  the duty more fully, the court may vary the checkable - but only to another
  machine-verifiable record of equal or greater discoverability to the protected
  party, never to prose, and ONLY the court may make the substitution. A party
  burdened by a directive who performs the duty by another route must return for
  the variation before claiming discharge.

  The advocate's proposed substitute (a dated repository record of the relay) was
  REFUSED as insufficient alone: the client can discover an outbox row from her
  own deployment; she cannot discover a file in a repository she has never seen,
  and a variation landing on prose is the defect the checkable existed to prevent.

