implementation_note: |
  Convened 2026-07-31 (SUBMISSION-2026-07-31-170419,
  CONVENING-county-2026-07-31-170433) after the Principal directed "You relay it
  yourself" and the advocate declined to substitute the checkable on his own
  authority. Opinion: docs/vjs/2026-VJS-CC-BOLTRIG-D7-DISCHARGE-001-opinion.md.

  V2's mechanism is built and tested ahead of need: scripts/record_d7_relay.py
  writes the security event through write_host_boundary_security_event with the
  exact detail shape the directive names, and refuses to run without the relay
  date and channel class (the V1 facts only the Principal can supply). It has
