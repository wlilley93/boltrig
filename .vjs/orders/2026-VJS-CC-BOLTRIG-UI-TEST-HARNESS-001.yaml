issue: browser_test_harness_dependency
holding: |
  Option A is adopted with conditions: @playwright/test enters ui/package.json as a dev-only dependency at an exact pinned version, with a chromium-only config and one hermetic smoke spec driving the built UI against the deterministic no-runtime-configured path. The smoke is gating (CI-blocking). The runtime image must remain nginx plus dist with no node_modules and no browser binaries. Options B (ad-hoc scratchpad scripts) and C (vitest plus jsdom) are rejected.
