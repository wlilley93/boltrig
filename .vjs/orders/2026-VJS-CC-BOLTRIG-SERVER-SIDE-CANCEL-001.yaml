id: 2026-VJS-CC-BOLTRIG-SERVER-SIDE-CANCEL-001
court: county
jurisdiction: default
repo_code: null
status: binding
issue: server_side_cancel_status
holding: |
  Option A is adopted. A run gains a first-class terminal WorkStatus.CANCELLED and
  a COOPERATIVE server-side cancel. Cancel is signalled by an owner-only, audited
  request keyed by run id (a cancel flag/row written through the chokepoint), which
  the WorkPump checks at the step / chokepoint boundary. On observing the signal the
  run stops BEFORE dispatching the next verb, writes CANCELLED in a finally (so the
  terminal state is durable even if the process dies mid-flight), scores the outcome
  neutral (a cancel is neither success nor failure), and audits the transition. A
  cancel MUST NOT interrupt an in-flight adapter call: it takes effect at the next
  cooperative point, so no partial external side effect is ever left un-audited. The
  cancel route is owner-only and fail-closed (scoped-read callers get 403 with no
  write), mirroring the rename and regenerate routes; ChatService exposes the cancel
  and the SSE stream ends cleanly on it. Option B (client-only) is rejected as a
  false stop that halts neither work nor cost. Option C (hard-kill mid-step) is
  rejected as unsafe: it can abort mid-adapter-call and orphan a side effect outside
  the audit/output stage.
