runtime_summary: |
  Stop becomes real: a terminal WorkStatus.CANCELLED plus a cooperative,
  owner-only, audited cancel signal keyed by run id. The pump checks it at the
  step boundary and stops before the next verb, never mid-adapter-call; the
  terminal state is written in a finally (durable), scored neutral, and audited.
  POST /v1/runs/{run_id}/cancel is owner-only fail-closed; ChatService.cancel ends
  the SSE stream cleanly. Client-only stop and hard-kill are rejected.
