runtime_summary: |
  CVE-2026-56852 (golang.org/x/text v0.38.0 vendored in the pinned rclone 1.74.4 binary,
  no released upstream fix) is accepted in .trivyignore.yaml, scoped to
  usr/local/bin/rclone, with owner, expiry 2026-10-23, the qualified client-only
  reachability statement, and a drop-on-fixed-release condition. The acceptance and the
  pre-existing GHSA-hrxh-6v49-42gf acceptance are both mirrored into
  docs/security/accepted-advisories.json (ecosystem go), repairing the pleaded record
  drift and binding both to the ledger's fail-on-expiry enforcement. The acceptance is
  proven against the built backup image under the release gate's own trivy invocation,
  red without the entry. v0.4.22 (the HITL-notification cure) is unblocked. Beta tags,
  source builds, unscoped ignores, and silent expiry renewals are forbidden.
