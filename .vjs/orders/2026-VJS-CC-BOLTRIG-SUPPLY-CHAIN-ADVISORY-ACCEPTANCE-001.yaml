issue: supply-chain.advisory-acceptance
holding: |
  Option A is ADOPTED AS MODIFIED; Options B, C and D are REFUSED, each on stated grounds.

  THE RATIO. An advisory may be accepted only where the fix cannot be taken - no released
  upstream artefact carries it - and only as a record, never as a silence: scoped to the
  operative path, owned, expiring, reachable-stated, and mirrored into the ledger whose
  machinery fails the review the day the statement goes stale. Where the fix CAN be taken
  it must be taken; the acceptance is self-terminating by expiry and self-cancelling by
  condition, so the gate loses nothing it was measuring.

  F2 is verified by direct measurement: rclone v1.74.4 (2026-07-08) is the latest release
  and pins golang.org/x/text v0.38.0; master pins v0.40.0; no released fix exists. F1 is
  verified via the Go vulnerability record GO-2026-5970 (alias CVE-2026-56852, fixed
  0.39.0, norm.Iter infinite loop on invalid UTF-8); the release gate blocks it because a
  PACKAGE-level fix exists even though no released ARTIFACT carries one. F5 is confirmed
  as qualified: the backup service publishes no ports and runs rclone strictly as a client
  against operator-configured remotes, so reaching the defect requires a compromised
  operator-provisioned remote; the pleaded absolute ("no untrusted text input") is
  corrected and the entry must carry the qualified statement.

  B is refused: a mutable beta tag defeats the digest-pinning discipline
  backup.Dockerfile:16 exists for and ships unreleased code on the backup path. C is
  refused: the blocked release carries a court-ordered kernel cure with a live-tenant D4
  outstanding (2026-VJS-CC-BOLTRIG-HITL-NOTIFICATION-ROUTING-001), reachability is
  genuinely absent as deployed, and the schedule is upstream's; holding is the price of
  the cure paid for no measured security gain. D is refused: it trades an official
  cosign-attested artefact for a self-built one and adds the toolchain to the trusted
  set - Option B's defect wearing a pin.

  The modification to A: the acceptance is entered in .trivyignore.yaml scoped to
  usr/local/bin/rclone AND mirrored, together with the existing GHSA-hrxh-6v49-42gf entry,
  into docs/security/accepted-advisories.json, repairing the pleaded F4 drift by
  completing the record the gRPC entry's statement already claims - the ledger was
  designed for exactly this (scripts/python_audit.py:58-64, one ledger for every
  ecosystem, expiry fail-before-audit).

  RESERVED, not decided: whether .trivyignore.yaml statements should be schema-validated
  against the ledger so such a claim cannot drift again; the repair here is the record,
  not the tooling.
