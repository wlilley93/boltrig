implementation_note: |
  Convened 2026-08-02 on Lexby's own motion after `vjs route` returned CourtRequired
  (SUBMISSION-2026-08-02-122040, CONVENING-county-2026-08-02-122100, case file pinned
  sha256:070dde24427280a07bfd85c91a9b11ea4e7f4e34bf184a1d65c935f61d3d5ec1). Single seat,
  lexby-first-instance. Full opinion at the source_opinion path.

  ON D6's WORDING. The judgment directed the gate be wired into "make gates". There is no
  such target: the aggregate this repository runs, and the one CI runs, is `make check`. The
  directive is left as ordered rather than silently reworded, and the gate is wired into
  `make check` beside check_architecture.py, which is the target the judgment described by
  position even though it named it wrongly. Recorded because a directive naming a target
  that does not exist is dischargeable by doing nothing, and that is exactly the kind of
  unrunnable requirement this estate keeps finding in its own record.

  D10, DISCHARGED HERE AND NOT DEFERRED. A tool name's range is NOT closed at build time. For
  first-party verbs it is a registered verb; for MCP-imported tools it is chosen by the tool
  PUBLISHER at import. It is admitted because its provenance is a registry rather than the
  conversation, and because it is capped and charset-normalised inside its own untrusted
  envelope. THAT IS A RECORDED LIMIT AND NOT A SAFETY PROOF, and no test may be written to
  imply otherwise. It is admitted on the same footing the schema-validation-ledger order used
  for params key names at the audit row, and expressly NOT on the footing that names are
  provably safe.

  TWO CORRECTIONS AGAINST THE ADVOCATE, recorded because the record binds us both.

  (1) The case file's "For" limb asserted that the line would compose "only already-persisted,
  already-bounded data, the same projection already sent to the browser". THAT IS WRONG IN
  THREE RESPECTS, found by measurement at the sitting. The cardinality cap is not in
  chat_event_projection.py at all - MAX_PARAM_KEYS lives two modules upstream in
  run_event_projection.py, _summarise_output has no cap whatever, and no key-name length is
  bounded anywhere in the chain. message.events is NOT a value-free structure: the same list
  on the same row carries text_delta.delta (the entire reply), subagent.task (unbounded), and
  hitl.question / question.prompt as free text. And one writer of message.events,
  held_write_resume.py, hand-builds frames and persists them directly, never passing through
  the projection at all. The mechanism the advocate pleaded is therefore refused, and the
  relief granted on a bound this order enumerates itself.

  (2) The case file described commit e558bc0 as "changes no behaviour" and placed it outside
  the court's consideration. It changed no CODE. It changed the LAW: it rewrote SEC-46 in
  docs/invariants.md from "(it composes only persisted text)" into an express prohibition
  naming message.events, on the advocate's own motion, hours before filing, in the direction
  of refusal, while this question was live. The parenthetical does not bind this court - a
  one-line edit to a docs table is a record of behaviour, not a holding, and the test file
  itself says pinning what the system does today is not a ruling that it should. But the
  advocate ought not to have told the court the commit was neutral, and D9 now directs that
  wording be rewritten under this order rather than left as it was made.

  CITATION DELIBERATELY NULL, following SCHEMA-VALIDATION-LEDGER-001, RATE-LIMIT-WINDOW-001
  and WORK-ITEM-LEASE-FENCE-001. Hand-minting a county citation at this seat would
  collide with the canon series and reproduce the VJS-CC-VJS 1 defect on purpose. The
  allocator gap is not settled here.
