id: 2026-VJS-CC-BOLTRIG-CONTINUITY-TOOL-WORK-001
court: county
jurisdiction: default
repo_code: null
status: binding
issue: continuity_tool_work_projection
holding: |
  GRANTED AS VARIED. The relief is granted; the mechanism pleaded is refused.

  `_render_message` MAY append a bounded, value-free statement of a turn's tool work. It may
  NOT do so by inheriting the bound from `chat_event_projection.py`. On the sub-question
  expressly reserved: YES, the permitted projection must be defined AT the continuity
  boundary.

  THE RATIO. Persistence is not prompt-eligibility. A datum's presence on a persisted row
  confers no entitlement to enter a prompt. The prompt is a distinct boundary with a distinct
  reader, and what may cross it must be enumerated AT THAT BOUNDARY, in the module that
  composes the prompt, as a closed allowlist of record types and of fields within them, with
  its own caps expressed as typed configuration. A BOUND DECLARED FOR ANOTHER DESTINATION IS
  NOT A BOUND HERE: bounds do not travel with data, they belong to the boundary that declared
  them, and a projection built for one reader may be relied on for nothing at another however
  tightly it binds at its own.

  Corollaries. (a) Provenance is per FIELD, not per struct; arrival inside a reviewed
  structure is not an argument about the field. (b) A field may be composed into a prompt only
  if its value range is closed at build time, or it is a NAME whose provenance is the system's
  own registry rather than the conversation; an instance-chosen name is not admitted, and its
  admission elsewhere as a RECORDED LIMIT is not authority to admit it here. (c) A value with
  a closed build-time range crosses as itself; anything outside renders as a fixed `unknown`
  token. (d) An identifier may be READ to derive an admitted fact and must not be RENDERED;
  the allowlist governs the rendered surface. (e) A render derived only from an immutable row
  is prefix-stable, so the gateway-cache guarantee is not a ground to refuse a derived line.
  (f) A transcript that asserts a falsehood is a defect, not conservatism: silence about work
  performed is a FALSE STATEMENT THAT THE TURN WAS SILENT, and a continuity property may not
  be made to depend on a third-party model choosing to narrate.

  THE BOUND. One deterministic line per rendered message, only where the row carries at least
  one admitted frame, inside its own wrap_untrusted("tool_work", "prior_turn", ...): the TRUE
  count of tool_call frames (exact, never capped); the distinct (tool name, status) pairs with
  repetition counts, sorted, joined on call_id INSIDE continuity; and an overflow marker when
  the pair list exceeds its cap.

  Rendered allowlist: tool_call.tool, tool_result.status. Read but never rendered: call_id,
  type. Frame types admitted: {tool_call, tool_result} and nothing else.

  REFUSED: args_summary in whole and in part, result_summary in whole and in part, run_id, any
  rendering of call_id, and every other frame type (subagent, hitl, question, text_delta,
  artifact, workflow_*, model_routing, steer_*, unknown), whose fields are neither read nor
  rendered.

  Count-only was refused as insufficient: without identity the model cannot avoid the
  repetition that is the whole justification. Argument key names were refused because
  2026-VJS-CC-BOLTRIG-SCHEMA-VALIDATION-LEDGER-001 admitted them at a different boundary as a
  RECORDED LIMIT (L1) resting on four conditions, two of which cannot be reproduced here:
  there is no write-time scrub on the prompt path, and the destination is a third-party model
  rather than a first-party store. Under a verb with additionalProperties an instance-chosen
  key IS a params key, which is the same defect that order refused for json_path.
