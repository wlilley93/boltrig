runtime_summary: |
  Persistence is not prompt-eligibility. What may enter a prompt is enumerated at the
  continuity boundary as a closed allowlist with its own typed caps, never inherited from a
  projection built for another reader. Tool NAMES and a closed-allowlist STATUS may be
  composed, joined on call_id read-but-not-rendered, with the true call count exact; argument
  key names, result summaries, identifiers and every other frame type are refused.
