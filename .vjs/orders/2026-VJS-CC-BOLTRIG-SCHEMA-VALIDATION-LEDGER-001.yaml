source_opinion: docs/vjs/2026-VJS-CC-BOLTRIG-SCHEMA-VALIDATION-LEDGER-001-opinion.md
runtime_summary: |
  A schema-validation failure records {schema_path, keyword} per error, the top-level params
  key names, and a digest of the registered schema. It records no message, no instance path,
  and no schema value. The expectation is DERIVED at read time from the schema the digest
  pins, so the ledger stores what cannot be recomputed and nothing else. Input and output
  validation are treated identically. The write-time scrubber stays as a second line and a
  test proves it is not the first, by disabling it and requiring the leak test to stay green.
