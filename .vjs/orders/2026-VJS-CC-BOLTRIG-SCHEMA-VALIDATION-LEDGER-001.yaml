issue: schema_validation_ledger_admissibility
holding: |
  None of the three pleaded options is right, and the axis the filing chose is the wrong
  one. It asked how much diagnostic power may be bought; the question is PROVENANCE, per
  field.

  THE RATIO. A field may enter an append-only store only if its value range is closed at
  build time, or its provenance is wholly the schema AND it is name-only. Everything else is
  derived at read time from the system of record, pinned by a digest.

  Three corollaries, each doing distinct work. (i) Provenance is per FIELD, not per struct:
  "structured, therefore safe" is not an argument, and {path, keyword, expected} mixes three
  provenances so that the least safe rides in on the reputation of the other two. (ii)
  Schema-derived is not value-free: a schema is data, is third-party data for an
  MCP-imported verb, and const and enum place literals in validator_value by definition. The
  safe cut is names versus values. (iii) In a store where nothing can be unwritten the test
  is not "is it usually safe" but "can it be wrong", because the remedy for a mistake here is
  nothing at all.

  Option B is FORBIDDEN by [2026] VJS-COUNTY 9, not weighed. Option C rests on a false fact:
  the security stream is also append-only and hash-chained, carries the same no-secrets rule,
  and imports the same scrubber, so diverting lowers no bar and splits the record.

  Option A is refused AS PLEADED, on all three of its named fields and on its stated
  guarantee. Its claim that instance data is never read is untrue: json_path is derived from
  the INSTANCE, and under additionalProperties an instance key IS a path segment. Its
  treatment of a value-bearing validator_value as hypothetical is wrong: const and enum are
  ordinary keywords. And it does not deliver its headline benefit, because on the motivating
  failure neither recorded field names the disagreeing property.

  ADOPTED: Option A as modified, which is a materially different order. Record per error
  {schema_path, keyword} where schema_path is absolute_schema_path (name-only) and keyword is
  allowlisted; record the top-level params key summary; record a schema digest; derive the
  expectation at read time; never read message, json_path, absolute_path, instance or
  validator_value anywhere on the audit path; apply all of it to output validation too; and
  keep the write-time scrub as a second line, proven by test not to be what saves the row.

  The pleading is corrected in four places. The output-validation twin at dispatch.py:523-525
  was not disclosed and is the worse half, its instance being the adapter's response. The
  ledger is not value-free today: _resource_ref already lifts an instance value into
  resource_id under COUNTY 9 D1. detail is already scrubbed at write time, and that scrubber
  does not catch the filing's own worked example. And the remedy in the 85-row incident was
  not scrub-by-key: those rows are permanent and unreachable, which makes that fact stronger
  against widening than as pleaded.
