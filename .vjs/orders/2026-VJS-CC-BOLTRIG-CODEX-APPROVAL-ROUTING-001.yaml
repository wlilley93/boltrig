issue: codex_item_tool_requestUserInput_reconciliation_with_boltrig_hitl
holding: |
  The governing locus for tool-call authorization is the kernel dispatcher reached
  through /v1/mcp (mcp.py -> dispatch.py:406, SEC-26/SEC-14). codex's per-tool-call
  item/tool/requestUserInput is an INTERFACE control point, not a governing one. It
  must ALWAYS be answered (never left to crash the notification pump), and its answer
  must be DERIVED from boltrig's own calibrated governance, never invented as an
  independent parallel human gate. Disposition is a HYBRID: unify-by-derivation in
  form, defer-in-mechanism. For the LOW / non-blocking class the calibration
  (dispatch.py:406) deliberately omits a human veto, so the derived answer is
  approve and kernel grant-check + audit remain the sole governance (VJS-PC 20
  locus-not-cardinality on all fours for this class). For the HIGH / blocking class
  the client answers approve ONLY to admit the call to the kernel, where the durable,
  param-bound human HITL is the real veto; codex asks pre-forward, so deriving from a
  not-yet-existent kernel decision would deadlock, making admit-to-kernel the fail-safe
  derivation. A human veto for the LOW class is deliberately omitted; the doctrine-
  honoring way to add one is to recalibrate the verb as DATA (consequence: HIGH or
  manifest blocking_verbs), never a codex-side gate.
