exceptions: |
  Contingency: should the pinned binary's ordering ever be POST-forward (a kernel HITL
  already exists when codex asks), the handler must instead BLOCK on the kernel decision
  via the fleet-side resume_notifier seam (or store poll) keyed by run_id/hitl_request_id
  (kernel emits, fleet subscribes, honoring P1), deriving approve->approve-label,
  deny->error/deny-label, and failing CLOSED (error/deny) on autoResolutionMs expiry for
  a HIGH/blocking verb.
supersedes: []
source_opinion: |
  First Instance judgment, delivered on a symmetric case file with two adversarial
  advocates (defer-to-the-real-gate; unify-into-HITL) and no access to the engineer's
  preference. Decisive verified fact: the kernel HITL gate is SELECTIVE
  (dispatch.py:406 gates only HIGH-consequence or blocking-listed verbs; the Consequence
  enum is binary LOW/HIGH, models/registry.py). VJS-PC 20 (locus-not-cardinality) held
  on all fours for the LOW class, distinguishable/first-impression for the HIGH class
  (a human pre-act veto is a different KIND of control than runtime/egress cardinality)
  but the HIGH result is compelled by the deadlock/liveness analysis and the superiority
  of the durable param-bound kernel HITL. S-2: the Principal directive "route into HITL,
  not auto-approve" is FOLLOWED in substance (real decisions route to the durable kernel
  HITL; codex's answer is that decision's faithful image) and held PARTIALLY ULTRA VIRES
  only insofar as a literal reading would force a fresh human veto on the whole LOW class,
  colliding with the calibrated selective gate, PC 20, and the anti-side-door doctrine;
  the constructive off-ramp is data recalibration. Permission to appeal GRANTED but
  CONFINED to two questions (whether the LOW class must receive a codex-derived human
  veto notwithstanding the dispatch.py:406 calibration; and the S-2 ultra vires treatment);
  DENIED on the pump-crash fix (settled by graceful-degradation doctrine) and the HIGH-class
  admit-to-kernel derivation (compelled). The Order stands and must be built pending any appeal.
runtime_summary: |
  Answer codex's item/tool/requestUserInput, never crash the pump. Derive the answer from
  the SAME predicate the kernel uses (dispatch.py:406: consequence==HIGH or verb in
  blocking_verbs), exposed as one shared function. LOW verb -> approve (label read from
  codex's offered options), governance stays kernel grant-check + audit, no human veto by
  design. HIGH/blocking verb -> approve only to admit the call to the kernel, where the
  durable param-bound HITL is the real veto; never a timer-defaulted approval. Missing or
  ambiguous approve label -> error arm, fail closed. Never auto-deny a LOW call. To add a
  human veto on a LOW verb, recalibrate it as data (consequence: HIGH or blocking_verbs),
  not a codex-side gate. Pin all four properties as invariants.
