id: 2026-VJS-CC-BOLTRIG-DEVELOPMENT-POSTURE-001
court: county
jurisdiction: default
repo_code: boltrig
status: binding
issue: development_posture
holding: |
  Option C is ADOPTED IN PRINCIPLE and REFUSED AS SHIPPED. Option E is REFUSED. Options A and D
  are REFUSED. Option B is expressly not reached.

  THE RATIO. Independence may be suspended only where there is no party for independence to
  protect, and that absence must be established by a fact the declaring party does not author.

  Four corollaries, each stated to decide future cases. (a) Necessity, not convenience, and
  absence, not declaration: every lawful lifting of four-eyes in this repository tracks the
  UNSATISFIABILITY of the rule - the founding-owner bootstrap ([2026] VJS-COUNTY 7 D7, because
  invite-only needs a first inviter) and the sole-author exemption (`_sole_active_author`: one
  author, so no independent approver can exist). A posture that tracks the operator's STATEMENT
  that protection is unnecessary tracks the wrong fact. (b) A posture-gated relaxation is lawful
  only under a fence that is mandatory, test-enforced, and makes the relaxation provably
  unreachable in production - and a court that approves such a fence approves it WHOLE; taking
  the flag and the production signal from an approved wall while leaving behind its isolation
  limb is not following the precedent, it is citing it. (c) A gate whose permissive branch is
  the ABSENCE of a signal is not a gate: a control that must establish a fact must require an
  affirmative signal of that fact, not the silence of its negation. (d) A humanity check is only
  as strong as the weakest issuer of `actor_tier="human"`; where any credential path stamps that
  tier on a machine bearer, no downstream control may claim to exclude non-human actors, and the
  claim must be made good at the issuer or struck from the record.

  And, following the operator-seat court: "it is the same relief an existing exemption already
  grants, extended" is an argument for EXAMINING the existing exemption, never for opening a
  comparable one beside it.

  A declared development posture is a lawful MECHANISM for a tenant with no protected party. The
  kernel work in 881a9df is architecturally close to right: it lifts independence only, never
  admits a second relief silently, never lifts the grant check, bounds itself to `control.*`,
  requires an expiry, admits superadmin only, and writes the reliance to both the audit chain and
  the client-readable security stream. It is not struck down. But as shipped it is not fenced,
  and as applied to Classical Visas it was unlawful, on three findings.

  ONE, the fence is missing its load-bearing limb. The posture is modelled expressly on
  `require_codex_trusted_posture` ([2026] VJS-CC-VJS 2), whose fence has TWO limbs: no production
  signal AND no real ingress posture (OIDC / CF Access / session login). The second is both an
  express directive and an express forbidden item of that order. The posture reproduced the first
  and dropped the second - and the dropped limb is the one that would have refused the tenant it
  was actually declared on.

  TWO, its central safety claim is false in operation. `resolve_pat_principal`
  (identity/tokens.py:145) hardcodes `actor_tier="human"` on every machine bearer, so the claim
  that the posture "never admits a non-human approver" does not hold. Proven by execution: a PAT
  minted for the declaring superadmin, on a two-author tenant under a live posture, answered its
  own `control.adapter.activate` approval and returned {"status": "answered",
  "development_posture": true}. No human acted. The posture as shipped delivers Option D - the
  option the case file records as consistently refused - by accident rather than by design.

  THREE, the "observed condition the operator cannot assert away" is neither observed nor
  unassertable, and it fails OPEN. `production_signal()` reads four process environment variables
  and returns None when all are unset; unset means permitted. It is a second declaration, in a
  different file, written by the same operator on the same box. Classical Visas returned no
  production signal while serving a real client on a public domain.

  FOUND ADDITIONALLY, on a point the case file does not plead at all: 881a9df BREACHED a binding
  directive. [2026] VJS-CC-BOLTRIG-HITL-NOTIFICATION-ROUTING-001 D2 requires the notified set to
  equal the set the response route admits, derived from ONE shared definition.
  `eligible_approval_responders` does not receive the posture. Measured: notice ['client@cv'],
  route ['client@cv', 'operator@cv']. That function's own docstring - "a user it would admit is
  never missed" - had become false, and the D2 matrix test could not detect it because no row
  ever set a posture: a check that cannot fail in the exact dimension the new code introduced.

  ON THE PRINCIPAL. Applying [2026] VJS-APPEAL 1 (construction-to-validity first, ultra vires as
  a last resort), the Principal's instruction is NOT ultra vires. Its stated requirement - "on a
  tenant NOT YET IN SERVICE, work without a second human answering each approval, and turn it off
  again after" - is entirely lawful and is Option C properly fenced. What was ultra vires was the
  APPLICATION, and it was the executive's act, not the Sovereign's: Classical Visas is in
  service, so the instruction's own premise does not reach it, and the declaration was made while
  the operator-seat refusal stood and its express condition precedent for re-argument remained
  open. The residual failure under S-4..S-8 is stated precisely: the thing was deployed to a
  client tenant and relied upon BEFORE the court sat. The remedy is to make the work good, and
  nothing else.

  ON THE ABSENT THIRD PARTY. The demotion limb the operator-seat court refused had the vice of
  consent EXTRACTED; this posture has the vice of consent DISPENSED WITH. A court cannot hold
  that not asking the protected party is an improvement on asking her badly. But her absence is
  decisive against the mechanism ON HER TENANT, not against the mechanism: on a tenant with no
  client there is no absent party and independence protects nobody. That is why the condition
  must be the demonstrable ABSENCE of a protected party, not a declaration that protection is
  unnecessary.

  DISPOSITION. The Classical Visas declaration is withdrawn forthwith (D1). No tenant may declare
  the posture until D2-D6 are discharged. The act already taken under it STANDS (it was within
  grant, fully recorded, corrective, and voiding it would injure the very absent party this
  ruling protects) and must be put to her (D7). The record is to be corrected (D8).
