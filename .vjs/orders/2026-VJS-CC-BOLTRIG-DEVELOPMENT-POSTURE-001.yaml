runtime_summary: |
  The development posture is fenced as the court required, and each limb is proven to fail.
  `posture_block` now takes every condition as a PARAMETER rather than reading the environment,
  so adding one breaks every call site instead of defaulting to permissive at the caller nobody
  updated. It refuses under a real ingress posture (D2), refuses unless the environment
  AFFIRMATIVELY declares development (D5), refuses a caller whose `Principal.credential_kind` is
  not an interactive door (D4, defaulting to "machine" so an unlabelled resolver is refused), and
  lapses when any active author-tier user is not named in the declaration's `covers` (D3).
  `eligible_approval_responders` receives and passes the posture, so notice and authority are
  again derived from one definition (D6). Classical Visas' declaration was withdrawn on the box
  the hour the judgment landed (D1), verified against the running kernel.
created_at: 2026-07-29T15:15:00Z
