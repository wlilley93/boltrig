implementation_note: |
  D1 DONE 2026-07-29 on jellytot-prod: the `development_posture` block was removed from
  boltrig-tenants/cv/manifest.yaml (previous kept as manifest.yaml.bak-posture-withdraw-*) and
  the kernel restarted. Verified against the RUNNING container, not the file: posture object
  None, enabled False, `posture_block(...)` returns "no development posture is declared for this
  tenant". Kernel healthy with all 15 adapters registered; unauthenticated /v1/skills returns 401.

  D2, D3, D4, D5, D6 DONE. 40 tests in tests/security/test_development_posture.py plus the new
  posture row in tests/security/test_hitl_notification_routing.py. Every limb was RED-SEEDED by
  removing it in turn: D2 -> 1 fails, D5 -> 1 fails, D4 -> 1 fails, D3 -> 3 fail, D6 -> notice
  != route, reproducing the drift the court measured. Recorded honestly: the FIRST pass of that
  work had no test for D2 or D5 at all, so both seeds stayed green and those two limbs were
  unfalsifiable - the check-that-cannot-fail defect written into the fix for it. Caught by
  running the seeds rather than assuming they would fail.

  D7 OPEN and BLOCKED on the Principal. It requires an outward communication to the client, and
  the Principal has a standing instruction not to email that client. Nothing has been sent. The
  lawful routes are that the Principal relays it himself, or directs another channel.

  D8 OPEN.
