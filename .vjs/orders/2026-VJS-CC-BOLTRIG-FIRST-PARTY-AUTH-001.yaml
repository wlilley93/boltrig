- an_unbounded_non_revocable_or_non_httponly_session_or_a_login_error_that_enumerates_which_emails_exist
- any_open_self_signup_a_login_path_that_bypasses_the_ratelimiter_or_the_audit_chain_or_a_resolver_that_fails_open
- adding_an_email_or_sms_dependency_without_surfacing_it_to_the_principal
- removing_cloudflare_access_on_the_live_prod_console_without_the_principals_explicit_go
exceptions: null
supersedes: []
source_opinion: null
runtime_summary: |
  Boltrig gets a first-party invite-only password login (the Opbox shape) that
  replaces CF Access: accept-invite sets a password (argon2id), login issues a
  Boltrig-signed httpOnly+Secure+SameSite session verified by a new bootstrap-
  selected resolver, the founding owner is seeded by `boltrig initiate`, login is
  rate-limited + constant-time + non-enumerating, everything is fail-closed,
  audited, and invite-only (no self-signup). Magic-link and passkeys are deferred
  add-ons. Removing CF Access on the live console is Principal-gated.
