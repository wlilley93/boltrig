id: 2026-VJS-CC-BOLTRIG-FIRST-PARTY-AUTH-001
court: county
jurisdiction: default
repo_code: null
status: binding
issue: first_party_invite_only_login
holding: |
  Option A is adopted. Boltrig gains a first-party, invite-only password login that
  replaces the Cloudflare Access edge IdP, reusing the existing users / invitations /
  sessions / RBAC plumbing. An admin invites an email; the invitee accepts via a
  single-use, hashed, expiring invite token and sets a password; login verifies
  email + password and issues a Boltrig-signed session, and a new session resolver
  replaces the CF Access resolver, selected by bootstrap. The founding OWNER is
  seeded out-of-band by a `boltrig initiate` bootstrap, because invite-only needs a
  first inviter. This becomes the sole internet-facing gate, so it is subject to a
  binding SECURITY FLOOR (directives D4..D9). Option B (magic-link) is deferred: it
  needs an email dependency the Principal must supply; it may be added later behind
  that dependency. Option C (passkeys) is a permitted later add-on, not the v1 gate.
  Option D (keep CF Access) is rejected per the Principal's instruction. The live
  prod cutover that REMOVES CF Access is an irreversible outward-facing action and
  is gated on the Principal's explicit go (D10); building and testing the login is
  not gated.
