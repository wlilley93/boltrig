status: binding
issue: chat_attachment_storage_shape
holding: |
  Option A is adopted with modification: chat attachments are an inline size-capped attachments JSONB field on the conversation_messages row, persisted through the existing message contract. Caps live as typed data on ChatConfig with conservative non-zero code defaults; a manifest may only tighten a cap, never loosen it. Over-cap turns are rejected, not truncated, before any persistence or streaming. Agent-readable text attachments pass wrap_untrusted; all other types persist record-only and never enter the task. Option B (object-storage seam plus MinIO now) is rejected as premature; Option C (defer) is rejected.
