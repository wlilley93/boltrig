runtime_summary: |
  Chat attachments ride inline as a size-capped attachments JSONB field on the message row through the existing message contract. Caps are ChatConfig data, tighten-only from conservative code defaults, enforced on decoded bytes at intake with rejection before persistence. Text made agent-readable is enveloped via wrap_untrusted; everything else is record-only. No object store, no new dependency; the future seam, if earned, slots behind this message contract by court order.
