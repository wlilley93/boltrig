id: 2026-VJS-CC-BOLTRIG-DEV-EGRESS-LOOPBACK-001
court: county
jurisdiction: default
repo_code: boltrig
status: binding
created_at: "2026-07-31T14:56:10Z"  # no convening record carries this matter, so this is the file's first-commit time (b1bb11df), an upper bound, not the sitting
issue: dev_egress_loopback
holding: |
  PERMITTED, on five conditions, ALL of which must hold before the diversion may run once.

  The matter: may the stack, under a development tag enabled by the Principal, divert governed
  outbound egress (`channel.send`) away from its declared external recipient and into a webhook
  the stack itself receives?

  The relief is narrower than it appears and the risk runs OPPOSITE to the posture cases: this
  does not widen what may leave the system, it prevents anything leaving. That is why it is
  granted. It is granted CONDITIONALLY because the property that makes it safe - nothing reaches
  the recipient - is a lie told to the approver unless the record says so at the point of
  approval.

  The advocate pleaded this as an independence question. It is NOT one, and the court declined to
  decide it on that ground.

  THE RATIO. A control may be narrowed by a declared posture where the narrowing removes the
  protected exposure entirely; but where the narrowing makes a human's approval mean something
  other than what the human is being asked to approve, the narrowing must be disclosed at the
  point of approval, in the approval itself.

  Three corollaries. (a) Diverting an effect is not suspending its control: where the initiator
  is an agent and the approver a human outside the initiator set, four-eyes is SATISFIED, not
  lifted, so [2026] VJS-CC-BOLTRIG-DEVELOPMENT-POSTURE-001's ratio is not engaged; a court must
  not stretch a precedent to cover a case merely because the same tag enables both. (b) The
  DIRECTION of the relaxation decides the fence: a posture permitting MORE to leave needs a fence
  making it unreachable in production, while a posture permitting LESS to leave needs the
  converse - that the diversion cannot persist into production unnoticed, the failure mode being
  a sender who believes a message was delivered when it never left. (c) An approval obtained on a
  false description of its effect is not an approval; the disclosure is not documentation, it is
  the condition of the approval's validity.

