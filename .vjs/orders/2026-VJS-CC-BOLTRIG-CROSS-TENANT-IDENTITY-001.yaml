id: 2026-VJS-CC-BOLTRIG-CROSS-TENANT-IDENTITY-001
court: county
jurisdiction: default
repo_code: null
status: binding
issue: cross_tenant_identity
holding: |
  Option A is adopted. One human identity spans multiple organisations via a global
  identity anchored on the normalised email, with a per-org User row + org membership.
  Login authenticates the email against a credential held ONCE (not per-org); the
  session then carries the ACTIVE org (tenant) + workspace, and an org switch
  RE-AUTHORIZES against org_members (mirroring the workspace switch) and REBINDS the
  RLS tenant for every subsequent request. Isolation is preserved absolutely: a
  request is always bound to exactly ONE active tenant, and the switch is the only
  thing that changes it, always membership-checked, never trusted from the client.
  Provisioning-by-invite (COUNTY 8) is completed by creating the invitee's User row +
  membership in the new org, the shared credential being the identity. The shared
  credential + any 2FA (COUNTY 10) travel with the identity, not the per-org row.
  Option B (separate accounts per org) is rejected as contrary to the Principal's
  multi-org intent. Option C (a single super-tenant with app-level scoping) is
  rejected as collapsing the org=tenant RLS fence isolation depends on. Composes with
  COUNTY 7/8/10; the live prod cutover stays Principal-gated.
