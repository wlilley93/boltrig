runtime_summary: |
  One identity spans many orgs: a global email-anchored identity with per-org User +
  membership and a credential held once. The session carries the active org+workspace;
  an org switch is membership-re-authorized and rebinds the RLS tenant every request,
  so a request is always bound to exactly one tenant and cross-org reads are
  impossible. Provisioning-by-invite creates the invitee's login in the new org; the
  credential + 2FA travel with the identity. Super-tenant and per-org-accounts are
  rejected. Prod cutover stays Principal-gated.
