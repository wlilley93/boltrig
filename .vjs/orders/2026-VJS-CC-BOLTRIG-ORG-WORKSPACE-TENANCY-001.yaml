id: 2026-VJS-CC-BOLTRIG-ORG-WORKSPACE-TENANCY-001
court: county
jurisdiction: default
repo_code: null
status: binding
issue: org_workspace_tenancy
holding: |
  Option A is adopted. Boltrig gains an Organisation -> Workspace tenancy in the
  Opbox shape, mapped onto the existing fence: tenant_id BECOMES the Organisation
  boundary, so RLS and the WHERE tenant_id filter are unchanged and org-level
  isolation is inherited, not rebuilt. A Workspace is a new entity belonging to an
  org, and a workspace_id sub-scope is added to workspace-owned resources. Users
  decouple from a single tenant into org_members and workspace_members (a global
  user role plus a per-workspace role: owner/admin/member/viewer/agent). The session
  carries the ACTIVE org + workspace; a switch is re-authorized against membership on
  every request, never trusted from the client. AI keys live at org / workspace /
  user levels as config rows gated by an org allow_own_ai_keys, stored only through
  the sealed credential store. Invites (COUNTY 7 accept-invite) are org- or
  workspace-scoped and may provision a new org/workspace; the flow stays invite-only.
  The founding superadmin is seeded by `boltrig initiate` into a default org +
  workspace. Only the auth/tenancy CORE of Opbox is copied, never its domain models.
  Option B (workspace = tenant, no org) and Option C (copy the full Opbox schema) are
  rejected. This composes with COUNTY 7 (login authenticates; org/workspace is the
  authorization context) and is delivered in phases; the live prod cutover stays
  Principal-gated (COUNTY 7 D10).
