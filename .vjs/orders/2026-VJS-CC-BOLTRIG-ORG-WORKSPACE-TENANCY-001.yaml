runtime_summary: |
  Boltrig adopts an Organisation -> Workspace tenancy in the Opbox shape: tenant_id
  becomes the org boundary (RLS unchanged), a workspace is a sub-scope, users join
  orgs + workspaces as members with roles, the session carries an active org+workspace
  re-authorized on every switch, AI keys sit at org/workspace/user levels through the
  sealed store gated by allow_own_ai_keys, invites are org/workspace-scoped and
  invite-only, and `boltrig initiate` seeds the founding superadmin with a forced
  password rotation before prod. Only the auth/tenancy core of Opbox is copied,
  delivered in phases, composing with COUNTY 7; the prod cutover is Principal-gated.
