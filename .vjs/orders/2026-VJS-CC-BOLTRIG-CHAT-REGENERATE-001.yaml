issue: regenerate_amendment_vocabulary
holding: |
  Option B is adopted with modification: regenerate appends a fresh assistant message from a new normally-audited run and records the disowning additively by setting a single nullable forward pointer (superseded_by = new run id) on the prior assistant message. The prior message's content, events, run_id and created_at are frozen forever; the marker is the amendment, expressed as data, written by a narrow marker-only store method. Superseded turns are filtered deterministically by the continuity composer and collapsed in the head. Eligibility is bounded to the last assistant message of a conversation; the write is owner-only, fail-closed, and audited. Options C (replace in place) and D (forking) are rejected outright; Option A (plain append) is rejected as dishonest continuity input.
