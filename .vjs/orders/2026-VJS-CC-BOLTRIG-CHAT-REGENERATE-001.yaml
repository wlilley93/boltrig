runtime_summary: |
  Regenerate is append-plus-supersede: a new audited run appends the fresh assistant message and the old one gains only a superseded_by pointer via a narrow marker-only write. Content and events are frozen; continuity filters superseded turns; only the last assistant message is eligible; owner-only fail-closed RBAC; the marker write is audited. Replace-in-place, forking, plain append, and a general update_message are all forbidden. Regenerating earlier history requires a fresh ruling.
