runtime_summary: |
  A store-level conditional write, fenced on the claim-time lease tuple, in both
  backends. Not a re-read in the pump: that shape was tried and defeated. The
  memory store becomes copy-on-read, which is a parity repair rather than a new
  divergence. Records the limit honestly: single-writer on the RECORD, not
  exactly-once execution, and the duplicate-child window is narrowed rather than
  closed.
