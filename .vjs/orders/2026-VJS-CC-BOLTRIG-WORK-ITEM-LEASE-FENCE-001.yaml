issue: work_item_lease_fence
holding: |
  Option A is adopted, narrowed and corrected. The Store contract gains a
  CONDITIONAL work-item write, fenced by the backend in the SAME statement as the
  update, against the lease tuple (lease_owner, lease_expires_at) MINTED AT CLAIM
  TIME and carried to the writing body, returning whether it wrote.

  The fence value must NOT be re-read by the body. `_still_leased` failed because
  it compared against the body's own read, and a CAS whose expected tuple is
  re-derived at body start inherits the identical defect. The token is captured
  from the claim result and carried on the enqueue payload.

  The case file's premise that InMemoryStore "cannot express it" is REJECTED as
  stated: that store already implements owner-fenced conditional settles, an
  owner-token CAS and a status CAS. The real obstacle is narrower, and is itself a
  parity defect: the memory store hands back the LIVE row, while Postgres already
  returns a fresh object. Making the memory store copy-on-read is a parity REPAIR,
  not a change to the parity design.

  Option B is rejected as a SUBSTITUTE and admitted as mitigation. A monotonic
  terminal write leaves two non-terminal writes clobbering `attempts` and `result`,
  and renewal reduces how often a long step loses its lease but cannot supply the
  missing predicate: a paused or partitioned worker stops renewing while still
  running, which is precisely the overlap case.

  An owner-equality fence on the pump's own worker id is refused as positively
  wrong: the durable lane runs the body in a different process under a different
  id, so it would refuse every legitimate durable write.
