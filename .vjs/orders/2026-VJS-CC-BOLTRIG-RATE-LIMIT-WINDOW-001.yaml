id: 2026-VJS-CC-BOLTRIG-RATE-LIMIT-WINDOW-001
court: county
jurisdiction: default
repo_code: boltrig
status: binding
issue: rate_limit_window_and_backend
holding: |
  The FIXED epoch-aligned window in boltrig/kernel/ratelimit.py STANDS. The
  algorithm is not the defect: it is rate-correct over sustained time, only the
  instantaneous burst doubles, and on every surface the limiter guards that
  doubling is immaterial (5/min per identity against a six-digit TOTP with a
  five-minute challenge TTL; the channel intake bounds are spend throttles whose
  sustained rate is preserved). It stands ON CONDITION that the delivered bound is
  recorded where limits are CONFIGURED and pinned by a test that names it.

  Option A, a sliding window, is REFUSED ON THE EVIDENCE, not in principle. Both
  costs the case file assigned to it failed verification and the refusal does not
  rest on them: a rejecting limiter need never hold more than `max` timestamps per
  key (this repo already has that bounded pattern in adapters/http_base.py), and
  rewriting RedisCounter changed no production behaviour because nothing
  constructed it.

  Verification also found a LARGER defect the case file did not disclose and on
  which neither side was heard: RedisCounter was constructed nowhere, so every
  bound was per-process and per-boot while the module docstring, docker-compose.yml
  and the production readiness check all asserted Redis. That is disposed of in the
  directives as a discovered breach, and the limbs of the ratio addressing it bind
  only so far as an unheard point can.
