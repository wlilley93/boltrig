source_opinion: docs/vjs/2026-VJS-CC-BOLTRIG-RATE-LIMIT-WINDOW-001-opinion.md
runtime_summary: |
  Fixed window stands, conditionally. Sliding window refused on the evidence, with
  the renewal test named. The unwired Redis counter is a discovered breach and is
  closed: the counter is now built from REDIS_URL at the composition root and
  handed to the Kernel, both backends are pinned to agree, the window semantics are
  stated at the configuration site, and SEC-130 and FR-KER-05 no longer assert a
  bound the limiter does not deliver.
