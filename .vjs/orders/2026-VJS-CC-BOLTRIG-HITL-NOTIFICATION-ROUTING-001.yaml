runtime_summary: |
  HITL approval notices now follow eligibility: `_notify_request` additionally enqueues, via
  the existing `enqueue_user_notification`, to every user who could lawfully respond under
  `authorize_approval_response` (outside the initiator set, human, assignee-consistent, holding
  the verb's live grant, sole-author exemption applied identically), deduplicated against the
  present subject, best-effort and fail-safe as now. The recorded request remains the truth
  (SEC-179, P9); notification widens the audience, never the authority. On Classical Visas the
  cure is discharged only when a raised approval provably reaches the client on the tenant
  database - a delivery artefact, never an expired row. The AUTHOR_ROLES double duty and the
  seat-operator question stay reserved.
