status: binding
issue: hitl_notification_routing
holding: |
  Option A is ADOPTED; Options B, C and D are REFUSED, each on stated grounds.

  THE RATIO. Notice follows eligibility. The side channel that advertises a governance record
  must address the same set the authorization rule would admit, derived from ONE shared
  definition, so that notice and authority cannot drift apart: a system that admits X to answer
  and notifies only Y has built its deadlock into its routing table. Notification widens the
  AUDIENCE, never the AUTHORITY - being notified confers no power to approve, and the response
  route re-checks everything at answer time. The recorded request remains the truth (SEC-179,
  P9); delivery remains best-effort and fail-safe; a notifier fault never voids anything.

  `_notify_request` (hitl.py:235-252) addresses `assignee or requested_on_behalf_of or
  requested_by` (hitl.py:244) - an operator-raised approval notifies its raiser and never the
  only lawful approver, and on the live Classical Visas tenant (empty notification_prefs, per
  the scrutiny-verified operator-seat record) it notifies nobody at all. Who may lawfully
  respond is fixed by authorize_approval_response (hitl_response_auth.py:142-178): a human
  outside the initiator set, assignee-consistent, holding the verb's live grant, the sole-author
  exemption lifting independence only while exactly one active author-tier user exists. On
  Classical Visas the exemption has lapsed and the only lawful approver of an operator-raised
  request is the client.

  B is refused: pull-visibility already exists (hitl_response_auth.py:83-99) and has never once
  been exercised; a queue never heard of is not a route put to anyone. C is refused: author tier
  is not eligibility - it notifies users lacking the verb's grant, on a single-author tenant it
  notifies only the initiator, and routing by AUTHOR_ROLES would entrench the double duty the
  operator-seat court expressly reserved. D is refused as a general rule: it asks the raiser to
  compute by hand the eligibility the kernel already computes, and a stale or ineligible
  assignee refuses every other responder (hitl_response_auth.py:156-157); the existing
  assignee-first routing stays.

  Corollaries. (1) A check of this cure must test the OPERATIVE artefact - kernel behaviour and
  the tenant database, never code constants a deployed manifest or tenant data overrides. (2) A
  request that expires unheard is not a request put to anyone; expiry proves silence, not
  refusal. (3) The notice set must be DERIVED from the same eligibility rule the response route
  enforces, not a parallel computation that happens to agree today.

  RESERVED, not decided: the AUTHOR_ROLES double duty (already reserved by the operator-seat
  court) and the seat-operator question (this order makes that court's D8 performable; it does
  not satisfy it and is no record for re-arguing it).
