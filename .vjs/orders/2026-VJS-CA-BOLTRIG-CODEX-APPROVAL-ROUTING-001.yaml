exceptions: |
  VJS-PC 20 "on all fours": the panel splits 2-1 (Marchmont LJ + LJ-3 on all fours;
  LJ-2 distinguishable-in-KIND but the ratio extends and controls). Result
  unaffected - all three agree PC 20's interface-not-executor ratio governs and
  compels affirmance. LJ-2's narrower reasoning (a per-call human SAFETY approval is
  a different kind of control than runtime/egress cardinality; enter an adjacent
  sibling ratio) is preserved as the citator's caution against over-reading PC 20 to
  suppress interface prompts that ARE a sole safety control.
