source_opinion: |
  Full three-judge panel delivered (Marchmont LJ / LJ-1 leading statutory
  calibration; LJ-2 leading precedent; LJ-3 leading the constitutional S-2
  question). Q2 partial dissent (LJ-2 alone) would AFFIRM the First Instance S-2
  treatment outright; the difference is framing not substance (LJ-2 reaches the
  identical result by treating the ultra vires finding as already confined to the
  un-read-down residue). Narrowest-common-ground ratio on Q2: the directive is
  honoured on a conforming construction; "partially ultra vires" does not stand as a
  primary holding. Full opinions in the workflow transcript
  wf_f7a5b15b-dc7 (subagents/workflows).
runtime_summary: |
  Appeal AFFIRMS the deployed codex-approval Order. LOW verbs still admit to the
  kernel with no synchronous human veto (by calibration, not defect); HIGH/blocking
  still hit the durable kernel HITL; to add a LOW-class veto, recalibrate as data
  (consequence: HIGH / blocking_verbs), never a codex-side gate. Q2: the Principal's
  "route into HITL" directive is HONOURED on a conforming construction (construction-
  to-validity before any ultra vires finding) - not partially void. Obiter: run a
  periodic LOW-roster calibration audit. No code change.
further_appeal: |
  Leave to appeal to the Supreme Council REFUSED: Q1 unanimous with no governance
  defect and no live stakes; Q2 unanimous on outcome, the 2-1 split declaratory-only.
  Reservation: the S-2 METHODOLOGY question (partial-ultra-vires vs construction-to-
  validity-plus-reservation for a directive that conflicts only on a maximal reading)
  is genuinely constitutional and this court settles it for boltrig (construction-to-
  validity first; ultra vires as last resort); a future matter with OPERATIVE stakes
  (a directive whose lawful construction is genuinely unavailable) would be a proper
  occasion for the apex.
