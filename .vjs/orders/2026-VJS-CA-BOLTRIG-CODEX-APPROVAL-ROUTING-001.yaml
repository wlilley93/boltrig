holding: |
  Court of Appeal (three judges, s.18 odd bench) on the two certified questions of
  [2026] VJS-COUNTY 12. Q1 (LOW-class human veto) AFFIRMED UNANIMOUSLY (3-0): the
  LOW / non-blocking verb class need NOT receive a human veto derived from codex's
  per-tool-call requestUserInput prompt. The binary gate at dispatch.py:406 is a
  DELIBERATE ENACTED CALIBRATION with two express per-verb DATA levers to escalate
  (consequence: HIGH / blocking_verbs), not a gap the court must plug; codex's
  uniform calibration-blind prompt is the weakest evidence of required governance
  and cannot be the SOURCE of a governing veto (the VJS-PC 20 cardinality error); a
  LOW verb is governed (schema/grant/idempotency/rate-limit/audit), just not
  human-vetoed by deliberate design; the handler's approve is governance-neutral by
  construction (it admits, does not execute; derive-don't-store holds nothing to
  drift from); a codex-derived LOW veto is technically unavailable (pre-forward, no
  kernel decision yet exists to derive from, and the kernel by calibration issues
  none) and could only be a forbidden codex-side interface gate. Q2 (S-2 treatment)
  VARIED 2-1 but the OUTCOME and off-ramp AFFIRMED UNANIMOUSLY: the flat "partially
  ultra vires" is stronger than S-2 warrants; S-2 requires CONSTRUCTION-TO-VALIDITY
  first - a Principal directive must be given a lawful construction where its words
  fairly bear one before any part is declared ultra vires. "Route into HITL, not
  auto-approve" is HONOURED ON A CONFORMING CONSTRUCTION ("subject tool-calls to
  boltrig's HITL rather than blind-approving"); only a rejected hyper-literal
  reading (a mandatory synchronous human veto on EVERY LOW read, sourced from
  codex's interface prompt) would conflict, and any ultra vires characterisation
  attaches at most to that rejected reading. THE DEPLOYED [2026] VJS-COUNTY 12 ORDER
  AND ALL CODE STAND AFFIRMED - not one line changes.
