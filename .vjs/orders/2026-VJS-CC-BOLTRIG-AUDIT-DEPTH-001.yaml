status: binding
issue: audit_depth_opbox_parity
holding: |
  Option A is adopted. Boltrig DEEPENS its existing tamper-evident hash-chained audit
  to Opbox parity, additively, never replacing the chain. Add ip_address, user_agent,
  resource, resource_id and workspace_id to the audit row (all nullable, backfilled
  null so the chain and its tests stay green). Every MCP-initiated row carries the MCP
  caller's identity, org/workspace, and ip/ua at the SAME depth as a human action (the
  chokepoint already audits MCP; enrich it). Add a distinct SecurityEvent stream (its
  own tamper-evident table) for security signals: login failures, rate-limit trips,
  permission denials, MCP auth failures. Add a periodic per-org/workspace ROLLUP ANCHOR
  (a rollup_root_hash over a chain segment) with a LOCAL dev-fallback now
  (is_dev_fallback), and the real RFC3161 TSA + KMS signature behind a surfaced
  Principal dependency, so the mechanism ships now and hardens when the external
  credential arrives. Extend the audit browser to filter by user/resource/date/
  security-event and to VERIFY the chain + anchor. Secrets are never in a row (K-20);
  org/workspace-scoped reads are fail-closed; the audit is append-only + tamper-evident
  (never edit/delete). Option B (replace the chain with an external SIEM) and Option C
  (defer anchoring) are rejected. Composes with COUNTY 8 (org/workspace scope); the
  prod cutover + the external RFC3161/KMS wiring stay Principal-gated.
