runtime_summary: |
  No host-boundary command may create a user identity: the identity set stays exactly
  {initiate, set-password, mint-token}. The four-eyes ratchet is one-way - no control verb may
  take a tenant's active author-tier count from >=2 down to exactly 1, and no such reduction may
  be routed through the protected party's own approval. Crossings of the 1<->2 author boundary
  are announced on the audit stream, and an exemption spent to end itself is flagged at the
  moment it is spent. The shipped control.* approval window is at least 24 hours. The host
  boundary stops attributing set-password and mint-token to the target user and puts both on the
  security event stream. The Python and TypeScript AUTHOR_ROLES sets are reconciled. Before the
  seat-operator question returns, the open in-band route must actually be exercised: an
  invitation raised and put to the client on a >=24h window, evidenced on the tenant database.
