status: binding
issue: operator_seat_host_boundary
holding: |
  Both limbs are REFUSED. `seat-operator` is refused because the bootstrap necessity that alone
  justifies a host-boundary carve-out is not made out: an eligible approver exists and the in-band
  route has never once been exercised. Demoting the client is refused because it does not correct
  the role - it switches mandatory four-eyes off, and asks the protected party to sign away their
  own protection.

  THE RATIO. A host-boundary carve-out from an in-band control is justified only by bootstrap
  NECESSITY - that no in-band route can discharge the act - and necessity is measured on the
  record, not on the record's awkwardness. Where an eligible approver exists in fact and the
  in-band route has never been exercised, the boundary stays shut and the defect is repaired
  in-band. That another boundary command already confers more is an argument for CLOSING that
  command, never for opening a comparable one beside it, because "no worse than the last" makes
  every future widening self-justifying. Correlatively, the four-eyes ratchet is ONE-WAY: no
  control verb may reduce a tenant's active author-tier count from two to one, because that
  silently converts a mandatory independent approval into an optional one; and such a reduction
  may never be effected by asking the protected party to approve the removal of their own
  protection.

  WHAT THE COURT VERIFIED, against the pleading. The mechanism pleaded is exactly right and the
  live record proves it more precisely: the invitation raised at 08:19:12 on 2026-07-27 and
  self-approved under the exemption, the client created `member` at 08:27:05, then
  `control.user.update` to `admin` raised at 08:29:31, self-approved at 08:30:05 and executed at
  08:30:31 - at which point the client became author-tier and the exemption died. The last act
  performed under the exemption destroyed it, unannounced.

  But the central NECESSITY claim in the case file is FALSE. "Every route to a second operator
  requires an approval that requires a second operator" cannot stand beside the case file's own
  concession that the only lawful approver is the client. The court walked every gate on the
  respond path (`authorize_hitl_scope` -> `departments_for("admin", {all:true})` is None ->
  `_scope_matches` True; human actor tier; fingerprint present; assignee NULL on every live row;
  initiators and respondents disjoint; client scope `{all:true}` -> `allow=["*"]`) and found NO
  author-tier gate anywhere on it. The route to a second operator is OPEN TODAY, with no code
  change. It has never been used: `hitl_responses` held 9 rows, all the operator's, none the
  client's. This is not a deadlock; it is an unexercised route. The three expired requests are
  evidence of a 3600-second window, not of a legal impossibility.

  The case file's claim that `AUTHOR_ROLES` is "used ONLY by the exemption" is also wrong - it is
  read by `rbac.can_author()` at six verified call sites, and a second, differently-populated set
  lives in `ui/src/deck/deckMap.ts`. The load-bearing half is nonetheless correct and was verified
  independently: approver eligibility genuinely does not require author tier, because grants come
  from SCOPE, never role.

  The "narrower cure" (demotion) is the MOST destructive option on the list, not the conservative
  one: it revives the self-approval exemption, ends mandatory four-eyes on the tenant, and -
  because `control.user.update` is itself high-consequence - requires the client to approve
  stripping their own author tier and the independent approval that protects them.

  ON AUTHORITY HYGIENE. Option 2 proposed "an INV-8-class audit row". INV-8 has ZERO occurrences
  anywhere in boltrig; it is an opbox invariant living in the VJS repo. The court declined to
  adopt a condition under that name and wrote its audit directives against mechanisms it had read
  (`AuditWriter.write`, `SecurityEventWriter.write`). This is the same defect class as the C1-C9
  incident.
