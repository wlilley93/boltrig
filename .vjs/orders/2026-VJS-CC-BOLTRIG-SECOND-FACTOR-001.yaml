id: 2026-VJS-CC-BOLTRIG-SECOND-FACTOR-001
court: county
jurisdiction: default
repo_code: null
status: binding
issue: second_factor_auth
holding: |
  Option A is adopted. Boltrig adds TOTP (RFC 6238, authenticator app) plus a set of
  one-time hashed recovery codes as the second factor on the first-party login, with
  NO external dependency (TOTP verifies offline). The TOTP secret is stored SEALED
  through the credential store (encrypted, never plaintext, never audited, never
  returned after enrollment); recovery codes are stored only as hashes and each is
  single-use. The factor sits BETWEEN password-verify and session-issue (COUNTY 7): a
  user who has 2FA enabled OR whose org sets require_two_factor must pass a TOTP (or a
  recovery code) challenge before any session issues. Enrollment is offered after
  first login and is FORCED before console access when the org requires_two_factor (a
  user with an unmet requirement reaches only the enrollment surface, nothing else).
  The challenge is fail-closed (an enabled factor that fails is denied, never
  bypassed), rate-limited via the existing RateLimiter, and constant-time; every
  enroll / challenge-pass / challenge-fail / recovery-code-use / disable is audited
  keys-only. A TOTP library is a surfaced dependency. Option B (WebAuthn/passkeys) is
  a permitted later add-on, not the first factor. Option C (email/SMS OTP) is rejected
  as needing an external dependency that becomes login's availability (the reason
  magic-link was deferred in COUNTY 7). The live prod cutover stays Principal-gated.
