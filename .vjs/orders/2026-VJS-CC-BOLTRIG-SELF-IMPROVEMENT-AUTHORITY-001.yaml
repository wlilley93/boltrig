- id: D3
  actor: lexby
  must: keep_reflection_writes_going_through_the_chokepoint_memory_verb_so_the_scope_secret_and_injection_screens_always_run_on_a_lesson
  when: null
- id: D4
  actor: lexby
  must: constrain_future_eval_gated_promotion_and_selection_loops_to_competence_signals_only_promotion_changes_ranking_and_reuse_likelihood_never_execution_authority
