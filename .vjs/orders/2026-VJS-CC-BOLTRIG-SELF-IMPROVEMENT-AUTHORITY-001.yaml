runtime_summary: |
  Self-improvement raises competence, never authority. Learned/generated/reflected
  artifacts run under the SAME grant ceiling, scope, tier, and HITL gates as
  authored ones, enforced provenance-blind at the one dispatch chokepoint.
  memory.improve is reweight-only; promotion changes reuse likelihood, never
  execution authority; future eval-gated promotion and selection loops gate on
  competence only. Pinned by a machine-checked invariant. Leaving the boundary
  implicit or deferring it are rejected because the loop is already live.
