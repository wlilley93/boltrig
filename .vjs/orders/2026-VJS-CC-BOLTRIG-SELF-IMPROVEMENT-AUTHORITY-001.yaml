id: 2026-VJS-CC-BOLTRIG-SELF-IMPROVEMENT-AUTHORITY-001
court: county
jurisdiction: default
repo_code: null
status: binding
issue: self_improvement_authority_boundary
holding: |
  Option A is adopted. The self-improvement loop may raise COMPETENCE but never
  AUTHORITY. Provenance is authority-blind: a learned, generated, precreated, or
  reflected-upon artifact executes under exactly the same grant ceiling, scope,
  tier, and HITL gates as an authored one, enforced at the single dispatch
  chokepoint regardless of where the artifact came from. No self-improvement path
  may add a grant, escalate a tier, widen a scope, bypass or downgrade a HITL
  gate, or let any workflow run beyond its author's ceiling. Promotion of a
  generated workflow to learned or candidate status changes reuse likelihood and
  ranking ONLY, never the authority under which it runs. memory.improve stays
  reweight-only and may not mutate scope, grants, tier, or authority. Eval-gated
  promotion and selection loops, when built, must gate on competence metrics
  only and are forbidden from altering any authority field. The rail is enforced
  by data and the provenance-blind chokepoint, not by trust, and is entrenched by
  a machine-checked invariant. Options B (leave implicit) and C (defer) are
  rejected: the loop is already live and already reuses learned artifacts, so the
  boundary must be pinned now, before the loop is extended.
directives:
