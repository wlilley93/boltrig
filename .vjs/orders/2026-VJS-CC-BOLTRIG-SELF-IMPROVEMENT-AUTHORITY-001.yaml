- memory_improve_or_any_reflection_path_mutating_scope_grants_tier_or_authority_fields
- reading_provenance_learned_or_generated_as_an_authority_or_trust_signal_at_dispatch
- a_self_improvement_path_adding_a_grant_escalating_a_tier_or_bypassing_a_hitl_gate
