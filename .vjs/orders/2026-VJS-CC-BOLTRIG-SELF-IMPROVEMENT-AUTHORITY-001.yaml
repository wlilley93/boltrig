  actor: lexby
  must: pin_invariant_self_improvement_never_widens_authority_bound_to_tests_a_learned_or_generated_workflow_executes_under_the_callers_grant_ceiling_and_b_memory_improve_cannot_mutate_scope_or_authority_and_c_provenance_is_never_read_as_an_authority_signal
  when: after_beat6_invariants_land_to_avoid_a_yaml_collision
- id: D2
