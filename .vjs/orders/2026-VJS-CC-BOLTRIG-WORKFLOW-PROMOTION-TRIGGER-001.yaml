id: 2026-VJS-CC-BOLTRIG-WORKFLOW-PROMOTION-TRIGGER-001
court: county
jurisdiction: default
repo_code: boltrig
status: binding
issue: workflow_promotion_trigger
holding: |
  None of the four pleaded options is right, and three of them are not justiciable.

  A, B and C each answer "which trigger writes a promotion". Each is defeated by a fact the
  pleading did not establish: the VALUE HAS NO CONSUMER. `WorkflowLibrary.match` has one
  caller, `select_or_generate_workflow`, and that function has no production caller at all.
  Production never selects a workflow by intent; it selects by explicit id
  (`control.workflow.trigger`, `control.workflow.execute`, and the pump's addressed
  `workflow:<id>` target). Writing a promotion by eval completion, by a governed verb or by run
  outcome therefore all produce identical observable behaviour, namely none.

  THE RATIO. A fork about which trigger should WRITE a value is not justiciable while no
  production path READS it. Reachability is transitive and is measured to a production entry
  point: a reader that has a caller is not wired if that caller has none. Where the consumer is
  transitively unreachable every candidate producer is equally inert, the choice between them
  decides nothing, and the court refuses it. The order of work is: wire or retire the CONSUMER
  first. A producer's trigger becomes a live question only where writing the value changes
  observable behaviour.

  Corollary 1, on pleading. A submission asserting a reader "runs on every X" must prove the
  transitive chain to a production entry point. A caller count that stops at the first hop
  misstates the record, and a misstatement about reachability is not a detail: it is the whole
  question, dressed as background.

  Corollary 2, on gates. A reachability gate that accepts a name's presence in `__all__`, or in
  a package re-export, as evidence of wiring is honest on the paths it walks and cosmetic on the
  paths it does not. That is a parity defect and the repair is parity, not a waiver on the one
  instance the gate happened to catch.

  Corollary 3, on triggers. Where the value a trigger would write is a pure function of records
  the system already keeps, there is no trigger question: the value is derived and "when does it
  run" has no referent. A live product question about WHEN a value is written is a symptom that
  the value was stored where it should have been derived.

  ON THE WAIVER'S DEFERRAL. The waiver says the promoter awaits "the product decision of WHEN
  promotion runs". That is NOT the Principal's decision and this court decides it: there is no
  such decision. On the current record every answer to "when" has identical effect, so the
  question is not ripe and no decision-maker could be given material on which to answer it; and
  permanently, the eval-gated state is derivable from the eval cases and their runs, so under
  the derive-don't-store ratio promotion is not an event with a trigger at all. Routing it to
  the Principal would have handed them an unanswerable question and bought another expiry cycle.

  There IS a genuine Principal-owned question, and it is a different one nobody asked: should
  the pump's routing path consult the workflow library BY INTENT before routing an unaddressed
  item to the chief of staff? That changes what runs for a tenant and no record establishes a
  demand for it. That one is the Principal's, it is D8, and it is the real blocker the waiver
  mis-described.

  Options A, B and C are REFUSED, not weighed. Option D is ADOPTED IN PART, on different
  reasoning and extended: retire the half that is wrong-shaped and would not be reused on any
  rebuild, keep the half that is right-shaped and one call away from live under a waiver whose
  reason is true, and repair the gate that let a whole inert loop present itself as a live
  control. The cut runs through `signals.py`: `harvest_reuse_signal` is wired, has a live
  consumer, and STAYS.

  The pleading is corrected in three places. Its claim that the read side "runs on every
  workflow selection" is false (the chain is dead one hop up). Its claim that the only platform
  keys any reader looks up are `workflows` and `admin` is false (`eval`, `spawner`, `status` and
  `readiness` are all read; `promoter` is the one key with no reader, which is the point it
  needed and did not make, and which the waiver it cites states correctly). And COUNTY 5's
  stated ground that "the loop is already live and already reuses learned artifacts" is not true
  on today's record: `GENERATED_WORKFLOW_KEY` is written by nothing, so `_maybe_learn` cannot
  fire either. That is a mistaken fact and not ignorance of binding law, so COUNTY 5 is not per
  incuriam and its ratio stands untouched.
