runtime_summary: |
  The promotion subsystem's write side is deleted and its read side follows, because the
  consumer was transitively dead: `match` is reachable only from `select_or_generate_workflow`,
  which nothing in production calls. `harvest_reuse_signal` is wired and stays. Two gate repairs
  land with it: the unwired-claims FUNCTION rule stops treating a re-export as wiring, and a new
  transitive-reachability check measures to an enumerated root set rather than to the first hop.
  Waivers now carry a `blocker`, so a deferral names the caller or the record it waits on. If
  promotion is ever rebuilt, the eval-gated state is DERIVED from the eval cases and their runs,
  pinned by the definition digest: no table, no writer, no trigger.
