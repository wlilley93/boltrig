id: LOG-2026-07-27-130917
time: 2026-07-27T13:09:17.317471875+00:00
actor: lexby
kind: fix
issue: audit-schema-error-diagnostics
decision: Add contains_identity as a SECOND predicate consulted only by the audit scrubber, redact identity spans in place, and bring dict keys within the scrub
basis:
- '[2026] VJS-COUNTY variation of CP3 on SUBMISSION-2026-07-27-124116'
risk: medium
reversibility: easy
court_required: false
why: contains_secret has six callers and only one is the audit scrubber; at the other five a truthy answer REFUSES. Widening it would have made a memory recall silently drop a stored memory mentioning a host IP, and refused a phase result carrying a 13-digit epoch timestamp (which credit_card matches). A consumer had already noticed and patched around it locally. Secrets taint their context so still digest whole; identity data does not, so the span is cut and the rest left legible, because whole-value digesting on a false positive defeats the order it serves. Each guard proven red by seeding the exact change it prevents.
