id: SUBMISSION-2026-07-29-083653
court_requested: county
jurisdiction: default
question: May a development-posture tenant dispatch high-consequence verbs without a synchronous human veto, and by what mechanism?
facts: |
  # Unattended dispatch on a tenant in development posture

  Own motion, on a Principal instruction that development proceed unattended. The operator-seat court
  (2026-07-28) refused a carve-out on a LIVE CLIENT tenant with an eligible, untried approver; a
  tenant with no client was not before it.

  ## Facts

  F1. The veto is the CONSEQUENCE gate, not four-eyes: `dispatch` gates on
  `consequence == HIGH or verb in blocking_verbs`, and every `control.*` spec defaults
  `consequence="high"` (`control_specs.py:36`).

  F2. The sole-author exemption does not give unattended operation. `_sole_active_author`
  (`hitl_response_auth.py:124-139`) lifts INDEPENDENCE, but `approval_response_block` still
  refuses a non-human ("only a human may approve"). It removes the second human, never the
  human, so a HIGH verb still parks.

  F3. `[2026] VJS-APPEAL 1`: LOW verbs admit "with no synchronous human veto (by calibration,
  not defect)"; "to add a LOW-class veto, recalibrate as data (consequence: HIGH /
  blocking_verbs), never a codex-side gate." It addresses ADDING a veto, not removing one.

  F4. A posture-gated relaxation is already approved. `[2026] VJS-CC-VJS 2` admits the trusted
  Codex runtime under (a) a single trusted operator - dev auth, no real ingress - or (b)
  kernel-attested per-cell uids; explicit flag, off by default; refuses under ANY production
  signal (`codex_trusted_wall.py:49-97`).

  F5. Candidate tenant `app.boltrig.io` has ONE active author-tier user, but runs
  `BOLTRIG_AUTH_MODE=session`, so `real_ingress` is true and F4's posture (a) would REFUSE it.

  F6. Approval is not the only blocker, and the other half is not law: both kernels use
  `build_session_resolver` (cookie only, `sessions.py:268-273`), never `resolve_pat_principal`,
  so machine invocation is impossible regardless.

  F7. Classical Visas (two authors, client data) is untouched by this matter.

  CORRECTION, entered by the advocate before any bench read this file. F6 IS FALSE and F2 is
  materially incomplete. Measured on `app.boltrig.io` 2026-07-29: `principal` (`app.py:322-333`)
  tries `looks_like_pat` FIRST and only falls through to the session resolver, so a PAT
  authenticates (`GET /v1/hitl` -> 200). `resolve_pat_principal` sets `actor_tier="human"`
  (`tokens.py:145`), so a PAT satisfies the human requirement in F2. The full loop closes
  headlessly on a sole-author tenant: `control.config.upsert` -> 202 `pending_human`, then
  `POST /v1/hitl/{id}/respond` -> 200 `{"sole_author_exemption": true}`. The advocate's earlier
  401s were operator error - a captured log line passed as a bearer, which failed the
  `boltrig_pat_` prefix test and fell through to the session resolver ("no session").

  What this leaves for decision is therefore NARROWER than pleaded: unattended operation
  already works on a sole-author tenant via a two-call approve-then-invoke round trip, needing
  no ruling. The live question is only whether the ROUND TRIP itself may be removed - i.e.
  Option B's downward calibration - and whether any posture may do so. Options C and D may now
  be unnecessary to reach.

  ## A: refuse; posture is not a lawful ground

  *For:* no new surface; F4's wall protects an attestation gap, not an approval; posture is
  self-declared, and self-declaration is what independent approval exists to distrust.
  *Against:* no unattended path survives; treats a tenant with no client identically to one
  with a client.

  ## B: calibration only, no new law

  A tenant sets `consequence`/`blocking_verbs` as manifest data, including downward.

  *For:* the lever precedent names; manifest data is already the policy seam; reversible.
  *Against:* F3's ratio addressed adding, so this may exceed it; no boundary, so a tenant may
  calibrate down in production.

  ## C: a declared development posture, modelled on F4

  Suspends the synchronous veto for a bounded verb set on a proved test: no non-operator users,
  no client data, no production signal.

  *For:* reuses a mechanism this court approved for a comparable relaxation, production refusal
  included; machine-checked, not asserted.
  *Against:* a second wall to maintain; by F5 the candidate tenant fails the nearest test; "no
  client data" is cheap to assert, hard to prove.

  ## D: a non-human approver under that posture

  *For:* delivers it directly; actor tier is already modelled.
  *Against:* consistently refused; an agent seat already cleared an irreversible verb on
  standing here; changes WHO approves, not WHETHER.

  ## E: the Principal's own proposal, entered verbatim

  A per-tenant flag only a SUPERADMIN may set. While on, the operator may perform every
  governed act on that tenant alone; no other user need do anything. Entered because a
  Principal instruction conflicting with precedent is itself a trigger to convene (S-2), and
  the bench should weigh what was actually proposed rather than the advocate's paraphrase.

  *For:* it is the smallest thing that delivers the stated need; superadmin is already the
  tenant's highest tier, so it grants no authority that tier lacks; per-tenant, so it cannot
  leak across the fleet; explicit and off by default, like F4's flag.
  *Against:* on this tenant the superadmin IS the party four-eyes constrains, so a
  superadmin-settable switch lets the constrained party remove their own constraint - the mirror
  of the demotion limb the operator-seat court refused, and the reason F4 pairs its flag with an
  OBSERVED production signal the operator cannot assert away. It also turns on intent ("we are
  in development") which no mechanism can verify, while the record shows an active non-operator
  admin and client-owned data on the tenant.

  ## SUPERVENING FACT, entered before any bench read this file

  Since filing, the Principal instructed that the flag be built, reaffirmed after the advocate
  put the objections, and directed the advocate to stop arguing it. It WAS built and it is
  LIVE: boltrig 881a9df (v0.4.25) adds a per-tenant `development_posture`, and Classical Visas
  declares it (expires 2026-08-12). It has been RELIED ON ONCE - to self-approve
  `control.adapter.activate`, which re-registered the opbox adapter from 99 verbs to 443 and
  corrected a stale schema behind 42% of that tenant's tool-call failures.

  So the court is not asked whether this MAY be done. It is asked whether what was done is
  lawful, and on what conditions it may stand. The advocate records that squarely rather than
  letting a bench rule in ignorance of it, which would be per incuriam and void.

  As shipped it lifts INDEPENDENCE only: it never admits a non-human approver, never lifts the
  grant check, reaches `control.*` only, lowers no consequence, refuses under any production
  signal, requires an expiry, admits superadmin only, and records every reliance on both the
  audit chain and the tamper-evident security stream.

  The advocate discloses one fact adverse to the posture as applied: Classical Visas returns NO
  production signal despite serving a real client on a public domain, so the observed condition
  admits it because an environment variable is unset, not because the tenant is in development.

  No option is preferred. The advocate held a view and withheld it. Option E is the Principal's,
  reproduced without endorsement.
