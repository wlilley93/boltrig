# Candidate decision-0021 route topology. Worker is the task surface at / and
# the independently built Operator SPA remains reachable at /operator/.

resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;
    # Preserve the browser-visible host/port behind local preview, Docker port
    # publishing and reverse proxies. The /operator redirect remains relative.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:" always;

    location /v1/ {
        set $kernel_api http://kernel:8000;
        proxy_pass $kernel_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location = /healthz {
        set $kernel_health http://kernel:8000;
        proxy_pass $kernel_health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /readyz {
        set $kernel_ready http://kernel:8000;
        proxy_pass $kernel_ready;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional decision-0021 media bridge. Dynamic resolution keeps Worker
    # healthy when the profile-gated channel gateway is intentionally absent.
    location /voice/ {
        set $voice_gateway http://channel-gateway:8091;
        rewrite ^/voice/(.*)$ /$1 break;
        proxy_pass $voice_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location = /operator {
        return 308 /operator/;
    }

    location /operator/ {
        try_files $uri $uri/ /operator/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
