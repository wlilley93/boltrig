# Worker is the only first-party browser surface.

resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;
    # Preserve the browser-visible host/port behind local preview, Docker port
    # publishing and reverse proxies.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:" always;

    location /v1/ {
        # The kernel accepts uploads up to its MAX_UPLOAD_BYTES (25 MiB);
        # nginx's compiled-in 1m default would 413 them before the kernel
        # ever saw the request.
        client_max_body_size 26m;
        set $kernel_api http://kernel:8000;
        proxy_pass $kernel_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location = /healthz {
        set $kernel_health http://kernel:8000;
        proxy_pass $kernel_health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /readyz {
        set $kernel_ready http://kernel:8000;
        proxy_pass $kernel_ready;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional decision-0021 media bridge. Dynamic resolution keeps Worker
    # healthy when the profile-gated channel gateway is intentionally absent.
    location /voice/ {
        set $voice_gateway http://channel-gateway:8091;
        rewrite ^/voice/(.*)$ /$1 break;
        proxy_pass $voice_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Hashed build output is content-addressed: cache hard, and answer a
    # missing chunk with 404 rather than falling through to index.html,
    # which strict module-MIME would refuse and blank the app.
    # `expires` rather than `add_header Cache-Control` so the inherited
    # security headers above are not dropped in these locations.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # The retired Operator is not a route in the Worker application. Keep the
    # SPA fallback from making the old path appear to work by accident.
    location = /operator { return 404; }
    location ^~ /operator/ { return 404; }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
