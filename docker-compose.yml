# Boltrig - one self-hostable stack (SRS S11.1).
#
# The same first-party images run in every environment; only .env and the fleet
# manifest change between them (P7, NFR-PORT-01). Bring it up with:
#
#   cp .env.example .env                 # then edit secrets
#   cp manifest.example.yaml manifest.yaml
#   docker compose up -d                 # add: --profile gateway for Bifrost,
#                                        #      --profile local for on-box inference
#
# Services:
#   postgres          durable state (SRS S6 / boltrig/store/schema.sql)
#   redis             shared rate-limit counters and the bounded live
#                     conversation relay. REDIS_URL is required in production.
#   kernel            the dispatch chokepoint HTTP surface (P2)
#   fleet-worker      the fleet runtime + durable workers (Epics F/G)
#   hatchet-engine    optional durable execution engine (US-FLT-06, seam)
#   hatchet-dashboard optional Hatchet web console (seam)
#   ui                the React console: Router, Kanban, Approvals (Epic L)
#   bifrost           optional model cost/cache gateway (profile: gateway)
#   local-model       optional on-box inference for sensitive data (profile: local)

# Container runtime hardening (INF-01): our first-party app containers run
# read-only, drop all Linux capabilities, forbid privilege escalation, and are
# resource-capped. The app writes nothing to disk (logs -> stdout); a tmpfs backs
# /tmp. Merged into the kernel / fleet-worker / pi_sidecar services below.
x-app-hardening: &app-hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - "no-new-privileges:true"
  pids_limit: 512
  mem_limit: 1g

services:
  postgres:
    # pgvector/pgvector:pg16 = stock Postgres 16 + the `vector` extension, so the
    # native vector Memory Engine keeps its store in this one Postgres (no separate
    # vector DB). Drop-in for postgres:16; same data dir, same env.
    # IAC-002: pinned to tag + digest to prevent supply-chain drift.
    image: pgvector/pgvector:pg16@sha256:131dcf7ff6a900545df8e7e092c270aa8c6db2f2c818e408cb45ec21316b74e6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-boltrig}
      # M9 (SEC-69): no baked default credential. The stack refuses to start
      # unless POSTGRES_PASSWORD is set (compose required-var form). Generate a
      # strong value and put it in .env - see .env.example.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-boltrig}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # First-boot schema load (idempotent; CREATE TABLE IF NOT EXISTS).
      # Production schema changes go through `make migrate` (alembic).
      - ./boltrig/store/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER:-boltrig} -d $${POSTGRES_DB:-boltrig}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    # IAC-002: pinned to tag + digest.
    image: redis:7@sha256:b2b95679e3b46fb51864949ed25ea976fc3a6bcc00a40a1bc00d568cb2822e50
    restart: unless-stopped
    # AOF preserves the bounded relay/cursors and shared counter state across a
    # Redis container restart. External Redis deployments must provide
    # equivalent persistence and availability.
    command: ["redis-server", "--save", "", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  kernel:
    build:
      context: .
      dockerfile: deploy/kernel.Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    image: boltrig/kernel:0.1.0
    restart: unless-stopped
    <<: *app-hardening
    # [2026] VJS-CC-VJS 7 J1/J11. Per-cell uids, and the VERIFIED reason uid 0 is
    # required, recorded here so the necessity is auditable and revisitable rather
    # than folklore: a NON-ROOT container cannot hold CAP_SETUID at all. Under
    # --user 10001 --cap-add SETUID the permitted set is EMPTY and only the
    # bounding set survives, so a uid-10001 supervisor that setuids and then drops
    # is not merely unsafe, it is unavailable at the runtime. The court found this
    # itself and it supplies the necessity my own pleading failed to establish.
    #
    # uid 0 here is NOT the API. scripts/kernel-entrypoint.py forks a minimal
    # spawner that alone keeps these capabilities, then drops the API to 10001
    # with an empty permitted set and proves it from /proc before serving. J3
    # forbids any other arrangement. CAP_CHOWN is REFUSED and unnecessary: the
    # per-slot tmpfs mounts above are created already owned by their cell uid.
    #
    # ENACTED. The J9 two-cell adversarial gate passed on the built image: hostile
    # cell A at uid 20001, holding full write access to everything its uid can
    # reach, could not rewrite, append to, read, unlink, rename over, chmod or even
    # list cell B's config.toml at uid 20002, and B verified its own auth.command
    # survived intact. J7 passed too: a cell cannot setuid back to the spawner,
    # to the API, or sideways to a sibling, and cannot exec a setuid binary
    # (there are none left; the image strips them under J4).
    user: "0:0"
    cap_add:
      - SETUID
      - SETGID
    # [2026] VJS-CC-VJS 5 G2: the per-cell auth helper no longer lives in the cell
    # root (it is baked root-owned at /opt/boltrig/codex/model_auth_helper on the
    # read-only rootfs), so this tmpfs no longer needs exec. Reverting to noexec
    # removes the whole "drop a script in a cell root and run it" class. It does
    # NOT close the config.toml vector (auth.command can still name an existing
    # interpreter), which is why concurrent multi-cell is refused at runtime.
    tmpfs:
      - /tmp
      # noexec is written EXPLICITLY ([2026] VJS-CC-VJS 6 H11). It was previously
      # pleaded as an enacted control while resting on a runtime default, which is
      # exactly the kind of unearned claim the court has now twice corrected. A
      # control we rely on in argument has to be stated in the file.
      # 0711 (Gap 5): a cell runs at its own uid (2000N) and must TRAVERSE this parent
      # to reach its own slot below. 0711 grants traverse (--x) without list (r): a
      # cell reaches a KNOWN slot path but cannot enumerate the set, and each slot is
      # 0700 owned by its own uid so a cell is refused EACCES on any sibling's. Under
      # per-cell uids validate_cell_layout runs with require_local_ownership=False, so
      # it no longer asserts this parent's mode (the cell-uid tree is verified spawner-
      # side); the in-process path owns its own 0700 cells/<id> subtree regardless.
      - /var/lib/boltrig/codex-cells:mode=0711,uid=10001,gid=10001,noexec,nosuid,nodev
      # [2026] VJS-CC-VJS 7 J2: one slot per cell, each created by the KERNEL
      # already owned by that cell's uid. This is what replaces the CAP_CHOWN the
      # court REFUSED: nothing is ever given away, so nothing needs chowning, and
      # a cell that has dropped to its own uid is refused EACCES on any sibling's
      # slot. The uids must match cell_slots.slot_for_index; a test holds them in
      # step. Inert until the capability is granted, since without per-cell uids
      # every cell is still 10001 and simply uses the shared root above.
      - /var/lib/boltrig/codex-cells/slot-0:mode=0700,uid=20001,gid=20001,noexec,nosuid,nodev
      - /var/lib/boltrig/codex-cells/slot-1:mode=0700,uid=20002,gid=20002,noexec,nosuid,nodev
      - /var/lib/boltrig/codex-cells/slot-2:mode=0700,uid=20003,gid=20003,noexec,nosuid,nodev
      - /var/lib/boltrig/codex-cells/slot-3:mode=0700,uid=20004,gid=20004,noexec,nosuid,nodev
    command: ["uvicorn", "boltrig.api.asgi:app", "--host", "0.0.0.0", "--port", "8000"]
    # Local/operator runs keep the conventional .env default. Validation and CI
    # can point at the checked non-secret fixture without creating an ignored
    # file in a clean checkout.
    env_file: ${BOLTRIG_ENV_FILE:-.env}
    environment:
      BOLTRIG_HERDR_HOME: ${BOLTRIG_HERDR_HOME:-/var/lib/boltrig/herdr}
      BOLTRIG_KNOWLEDGE_VAULT: ${BOLTRIG_KNOWLEDGE_VAULT:-/var/lib/boltrig/knowledge}
      BOLTRIG_COGNEE_ROOT: ${BOLTRIG_COGNEE_ROOT:-/var/lib/boltrig/cognee}
      BOLTRIG_BACKUP_HEALTH_FILE: /run/boltrig-backup-health/last-success
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-86400}
      BACKUP_HEALTH_GRACE: ${BACKUP_HEALTH_GRACE:-3600}
    # On both the app network and the sandbox, so the Pi gateway can reach the
    # MCP face (sandbox) while the kernel keeps its normal connectivity (default).
    networks:
      - default
      - sandbox
    ports:
      - "${KERNEL_PORT:-8000}:8000"
    volumes:
      - ./manifest.yaml:/app/manifest.yaml:ro
      - ./libraries:/app/libraries:ro
      # Stack-owned Herdr state only; never bind a developer user's ~/.config/herdr.
      - herdr_data:/var/lib/boltrig/herdr
      # Canonical originals and rebuildable Cognee state are persisted separately.
      - knowledge_data:/var/lib/boltrig/knowledge
      - cognee_data:/var/lib/boltrig/cognee
      # Safe epoch marker only. The kernel cannot read backup artifacts.
      - backup_health:/run/boltrig-backup-health:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # The container health signal consults READINESS, not liveness. It probed
    # /healthz until 2026-07-26, and /healthz knows nothing about the schema: on
    # 2026-07-25 a client tenant sat at /readyz 503 on an unapplied migration head
    # for about forty minutes while `docker ps` reported this container healthy the
    # whole time. Nothing in the orchestration layer could see the outage.
    #
    # Rehearsed on dev before the change, rather than argued:
    #   * schema head forced to 0037 -> health UNHEALTHY, while /healthz kept
    #     answering 200. That is the incident, caught.
    #   * hatchet-engine stopped      -> health UNHEALTHY. Real new coupling, and
    #     accepted: durable execution is a REQUIRED readiness check, so a kernel
    #     without it is genuinely not ready. Cost: channel-gateway and pi-sidecar
    #     carry depends_on: kernel: service_healthy, so they will not START during
    #     a hatchet outage. A running one is not restarted - compose does not act
    #     on unhealthy by itself.
    #   * fleet-worker stopped        -> NO effect. The stack-tool receipt is
    #     cached in Redis with a TTL, so a short worker outage does not flip it.
    #     This was the coupling the deferral was written around; it is not real.
    #
    # start_period is 60s because readiness waits on postgres, redis, the control
    # plane and the hatchet probe, which is a slower true than a liveness ping.
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')" || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  fleet-worker:
    build:
      context: .
      dockerfile: deploy/fleet.Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    image: boltrig/fleet:0.1.0
    restart: unless-stopped
    <<: *app-hardening
    command: ["python", "-m", "boltrig.api.worker"]
    env_file: ${BOLTRIG_ENV_FILE:-.env}
    environment:
      BOLTRIG_OPENCODE_HOME: ${BOLTRIG_OPENCODE_HOME:-/var/lib/boltrig/opencode}
      BOLTRIG_BROWSER_CLI_HOME: ${BOLTRIG_BROWSER_CLI_HOME:-/var/lib/boltrig/browser-cli}
      BOLTRIG_BROWSER_CLI_BIN: ${BOLTRIG_BROWSER_CLI_BIN:-/usr/local/bin/browser-use}
      # Reflection is the ONLY automatic memory writer in the stack: fleet/pump.py
      # calls memory.remember with a distilled lesson when a work item reaches a
      # terminal status, under the bounded REFLECTION_GRANTS seat (exactly that one
      # verb). It reads BOLTRIG_REFLECT, and until now that variable was not plumbed
      # into this service at all, so it could not be set without editing this file -
      # and it was set nowhere. Measured 2026-07-30: 90 terminal work items on the
      # beelink and 69 on the CV tenant, and ZERO memory_items on either. A memory
      # subsystem that never records anything looks identical to one switched off.
      #
      # Defaulted OFF deliberately. Reflection RETAINS derived content (manifest
      # memory.retention_days is 365), so switching it on for a tenant is a data
      # decision, not a default. The manifest already declares memory.enabled per
      # tenant; that declaration ought to drive this rather than a separate env var
      # nobody sets, and that mismatch is filed rather than papered over here.
      BOLTRIG_REFLECT: ${BOLTRIG_REFLECT:-}
    volumes:
      - ./manifest.yaml:/app/manifest.yaml:ro
      - ./libraries:/app/libraries:ro
      # Stack-owned OpenCode state only; never bind a developer user's ~/.config/opencode.
      - opencode_data:/var/lib/boltrig/opencode
      # Stack-owned Browser Use CLI state only; never bind a developer browser profile.
      - browser_cli_data:/var/lib/boltrig/browser-cli
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # The worker serves no HTTP, so this cannot be a URL probe - but it does
    # publish a signed, short-lived receipt naming which of its tools probed ok,
    # and the kernel's /readyz already consumes it. `fleet-health` reads that
    # receipt back, so a green here means the heartbeat loop ran within the TTL
    # AND the tools are sound. It replaced `python -c "import boltrig"`, which
    # proved an interpreter could import a module and could not go red for any
    # outage that mattered.
    #
    # It exits 0 saying NOT CHECKED when the heartbeat is legitimately disabled
    # (no REDIS_URL, or a placeholder audit key - both are the designed dev
    # posture). Failing there would paint every offline deployment permanently
    # red, which is how a signal gets ignored. BOLTRIG_FLEET_HEALTH_REQUIRE_RECEIPT
    # =1 makes it fatal for a deployment that considers the heartbeat mandatory.
    healthcheck:
      test:
        - CMD-SHELL
        - python -m boltrig.api.cli fleet-health || exit 1
      interval: 60s
      timeout: 10s
      retries: 3
      # Measured on jellytot-prod, not guessed: container start 09:23:47 ->
      # "delegation pump live" 09:24:23 is 36s of kernel build and org assembly
      # before the heartbeat task is even created, and the first receipt lands a
      # probe-and-publish cycle after that. 20s would have had the probe failing
      # for the whole of a normal boot.
      start_period: 90s

  hatchet-engine:
    # Optional durable execution (US-FLT-06). The kernel and fleet run WITHOUT
    # it (P9 degrade); enable it to get durable resume of paused/long runs.
    # hatchet-lite bundles the engine, API and gRPC. Pin a digest for air-gap.
    # IAC-002: pinned to digest; the :latest tag is mutable.
    image: ghcr.io/hatchet-dev/hatchet/hatchet-lite@sha256:30ff826bdc65efc15a46df61e6d16dcc52f76cf2cf2693e848c6789e2b48718f
    restart: unless-stopped
    environment:
      # M9 (SEC-69): interpolate the DB credential instead of a literal boltrig:boltrig.
      DATABASE_URL: ${HATCHET_DATABASE_URL:-postgresql://${POSTGRES_USER:-boltrig}:${POSTGRES_PASSWORD}@postgres:5432/hatchet?sslmode=disable}
      SERVER_GRPC_BROADCAST_ADDRESS: hatchet-engine:7077
      SERVER_GRPC_BIND_ADDRESS: 0.0.0.0
      # hatchet-lite binds gRPC on 7070 by default; pin the bind port to the
      # broadcast + published port or every SDK connect is reset by the proxy.
      SERVER_GRPC_PORT: "7077"
      # hatchet-lite required auth/session config (it refuses to boot without a
      # cookie domain). The engine is internal (loopback / compose network only),
      # so an insecure cookie over the private network is fine.
      SERVER_AUTH_COOKIE_DOMAIN: ${HATCHET_COOKIE_DOMAIN:-localhost}
      SERVER_AUTH_COOKIE_INSECURE: "t"
      SERVER_AUTH_SET_EMAIL_VERIFIED: "t"
      SERVER_GRPC_INSECURE: "t"
      SERVER_URL: ${HATCHET_SERVER_URL:-http://localhost:8888}
    # M8 (SEC-69): bind the published ports to loopback so the plaintext gRPC
    # control plane (SERVER_GRPC_INSECURE) and API are NOT on all interfaces by
    # default - on a multi-homed host 0.0.0.0 would make them LAN-reachable in
    # cleartext. The secure overlay drops these host ports entirely (ports: []).
    ports:
      - "127.0.0.1:${HATCHET_GRPC_PORT:-7077}:7077"
      - "127.0.0.1:${HATCHET_API_PORT:-8888}:8888"
    depends_on:
      postgres:
        condition: service_healthy

  hatchet-dashboard:
    # Optional Hatchet web console (seam). Proxies to the engine API.
    # IAC-002: pinned to digest; the :latest tag is mutable.
    image: ghcr.io/hatchet-dev/hatchet/hatchet-dashboard@sha256:326774d08b1ce9123482cdb0ff24a4c0eb54b112d27207789dffb6f82d2667e9
    restart: unless-stopped
    environment:
      SERVER_URL: http://hatchet-engine:8888
    # M8 (SEC-69): the dashboard is UNAUTHENTICATED - keep it off 0.0.0.0. Bind to
    # loopback in the base stack; the secure overlay drops the host port entirely.
    ports:
      - "127.0.0.1:${HATCHET_DASHBOARD_PORT:-8889}:80"
    depends_on:
      - hatchet-engine

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
      secrets:
        # Token-bearing .npmrc so `pnpm install` can read @wlilley93/boltrig-web-sdk
        # (the shared UI-SDK) from GitHub Packages, which requires auth even for a
        # public package. Only the CENTRAL build needs this; release/demo overlays
        # `build: !reset null` and pull the pinned image, so tenants never build.
        - gh_npmrc
    image: boltrig/ui:0.1.0
    restart: unless-stopped
    ports:
      - "${UI_PORT:-8080}:80"
    depends_on:
      - kernel
    healthcheck:
      # 127.0.0.1 (not "localhost"): nginx binds IPv4 0.0.0.0:80, but localhost
      # can resolve to IPv6 ::1 first in the container -> connection refused.
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1/index.html || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker-ui:
    # Decision 0021 candidate topology. This remains explicitly profile-gated
    # until parity, connector, device, call and accessibility acceptance pass.
    # It serves Worker at / and the maintained Operator at /operator/.
    profiles: ["worker"]
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      secrets:
        - gh_npmrc
    image: boltrig/worker-ui:0.1.0
    restart: unless-stopped
    networks:
      - default
      - sandbox
    ports:
      - "${WORKER_PORT:-8082}:80"
    depends_on:
      - kernel
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1/index.html && wget -q --spider http://127.0.0.1/operator/index.html || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  bifrost:
    # The model gateway (Pi runtime spec S4.2, the cost/cache layer in front of
    # providers). Bifrost is OpenAI-compatible on :8080, so the kernel's
    # model-gateway seam (BOLTRIG_MODEL_GATEWAY_URL) points standard conversation
    # traffic here and it stays warm per conversation (SEC-47). Sensitive data is
    # never routed through it (residency) - that goes to local-model.
    #
    # Profile-gated like local-model: bring it up with
    #   docker compose --profile gateway up -d
    # then set BOLTRIG_MODEL_GATEWAY_URL=http://bifrost:8080/v1 in .env and configure
    # provider keys in the Bifrost web UI at http://localhost:${BIFROST_PORT:-8081}
    # (keys + running it are operator-supplied; the seam is inert until the URL is
    # set, so the default stack is unaffected).
    profiles: ["gateway"]
    # IAC-002: pinned to digest; the :latest tag is mutable.
    image: maximhq/bifrost@sha256:c4de3a1d6bd2f9b8b0b8f508deaaf0337a793603d2b84b61138cdb35f94a4318
    restart: unless-stopped
    networks:
      - default
      - sandbox
    ports:
      # Loopback-only: provider keys/routing live behind this admin/API surface.
      # Pi reaches the service over the sandbox network at bifrost:8080.
      - "127.0.0.1:${BIFROST_PORT:-8081}:8080"
    volumes:
      # Bifrost persists its config (providers, routing, cache) here; no config
      # file is required - it is configured via the web UI / API.
      - bifrost_data:/app/data

  local-model:
    # Optional on-box inference for air-gapped / sensitive-classified data
    # (SEC-12, the manifest sensitive_endpoint). OpenAI-compatible on :8000.
    # Enable with: docker compose --profile local up -d
    profiles: ["local"]
    # IAC-002: pinned to a stable tag + digest. The default :latest tag is mutable.
    image: vllm/vllm-openai:v0.24.0-ubuntu2404@sha256:bfdefe75b5c3fb83f4f0fcaae8f39fac87941cbadb05cd2203f44a1689236c71
    restart: unless-stopped
    networks:
      - default
      - sandbox
    command:
      - "--model"
      - "${LOCAL_MODEL:-Qwen/Qwen2.5-7B-Instruct}"
      - "--port"
      - "8000"
    ports:
      # The local sensitive-data model has no authenticated public surface. Keep
      # the dev convenience port on loopback; the secure overlay removes it.
      - "127.0.0.1:${LOCAL_MODEL_PORT:-8001}:8000"
    volumes:
      # Mount a local model cache so air-gapped boxes never reach the internet.
      - ${LOCAL_MODEL_CACHE:-./.models}:/root/.cache/huggingface
    ipc: host
    # GPU is optional. On a CPU-only box, swap this image for an Ollama service.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]

  channel-gateway:
    # Decision 0003, Phase 2: the severed terminator for the socket channel
    # class (Slack/Discord/Telegram/WhatsApp/Signal + the reference generic
    # adapter). Profile-gated: it is inert without a scoped gateway token, so
    # bring it up deliberately with
    #   docker compose --profile channels up -d
    # after minting a run-scoped token in Worker's channel detail. Prefer a
    # read-only mounted CHANNEL_GATEWAY_TOKEN_FILE so rotation can be loaded
    # without restarting; CHANNEL_GATEWAY_TOKEN remains restart-only.
    #
    # Sandboxed like the pi_sidecar (conditions 2 + 7): it sits on the
    # `sandbox` network ONLY - it reaches the kernel intake but NOT
    # postgres/redis. Egress to platform endpoints is allow-listed
    # (CHANNEL_GATEWAY_EGRESS_ALLOW); the secure overlay's internal sandbox
    # removes arbitrary internet egress, so in that posture platform traffic
    # must route via an allow-list proxy. It owns no credential authority:
    # the short-lived token is injected and provider credentials are resolved
    # into memory only after the durable per-channel owner lease is won.
    profiles: ["channels"]
    networks:
      - sandbox
    <<: *app-hardening
    build:
      context: ./services/channel_gateway
      dockerfile: Dockerfile
    image: boltrig/channel-gateway:0.1.0
    restart: unless-stopped
    environment:
      BOLTRIG_KERNEL_URL: ${CHANNEL_GATEWAY_KERNEL_URL:-http://kernel:8000}
      # Mutually exclusive token sources. The file path must be supplied by a
      # deployment overlay that also mounts it read-only into this container.
      CHANNEL_GATEWAY_TOKEN: ${CHANNEL_GATEWAY_TOKEN:-}
      CHANNEL_GATEWAY_TOKEN_FILE: ${CHANNEL_GATEWAY_TOKEN_FILE:-}
      # Development compatibility only; production refuses a static snapshot
      # so Worker-authored kernel desired state remains the sole authority.
      CHANNEL_GATEWAY_CHANNELS: ${CHANNEL_GATEWAY_CHANNELS:-}
      CHANNEL_GATEWAY_RECONCILE_SECONDS: ${CHANNEL_GATEWAY_RECONCILE_SECONDS:-10}
      CHANNEL_GATEWAY_EGRESS_ALLOW: ${CHANNEL_GATEWAY_EGRESS_ALLOW:-kernel}
      CHANNEL_GATEWAY_MAX_BROWSER_CALLS: ${CHANNEL_GATEWAY_MAX_BROWSER_CALLS:-8}
      BOLTRIG_ENV: ${BOLTRIG_ENV:-}
      BOLTRIG_PRODUCTION: ${BOLTRIG_PRODUCTION:-}
    expose:
      - "8091"
    depends_on:
      kernel:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8091/ready')" || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  signal-cli:
    # The Signal sibling daemon for the channel gateway's signal adapter
    # (decision 0003): signal-cli holds the registered account keys and
    # terminates the Signal protocol; the gateway's signal adapter speaks
    # JSON-RPC (outbound) + SSE (inbound) to it and dials NO other host for
    # Signal - allow `signal-cli` in CHANNEL_GATEWAY_EGRESS_ALLOW. Profile-
    # gated with the gateway itself:
    #   docker compose --profile channels up -d
    # Register/link the account into the named volume FIRST (per the image's
    # docs, e.g. `docker compose run --rm signal-cli ... register`); the daemon
    # is inert without one. The account NUMBER reaches the adapter via the
    # Worker-authored channel provider config - it is never written here.
    # Third-party image, so the first-party hardening anchor does not apply;
    # pinned by tag + digest like every other third-party image (IAC).
    profiles: ["channels"]
    networks:
      - sandbox
    image: bbernhard/signal-cli-rest-api:0.99@sha256:96578363477d97cb1d8da303791b2ad686b374a255fce4d78c7c6f00ef56cba8
    restart: unless-stopped
    environment:
      # json-rpc mode: POST /api/v1/rpc + SSE /api/v1/events on :8080
      MODE: json-rpc
    volumes:
      - signal_cli_data:/home/.local/share/signal-cli
    expose:
      - "8080"

  whatsapp-bridge:
    # WhatsApp via Baileys (decision 0003, Phase 2): the Node bridge is a
    # sibling of the channel gateway (condition 9 - the Baileys SDK lives in
    # THIS image, never the kernel's or the Python gateway's). Derived from the
    # MIT-licensed Hermes bridge (Copyright (c) 2025 Nous Research; see
    # services/channel_gateway/whatsapp_bridge/LICENSE.md) with the Hermes
    # allowlist/self-chat POLICY stripped - who-may-talk is the kernel's
    # binding rows (condition 2). Profile-gated with the gateway:
    #   docker compose --profile channels up -d
    #
    # The bridge terminates WhatsApp's E2EE and holds the session credentials
    # on the whatsapp-session volume - treat that volume like a credential.
    #
    # Pairing (one-off, before first up) - scan the QR in WhatsApp >
    # Linked devices:
    #   docker compose --profile channels run --rm -it whatsapp-bridge \
    #     node bridge.js --pair-only --session /data
    profiles: ["channels"]
    networks:
      - sandbox
    <<: *app-hardening
    build:
      context: ./services/channel_gateway/whatsapp_bridge
      dockerfile: Dockerfile
    image: boltrig/channel-gateway-whatsapp-bridge:1.0.0
    restart: unless-stopped
    command: ["node", "bridge.js", "--host", "0.0.0.0", "--port", "3000", "--session", "/data"]
    environment:
      # The whatsapp adapter's inbound listener on the gateway service (the
      # channel's config in CHANNEL_GATEWAY_CHANNELS sets listen_host
      # "0.0.0.0" / listen_port 3001 - see the README's WhatsApp section).
      ADAPTER_URL: ${WHATSAPP_ADAPTER_URL:-http://channel-gateway:3001/inbound}
      # This service's alias, accepted by the bridge's Host-header
      # DNS-rebinding defence in addition to loopback.
      WA_ACCEPTED_HOSTS: whatsapp-bridge
    volumes:
      - whatsapp-session:/data
    expose:
      - "3000"
    depends_on:
      channel-gateway:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://localhost:3000/health || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backup:
    # M10 (SEC-70): scheduled off-box backup. The base `make backup` is a manual,
    # same-host dump; this gateway SHIPS the scheduled + off-box path so a self-
    # hosted deployment with a durable audit chain is not one-disk-failure away
    # from total loss. Profile-gated so the DEFAULT (dev) stack is unaffected:
    #   docker compose --profile backup up -d
    # It loops scripts/backup.sh every BACKUP_INTERVAL seconds: pg_dump (custom
    # format) -> a timestamped file under /backups, optional passphrase encryption,
    # and an off-box copy via rclone when BACKUP_REMOTE is set (skipped cleanly,
    # with a warning, when it is unset - so it is safe to enable in dev too).
    profiles: ["backup"]
    build:
      context: .
      dockerfile: deploy/backup.Dockerfile
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-boltrig}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (see .env.example)}
      PGDATABASE: ${POSTGRES_DB:-boltrig}
      BACKUP_DIR: /backups
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-86400}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      BACKUP_HEALTH_GRACE: ${BACKUP_HEALTH_GRACE:-3600}
      BACKUP_HEALTH_FILE: /backup-health/last-success
    volumes:
      # The script is also baked into the image, but mounting it keeps the dev
      # loop editable without rebuilding. (IAC-003: rclone is built in, not
      # installed at runtime.)
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
      - backup_health:/backup-health
      # rclone config for the off-box leg (remotes, tokens). Only read when
      # BACKUP_REMOTE is set; mount your own configured rclone.conf here.
      - ${RCLONE_CONFIG_DIR:-./deploy/rclone}:/root/.config/rclone:ro
    depends_on:
      postgres:
        condition: service_healthy

networks:
  # The app network: every service joins this by default.
  default:
    driver: bridge
  # The Pi gateway's isolation network (SEC-48 / FIND-IAC-001). Only the gateway
  # and the kernel MCP face plus model endpoints/proxies (bifrost/local-model) sit
  # here. WARNING: the base docker-compose.yml is a dev stack. It leaves the
  # sandbox as a normal bridge so an external model endpoint is reachable without
  # a local gateway. For production, ALWAYS use the secure overlay
  # `deploy/compose.secure.yml`, which sets `internal: true` on this network and
  # forces Pi to route model traffic through the sandbox peers (bifrost/local-model).
  sandbox:
    driver: bridge

secrets:
  # Build-only secret for the central `ui` image build (see ui.build.secrets).
  # Provide a user .npmrc carrying `//npm.pkg.github.com/:_authToken=<read:packages token>`.
  # Defaults to a gitignored .secrets/gh_npmrc; override with GH_NPMRC_FILE.
  gh_npmrc:
    file: ${GH_NPMRC_FILE:-./.secrets/gh_npmrc}

volumes:
  pgdata:
  redis_data:
  bifrost_data:
  herdr_data:
  opencode_data:
  browser_cli_data:
  knowledge_data:
  cognee_data:
  signal_cli_data:
  whatsapp_session:
  backup_health:
