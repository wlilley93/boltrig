# Boltrig - one self-hostable stack (SRS S11.1).
#
# The same first-party images run in every environment; only .env and the fleet
# manifest change between them (P7, NFR-PORT-01). Bring it up with:
#
#   cp .env.example .env                 # then edit secrets
#   cp manifest.example.yaml manifest.yaml
#   docker compose up -d                 # add: --profile gateway for Bifrost,
#                                        #      --profile local for on-box inference
#
# Services:
#   postgres          durable state (SRS S6 / boltrig/store/schema.sql)
#   redis             rate-limit + ephemeral counters (FR-KER-05)
#   kernel            the dispatch chokepoint HTTP surface (P2)
#   fleet-worker      the fleet runtime + durable workers (Epics F/G)
#   hatchet-engine    optional durable execution engine (US-FLT-06, seam)
#   hatchet-dashboard optional Hatchet web console (seam)
#   ui                the React console: Router, Kanban, Approvals (Epic L)
#   bifrost           optional model cost/cache gateway (profile: gateway)
#   local-model       optional on-box inference for sensitive data (profile: local)

# Container runtime hardening (INF-01): our first-party app containers run
# read-only, drop all Linux capabilities, forbid privilege escalation, and are
# resource-capped. The app writes nothing to disk (logs -> stdout); a tmpfs backs
# /tmp. Merged into the kernel / fleet-worker / pi-sidecar services below.
x-app-hardening: &app-hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - "no-new-privileges:true"
  pids_limit: 512
  mem_limit: 1g

services:
  postgres:
    # pgvector/pgvector:pg16 = stock Postgres 16 + the `vector` extension, so the
    # native vector Memory Engine keeps its store in this one Postgres (no separate
    # vector DB). Drop-in for postgres:16; same data dir, same env.
    # IAC-002: pinned to tag + digest to prevent supply-chain drift.
    image: pgvector/pgvector:pg16@sha256:131dcf7ff6a900545df8e7e092c270aa8c6db2f2c818e408cb45ec21316b74e6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-boltrig}
      # M9 (SEC-69): no baked default credential. The stack refuses to start
      # unless POSTGRES_PASSWORD is set (compose required-var form). Generate a
      # strong value and put it in .env - see .env.example.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-boltrig}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # First-boot schema load (idempotent; CREATE TABLE IF NOT EXISTS).
      # Production schema changes go through `make migrate` (alembic).
      - ./boltrig/store/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER:-boltrig} -d $${POSTGRES_DB:-boltrig}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    # IAC-002: pinned to tag + digest.
    image: redis:7@sha256:b2b95679e3b46fb51864949ed25ea976fc3a6bcc00a40a1bc00d568cb2822e50
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  kernel:
    build:
      context: .
      dockerfile: deploy/kernel.Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    image: boltrig/kernel:0.1.0
    restart: unless-stopped
    <<: *app-hardening
    # [2026] VJS-CC-VJS 5 G2: the per-cell auth helper no longer lives in the cell
    # root (it is baked root-owned at /opt/boltrig/codex/model_auth_helper on the
    # read-only rootfs), so this tmpfs no longer needs exec. Reverting to noexec
    # removes the whole "drop a script in a cell root and run it" class. It does
    # NOT close the config.toml vector (auth.command can still name an existing
    # interpreter), which is why concurrent multi-cell is refused at runtime.
    tmpfs:
      - /tmp
      - /var/lib/boltrig/codex-cells:mode=0700,uid=10001,gid=10001
    command: ["uvicorn", "boltrig.api.asgi:app", "--host", "0.0.0.0", "--port", "8000"]
    # Local/operator runs keep the conventional .env default. Validation and CI
    # can point at the checked non-secret fixture without creating an ignored
    # file in a clean checkout.
    env_file: ${BOLTRIG_ENV_FILE:-.env}
    environment:
      BOLTRIG_HERDR_HOME: ${BOLTRIG_HERDR_HOME:-/var/lib/boltrig/herdr}
    # On both the app network and the sandbox, so the Pi sidecar can reach the
    # MCP face (sandbox) while the kernel keeps its normal connectivity (default).
    networks:
      - default
      - sandbox
    ports:
      - "${KERNEL_PORT:-8000}:8000"
    volumes:
      - ./manifest.yaml:/app/manifest.yaml:ro
      - ./libraries:/app/libraries:ro
      # Stack-owned Herdr state only; never bind a developer user's ~/.config/herdr.
      - herdr_data:/var/lib/boltrig/herdr
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')" || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  fleet-worker:
    build:
      context: .
      dockerfile: deploy/fleet.Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    image: boltrig/fleet:0.1.0
    restart: unless-stopped
    <<: *app-hardening
    command: ["python", "-m", "boltrig.api.worker"]
    env_file: ${BOLTRIG_ENV_FILE:-.env}
    environment:
      BOLTRIG_OPENCODE_HOME: ${BOLTRIG_OPENCODE_HOME:-/var/lib/boltrig/opencode}
      BOLTRIG_BROWSER_CLI_HOME: ${BOLTRIG_BROWSER_CLI_HOME:-/var/lib/boltrig/browser-cli}
      BOLTRIG_BROWSER_CLI_BIN: ${BOLTRIG_BROWSER_CLI_BIN:-/usr/local/bin/browser-use}
    volumes:
      - ./manifest.yaml:/app/manifest.yaml:ro
      - ./libraries:/app/libraries:ro
      # Stack-owned OpenCode state only; never bind a developer user's ~/.config/opencode.
      - opencode_data:/var/lib/boltrig/opencode
      # Stack-owned Browser Use CLI state only; never bind a developer browser profile.
      - browser_cli_data:/var/lib/boltrig/browser-cli
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import boltrig" || exit 1
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s

  hatchet-engine:
    # Optional durable execution (US-FLT-06). The kernel and fleet run WITHOUT
    # it (P9 degrade); enable it to get durable resume of paused/long runs.
    # hatchet-lite bundles the engine, API and gRPC. Pin a digest for air-gap.
    # IAC-002: pinned to digest; the :latest tag is mutable.
    image: ghcr.io/hatchet-dev/hatchet/hatchet-lite@sha256:30ff826bdc65efc15a46df61e6d16dcc52f76cf2cf2693e848c6789e2b48718f
    restart: unless-stopped
    environment:
      # M9 (SEC-69): interpolate the DB credential instead of a literal boltrig:boltrig.
      DATABASE_URL: ${HATCHET_DATABASE_URL:-postgresql://${POSTGRES_USER:-boltrig}:${POSTGRES_PASSWORD}@postgres:5432/hatchet?sslmode=disable}
      SERVER_GRPC_BROADCAST_ADDRESS: hatchet-engine:7077
      SERVER_GRPC_BIND_ADDRESS: 0.0.0.0
      # hatchet-lite binds gRPC on 7070 by default; pin the bind port to the
      # broadcast + published port or every SDK connect is reset by the proxy.
      SERVER_GRPC_PORT: "7077"
      # hatchet-lite required auth/session config (it refuses to boot without a
      # cookie domain). The engine is internal (loopback / compose network only),
      # so an insecure cookie over the private network is fine.
      SERVER_AUTH_COOKIE_DOMAIN: ${HATCHET_COOKIE_DOMAIN:-localhost}
      SERVER_AUTH_COOKIE_INSECURE: "t"
      SERVER_AUTH_SET_EMAIL_VERIFIED: "t"
      SERVER_GRPC_INSECURE: "t"
      SERVER_URL: ${HATCHET_SERVER_URL:-http://localhost:8888}
    # M8 (SEC-69): bind the published ports to loopback so the plaintext gRPC
    # control plane (SERVER_GRPC_INSECURE) and API are NOT on all interfaces by
    # default - on a multi-homed host 0.0.0.0 would make them LAN-reachable in
    # cleartext. The secure overlay drops these host ports entirely (ports: []).
    ports:
      - "127.0.0.1:${HATCHET_GRPC_PORT:-7077}:7077"
      - "127.0.0.1:${HATCHET_API_PORT:-8888}:8888"
    depends_on:
      postgres:
        condition: service_healthy

  hatchet-dashboard:
    # Optional Hatchet web console (seam). Proxies to the engine API.
    # IAC-002: pinned to digest; the :latest tag is mutable.
    image: ghcr.io/hatchet-dev/hatchet/hatchet-dashboard@sha256:326774d08b1ce9123482cdb0ff24a4c0eb54b112d27207789dffb6f82d2667e9
    restart: unless-stopped
    environment:
      SERVER_URL: http://hatchet-engine:8888
    # M8 (SEC-69): the dashboard is UNAUTHENTICATED - keep it off 0.0.0.0. Bind to
    # loopback in the base stack; the secure overlay drops the host port entirely.
    ports:
      - "127.0.0.1:${HATCHET_DASHBOARD_PORT:-8889}:80"
    depends_on:
      - hatchet-engine

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    image: boltrig/ui:0.1.0
    restart: unless-stopped
    ports:
      - "${UI_PORT:-8080}:80"
    depends_on:
      - kernel
    healthcheck:
      # 127.0.0.1 (not "localhost"): nginx binds IPv4 0.0.0.0:80, but localhost
      # can resolve to IPv6 ::1 first in the container -> connection refused.
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1/index.html || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  bifrost:
    # The model gateway (Pi runtime spec S4.2, the cost/cache layer in front of
    # providers). Bifrost is OpenAI-compatible on :8080, so the kernel's
    # model-gateway seam (BOLTRIG_MODEL_GATEWAY_URL) points standard conversation
    # traffic here and it stays warm per conversation (SEC-47). Sensitive data is
    # never routed through it (residency) - that goes to local-model.
    #
    # Profile-gated like local-model: bring it up with
    #   docker compose --profile gateway up -d
    # then set BOLTRIG_MODEL_GATEWAY_URL=http://bifrost:8080/v1 in .env and configure
    # provider keys in the Bifrost web UI at http://localhost:${BIFROST_PORT:-8081}
    # (keys + running it are operator-supplied; the seam is inert until the URL is
    # set, so the default stack is unaffected).
    profiles: ["gateway"]
    # IAC-002: pinned to digest; the :latest tag is mutable.
    image: maximhq/bifrost@sha256:c4de3a1d6bd2f9b8b0b8f508deaaf0337a793603d2b84b61138cdb35f94a4318
    restart: unless-stopped
    networks:
      - default
      - sandbox
    ports:
      # Loopback-only: provider keys/routing live behind this admin/API surface.
      # Pi reaches the service over the sandbox network at bifrost:8080.
      - "127.0.0.1:${BIFROST_PORT:-8081}:8080"
    volumes:
      # Bifrost persists its config (providers, routing, cache) here; no config
      # file is required - it is configured via the web UI / API.
      - bifrost_data:/app/data

  local-model:
    # Optional on-box inference for air-gapped / sensitive-classified data
    # (SEC-12, the manifest sensitive_endpoint). OpenAI-compatible on :8000.
    # Enable with: docker compose --profile local up -d
    profiles: ["local"]
    # IAC-002: pinned to a stable tag + digest. The default :latest tag is mutable.
    image: vllm/vllm-openai:v0.24.0-ubuntu2404@sha256:bfdefe75b5c3fb83f4f0fcaae8f39fac87941cbadb05cd2203f44a1689236c71
    restart: unless-stopped
    networks:
      - default
      - sandbox
    command:
      - "--model"
      - "${LOCAL_MODEL:-Qwen/Qwen2.5-7B-Instruct}"
      - "--port"
      - "8000"
    ports:
      # The local sensitive-data model has no authenticated public surface. Keep
      # the dev convenience port on loopback; the secure overlay removes it.
      - "127.0.0.1:${LOCAL_MODEL_PORT:-8001}:8000"
    volumes:
      # Mount a local model cache so air-gapped boxes never reach the internet.
      - ${LOCAL_MODEL_CACHE:-./.models}:/root/.cache/huggingface
    ipc: host
    # GPU is optional. On a CPU-only box, swap this image for an Ollama service.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]

  pi-sidecar:
    # Round Two: the Pi reasoning sidecar (Epic RUN). Sandboxed: it has no native
    # tools and reaches ONLY the kernel MCP face + the model endpoint (SEC-24).
    # It is not internet-facing (no published ports).
    #
    # Egress is ENFORCED, not just documented (Round Six gap 3.3, SEC-48): the
    # sidecar sits on the `sandbox` network ONLY, so it can reach the kernel (its
    # MCP face) but NOT postgres/redis/the other services on `default`. The secure
    # overlay (deploy/compose.secure.yml) flips `sandbox` to internal: true, which
    # removes arbitrary internet egress entirely - in that posture the model must
    # be local (the `local` profile model on `sandbox`) or routed via the proxy.
    networks:
      - sandbox
    <<: *app-hardening
    build:
      context: ./services/pi_sidecar
      dockerfile: Dockerfile
    image: boltrig/pi-sidecar:0.1.0
    restart: unless-stopped
    environment:
      # M2 (SEC-73): the shared /run bearer. Unset = dev-open (fail-closed only
      # under a production signal). The fleet-worker (env_file: .env) must carry
      # the SAME PI_SIDECAR_TOKEN so PiRuntime presents it. See .env.example.
      PI_SIDECAR_TOKEN: ${PI_SIDECAR_TOKEN:-}
      PI_SIDECAR_EGRESS_ALLOW: ${PI_SIDECAR_EGRESS_ALLOW:-kernel,bifrost,local-model}
      # Pass the prod signals the sidecar's fail-closed auth checks (it reads
      # these directly, mirroring the kernel), so an unset token fails closed
      # in prod but stays open in dev.
      BOLTRIG_ENV: ${BOLTRIG_ENV:-}
      BOLTRIG_PRODUCTION: ${BOLTRIG_PRODUCTION:-}
    expose:
      - "8090"
    depends_on:
      kernel:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')" || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backup:
    # M10 (SEC-70): scheduled off-box backup. The base `make backup` is a manual,
    # same-host dump; this sidecar SHIPS the scheduled + off-box path so a self-
    # hosted deployment with a durable audit chain is not one-disk-failure away
    # from total loss. Profile-gated so the DEFAULT (dev) stack is unaffected:
    #   docker compose --profile backup up -d
    # It loops scripts/backup.sh every BACKUP_INTERVAL seconds: pg_dump (custom
    # format) -> a timestamped file under /backups, optional passphrase encryption,
    # and an off-box copy via rclone when BACKUP_REMOTE is set (skipped cleanly,
    # with a warning, when it is unset - so it is safe to enable in dev too).
    profiles: ["backup"]
    build:
      context: .
      dockerfile: deploy/backup.Dockerfile
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-boltrig}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (see .env.example)}
      PGDATABASE: ${POSTGRES_DB:-boltrig}
      BACKUP_DIR: /backups
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-86400}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      BACKUP_HEALTH_GRACE: ${BACKUP_HEALTH_GRACE:-3600}
    volumes:
      # The script is also baked into the image, but mounting it keeps the dev
      # loop editable without rebuilding. (IAC-003: rclone is built in, not
      # installed at runtime.)
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
      # rclone config for the off-box leg (remotes, tokens). Only read when
      # BACKUP_REMOTE is set; mount your own configured rclone.conf here.
      - ${RCLONE_CONFIG_DIR:-./deploy/rclone}:/root/.config/rclone:ro
    depends_on:
      postgres:
        condition: service_healthy

networks:
  # The app network: every service joins this by default.
  default:
    driver: bridge
  # The Pi sidecar's isolation network (SEC-48 / FIND-IAC-001). Only the sidecar
  # and the kernel MCP face plus model endpoints/proxies (bifrost/local-model) sit
  # here. WARNING: the base docker-compose.yml is a dev stack. It leaves the
  # sandbox as a normal bridge so an external model endpoint is reachable without
  # a local gateway. For production, ALWAYS use the secure overlay
  # `deploy/compose.secure.yml`, which sets `internal: true` on this network and
  # forces Pi to route model traffic through the sandbox peers (bifrost/local-model).
  sandbox:
    driver: bridge

volumes:
  pgdata:
  bifrost_data:
  herdr_data:
  opencode_data:
  browser_cli_data:
