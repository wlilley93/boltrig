id: DECISION-0017
at: 2026-08-14T10:54:41Z
by: williamlilley
decision: At compact desktop widths, Task details may be opened manually as a floating, non-modal right overlay without moving the centred Chat column; phones retain the modal sheet and wide desktops retain the automatic inline rail.
court_required: false
why: The Principal explicitly showed the compact Codex behavior: surplus width is insufficient for an inline rail, but the same inspector remains available on demand over the conversation. Boltrig must preserve the canonical Chat geometry while keeping Task details reachable, without imposing phone-style scrim, body lock or background isolation on desktop.
