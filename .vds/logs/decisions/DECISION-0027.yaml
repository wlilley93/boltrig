decision: Composer toolbar glyphs use the heavier Codex-weight stroke family, and unavailable dictation remains semantically disabled without being visually washed out.
court_required: false
why: The Principal supplied a direct Codex-versus-Boltrig microphone comparison and identified the thinner Boltrig glyph. The correction is scoped to the stroke-based composer actions rather than changing unrelated iconography throughout the product.
