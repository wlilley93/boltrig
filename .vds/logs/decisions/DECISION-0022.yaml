id: DECISION-0022
at: 2026-08-14T12:36:52Z
by: williamlilley
decision: Shared Shell primary rows keep their compact 32px desktop height when keyboard-focused; the focus indicator is drawn inside the row instead of adding a ten-pixel outer halo.
court_required: false
why: The Principal explicitly compared the compact Codex New chat row with Boltrig's visually taller focused row. Boltrig already used the correct 32px box, but the global 3px outline plus 2px offset made the focused footprint appear 42px tall.
