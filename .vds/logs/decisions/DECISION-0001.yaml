id: DECISION-0001
date: 2026-08-10
decision: token_pin stays VACUOUS and is blocked on the Figma plan tier, a Principal-owned dependency. Not routed around, not faked.
subject: the pin between the shipped stylesheet and the decided-target Figma file
why: >-
  A token pin is derived out of band because one of its two records is a Figma file
  behind a network call, and VDS S-7(2)(1) forbids a network call inside a proof.
  FIGMA_TOKEN is present and authenticates: `vds figma pull` succeeded and wrote
  .vds/ledgers/figma.yaml against file iVQBKFc3NpRH3zdOOxfPqr. What fails is
  narrower and external: `vds pin generate` reads GET /v1/files/:key/variables/local,
  which needs an Enterprise plan and the file_variables:read scope. This account is
  on the "My Files" plan at tier `pro`, so the endpoint returns 403 rather than an
  empty result. No token change fixes it; only a plan change does.
  The pin was NOT hand-written from the values I could read by eye. A pin that VDS
  did not derive is a realisation stored in .vds/, which S-2(4) forbids and
  no_stored_values would then correctly fail.
what_is_true_anyway: >-
  The token layer was verified by direct comparison outside VDS: all 22 tokens in
  apps/worker/src/styles.css match the decided target's [data-ui="dark"] and
  [data-ui="light"] blocks exactly, in both themes, including --shadow. So the
  risk this proof exists to catch is measured as absent today; what is missing is
  the machine-derived record that keeps it absent tomorrow.
evidence:
  - vds figma pull --file-key iVQBKFc3NpRH3zdOOxfPqr = wrote .vds/ledgers/figma.yaml, file version 2386064713862372315
  - vds pin generate --file-key iVQBKFc3NpRH3zdOOxfPqr = REFUSED, Figma API 403 on the local-variables endpoint
  - mcp Figma whoami = plans[0].tier "pro"
  - vds proof token_pin = vacuous, exit 3
unblocks_on: an Enterprise plan with file_variables:read, after which `vds pin generate` needs no code change
