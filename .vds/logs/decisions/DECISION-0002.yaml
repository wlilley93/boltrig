id: DECISION-0002
date: 2026-08-10
decision: >-
  CMP-0061 keeps a failing `border-2:inset` contrast floor on the record. The floor
  was declared in error and its withdrawal is blocked on a warrant that cannot be
  granted here. The drawing was corrected; the record was not quietly cleaned up.
subject: the routine thumbnail's graphical contrast floors
what_happened: >-
  Registering CMP-0061 with a 3:1 floor for its node outline made `contrast`
  enforceable for the first time, and it immediately failed: --border-2 against
  --inset measures 1.42:1 in dark and 1.31:1 in light, against the 3:1 that
  WCAG 2.2 SC 1.4.11 requires of a graphical object a reader must see to read the
  graph. This is a real defect and it comes from the decided target's own choice of
  a hairline for those outlines, not from a mistake in the implementation.
what_changed: >-
  The drawing moved from --border-2 to --text-3 for both node outlines and edges.
  --text-3 is the lightest token that clears the floor in both themes (4.89:1 dark,
  4.00:1 light), so the thumbnail is a shade firmer than the decided target draws it
  and legible to the people the floor exists for. The trigger outline (--orange) and
  the amber pip already cleared 3:1 and were left alone.
why_the_bad_floor_remains: >-
  The `border-2:inset` floor is now a floor nothing can satisfy, because nothing
  draws that boundary any more. Removing a floor is BREAKING under VDS S-9(4) and
  needs --warrant-id naming a granted warrant. No warrant can be granted in this
  project: designpack.lock pins the ABSENCE of a designpack, and VDS S-15(1) makes
  the specification commence on a dated, digest-pinned assent event that does not
  exist yet. Hand-editing the YAML to drop it is the one thing the register may not
  be, so the floor stays and `contrast` stays failing until a warrant is possible.
consequence: >-
  `vds proof contrast` reports one violation that is true about the record and false
  about the shipped drawing. That is the correct reading: the register says this
  component promised something it no longer draws, and the promise can only be
  withdrawn through the gate.
evidence:
  - vds proof contrast (before) = --border-2 against --inset 1.42:1 dark, 1.31:1 light, floor 3.00
  - vds register amend CMP-0061 --kind breaking --remove-floor = REFUSED, needs a granted warrant
  - apps/worker/src/components/RoutineThumb.tsx now strokes nodes and edges with --text-3
unblocks_on: an assent event under VDS S-15(1), after which W-series warrants can be granted and the dead floor withdrawn
