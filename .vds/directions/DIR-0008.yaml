direction: 'Use codex-left-rail.png, codex-right-rail.png, and codex-tool-usage.png as the positive visual authority for desktop ChatView chrome; use chat-wrong-root.png, old-right-rail.png, and old-left-status.png only as negative defect and legacy evidence. Where these conflict with the prior Claude executable or Figma chat frames, the Codex references govern: glassy rounded rails, compact recent and thread rows, compact inline semantic tool receipts, and a thin agent-update chip; omit the conversation-title editor, Governed by Boltrig disclosure, run-status and governance blocks, and the persistent left readiness/status row; preserve the account and help controls.'
magnitude: Apply this override to the complete desktop chat chrome rendered by apps/worker/src/components/ChatView.tsx, including its desktop left and right rails and transcript disclosure rows. Preserve real backend, tool, and subagent state, audit drill-down, accessibility, and responsive behavior; do not infer a mobile design, copy transient screenshot content, fabricate activity, or change authority for non-chat routes.
