notes: This additive route direction extends DIR-0008, DIR-0011 and DIR-0012 without changing their reference images. Unsupported dynamic inspector groups stay absent; Outputs remains stable and truthfully reports its empty state. No frameDigest, signed review, Code Connect linkage, token linkage, conformity or sign-off is asserted.
