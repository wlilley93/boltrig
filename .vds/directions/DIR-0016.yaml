direction: Use Omnigent only as an interaction reference for the shared primary task hierarchy. Render one borderless glass rail with compact Pinned and Recents groups over real conversation summaries, keep the top command search as the single global search entry point, and keep account and help controls without a workspace identity line or footer health row. Treat pin state as versioned presentation preference, never as a replacement conversation store.
