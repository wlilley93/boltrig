direction: For the desktop Chat and New-chat shell only, use codex-left-rail.png as the positive visual authority and old-left-status.png only as negative evidence for the persistent readiness/status row. The Shell-owned rail must use glass treatment and compact conversation rows, keep Search conversations, timestamps, and the selected row actions visibly available as shown, omit the persistent readiness/status row, and preserve the account and help controls.
magnitude: Apply this override only while Shell renders the desktop chat route, including both a selected conversation and the New-chat state. Preserve accessible search, pin, archive, account and help behavior, retain truthful per-conversation working indicators, and do not transfer this chat-only override to Settings, mobile, or non-chat routes without independent authority.
