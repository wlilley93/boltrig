notes: 'Evidence is byte-preserved under docs/design/evidence/2026-08-11-chat-ui-direction/references and rehashable through references.sha256: codex-left-rail sha256:a5ee736315f45c9f6c50f2c80e7e11808b6f5ff3f632950ab2365981c7d39ad6; old-left-status sha256:236f32d39e8d5c4d8609b4702d7a914276543a6e00580856e6f51e3289011055. The old-left-status image is negative only for its readiness/status row; its account/help controls remain required. VDS route scope cannot encode the desktop breakpoint or Shell route predicate, so those limits are explicit here. No frameDigest, signed review, Code Connect, token linkage, visual verdict, sign-off, or conformity is asserted.'
