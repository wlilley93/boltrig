notes:
- '[reserved] This kind validates, stores and stales VERDICT RECORDS. The capture and review pipeline (render, screenshot, export, compare) lives in the consuming repo: a proof may not call a network or a model (VDS S-7(2)(1)). The verdict vocabulary is conform | deviate | no_authority, and there is NO ACCEPTANCE STATE: an addition the frame omits is a deviation exactly like a missing element, and its resolution path is a new signed frame version recorded as a redraw, never an engine-side excusal. A delta''s DISPOSITION classifies a difference and never disposes of it: the taxonomy carries no `accepted` and no `wont_fix`, because either would be a fourth verdict wearing a different field name, reachable by the recorder rather than by the signer. BEFORE a surface''s frame is entered in the sign-off register this kind REPORTS AND NEVER BLOCKS ([2026] VJS-SC-OPBOX 1 orders 20, 23 and 24): registration is the moment a surface flips from report to block, and there is no estate-wide flag day.'
- '[stage-4 coverage] 6 route(s) enumerated by the estate (docs/design/evidence/2026-08-11-console-parity/current/capture-manifest.json (sha256:dfb27bee81453a7d0c7fb85e94730c684d44dfd082c643297b629fb7f33ed7c0) and metrics.json (sha256:be90dcf5ea1fa5d7db8fea085ac284cd6750b207cdfd5e841554df79d8d2f0b7)): 6 CURRENT (a verdict against the current artefact AND the current contract), 0 OWED BY DRIFT (the code or the frame moved since the verdict, so the route is not reviewed - it is owed), 0 NEVER REVIEWED (named above, one warning each). A route is covered at stage 4 only while all three hashes hold.'
- '[manifest] the estate states its enumeration does NOT cover: VDS route coverage cannot distinguish the Chat run and New chat states because both are rendered by ChatView.tsx; the seven-state current capture manifest retains that distinction.; SCR-0007 / Figma node 13:2 has no non-invented frameDigest and cannot occupy a second route-scoped visual-review slot.; DIR-0008 through DIR-0012 and DIR-0015 through DIR-0017 govern shared Chat and Shell presentation, but Shell.tsx, TaskInspector, transcript navigation, composer states and responsive sheets are component or state boundaries rather than independent stage-four routes; states.json retains their source-bound contracts.; The additive Chat-direction capture is source-bound to DIR-0016 and DIR-0017 but has no signed full-frame target, so it supplies no frameDigest, sign-off or route-scoped visual-review authority.; Routes without a 2026-08-11 Figma CURRENT SOURCE frame are outside this parity programme.'
- '[region correspondence] R14 ran on 6 route(s) and COULD NOT RUN on 0 route(s), each named above. It runs only where a screen record claims the route AND declares its bands, so a route missing either has an UNCHECKED checklist rather than a clean one. The key is the screen record''s `bands` and never its `regions`: the region vocabulary is the subject''s own and is deliberately open, and an open set cannot refuse a name that is not a band.'
- '[pipeline] This kind is STAGE 4 of four, in fixed order: (1) the machine-readable contract derived from signed frames, (2) Figma AND code both built to that contract, (3) source-side gates per push, (4) this artefact-side visual check per route. STAGE 3 AND STAGE 4 ARE NOT SUBSTITUTES: gates read SOURCE and cannot see the page; the visual check reads the PAGE and is slow and sampled. Neither may be cited as covering the other''s ground. On the motivating estate, 28 green stage-3 gates were read as evidence about stage 4, and the pages looked nothing like their frames.'
