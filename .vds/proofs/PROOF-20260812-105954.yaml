notes:
- 'this proof establishes EXISTENCE, AND THE MEASUREMENT COVERAGE OF A DIRECTED RECORD (VDS S-7(5) and S-5(9); the widening is recorded by [2026] VJS-CA-VDS 1 order 18 rather than left standing in a scope note the proof has outgrown). A record at `proposed` or `designed` satisfies it and fails `composition`, which is why they are two proofs: W1 REGISTER-COMPLETE is granted on existence alone, before any design work has happened. A warrant citing this run has evidence that the register covers the surface, and no evidence that anything on the surface is fit to be used.'
- 'the claim is bounded by [surface] screen_globs and [surface] governed_import_prefixes. A screen outside those globs, a reference imported from outside those prefixes, and a reference whose import the ledger could not resolve are each counted and not enforced. This proof cannot say `no unregistered component anywhere`, only `no absent record among the references it reached`. R2 reaches only records that carry `directedAt`. A record naming no direction and no measure is outside this clause, and the count of such records is printed on every run: a rule that fires only on the rows that armed it has a denominator, and an unreported denominator is the defect this clause was written against ([2026] VJS-CA-VDS 1 order 17).'
- 'relies on VDS S-9(10) RESERVED (SUBMISSION-VDS-005): bare HTML elements are informational rows only, excluded from rows_enforced. Any warrant citing this proof must record that reliance in its `reserved` array.'
- 93 component reference(s) were NOT reached, because the ledger could not resolve the module their root name was imported from. Each is captured on this record as an informational finding naming its route and line, and none of them was enforced.
- 62 reference(s) resolve to a record that exists and is not in a status `composition` accepts. This proof passes on them by design, because VDS S-7(5) is the existence question; composition is where they fail.
- '[I4] 1 enforceable register record(s) carry neither directedAt nor measuredBy, so S-5(9) R2 does not reach them: CMP-0061. This is COVERAGE OWED and not a failure ([2026] VJS-CA-VDS 1 order 17).'
