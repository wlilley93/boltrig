notes:
- '[redaction] a finding names the file, the line, the column, the class of realisation and its length in characters, and never the matched text. A captured proof record lands under the record this proof scans, so a finding that copied the value would put that value under the record permanently and this gate would then fail forever on a file it wrote itself. Open the named file at the named line to read it. For the same reason a finding carries no digest of the matched text: VDS S-2(7) holds that a digest of a low-entropy value is the value.'
- '[prose] prose is NOT exempt. VDS S-2(8) makes the test recoverability rather than spelling, so a value written into a rationale, a note or a breach report is as recoverable as one written into a field. Exempting a list of prose-bearing keys would be a hole a realisation walks through by moving one field to the left. A note that must discuss a realisation names its class, as every note in this run does.'
- '[scope] every file under the record is scanned except those in the two directories VDS S-3(9) ignores. Their files are counted and skipped by name, so the carve-out is a number in this record. They are also not recorded as inputs, because a write to a scratch directory must not move the evidence digest a warrant cites.'
- '[preimage] this run discharges VDS S-2(8) limb 1 in full, and limb 2 for BOTH the reversible and the one-way transforms. A hexadecimal or base64 encoding is decoded and re-tested (R8), and every sha256, sha1 and md5 digest harvested from the record is tested against the VDS S-2(9) candidate space by enumerating it (R10), which is the recovery that took 27 seconds against the first token pin. What limb 2 still does NOT reach is a SALTED digest, an HMAC, a digest of a value concatenated with anything, an iterated or key-derived digest, and a digest of a value spelled outside the enumerated space - the largest named omission being the eight-digit hex colour with an alpha channel, whose 2^32 domain would add twenty seconds to every run. A warrant citing this proof may rely on the preimage limb for the plain digest of a plain value and must not describe it as covering the salted forms (VDS S-6(3)).'
- '[space] the candidate space is every 24-bit hex colour in the four spellings a stylesheet and a Figma export produce, every three- and four-digit hex colour, the 148 CSS named colours, numbers carrying a CSS length unit from -200 to 2000 at whole, tenth and hundredth precision, durations to ten seconds in milliseconds and to sixty seconds in hundredths, the named easing keywords with the common cubic-beziers, and the generic font families. It does NOT include the eight-digit hex colour with an alpha channel, whose 2^32 domain would add twenty seconds to every run, nor an arbitrary cubic-bezier, whose textual form is unbounded. It is a floor, and it is the floor at which the demonstrated leak sits.'
- '[reach] the pattern set is a floor and is named in the gate: colour literals in the hash-sigil form, the CSS colour functions, numbers carrying a CSS length or time unit, timing functions and named easing keywords, the CSS generic font-family keywords, and a closed list of field names that name a realisation. A bare family name under a field name outside that list is NOT reached, because the only way to reach it is a list of the project''s font families, and holding that list here would itself be the storing form this proof exists to prevent.'
- '[self-reference] this proof captures its own record into the tree it scans, so the NEXT run reads one more file than this one did. Two consecutive runs over an otherwise unchanged tree therefore cite different evidence digests. That is the subject moving, not the check (VDS S-7(2)(1)).'
- '[shape] a limb 1 match is a report that a string in the record is SHAPED like a design value. Whether the record is in the STORING FORM is answered by the four limbs of VDS S-2(5), which no pattern evaluates: delete the artefact and see whether a shipped or decided value is lost; change a named record and see whether it serves a second opinion; ask whether a reader can move a shipped pixel by editing it alone; ask whether it carries a value a named record also carries. Limb 1 is a lawful and necessary FLOOR and is not a sufficient test, and this gate must not be read as asserting more than it measured ([2026] VJS-FI-VDS 1 order 6).'
- '[adjudicated] where a court has applied the VDS S-2(5) limbs to a NAMED SITE and found no design value there, the site is DISPOSED: reported as a warning naming the ruling and the ground, and counted here, never suppressed and never omitted. A disposal binds one file, at one digest, at one line and column, for one limb 1 shape class, and it dies the moment any of those moves. It reaches only the three classes whose spellings collide with ordinary prose, and never a field name, an encoding, an undecodable file or a preimage recovery: a value behind an encoding is concealment and no court disposes of concealment. The distinction from a carve-out is measurable rather than rhetorical - a carve-out''s reach grows with the tree, and this one is the integer printed below.'
- '[preimage-run] 130 digest-shaped runs harvested, 50 distinct, tested against 65334666 enumerated candidates under sha256. A digest whose preimage is a design value is a stored design value (VDS S-2(7)).'
- '[adjudicated-run] 2 adjudicated site(s) in force, 0 disposed in this run, 2 naming an artefact this tree does not hold. Authorised by: [2026] VJS-FI-VDS 1 order 5. Each disposal is named individually above as a warning, with its file, line, column, class, ruling and ground. A disposal that stopped matching would be a fatal finding and not a silent absence.'
