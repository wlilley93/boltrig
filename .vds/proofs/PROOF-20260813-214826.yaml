- '[reach] limb (c) of VDS S-5(6) IS reached by this run: every register entry''s Figma node id was resolved against the figma ledger, which `vds figma pull` generated out of band because the resolution is a network call VDS S-7(2)(1) forbids inside a proof. A record naming a node that is not in the decided-target file is a finding here (R7). What this does NOT establish is that the ledger is current with the file as it stands NOW: it is current with the file as it was when it was pulled, and its own content digest is recorded on this run so a reader can tell which pull it was.'
- '[reach] limb (d) of VDS S-5(6), whether prop and state contracts agree between the record and the code, is NOT checked by this run. Comparing them requires reading and analysing the component''s TypeScript source, which this build does not do, so every record with a declared code counterpart was counted and skipped rather than passed. A record whose props have drifted from its component''s signature passes this run.'
- '[reach] this run establishes limbs (a), (b) and (c) of VDS S-5(6) over the declared surface, and not (d). Limb (c) is reached because a figma ledger was present and current; limb (d), whether prop and state contracts agree between the record and the code, is the `parity` proof''s and is not attempted here. A warrant citing this proof must not be described as covering the limb it did not reach.'
- '[carve-out] a library file named index.*, *.test.*, *.spec.* or *.stories.* is counted and NOT enforced against the register under limb (b): a barrel re-exports components rather than defining one, and a test or a story is not a shipped component. A component defined inside a file with one of those names is therefore outside this proof, and the skip counts above are where that carve-out is visible rather than assumed.'
