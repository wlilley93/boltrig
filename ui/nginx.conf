# Serves the built SPA and proxies the kernel HTTP surface. The kernel is
# reached at the compose/k8s service name "kernel" on port 8000.

upstream boltrig_kernel {
    server kernel:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Kernel API. proxy_pass without a path preserves the original request URI.
    location /v1/ {
        proxy_pass http://boltrig_kernel;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /healthz {
        proxy_pass http://boltrig_kernel;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: any unknown path serves index.html for client routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
