# Serves the built SPA and proxies the kernel HTTP surface. The kernel is
# reached at the compose/k8s service name "kernel" on port 8000.
#
# We use a runtime resolver + a variable in proxy_pass so nginx does not fail at
# startup if the kernel container is not yet resolvable in Docker DNS.

resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Kernel API. proxy_pass without a path preserves the original request URI.
    location /v1/ {
        # The kernel accepts uploads up to its MAX_UPLOAD_BYTES (25 MiB);
        # nginx's compiled-in 1m default would 413 them before the kernel
        # ever saw the request.
        client_max_body_size 26m;
        set $kernel_api http://kernel:8000;
        proxy_pass $kernel_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /healthz {
        set $kernel_health http://kernel:8000;
        proxy_pass $kernel_health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build output is content-addressed: cache hard, and answer a
    # missing chunk with 404 rather than falling through to index.html,
    # which strict module-MIME would refuse and blank the app.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA fallback: any unknown path serves index.html for client routing.
    # `expires -1` marks the HTML no-cache so a redeploy is picked up on the
    # next load instead of after a heuristic cache window.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
