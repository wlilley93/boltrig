allowBuilds:
  esbuild: true
# Smallest explicit upgrades that close current high advisories, per-major where
# the majors are not API-compatible: minimatch@3 calls the 1.x braceExpand API,
# so a blanket '>=5.0.8' throws at lint time. Each line takes the highest release
# that exists on it. Drop an entry once its puller adopts a fixed release.
overrides:
  brace-expansion@<2.0.0: 1.1.16
  brace-expansion@>=2.0.0 <3.0.0: 2.1.2
  brace-expansion@>=5.0.0: '>=5.0.8'
  postcss: '>=8.5.18'
# pnpm 10/11 moved build-script approval here (out of package.json's "pnpm" key).
# esbuild ships a postinstall that compiles its native binary; approve it so
# `pnpm install` / `pnpm run build` work in CI and the Docker image.
onlyBuiltDependencies:
  - esbuild
# ONE ENTRY PER PACKAGE NAME. pnpm evaluates this list FIRST-MATCHING-NAME-PATTERN
# and consults no later entry for that package.
#
# This held two entries, `…/boltrig-web-sdk@0.1.0` and `…@0.1.1`. The 0.1.0 entry
# matched the name first, so 0.1.1 was never excluded and every UI PR failed
# `pnpm install --frozen-lockfile` with ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION.
# 0.1.0 is not even resolved by the lockfile and is older than the 24h window, so
# it needed no exemption at all - a dead entry that broke the live one beside it.
#
# I diagnosed that wrongly and at length: I recorded that the exclude list is
# "honoured at resolution but ignored by the --frozen-lockfile verifier", and it
# is not. Proven by running it, both ways, on 2026-07-28:
#   both entries -> ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION
#   0.1.1 alone  -> passes
# Guarded by scripts/check-release-age-exclusions.py so a second entry for the
# same package cannot silently disable the first again.
minimumReleaseAgeExclude:
  - '@wlilley93/boltrig-web-sdk@0.1.1'
  - '@wlilley93/boltrig-web-sdk@0.2.0'

# Accepted advisory, recorded in docs/security/accepted-advisories.json with its
# reachability, owner, EXPIRY (2026-10-23) and compensating control. No fixed
# release exists on the lines that need it (1.x ends at 1.1.16, 2.x at 2.1.2, the
# fix ships only in 5.0.8, and minimatch@3 cannot use the 5.x API). The 5.x line
# IS pinned to the fix above, so only lint/test-tooling paths remain. Closing it
# needs the pullers to move off minimatch@3. Remove this the moment they do.
auditConfig:
  ignoreGhsas:
    - GHSA-mh99-v99m-4gvg
