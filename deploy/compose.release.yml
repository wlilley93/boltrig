# Digest-addressed first-party release overlay.
#
# Layer this between the base and secure manifests. Every image value is required
# and is generated by the protected release workflow in `boltrig-images.env`:
#
#   docker compose --env-file .env --env-file boltrig-images.env \
#     -f docker-compose.yml -f deploy/compose.release.yml \
#     -f deploy/compose.secure.yml config
#
# `scripts/validate_release_images.py` enforces immutable @sha256 references.
# The build keys are reset so production can run only the signed release images.

services:
  kernel:
    build: !reset null
    image: ${BOLTRIG_KERNEL_IMAGE:?set BOLTRIG_KERNEL_IMAGE to an image@sha256 digest}
    pull_policy: always

  fleet-worker:
    build: !reset null
    image: ${BOLTRIG_FLEET_IMAGE:?set BOLTRIG_FLEET_IMAGE to an image@sha256 digest}
    pull_policy: always

  ui:
    build: !reset null
    image: ${BOLTRIG_UI_IMAGE:?set BOLTRIG_UI_IMAGE to an image@sha256 digest}
    pull_policy: always

  worker-ui:
    build: !reset null
    image: ${BOLTRIG_WORKER_UI_IMAGE:?set BOLTRIG_WORKER_UI_IMAGE to an image@sha256 digest}
    pull_policy: always

  backup:
    build: !reset null
    image: ${BOLTRIG_BACKUP_IMAGE:?set BOLTRIG_BACKUP_IMAGE to an image@sha256 digest}
    pull_policy: always
    # Production executes only the script baked into the signed backup image.
    # Keep mutable source mounts in the developer base manifest, never here.
    volumes: !override
      - ${BACKUP_DIR:-./backups}:/backups
      - backup_health:/backup-health
      - ${RCLONE_CONFIG_DIR:-./deploy/rclone}:/root/.config/rclone:ro
