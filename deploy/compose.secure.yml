# Secure deployment overlay (SEC-10/SEC-11, P3-1). Layer it over the base stack:
#
#   docker compose -f docker-compose.yml -f deploy/compose.secure.yml up -d
#
# It adds TLS termination (Caddy) in front of the UI and kernel, stops publishing
# the kernel/UI ports directly (only Caddy is reachable), mounts a custom CA
# bundle into the app containers, and shows the encrypted-at-rest volume wiring.
# All of this is config + env, no image rebuild (P7).
#
# It also ENFORCES the Pi sidecar's egress isolation (SEC-48): the `sandbox`
# network becomes internal: true, so the sidecar (which sits on sandbox only) has
# NO route to the internet - it can reach only the kernel MCP face. In this
# posture the model endpoint must be local (the `local` profile model placed on
# sandbox) or reached through the egress proxy; an external provider URL called
# directly from the sidecar will be unreachable by design.

services:
  caddy:
    # IAC-002: pinned to tag + digest.
    image: caddy:2@sha256:af5fdcd76f2db5e4e974ee92f96ee8c0fc3edb55bd4ba5032547cbf3f65e486d
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    environment:
      BOLTRIG_DOMAIN: ${BOLTRIG_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile.example:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - kernel
      - ui

  kernel:
    # reachable only through Caddy now (no direct host port). Internal
    # service-to-service traffic stays on the compose network.
    ports: !override []
    volumes:
      - ./manifest.yaml:/app/manifest.yaml:ro
      - ./libraries:/app/libraries:ro
      # custom/internal CA so outbound adapter calls trust enterprise endpoints
      - ${CA_BUNDLE_FILE:-./deploy/ca-bundle.crt}:/certs/ca.pem:ro

  fleet-worker:
    volumes:
      - ./manifest.yaml:/app/manifest.yaml:ro
      - ./libraries:/app/libraries:ro
      - ${CA_BUNDLE_FILE:-./deploy/ca-bundle.crt}:/certs/ca.pem:ro

  ui:
    ports: !override []

  # M8 (SEC-69): drop the Hatchet host ports entirely in the secure posture. The
  # engine (plaintext gRPC + API) and the unauthenticated dashboard become
  # reachable ONLY over the compose network (the fleet-worker still reaches the
  # engine by service name), never from any host interface - matching how this
  # overlay already strips kernel/ui.
  hatchet-engine:
    ports: !override []

  hatchet-dashboard:
    ports: !override []

  bifrost:
    # Bifrost's admin/API surface stores provider routing and keys. In the secure
    # posture it remains compose-internal only; use an SSH tunnel or a governed
    # admin surface rather than publishing it directly.
    ports: !override []

  postgres:
    # Encrypted-at-rest (SEC-11): point the data dir at an encrypted device/path
    # (LUKS volume, or a cloud encrypted disk). Set PGDATA_HOST to that mount.
    # Connections use TLS by putting sslmode=require in DATABASE_URL.
    volumes:
      - ${PGDATA_HOST:-pgdata}:/var/lib/postgresql/data
      - ./boltrig/store/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

networks:
  # Enforce no arbitrary egress for the Pi sidecar (SEC-48). internal: true means
  # Docker attaches no gateway to this network, so containers on it cannot reach
  # any external address - only their sandbox peers (the kernel MCP face).
  sandbox:
    internal: true

volumes:
  caddy_data:
  caddy_config:
