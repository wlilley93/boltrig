misconfigurations:
  - id: DS-0031
    paths:
      - deploy/kernel.Dockerfile
      - deploy/fleet.Dockerfile
    expired_at: 2027-01-31
    statement: >-
      False positive on the name, not the value. BOLTRIG_CODEX_AUTH_HELPER holds a
      PATH to an executable (/opt/boltrig/codex/model_auth_helper), never a
      credential; DS-0031 matches any env whose name contains "AUTH". The helper
      is how a codex cell obtains a bearer WITHOUT one being baked into the image,
      so this ENV is part of the mitigation the check is looking for, not a leak.
      The value is fixed, non-secret, and identical in every layer.
  - id: AVD-DS-0002
    paths:
      - deploy/backup.Dockerfile
    expired_at: 2026-10-15
    statement: >-
      Release engineering owns migration from root after operator bind-mount
      ownership is made portable; the service publishes no ports, the image
      drops unused gosu, and it runs only the fixed backup loop entrypoint.
  - id: AVD-DS-0002
    paths:
      - ui/Dockerfile
      - apps/worker/Dockerfile
    expired_at: 2026-08-15
    statement: >-
      Frontend engineering owns the nginx-unprivileged migration; the secure
      overlay removes the direct host port and the digest-pinned runtime serves
      only the generated static build through its fixed nginx configuration.
      apps/worker/Dockerfile is the SAME runtime stage as ui/Dockerfile - the
      same pinned nginx alpine, the same static root, the same fixed config -
      so it is listed here rather than given an entry of its own, and
      deliberately shares this expiry rather than taking a fresh one. The
      justification for the original date is migration cost on a LIVE artefact,
      and the worker image is profile-gated and runs nowhere, so it has earned
      no extra time: a separate entry would have let the newer image quietly
      extend a deadline the older one is already close to. Both move to
      nginx-unprivileged as one piece of work, or this expires and iac-scan
      turns red on both.

vulnerabilities:
  - id: CVE-2026-16804
    purls: &chromium_purls
      - "pkg:deb/debian/chromium"
      - "pkg:deb/debian/chromium-common"
    expired_at: 2026-09-11
    statement: &chromium_statement >-
      SCOPED BY EXACT PURL - NO WILDCARDS, and both packages listed. Measured with the
      pinned scanner (aquasec/trivy:0.72.0) against the built image: a trailing `*`
      (`pkg:deb/debian/chromium*`) matches NOTHING, and `chromium-common` is a separate
      package that needs its own purl - with only `chromium` listed, 8 findings became 7,
      not 6. Verify any change to this block by running the scanner locally rather than
      pushing and reading CI; two of my attempts here looked correct and suppressed nothing.
      SCOPED BY PURL, NOT BY PATH, and that distinction is load-bearing. These are dpkg
      findings: trivy attributes them to the PACKAGE, not a file, so a `paths` entry can
      never match and the ignore is silently INERT - the first attempt used
      `usr/bin/chromium`, the gate stayed red, and that is how this was found. `purls`
      scopes to pkg:deb/debian/chromium* only, which honours the scoping the ratio of
      [2026] VJS-CC-BOLTRIG-SUPPLY-CHAIN-ADVISORY-ACCEPTANCE-001 requires while actually
      matching. This is NOT a global ignore.
      chromium 150.0.7871.181-1~deb12u1 in the fleet image, which ships it for the
      browser-cli adapter (browser-use). Trivy reports "fixed 151.0.7922.47-1", but
      that is the UPSTREAM CHROME version, not a Debian package: measured 2026-07-31,
      the newest chromium available to bookworm INCLUDING bookworm-security is exactly
      the installed 150.0.7871.181-1~deb12u1, and trixie carries the same code as
      150.0.7871.181-1~deb13u1. No Debian release carries the fix, so there is nothing
      to upgrade to and no rebuild or base change takes it. Follows the ratio of
      [2026] VJS-CC-BOLTRIG-SUPPLY-CHAIN-ADVISORY-ACCEPTANCE-001, which names this
      exact shape: the gate blocks because a PACKAGE-level fix exists even though no
      released ARTIFACT carries one.
      REACHABILITY, STATED HONESTLY AS THAT RATIO REQUIRES: this is NOT unreachable.
      chromium is present and running in both production fleet workers, and the
      browser-cli adapter is ACTIVATED on the Classical Visas tenant. Browser
      automation renders remote content by definition, so a sandbox escape is live
      wherever the adapter is invoked. What bounds it TODAY is usage, not
      architecture: all six browser verbs (web.fetch, browser.doctor, browser.tab.open,
      browser.remote.start, browser.remote.stop, browser.page.info) have ZERO rows in
      that tenant's audit_log - the adapter has never once been invoked. The second
      tenant registers no browser adapter at all.
      THE EXPIRY IS SIX WEEKS, NOT THE USUAL YEAR, because usage is a weak bound: the
      day someone invokes a browser verb the exposure becomes real with no further
      change. Before renewal, prefer DEACTIVATING browser-cli on any tenant not using
      it, or dropping chromium from the image, over extending this. Recorded because
      an unscanned image was deployed to both prod stacks on 2026-07-31 while branch
      protection was being bypassed - silence is what this file exists to prevent.
  - id: CVE-2026-16805
    purls: *chromium_purls
    expired_at: 2026-09-11
    statement: *chromium_statement
  - id: CVE-2026-16806
    purls: *chromium_purls
    expired_at: 2026-09-11
    statement: *chromium_statement
  - id: CVE-2026-16807
    purls: *chromium_purls
    expired_at: 2026-09-11
    statement: *chromium_statement
  - id: GHSA-hrxh-6v49-42gf
    paths:
      - usr/local/bin/rclone
    expired_at: 2026-10-23
    statement: >-
      google.golang.org/grpc v1.80.0 vendored inside the upstream rclone binary;
      fixed in grpc 1.82.1, but no rclone release carries it - v1.74.4 IS the
      latest upstream release, so there is nothing to upgrade to. The advisory
      covers xDS RBAC and HTTP/2 handling in gRPC servers; the backup image runs
      rclone only as a CLIENT in a fixed backup loop, serves no gRPC, publishes
      no ports, and never uses xDS service-mesh configuration. Recorded in
      docs/security/accepted-advisories.json; drop this the moment rclone ships
      a build with grpc >= 1.82.1.
  - id: CVE-2026-56852
    paths:
      - usr/local/bin/rclone
    expired_at: 2026-10-23
    statement: >-
      golang.org/x/text v0.38.0 vendored inside the upstream rclone binary;
      fixed in x/text 0.39.0, but no rclone release carries it - v1.74.4 IS
      the latest upstream release, so there is nothing to upgrade to.
      Accepted under 2026-VJS-CC-BOLTRIG-SUPPLY-CHAIN-ADVISORY-ACCEPTANCE-001;
      owner release-engineering. The advisory is a norm.Iter infinite loop on
      input containing invalid UTF-8. The backup image runs rclone strictly
      as a CLIENT in a fixed backup loop against operator-configured remotes;
      it serves nothing and publishes no ports, but it DOES process names and
      listings returned by the remote, so reaching the defect requires a
      compromised operator-provisioned remote - at which point the attacker
      already holds the off-box backup channel. Recorded in
      docs/security/accepted-advisories.json; drop this the moment a released
      rclone carries golang.org/x/text >= 0.39.0.
