misconfigurations:
  - id: DS-0031
    paths:
      - deploy/kernel.Dockerfile
      - deploy/fleet.Dockerfile
    expired_at: 2027-01-31
    statement: >-
      False positive on the name, not the value. BOLTRIG_CODEX_AUTH_HELPER holds a
      PATH to an executable (/opt/boltrig/codex/model_auth_helper), never a
      credential; DS-0031 matches any env whose name contains "AUTH". The helper
      is how a codex cell obtains a bearer WITHOUT one being baked into the image,
      so this ENV is part of the mitigation the check is looking for, not a leak.
      The value is fixed, non-secret, and identical in every layer.
  - id: AVD-DS-0002
    paths:
      - deploy/backup.Dockerfile
    expired_at: 2026-10-15
    statement: >-
      Release engineering owns migration from root after operator bind-mount
      ownership is made portable; the service publishes no ports, the image
      drops unused gosu, and it runs only the fixed backup loop entrypoint.
  - id: AVD-DS-0002
    paths:
      - apps/worker/Dockerfile
      - apps/worker/Dockerfile
    expired_at: 2026-08-15
    statement: >-
      Frontend engineering owns the nginx-unprivileged migration; the secure
      overlay removes the direct host port and the digest-pinned runtime serves
      only the generated static build through its fixed nginx configuration.
      apps/worker/Dockerfile is the sole Worker runtime stage - the
      same pinned nginx alpine, the same static root, the same fixed config -
      so it is listed here rather than given an entry of its own, and
      deliberately shares this expiry rather than taking a fresh one. The
      justification for the original date is migration cost on a LIVE artefact,
      and the worker image is profile-gated and runs nowhere, so it has earned
      no extra time: a separate entry would have let the newer image quietly
      extend a deadline the older one is already close to. Both move to
      nginx-unprivileged as one piece of work, or this expires and iac-scan
      turns red on both.

vulnerabilities:
  # July 2026 chromium wave (CVE-2026-16804, -16805, -16806, -16807) RETIRED
  # 2026-08-22. Those four rested on a 2026-07-31 measurement that the installed
  # 150.0.7871.181-1~deb12u1 was the newest chromium anywhere in bookworm and
  # that "no rebuild or base change takes it". The archive has since moved: the
  # image now installs 151.0.7922.137-1~deb12u1 from bookworm-security, which is
  # past the 151.0.7922.47-1 those findings named as fixed. Measured, not
  # assumed: aquasec/trivy:0.72.0 against the built fleet image reports ZERO
  # findings for all four ids, and the gate stays green with these entries gone.
  # An acceptance kept after its fix has landed is not harmless - trivy matches
  # on CVE id plus purl, never on the version recorded here, so an inert entry
  # would equally hide a genuine re-report of the same ids. Retiring it is the
  # holding of [2026] VJS-CC-BOLTRIG-SUPPLY-CHAIN-ADVISORY-ACCEPTANCE-001, which
  # makes an acceptance self-cancelling by condition; only RENEWAL needs a fresh
  # ruling. The purl-scoping measurement those entries carried is preserved in
  # the wave-2 statement below.
  # August 2026 chromium wave (11 CVEs, all HIGH, all fixed upstream in
  # 151.0.7922.169-1~deb12u1). DIFFERENT SHAPE from the block above: here the
  # fixed version IS a real Debian package version, announced but NOT YET
  # PUBLISHED - measured 2026-08-21, deb.debian.org/debian-security
  # bookworm-security serves exactly the installed 151.0.7922.137-1~deb12u1,
  # so `apt-get update && install` on a cache-less rebuild (verified twice on
  # CI runners) still takes .137 and there is nothing to upgrade to TODAY.
  # These entries become inert the moment the archive publishes .169 (the
  # Dockerfile installs chromium unpinned, so the next image build takes the
  # fix with no change here); delete them at that point rather than letting
  # them ride to expiry. Expiry deliberately SHARES 2026-09-11 with the block
  # above - the wave has earned no extra time.
  - id: CVE-2026-76033
    purls: &chromium_purls
      - "pkg:deb/debian/chromium"
      - "pkg:deb/debian/chromium-common"
    expired_at: 2026-09-11
    statement: &chromium_wave2_statement >-
      SCOPED BY EXACT PURL - NO WILDCARDS, and both packages listed. Measured with
      the pinned scanner (aquasec/trivy:0.72.0) against the built image: a trailing
      `*` (`pkg:deb/debian/chromium*`) matches NOTHING, and `chromium-common` is a
      separate package that needs its own purl - with only `chromium` listed, 8
      findings became 7, not 6. SCOPED BY PURL, NOT BY PATH, and that distinction is
      load-bearing: these are dpkg findings, so trivy attributes them to the PACKAGE,
      not a file, and a `paths` entry can never match - the ignore would be silently
      INERT. Verify any change to this block by running the scanner locally rather
      than pushing and reading CI; two earlier attempts looked correct in review and
      suppressed nothing. This is NOT a global ignore. (That measurement was first
      recorded on the July 2026 block, retired 2026-08-22 once its findings were
      genuinely fixed; it is carried here so it is not lost with it.) Fixed
      version 151.0.7922.169-1~deb12u1 is announced in the advisory data but
      not yet published: measured 2026-08-21, bookworm-security's
      binary-amd64 Packages index offers exactly the installed
      151.0.7922.137-1~deb12u1, and two cache-less CI rebuilds
      (`docker build --pull`, fresh runners) both installed it. No rebuild or
      base change can take a package the archive does not serve. Follows the
      ratio of [2026] VJS-CC-BOLTRIG-SUPPLY-CHAIN-ADVISORY-ACCEPTANCE-001:
      accept only where the fix cannot be taken, and only as a record.
      REACHABILITY, STATED HONESTLY AS THAT RATIO REQUIRES: this is NOT
      unreachable. chromium is present and running in both production fleet
      workers, and the browser-cli adapter is ACTIVATED on the Classical Visas
      tenant. Browser automation renders remote content by definition, so a
      sandbox escape is live wherever the adapter is invoked. What bounds it
      TODAY is usage, not architecture: all six browser verbs (web.fetch,
      browser.doctor, browser.tab.open, browser.remote.start,
      browser.remote.stop, browser.page.info) had ZERO rows in that tenant's
      audit_log when last measured - the adapter has never once been invoked.
      The second tenant registers no browser adapter at all. The same
      compensating controls stand: HITL-gated at the chokepoint, read-only root
      filesystem. All of it is recorded per-CVE in
      docs/security/accepted-advisories.json.
      THE EXPIRY IS SIX WEEKS, NOT THE USUAL YEAR, because usage is a weak
      bound: the day someone invokes a browser verb the exposure becomes real
      with no further change. Before renewal, prefer DEACTIVATING browser-cli on
      any tenant not using it, or dropping chromium from the image, over
      extending this. The image installs chromium
      unpinned, so the first build after the archive publishes .169 carries
      the fix with no change here - delete this block then.
  - id: CVE-2026-76036
    purls: *chromium_purls
    expired_at: 2026-09-11
    statement: *chromium_wave2_statement
  - id: CVE-2026-76037
