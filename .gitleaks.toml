[extend]
useDefault = true

# These are deliberately fake values exercised by regression tests for the
# application's own secret/PII detector. Each exception requires the specific
# rule, path, and fixture value; no directory or rule is globally suppressed.
[[allowlists]]
description = "Unknown 2FA challenge fixture"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^tests/security/test_two_factor\.py$''']
regexTarget = "line"
regexes = ['''boltrig_2fa_nope''']

[[allowlists]]
description = "Memory-ingest OpenSSH rejection fixture"
condition = "AND"
targetRules = ["private-key"]
paths = ['''^tests/security/test_round_five\.py$''']
regexTarget = "match"
regexes = ['''(?s)-----BEGIN OPENSSH PRIVATE KEY-----.*b3BlbnNzaC1rZXktdjEAAAAABG5vbmU.*-----END OPENSSH PRIVATE KEY-----''']

[[allowlists]]
description = "PII scanner PEM rejection fixtures"
condition = "AND"
targetRules = ["private-key"]
paths = ['''^tests/security/test_budget_and_pii\.py$''']
regexTarget = "match"
regexes = ['''(?s)-----BEGIN (?:RSA |OPENSSH )?PRIVATE KEY-----.*-----END(?: RSA| OPENSSH)? PRIVATE KEY-----''']

[[allowlists]]
description = "PII scanner Stripe rejection fixtures"
condition = "AND"
targetRules = ["stripe-access-token"]
paths = ['''^tests/security/test_budget_and_pii\.py$''']
regexTarget = "line"
regexes = ['''(?:sk|rk)_live_51H8xAbCdEfGhIjKlMnOpQrSt''']

[[allowlists]]
# HISTORY ONLY. The working tree no longer contains this value: the fleet-health
# fixture key is now an obviously-fake string, like every other fixture here. But
# `make secret-scan` scans the full commit history, and this literal is in
# fdbe6f6 - 64 random hex characters, written as a test key and completely
# indistinguishable from a real HMAC key, which is exactly why the scanner was
# right to stop it. Rewriting a pushed main to erase it would cost more than it
# is worth, so it is named here, exactly, and nothing else is suppressed.
description = "Fleet-health receipt fixture key (removed from HEAD, still in fdbe6f6)"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^tests/unit/test_fleet_health\.py$''']
regexTarget = "line"
regexes = ['''b9f2c1a4e7d38650f1c2b3a4958d6e7f0a1b2c3d4e5f60718293a4b5c6d7e8f9''']

[[allowlists]]
# The AI-key SEALING test's own fixture. The value is an obviously-fake sentence
# in hyphenated english, and it is the material the test then PROVES never leaves
# the sealed store - so the one place it is written is the place that exists to
# show it cannot escape. generic-api-key matched it on the `sk-` prefix and the
# length, not on any property that makes it a credential.
#
# Scoped exactly like every other fixture entry here: one rule, one path, one
# literal. Nothing else in that file is suppressed, so a REAL key added to it
# tomorrow still stops the scan.
description = "AI key sealing fixture (tests/security/test_ai_key_secret_proposals.py)"
condition = "AND"
targetRules = ["generic-api-key"]
paths = [
  '''^tests/security/test_ai_key_secret_proposals\.py$''',
  '''^tests/store/test_ai_key_secret_proposals\.py$''',
]
regexTarget = "line"
regexes = ['''sk-proposal-secret-material-0123456789''']

[[allowlists]]
description = "Webhook signature verification fixture"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^tests/security/test_channel_governance\.py$''']
regexTarget = "line"
regexes = ['''whsec_gov_123''']

[[allowlists]]
description = "Channel roundtrip signing-secret fixtures"
condition = "AND"
targetRules = ["generic-api-key"]
paths = [
  '''^tests/security/test_channel_discord_roundtrip\.py$''',
  '''^tests/security/test_channel_gateway_roundtrip\.py$''',
  '''^tests/security/test_channel_signal_roundtrip\.py$''',
  '''^tests/security/test_channel_telegram_roundtrip\.py$''',
  '''^tests/security/test_channel_xai_voice_roundtrip\.py$''',
]
regexTarget = "line"
# The exact literals, not a wildcard: each is the per-test HMAC signing secret the
# roundtrip drives the gateway with. Naming them keeps the exception as narrow as
# every other one here - a real credential appearing in these files would still
# be caught.
regexes = ['''(?:discord|signal|telegram|voice)roundtrip_123|roundtripsec_123''']

[[allowlists]]
# A Figma FILE KEY is a URL path component (figma.com/design/<key>/...), not a
# credential - access still requires Figma authentication. The VDS figma ledger
# records it as the decided-target pin. Entropy alone trips generic-api-key.
description = "VDS figma ledger: file keys are URL identifiers, not secrets"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^\.vds/ledgers/figma\.yaml$''']
regexTarget = "line"
regexes = ['''file_key: iVQBKFc3NpRH3zdOOxfPqr''']
