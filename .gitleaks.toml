[extend]
useDefault = true

# These are deliberately fake values exercised by regression tests for the
# application's own secret/PII detector. Each exception requires the specific
# rule, path, and fixture value; no directory or rule is globally suppressed.
[[allowlists]]
description = "Unknown 2FA challenge fixture"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^tests/security/test_two_factor\.py$''']
regexTarget = "line"
regexes = ['''boltrig_2fa_nope''']

[[allowlists]]
description = "Memory-ingest OpenSSH rejection fixture"
condition = "AND"
targetRules = ["private-key"]
paths = ['''^tests/security/test_round_five\.py$''']
regexTarget = "match"
regexes = ['''(?s)-----BEGIN OPENSSH PRIVATE KEY-----.*b3BlbnNzaC1rZXktdjEAAAAABG5vbmU.*-----END OPENSSH PRIVATE KEY-----''']

[[allowlists]]
description = "PII scanner PEM rejection fixtures"
condition = "AND"
targetRules = ["private-key"]
paths = ['''^tests/security/test_budget_and_pii\.py$''']
regexTarget = "match"
regexes = ['''(?s)-----BEGIN (?:RSA |OPENSSH )?PRIVATE KEY-----.*-----END(?: RSA| OPENSSH)? PRIVATE KEY-----''']

[[allowlists]]
description = "PII scanner Stripe rejection fixtures"
condition = "AND"
targetRules = ["stripe-access-token"]
paths = ['''^tests/security/test_budget_and_pii\.py$''']
regexTarget = "line"
regexes = ['''(?:sk|rk)_live_51H8xAbCdEfGhIjKlMnOpQrSt''']

[[allowlists]]
# HISTORY ONLY. The working tree no longer contains this value: the fleet-health
# fixture key is now an obviously-fake string, like every other fixture here. But
# `make secret-scan` scans the full commit history, and this literal is in
# fdbe6f6 - 64 random hex characters, written as a test key and completely
# indistinguishable from a real HMAC key, which is exactly why the scanner was
# right to stop it. Rewriting a pushed main to erase it would cost more than it
# is worth, so it is named here, exactly, and nothing else is suppressed.
description = "Fleet-health receipt fixture key (removed from HEAD, still in fdbe6f6)"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^tests/unit/test_fleet_health\.py$''']
regexTarget = "line"
regexes = ['''b9f2c1a4e7d38650f1c2b3a4958d6e7f0a1b2c3d4e5f60718293a4b5c6d7e8f9''']

[[allowlists]]
# The AI-key SEALING test's own fixture. The value is an obviously-fake sentence
# in hyphenated english, and it is the material the test then PROVES never leaves
# the sealed store - so the one place it is written is the place that exists to
# show it cannot escape. generic-api-key matched it on the `sk-` prefix and the
# length, not on any property that makes it a credential.
#
# Scoped exactly like every other fixture entry here: one rule, one path, one
# literal. Nothing else in that file is suppressed, so a REAL key added to it
# tomorrow still stops the scan.
description = "AI key sealing fixture (tests/security/test_ai_key_secret_proposals.py)"
condition = "AND"
targetRules = ["generic-api-key"]
paths = [
  '''^tests/security/test_ai_key_secret_proposals\.py$''',
  '''^tests/store/test_ai_key_secret_proposals\.py$''',
]
regexTarget = "line"
regexes = ['''sk-proposal-secret-material-0123456789''']

[[allowlists]]
description = "Webhook signature verification fixture"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^tests/security/test_channel_governance\.py$''']
regexTarget = "line"
regexes = ['''whsec_gov_123''']

[[allowlists]]
description = "Channel roundtrip signing-secret fixtures"
condition = "AND"
targetRules = ["generic-api-key"]
paths = [
  '''^tests/security/test_channel_discord_roundtrip\.py$''',
  '''^tests/security/test_channel_gateway_roundtrip\.py$''',
  '''^tests/security/test_channel_signal_roundtrip\.py$''',
  '''^tests/security/test_channel_telegram_roundtrip\.py$''',
  '''^tests/security/test_channel_xai_voice_roundtrip\.py$''',
]
regexTarget = "line"
# The exact literals, not a wildcard: each is the per-test HMAC signing secret the
# roundtrip drives the gateway with. Naming them keeps the exception as narrow as
# every other one here - a real credential appearing in these files would still
# be caught.
regexes = ['''(?:discord|signal|telegram|voice)roundtrip_123|roundtripsec_123''']

[[allowlists]]
# A Figma FILE KEY is a URL path component (figma.com/design/<key>/...), not a
# credential - access still requires Figma authentication. The VDS figma ledger
# records it as the decided-target pin. Entropy alone trips generic-api-key.
description = "VDS figma ledger: file keys are URL identifiers, not secrets"
condition = "AND"
targetRules = ["generic-api-key"]
paths = [
  '''^\.vds/directions/DIR-000[1-7]\.yaml$''',
  '''^\.vds/ledgers/(?:figma|frames)\.yaml$''',
  '''^\.vds/reviews/VRW-000[1-6]\.yaml$''',
  '''^\.vds/screens/SCR-000[1-7]\.yaml$''',
  '''^docs/design/evidence/2026-08-11-console-parity/capture-manifest\.json$''',
  '''^docs/design/evidence/2026-08-11-console-parity/figma-connected-inventory\.json$''',
  '''^docs/design/evidence/2026-08-11-console-parity/vds-review-inputs\.pending\.json$''',
]
regexTarget = "line"
regexes = ['''iVQBKFc3NpRH3zdOOxfPqr''']

[[allowlists]]
# HISTORY ONLY, and third-party. e7f56dfc committed the machine's whole pnpm
# content-addressable cache -- 7695 files of downloaded npm package bodies. The
# working tree no longer tracks it (see the untrack commit) and .gitignore now
# refuses it, but `make secret-scan` reads the full history and these blobs are
# in that commit for good.
#
# None of the matches are ours, and none are live. In order:
#   * three are @tauri-apps/api bundle files -- an IPC token constant in
#     Tauri's own published source, matched on shape and entropy
#   * one is a babel-helpers sourcemap
#   * one is the @types/node `node:https` declaration file
#
# Named as SEVEN EXACT PATHS rather than a `^\.pnpm-store/` prefix. A pnpm store
# is content-addressed, so the path IS the sha512 of the content: this is
# narrower than naming a literal would be, because any other bytes hash to a
# different path and the scan still stops them. The header's promise that no
# directory is globally suppressed survives intact.
description = "pnpm store cache: vendored npm package bodies (untracked at HEAD, still in e7f56dfc)"
condition = "AND"
targetRules = ["generic-api-key"]
paths = [
  '''^\.pnpm-store/v11/files/18/5a900adb2329b63a140c5530031bc005261466a961a0dfbdad854020002b864f62150f0e6c296d4caf2f130d763126dba542da6e5fa2db6cd4afeb0fa44f62$''',
  '''^\.pnpm-store/v11/files/7e/d24c9351880e3f6e72fc9818e7bed1c73ff1dd53ac8d471a06a2c6ac55b6c4569c5edc204a15c469f5ebc33dfad42bf1ef2fe51272de38cd78509cc31193f0$''',
  '''^\.pnpm-store/v11/files/d8/d68a1a678353b2e33b8deb645159b5817f524c77d375ab2bf4998da7324451d9a945732d21d66883acfd858bc8ed5aaa4867c3365841def10e141cae8e6611$''',
  '''^\.pnpm-store/v11/files/e1/d9b1d6de5c1eba900d99fd2e5a4e1196871a688ba1eb99dddf263a9510d12306e1b604a84f337408ff09e2fad34168d59896ec06c92b7e66a6b39cb5ac8503$''',
  '''^\.pnpm-store/v11/files/fd/af6875937b78473f336aef343a8c65274b97efed1960d7c3177bae74c1e738c53c641e354c8fab35b2d2a16312efe4b1c621ceb3acb300613a848bcb49901a$''',
]

[[allowlists]]
# Same commit, same reasoning. Both of these are happy-dom's `SSL certificate
# generated for Happy DOM to be able to perform HTTPS requests` -- a self-signed
# localhost cert and key that ship INSIDE the published npm package so its test
# server can speak HTTPS. It is public on the registry, it is not ours, and it
# authenticates nothing of ours.
description = "pnpm store cache: happy-dom's published self-signed test cert (still in e7f56dfc)"
condition = "AND"
targetRules = ["private-key"]
paths = [
  '''^\.pnpm-store/v11/files/1c/4b4cba4b152166979ba0a80bfaa5021af1a3370a2ca808a62191ed025abadc3bdbfba25bb10cb0475acb9196155b0884b90afcb8c520d429e8d43ea6302815$''',
  '''^\.pnpm-store/v11/files/a2/5328449d734287715498f1abf179a21980aec52e9021c85b837a0f70b75b0d20dfeb08e871878dee929f91995fdda07ba25365d4452d6addbc01d448541b9b$''',
]
