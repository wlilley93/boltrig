allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
# Smallest explicit upgrades that close current high advisories.
#
# THESE PINS GO STALE, and this is the second time that has been written here.
# They are set against the advisories current on the day, so a NEW advisory on the
# same package lands BELOW them and the audit fails on code nobody touched. That is
# what happened on 2026-08-05: GHSA-rgw5-rvv9-x895 raised the floor to 1.1.18 and
# 5.0.9 while these read 1.1.16 and >=5.0.8, and CI went red on a branch whose diff
# does not reach this directory. Re-check here on EVERY audit failure before
# assuming the failure is yours, and drop an entry once the puller adopts a fix.
#
# The auditConfig.ignoreGhsas block that used to sit below is GONE, not moved.
# It suppressed GHSA-mh99-v99m-4gvg on the stated grounds that 'brace-expansion 1.x
# ends at 1.1.16 and 2.x at 2.1.2, the fix ships only in 5.0.8'. Both halves are now
# false: 1.1.18 and 2.1.4 are published and carry the fix. Verified by deleting the
# block and re-running the audit - 'No known vulnerabilities found' - rather than by
# reasoning about it. Its own comment said to remove it the moment the pullers moved.
overrides:
  # Per-major, NOT a blanket '>=5.0.8': minimatch@3 calls the 1.x braceExpand
  # API, so forcing 5.x into it throws at lint time. Each line is pinned to the
  # highest release that exists on it.
  brace-expansion@<2.0.0: 1.1.18
  brace-expansion@>=2.0.0 <3.0.0: 2.1.4
  brace-expansion@>=5.0.0: '>=5.0.9'
  # js-yaml: GHSA-5p4m-2wfm-xmqj / CVE-2026-59870, quadratic CPU consumption in
  # !!omap. Published after main last ran green on 2026-08-06 12:36, so it turned
  # up as a red check on a branch whose diff does not reach this directory at all
  # - the THIRD time that pattern has appeared in two days. Vulnerable >=4.0.0
  # <4.3.1; the lock held 4.3.0, one patch short.
  # BOTH SIDES ARE BOUNDED, and the value is the half that matters. A blanket
  # '>=4.3.1' resolved to js-yaml@5.2.3 - a major jump to close a 4.x advisory,
  # exactly the failure this file already records for brace-expansion. Bounding
  # only the SELECTOR (js-yaml@>=4.0.0 <5.0.0) did not fix it: the selector picks
  # which requests to rewrite, the value decides what they become, and '>=4.3.1'
  # still admits 5.x. It took a clean re-resolve to see that, because pnpm keeps
  # an already-resolved 5.2.3 and the narrowed selector then matches nothing.
  js-yaml@>=4.0.0 <5.0.0: '>=4.3.1 <5.0.0'
  postcss: '>=8.5.18'
  sharp: '>=0.35.0'
