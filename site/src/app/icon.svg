<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <!-- Kept byte-for-byte equivalent to public/favicon.svg. Two files, one mark:
       Next serves this one at /icon.svg from the app directory and the head
       links /favicon.svg from public, so a browser can reach either. They
       disagreeing is how a tab ends up showing yesterday's logo. -->
  <rect width="100" height="100" fill="#FFFFFF" />
  <circle cx="50" cy="50" r="32" stroke="#04060D" stroke-width="6" stroke-linecap="round" stroke-dasharray="167.3 33.5" />
  <circle cx="50" cy="50" r="7" fill="#3DD3F0" />
</svg>
