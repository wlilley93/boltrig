name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: boltrig-release
  cancel-in-progress: false

jobs:
  preflight:
    name: Prepare draft release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      actions: read
      contents: write
      packages: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    outputs:
      release-commit: ${{ steps.verify.outputs.release-commit }}
    steps:
      - name: Checkout release commit with full ancestry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Every candidate build takes ~10 minutes. Discovering AFTER them that the
      # registry will not accept the push wastes all of it and reports
      # `denied: permission_denied: write_package`, which names neither the cause
      # nor the fix. That message is why v0.4.11 - the only release run this
      # workflow has ever had - died, and why every image in production was built
      # by hand outside this protected path instead: unsigned, unscanned, no SBOM.
      #
      # The cause is specific, and that run proved it by accident: pi-sidecar
      # pushed fine while kernel, fleet and ui were denied. The sidecar package was
      # LINKED to this repository; the others are user-owned packages that predate
      # this workflow and grant it nothing. GitHub links a package via the
      # org.opencontainers.image.source label only when the push CREATES it, so an
      # existing package cannot bootstrap its own access, and no REST or GraphQL
      # endpoint exposes the setting.
      - name: Registry write access, before spending ten minutes building
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
          USING_PAT: ${{ secrets.GHCR_PUSH_TOKEN && 'yes' || 'no' }}
        shell: bash
        run: |
          set -uo pipefail
          if [ "$USING_PAT" = yes ]; then
            echo "credential: GHCR_PUSH_TOKEN (repository secret)"
          else
            echo "credential: the built-in GITHUB_TOKEN"
          fi
          owner="${GITHUB_REPOSITORY%%/*}"
          name="$(echo "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')"
          denied=""
          for image in kernel fleet ui worker-ui backup; do
            pkg="$name-$image"
            # sed, not a JSON parser: on a bad credential the body is not JSON at
            # all, and a parser would die here with a stack trace instead of the
            # explanation this step exists to print - at exactly the moment it is
            # needed. No token extracted means DENIED, said plainly.
            tok="$(curl -s -u "x:$GHCR_TOKEN" \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:$owner/$pkg:pull,push" \
              | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')"
            # Open a blob upload and cancel it. The registry answers 202 only if
            # this credential may WRITE, and a cancelled session leaves nothing -
            # no tag, no layer, and it cannot create the package by accident. A
            # docker-push probe would do all three, and creating a package with the
            # wrong owner is precisely the defect being detected.
            hdrs="$(curl -s --retry 3 --retry-all-errors --retry-delay 2 \
              -D- -o /dev/null -X POST \
              -H "Authorization: Bearer $tok" \
              "https://ghcr.io/v2/$owner/$pkg/blobs/uploads/" | tr -d '\r')"
            code="$(printf '%s' "$hdrs" | head -1 | awk '{print $2}')"
            # `|| true` is load-bearing. On a genuine denial there is NO Location
            # header, so grep exits 1; pipefail propagates it, the assignment fails,
            # and GitHub's `bash -e` aborts the step - before the DENIED branch below
            # can print anything. This step could not report a denial, which is the
            # one thing it exists to report.
            loc="$(printf '%s' "$hdrs" | grep -i '^location:' | cut -d' ' -f2- || true)"
            if [ -n "$loc" ]; then
              # The registry returns Location as a PATH, not an absolute URL. Handing
              # that straight to curl is a malformed URL: curl exits 3 and `bash -e`
              # kills the step - one line after it has already proved the push IS
              # permitted. That is what killed v0.4.14, twice.
              case "$loc" in
                http://*|https://*) cancel="$loc" ;;
                *) cancel="https://ghcr.io$loc" ;;
              esac
              # Best effort: an uncancelled upload session expires by itself, so
              # cleanup must never be able to fail the release.
              curl -s -o /dev/null -X DELETE -H "Authorization: Bearer $tok" "$cancel" || true
            fi
            if [ "$code" = 202 ]; then
              echo "  $image: writable"
            else
              denied="$denied $image"
              echo "  $image: DENIED (HTTP ${code:-no-response})"
            fi
          done
          if [ -z "$denied" ]; then
            exit 0
          fi
          {
            echo
            echo "The registry will not accept a push for:$denied"
            echo
            echo "These are user-owned GHCR packages that predate this workflow, so this"
            echo "repository's Actions token has no write access to them. Nothing in the"
            echo "workflow can grant it. Two one-time fixes, either is enough:"
            echo
            echo "  (a) For each package above: Package settings -> Manage Actions access"
            echo "      -> add $GITHUB_REPOSITORY with the Write role."
            echo "      https://github.com/users/$owner/packages"
            echo
            echo "  (b) Add a repository secret GHCR_PUSH_TOKEN holding a PAT with"
            echo "      write:packages (and optionally GHCR_PUSH_USER). Every login in"
            echo "      this workflow already prefers it over the built-in token."
            echo
            echo "Failing here rather than after the builds, on purpose."
          } >&2
          exit 1

      - name: Require a new semantic tag reachable from the default branch
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "release tag must be vMAJOR.MINOR.PATCH with an optional prerelease" >&2
            exit 1
          fi
          release_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          git merge-base --is-ancestor "$release_commit" "origin/$DEFAULT_BRANCH"
          echo "release-commit=$release_commit" >> "$GITHUB_OUTPUT"

      - name: Require canonical CI and security success for the exact release commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMMIT: ${{ steps.verify.outputs.release-commit }}
        shell: bash
        run: |
          set -euo pipefail
          require_successful_workflow() {
            local workflow_file="$1"
            local check_name="$2"
            local response latest status conclusion url
            response="$(gh api --method GET \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_file/runs" \
              -f branch="$DEFAULT_BRANCH" \
              -f head_sha="$RELEASE_COMMIT" \
              -f per_page=100)"
            latest="$(jq -c --arg sha "$RELEASE_COMMIT" \
              '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.run_number) | reverse | .[0] // empty' \
              <<<"$response")"
            if [ -z "$latest" ]; then
              echo "$check_name has no workflow run for $RELEASE_COMMIT" >&2
              exit 1
            fi
            status="$(jq -r '.status' <<<"$latest")"
            conclusion="$(jq -r '.conclusion // "pending"' <<<"$latest")"
            url="$(jq -r '.html_url' <<<"$latest")"
            if [ "$status" != completed ] || [ "$conclusion" != success ]; then
              echo "$check_name is $status/$conclusion for $RELEASE_COMMIT: $url" >&2
              exit 1
            fi
          }
          require_successful_workflow ci.yml 'ci / quality'
          require_successful_workflow security.yml 'security / Security gate'

      - name: Refuse to replace an existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $RELEASE_TAG already exists; release evidence is immutable" >&2
            exit 1
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$RELEASE_TAG"
          --repo "$GITHUB_REPOSITORY"
          --draft --verify-tag --generate-notes
          --title "$RELEASE_TAG"

  candidates:
    name: Verify candidate ${{ matrix.image }}
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment: release
    permissions:
      contents: write
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: kernel
            dockerfile: deploy/kernel.Dockerfile
            context: .
          - image: fleet
            dockerfile: deploy/fleet.Dockerfile
            context: .
          - image: ui
            dockerfile: ui/Dockerfile
            context: ui
          - image: worker-ui
            dockerfile: apps/worker/Dockerfile
            context: .
          - image: backup
            dockerfile: deploy/backup.Dockerfile
            context: .
    env:
      IMAGE: ${{ matrix.image }}
      LOCAL_IMAGE: boltrig-release-${{ matrix.image }}:${{ github.run_id }}-${{ github.run_attempt }}
      CANDIDATE_TAG: candidate-${{ github.run_id }}-${{ github.run_attempt }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_COMMIT: ${{ needs.preflight.outputs.release-commit }}
      SBOM_FILE: sbom-${{ matrix.image }}.cdx.json
      IMAGE_REF_FILE: image-ref-${{ matrix.image }}.txt
    steps:
      - name: Checkout the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      # The Operator and combined Worker/Operator images need the private-package
      # token their Dockerfiles mount as `gh_npmrc`.
      # Nothing in this workflow ever supplied that secret, so the mount was
      # empty and every ui candidate died on ERR_PNPM_FETCH_401 - which is why
      # no tag has ever produced a published release. ci.yml's ui-build proves
      # the built-in GITHUB_TOKEN can read the package, so this introduces no
      # new credential class; `packages: write` above already implies read.
      - name: Authenticate frontend builds to GitHub Packages
        if: matrix.image == 'ui' || matrix.image == 'worker-ui'
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          printf '//npm.pkg.github.com/:_authToken=%s\n' "$GH_PACKAGES_TOKEN" > "$RUNNER_TEMP/gh_npmrc"

      - name: Build release candidate locally
        env:
          BUILD_CONTEXT: ${{ matrix.context }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          DOCKER_BUILDKIT: "1"
        run: |
          set -euo pipefail
          secret_args=()
          # Only frontend matrix legs write this file, so every other image
          # builds with no secret mounted.
          if [ -f "$RUNNER_TEMP/gh_npmrc" ]; then
            secret_args+=(--secret "id=gh_npmrc,src=$RUNNER_TEMP/gh_npmrc")
          fi
          docker build --pull \
            "${secret_args[@]}" \
            --file "$DOCKERFILE" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$RELEASE_COMMIT" \
            --label "org.opencontainers.image.version=$RELEASE_TAG" \
            --tag "$LOCAL_IMAGE" \
            "$BUILD_CONTEXT"

      - name: Remove the registry token
        if: always()
        run: rm -f "$RUNNER_TEMP/gh_npmrc"

      - name: Block fixable high or critical vulnerabilities before publication
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          scan-type: image
          image-ref: ${{ env.LOCAL_IMAGE }}
          scanners: vuln
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"
          timeout: 10m
          # The SAME acceptances security.yml's blocking scan reads. Without this
          # the two gates disagree about the identical image: `Container (backup)`
          # passes on every PR while the release scan blocks on
          # GHSA-hrxh-6v49-42gf, which .trivyignore.yaml already accepts with a
          # written justification and an expiry of 2026-10-23. A release gate that
          # is stricter than the security gate BY ACCIDENT is not a stricter
          # policy, it is drift, and it is the reason no tag has ever published.
          trivyignores: .trivyignore.yaml

      - name: Generate CycloneDX SBOM from the scanned image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: image
          image-ref: ${{ env.LOCAL_IMAGE }}
          scanners: vuln
          format: cyclonedx
          output: ${{ env.SBOM_FILE }}

      - name: Log in to GitHub Container Registry
        env:
          # GHCR_PUSH_TOKEN if the repository has one, else the built-in token.
          # See the "Registry write access" preflight for why the built-in token
          # is not always enough: a user-owned package that predates this workflow
          # grants the repository's Actions no write access, and no API can grant
          # it. A write:packages PAT is the only route that avoids the package UI.
          GHCR_TOKEN: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ secrets.GHCR_PUSH_USER || github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin

      - name: Push only a run-scoped candidate and record its digest
        shell: bash
        run: |
          set -euo pipefail
          image_name="$(printf 'ghcr.io/%s-%s' "$GITHUB_REPOSITORY" "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          candidate_ref="$image_name:$CANDIDATE_TAG"
          docker tag "$LOCAL_IMAGE" "$candidate_ref"
          docker push "$candidate_ref"
          digest="$(docker buildx imagetools inspect "$candidate_ref" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "registry did not return an immutable sha256 digest" >&2
            exit 1
          fi
          image_ref="$image_name@$digest"
          echo "IMAGE_REF=$image_ref" >> "$GITHUB_ENV"
          printf '%s\n' "$image_ref" > "$IMAGE_REF_FILE"

      - name: Sign candidate digest and attest its SBOM with GitHub OIDC
        run: |
          cosign sign --yes "$IMAGE_REF"
          cosign attest --yes --type cyclonedx --predicate "$SBOM_FILE" "$IMAGE_REF"

      - name: Verify candidate signature and SBOM attestation
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}
          CERTIFICATE_ISSUER: https://token.actions.githubusercontent.com
        run: |
          cosign verify \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "$CERTIFICATE_ISSUER" \
            "$IMAGE_REF" >/dev/null
          cosign verify-attestation \
            --type cyclonedx \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "$CERTIFICATE_ISSUER" \
            "$IMAGE_REF" >/dev/null

      - name: Retain candidate evidence in Actions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.image }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.SBOM_FILE }}
            ${{ env.IMAGE_REF_FILE }}
          if-no-files-found: error
          retention-days: 90

      - name: Attach immutable evidence to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release upload "$RELEASE_TAG"
          "$SBOM_FILE" "$IMAGE_REF_FILE"
          --repo "$GITHUB_REPOSITORY"

  publish:
    name: Promote verified release
    needs: [preflight, candidates]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      COMMIT_TAG: sha-${{ needs.preflight.outputs.release-commit }}
      CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}
      CERTIFICATE_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Log in to GitHub Container Registry
        env:
          # GHCR_PUSH_TOKEN if the repository has one, else the built-in token.
          # See the "Registry write access" preflight for why the built-in token
          # is not always enough: a user-owned package that predates this workflow
          # grants the repository's Actions no write access, and no API can grant
          # it. A write:packages PAT is the only route that avoids the package UI.
          GHCR_TOKEN: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ secrets.GHCR_PUSH_USER || github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin

      - name: Download and validate all draft release evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-evidence
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'image-ref-*.txt' \
            --pattern 'sbom-*.cdx.json' \
            --dir release-evidence
          test "$(find release-evidence -name 'image-ref-*.txt' -type f | wc -l)" -eq 5
          test "$(find release-evidence -name 'sbom-*.cdx.json' -type f | wc -l)" -eq 5
          image_env=release-evidence/boltrig-images.env
          : > "$image_env"
          for image in kernel fleet ui worker-ui backup; do
            image_name="$(printf 'ghcr.io/%s-%s' "$GITHUB_REPOSITORY" "$image" | tr '[:upper:]' '[:lower:]')"
            image_ref="$(tr -d '\r\n' < "release-evidence/image-ref-$image.txt")"
            digest="${image_ref##*@}"
            test "${image_ref%@*}" = "$image_name"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            jq -e . "release-evidence/sbom-$image.cdx.json" >/dev/null
            case "$image" in
              kernel) variable=BOLTRIG_KERNEL_IMAGE ;;
              fleet) variable=BOLTRIG_FLEET_IMAGE ;;
              ui) variable=BOLTRIG_UI_IMAGE ;;
              worker-ui) variable=BOLTRIG_WORKER_UI_IMAGE ;;
              backup) variable=BOLTRIG_BACKUP_IMAGE ;;
            esac
            printf '%s=%s\n' "$variable" "$image_ref" >> "$image_env"
          done
          test "$(wc -l < "$image_env")" -eq 5

      - name: Refuse to move an existing public image tag
        shell: bash
        run: |
          set -euo pipefail
          for image in kernel fleet ui worker-ui backup; do
            image_name="$(printf 'ghcr.io/%s-%s' "$GITHUB_REPOSITORY" "$image" | tr '[:upper:]' '[:lower:]')"
            for tag in "$RELEASE_TAG" "$COMMIT_TAG"; do
              if docker buildx imagetools inspect "$image_name:$tag" >/dev/null 2>&1; then
                echo "$image_name:$tag already exists; release tags are immutable" >&2
                exit 1
              fi
            done
          done

      - name: Reverify every signed digest before promotion
        shell: bash
        run: |
          set -euo pipefail
          for image in kernel fleet ui worker-ui backup; do
            image_ref="$(tr -d '\r\n' < "release-evidence/image-ref-$image.txt")"
            cosign verify \
              --certificate-identity "$CERTIFICATE_IDENTITY" \
              --certificate-oidc-issuer "$CERTIFICATE_ISSUER" \
              "$image_ref" >/dev/null
            cosign verify-attestation \
              --type cyclonedx \
              --certificate-identity "$CERTIFICATE_IDENTITY" \
              --certificate-oidc-issuer "$CERTIFICATE_ISSUER" \
              "$image_ref" >/dev/null
          done

      - name: Promote verified digests to immutable public tags
        # A release tag must resolve to the exact bytes cosign signed. `docker buildx
        # imagetools create` cannot do that: the candidates are pushed by `docker push`,
        # so they are plain manifests, and imagetools only ever emits a manifest INDEX.
        # It therefore WRAPS the candidate and mints a fresh digest, leaving the public
        # tag pointing at bytes no signature covers. v0.4.13 promoted the kernel that way
        # and the digest assertion below is what caught it.
        # A retag is a manifest PUT of the bytes already in the registry, so the digest is
        # preserved by construction. Fetching them by digest also lets promotion prove,
        # locally and unforgeably, that what it is about to publish hashes to the signed
        # digest, before it publishes it.
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ secrets.GHCR_PUSH_USER || github.actor }}
        shell: bash
        run: |
          set -euo pipefail
          accept='application/vnd.oci.image.index.v1+json'
          accept="$accept,application/vnd.oci.image.manifest.v1+json"
          accept="$accept,application/vnd.docker.distribution.manifest.list.v2+json"
          accept="$accept,application/vnd.docker.distribution.manifest.v2+json"
          basic="$(printf '%s:%s' "$GHCR_USER" "$GHCR_TOKEN" | base64 -w0)"

          for image in kernel fleet ui worker-ui backup; do
            image_ref="$(tr -d '\r\n' < "release-evidence/image-ref-$image.txt")"
            image_name="${image_ref%@*}"
            digest="${image_ref##*@}"
            repository="${image_name#ghcr.io/}"

            token="$(curl -fsSL -H "Authorization: Basic $basic" \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:$repository:pull,push" \
              | jq -r '.token')"
            test -n "$token" && test "$token" != null

            curl -fsSL -H "Authorization: Bearer $token" -H "Accept: $accept" \
              -D manifest-headers.txt -o manifest.bin \
              "https://ghcr.io/v2/$repository/manifests/$digest"

            # The signed digest IS the hash of these bytes. If they do not hash to it,
            # promotion stops before anything is published.
            fetched="sha256:$(sha256sum manifest.bin | cut -d' ' -f1)"
            if [ "$fetched" != "$digest" ]; then
              echo "$image: registry returned bytes hashing to $fetched, signed digest is $digest" >&2
              exit 1
            fi

            content_type="$(tr -d '\r' < manifest-headers.txt \
              | awk 'tolower($1) == "content-type:" { print $2 }' | tail -1)"
            test -n "$content_type"

            for tag in "$RELEASE_TAG" "$COMMIT_TAG"; do
              curl -fsS -X PUT -o /dev/null \
                -H "Authorization: Bearer $token" \
                -H "Content-Type: $content_type" \
                --data-binary @manifest.bin \
                "https://ghcr.io/v2/$repository/manifests/$tag"
              promoted_digest="$(docker buildx imagetools inspect "$image_name:$tag" --format '{{json .Manifest.Digest}}' | tr -d '"')"
              test "$promoted_digest" = "$digest"
            done
            rm -f manifest.bin manifest-headers.txt
          done

      - name: Attach the digest-pinned Compose environment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release upload "$RELEASE_TAG"
          release-evidence/boltrig-images.env
          --repo "$GITHUB_REPOSITORY"

      - name: Publish the fully verified GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release edit "$RELEASE_TAG"
          --repo "$GITHUB_REPOSITORY"
          --draft=false

  release:
    name: Release gate
    if: ${{ always() }}
    needs: [preflight, candidates, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require a fully published signed release
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          CANDIDATES_RESULT: ${{ needs.candidates.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          test "$PREFLIGHT_RESULT" = success
          test "$CANDIDATES_RESULT" = success
          test "$PUBLISH_RESULT" = success
