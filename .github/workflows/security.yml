name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  # NEVER cancel on the default branch. This is a required status check, so a
  # cancelled run on `main` is indistinguishable from a failed one: the ref is
  # left with no successful evidence and nothing can merge against it. Observed
  # repeatedly on 2026-07-25 - a rapid push cadence cancelled four consecutive
  # security runs, and the check appeared broken when it had simply never been
  # allowed to finish. Cancelling is still right on PRs and topic branches, where
  # superseding a run wastes nothing that any gate depends on.
  #
  # Condition precedent (a) of [2026] VJS-CC-BOLTRIG-BRANCH-PROTECTION-001 Order
  # 4: enforce_admins: true cannot lawfully be ordered while a required check
  # cancels itself on the guarded ref, because that gate would have no path
  # through it.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  source-security:
    name: Source security
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install hash-locked security tools and project graph
        run: python -m pip install --require-hashes -r requirements-dev-lock.txt

      - name: Audit Python graphs, run SAST, and scan IaC
        run: make python-audit sast iac-scan PY=python

      - name: Scan complete Git history for secrets
        run: make secret-scan PY=python

      - name: Lint GitHub Actions workflows
        run: make actionlint

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:${{ matrix.language }}

  containers:
    name: Container (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: kernel
            dockerfile: deploy/kernel.Dockerfile
            context: .
          - image: fleet
            dockerfile: deploy/fleet.Dockerfile
            context: .
          - image: ui
            dockerfile: apps/worker/Dockerfile
            context: .
          - image: backup
            dockerfile: deploy/backup.Dockerfile
            context: .
    env:
      IMAGE_REF: boltrig-ci-${{ matrix.image }}:${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        env:
          BUILD_CONTEXT: ${{ matrix.context }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          DOCKER_BUILDKIT=1 docker build --pull \
            --file "$DOCKERFILE" --tag "$IMAGE_REF" "$BUILD_CONTEXT"

      - name: Record complete high and critical vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          scan-type: image
          image-ref: ${{ env.IMAGE_REF }}
          scanners: vuln
          severity: HIGH,CRITICAL
          format: json
          output: vulnerabilities-${{ matrix.image }}.json
          exit-code: "0"

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: image
          image-ref: ${{ env.IMAGE_REF }}
          scanners: vuln
          format: cyclonedx
          output: sbom-${{ matrix.image }}.cdx.json

      - name: Upload scan evidence and SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-${{ matrix.image }}
          path: |
            vulnerabilities-${{ matrix.image }}.json
            sbom-${{ matrix.image }}.cdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Fail on fixable high or critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: image
          image-ref: ${{ env.IMAGE_REF }}
          scanners: vuln
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"
          timeout: 10m
          # Honour the recorded, EXPIRING accepted-advisory list. Without this the
          # file is only consulted for misconfigurations and every vulnerability
          # entry is silently ignored.
          trivyignores: .trivyignore.yaml

  security:
    name: Security gate
    if: ${{ always() }}
    needs: [source-security, codeql, containers]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every security component
        env:
          CODEQL_RESULT: ${{ needs.codeql.result }}
          CONTAINER_RESULT: ${{ needs.containers.result }}
          SOURCE_RESULT: ${{ needs.source-security.result }}
        run: |
          test "$SOURCE_RESULT" = success
          test "$CODEQL_RESULT" = success
          test "$CONTAINER_RESULT" = success
