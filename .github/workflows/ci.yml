# Required CI gate (per [2026] VJS-CC NANKLE-CONSOLIDATION 001, directive D3).
# The binding-invariant gate (K-29/K-30) and the test suite run remotely on every
# push and PR. Make this a REQUIRED status check in branch protection so a
# regression (an unbound claim, a stray marker, a coupling import, a failing test)
# turns the build red and cannot merge.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    # A real Postgres so the security suite + tenant isolation run against the
    # durable PostgresStore, not just in-memory (P0-1 done-when).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: boltrig
          POSTGRES_DB: boltrig
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BOLTRIG_TEST_DATABASE_URL: postgresql://postgres:boltrig@localhost:5432/boltrig
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio aiosqlite
      - name: Invariant binding gate (K-29/K-30, debt 0)
        run: python scripts/check_invariants.py
      - name: Test suite (in-memory + Postgres-backed)
        run: python -m pytest -q

  ui-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build UI
        working-directory: ui
        run: |
          npm install --no-audit --no-fund
          npm run build
