# Required CI gate (per [2026] VJS-CC NANKLE-CONSOLIDATION 001, directive D3).
# The binding-invariant gate (K-29/K-30) and the test suite run remotely on every
# push and PR. Make this a REQUIRED status check in branch protection so a
# regression (an unbound claim, a stray marker, a coupling import, a failing test)
# turns the build red and cannot merge.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    # A real Postgres so the security suite + tenant isolation run against the
    # durable PostgresStore, not just in-memory (P0-1 done-when).
    services:
      postgres:
        # pgvector image, not plain postgres:16: the store schema declares a
        # vector column, so the [postgres] test leg errors at setup without the
        # extension (audit 2026-07-02 H5). Matches the local test container.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: boltrig
          POSTGRES_DB: boltrig
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BOLTRIG_TEST_DATABASE_URL: postgresql://postgres:boltrig@localhost:5432/boltrig
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio aiosqlite
      - name: Invariant binding gate (K-29/K-30, debt 0)
        run: python scripts/check_invariants.py
      - name: Test suite (in-memory + Postgres-backed)
        run: python -m pytest -q

  ui-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install UI deps (frozen lockfile)
        working-directory: ui
        # same flow as ui/Dockerfile and the ui-e2e job: pnpm from the frozen
        # lockfile (ui/ has only pnpm-lock.yaml), scripts off at install, then
        # rebuild esbuild explicitly (its postinstall compiles the native binary)
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm rebuild esbuild
      - name: Build UI
        working-directory: ui
        run: pnpm run build

  # UI browser-test harness ([2026] VJS-COUNTY 2, order
  # 2026-VJS-CC-BOLTRIG-UI-TEST-HARNESS-001): the chromium-only smoke drives the
  # BUILT UI (vite preview over dist) against the real kernel booted with the
  # in-memory store and no turn executor - hermetic, no model keys, no
  # credentials, no egress. Make this a REQUIRED status check in branch
  # protection alongside test-and-gate and ui-build.
  ui-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install kernel (in-memory store, offline)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install UI deps (frozen lockfile)
        working-directory: ui
        # same flow as ui/Dockerfile: scripts off at install, then rebuild
        # esbuild explicitly (its postinstall compiles the native binary)
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm rebuild esbuild
      - name: Install Playwright chromium
        working-directory: ui
        run: npx playwright install --with-deps chromium
      - name: Build UI
        working-directory: ui
        run: pnpm run build
      - name: UI e2e smoke
        working-directory: ui
        run: npx playwright test
