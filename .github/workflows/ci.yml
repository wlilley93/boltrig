# Required CI gate (per [2026] VJS-CC NANKLE-CONSOLIDATION 001, directive D3).
# The binding-invariant gate (K-29/K-30) and the test suite run remotely on every
# push and PR. Make this a REQUIRED status check in branch protection so a
# regression (an unbound claim, a stray marker, a coupling import, a failing test)
# turns the build red and cannot merge.
name: ci

permissions:
  contents: read
  # Read-only. ui/ depends on @wlilley93/boltrig-web-sdk, published to GitHub
  # Packages, so `pnpm install` needs an authenticated registry or it fails with
  # ERR_PNPM_FETCH_401. Same owner, no new credential class.
  packages: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # A real Postgres so the security suite + tenant isolation run against the
    # durable PostgresStore, not just in-memory (P0-1 done-when).
    services:
      postgres:
        # pgvector image, not plain postgres:16: the store schema declares a
        # vector column, so the [postgres] test leg errors at setup without the
        # extension (audit 2026-07-02 H5). Matches the local test container.
        image: pgvector/pgvector:pg16@sha256:131dcf7ff6a900545df8e7e092c270aa8c6db2f2c818e408cb45ec21316b74e6
        env:
          POSTGRES_PASSWORD: boltrig
          POSTGRES_DB: boltrig
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BOLTRIG_TEST_DATABASE_URL: postgresql://postgres:boltrig@localhost:5432/boltrig
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --require-hashes -r requirements-dev-lock.txt
      - name: Python quality gate (invariants, lint, strict types, Postgres, coverage)
        run: make python-quality PY=python
      # `make quality` calls itself "the complete local release gate", and these two
      # of its components ran in NO workflow until 2026-07-26: the Alembic-head vs
      # schema.sql parity check and the secure-posture doctor fixture were local-only,
      # so the aggregate was complete on one developer's machine and not in CI.
      # scripts/check_gate_coverage.py now keeps that honest.
      - name: Migration parity (Alembic head vs schema.sql)
        run: make migration-parity PY=python
      - name: Secure production-doctor fixture
        run: make doctor-fixture PY=python

  ui-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      # pnpm cannot fetch the scoped @wlilley93 package anonymously; the committed
      # ui/.npmrc points the scope at GitHub Packages but carries no token. Write
      # a user-level token file for the install, then remove it.
      - name: Authenticate pnpm to GitHub Packages
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          umask 077
          printf '//npm.pkg.github.com/:_authToken=%s\n' "$GH_PACKAGES_TOKEN" >> "$HOME/.npmrc"
      - name: UI quality gate (lock, audit, types, coverage, bundle budget)
        run: make ui-quality
      - name: Remove the registry token
        if: always()
        run: rm -f "$HOME/.npmrc"

  site-build-test-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: Site quality gate (lock, audit, lint, coverage, build)
        run: make site-quality

  # UI browser-test harness ([2026] VJS-COUNTY 2, order
  # 2026-VJS-CC-BOLTRIG-UI-TEST-HARNESS-001): the chromium-only smoke drives the
  # BUILT UI (vite preview over dist) against the real kernel booted with the
  # in-memory store and no turn executor - hermetic, no model keys, no
  # credentials, no egress. Make this a REQUIRED status check in branch
  # protection alongside test-and-gate, ui-build, and site-build-test-lint.
  ui-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install kernel (in-memory store, offline)
        run: python -m pip install --require-hashes -r requirements-lock.txt
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      # pnpm cannot fetch the scoped @wlilley93 package anonymously; the committed
      # ui/.npmrc points the scope at GitHub Packages but carries no token. Write
      # a user-level token file for the install, then remove it.
      - name: Authenticate pnpm to GitHub Packages
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          umask 077
          printf '//npm.pkg.github.com/:_authToken=%s\n' "$GH_PACKAGES_TOKEN" >> "$HOME/.npmrc"
      - name: UI e2e smoke (built artifact, explicit preview bind)
        run: make ui-e2e PY=python PLAYWRIGHT_INSTALL_ARGS="--with-deps chromium"
      - name: Remove the registry token
        if: always()
        run: rm -f "$HOME/.npmrc"

  compose-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # The target shells out to the release validators via $(PY), which defaults
      # to .venv/bin/python and does not exist on a bare runner - that was an
      # exit-127 "command not found", not a Compose error. Both validators are
      # stdlib-only, so an interpreter is enough; no dependency install needed.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Validate base and secure Compose configurations
        run: make compose-validate PY=python

  # One required branch-protection check. Each parallel job invokes the same
  # component target used by `make quality`; this aggregator fails unless every
  # component succeeds.
  quality:
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    needs:
      - test-and-gate
      - ui-build
      - site-build-test-lint
      - ui-e2e
      - compose-validate
    steps:
      - name: Require every quality component
        run: |
          test "${{ needs.test-and-gate.result }}" = success
          test "${{ needs.ui-build.result }}" = success
          test "${{ needs.site-build-test-lint.result }}" = success
          test "${{ needs.ui-e2e.result }}" = success
          test "${{ needs.compose-validate.result }}" = success
