# Required CI gate (per [2026] VJS-CC NANKLE-CONSOLIDATION 001, directive D3).
# The binding-invariant gate (K-29/K-30) and the test suite run remotely on every
# push and PR. Make this a REQUIRED status check in branch protection so a
# regression (an unbound claim, a stray marker, a coupling import, a failing test)
# turns the build red and cannot merge.
name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # A real Postgres so the security suite + tenant isolation run against the
    # durable PostgresStore, not just in-memory (P0-1 done-when).
    services:
      postgres:
        # pgvector image, not plain postgres:16: the store schema declares a
        # vector column, so the [postgres] test leg errors at setup without the
        # extension (audit 2026-07-02 H5). Matches the local test container.
        image: pgvector/pgvector:pg16@sha256:131dcf7ff6a900545df8e7e092c270aa8c6db2f2c818e408cb45ec21316b74e6
        env:
          POSTGRES_PASSWORD: boltrig
          POSTGRES_DB: boltrig
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BOLTRIG_TEST_DATABASE_URL: postgresql://postgres:boltrig@localhost:5432/boltrig
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # `make commit-trailers` reads commit MESSAGES, so it needs history.
          # actions/checkout defaults to depth 1: the gate would see one commit,
          # find no trailer, and REFUSE - correctly, since a scan with nothing to
          # check is a broken scan. Verified against a real --depth 1 clone.
          # Only this job needs it; the other jobs stay shallow.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --require-hashes -r requirements-dev-lock.txt
      - name: Python quality gate (invariants, lint, strict types, Postgres, coverage)
        run: make python-quality PY=python
      - name: Public product boundary (BYO providers, stock companions)
        run: make public-product-validate PY=python
      # `make quality` calls itself "the complete local release gate", and these two
      # of its components ran in NO workflow until 2026-07-26: the Alembic-head vs
      # schema.sql parity check and the secure-posture doctor fixture were local-only,
      # so the aggregate was complete on one developer's machine and not in CI.
      # scripts/check_gate_coverage.py now keeps that honest.
      - name: Migration parity (Alembic head vs schema.sql)
        run: make migration-parity PY=python
      - name: Secure production-doctor fixture
        run: make doctor-fixture PY=python

  worker-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # The event supplies the immutable pre-change commit. The structural gate
      # loads its prior debt catalogue from this Git object, never from a
      # contributor-controlled second working-tree file.
      WORKER_STRUCTURE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Worker quality gate (lock, structure, audit, types, contracts, web bundle)
        run: make worker-quality

  worker-desktop-package:
    name: Worker desktop package (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            # Tauri recommends the oldest supported WebKitGTK 4.1 baseline so
            # AppImage/DEB glibc requirements do not accidentally jump forward.
            runner: ubuntu-22.04
          - platform: macos-arm64
            runner: macos-15
          - platform: windows-x86_64
            runner: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install Linux desktop build dependencies
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          test "$(rustc --version | awk '{print $2}')" = 1.97.1
      - name: Install the frozen Worker dependency graph
        working-directory: apps/worker
        run: |
          corepack enable
          corepack prepare pnpm@11.5.0 --activate
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm rebuild esbuild
      - name: Test the native desktop boundary
        run: cargo test --locked --manifest-path apps/worker/src-tauri/Cargo.toml
      - name: Build an unsigned installer without release secrets
        working-directory: apps/worker
        run: pnpm run tauri build --ci --config src-tauri/tauri.ci.conf.json
      - name: Require a real installer and prove no updater signature was minted
        run: |
          bundle=apps/worker/src-tauri/target/release/bundle
          test -d "$bundle"
          case "$RUNNER_OS" in
            Linux)
              test -n "$(find "$bundle" -type f \( -name '*.AppImage' -o -name '*.deb' \) -print -quit)"
              ;;
            macOS)
              test -n "$(find "$bundle" -type f -name '*.dmg' -print -quit)"
              ;;
            Windows)
              test -n "$(find "$bundle" -type f \( -name '*.msi' -o -name '*-setup.exe' \) -print -quit)"
              ;;
          esac
          if find "$bundle" -type f -name '*.sig' -print -quit | grep -q .; then
            echo "pull-request packaging unexpectedly minted an updater signature" >&2
            exit 1
          fi

  site-build-test-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Site quality gate (lock, audit, lint, coverage, build)
        run: make site-quality

  compose-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The target shells out to the release validators via $(PY), which defaults
      # to .venv/bin/python and does not exist on a bare runner - that was an
      # exit-127 "command not found", not a Compose error. Both validators are
      # stdlib-only, so an interpreter is enough; no dependency install needed.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate base and secure Compose configurations
        run: make compose-validate PY=python

  # One required branch-protection check. Each parallel job invokes the same
  # component target used by `make quality`; this aggregator fails unless every
  # component succeeds.
  quality:
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    needs:
      - test-and-gate
      - worker-build
      - worker-desktop-package
      - site-build-test-lint
      - compose-validate
    steps:
      - name: Require every quality component
        run: |
          test "${{ needs.test-and-gate.result }}" = success
          test "${{ needs.worker-build.result }}" = success
          test "${{ needs.worker-desktop-package.result }}" = success
          test "${{ needs.site-build-test-lint.result }}" = success
          test "${{ needs.compose-validate.result }}" = success
