version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - python

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/London
    open-pull-requests-limit: 5
    groups:
      ui-minor-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - ui

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/London
    open-pull-requests-limit: 5
    groups:
      site-minor-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - site

  - package-ecosystem: pip
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
      time: "06:40"
      timezone: Europe/London
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - python

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Europe/London
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - containers

  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
      time: "07:15"
      timezone: Europe/London
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - containers

  - package-ecosystem: docker
    directory: /ui
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
      timezone: Europe/London
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - containers

  - package-ecosystem: docker
    directory: /services/pi_sidecar
    schedule:
      interval: weekly
      day: monday
      time: "07:45"
      timezone: Europe/London
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - containers
