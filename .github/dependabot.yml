version: 2

# GitHub Packages, for the first-party @wlilley93/boltrig-web-sdk that ui/.npmrc
# scopes there. WITHOUT THIS the /ui npm ecosystem fails 100% of its runs:
#
#   Error while accessing npm.pkg.github.com ... {"error":"authentication token
#   not provided"}
#   Handled error whilst updating vite: private_source_authentication_failure
#
# and the failure is per-DEPENDENCY, so NOTHING in /ui gets updated - nine errors
# in one run, none of them about the SDK. It failed silently for as long as it has
# existed, because a failed Dependabot job is not a failed CI check and nothing
# read its verdict (see #134, which also found `docker in /.` dead the same way).
#
# GITHUB_TOKEN is NOT available to Dependabot the way it is to Actions, so this
# needs a Dependabot secret. It wants ONE scope, `read:packages`, and nothing else:
#
#   gh secret set GH_PACKAGES_READ_TOKEN --app dependabot --repo wlilley93/boltrig
#
# Until that secret exists the ecosystem keeps failing. It may now name the missing
# secret rather than the missing token - which would be an improvement, since the
# current error blames npm.pkg.github.com and reads like an upstream outage. Either
# way it was failing before and fails after, so this block risks nothing and leaves
# a paste rather than an investigation. NOT verified, because verifying it means
# pushing and watching a scheduled run; if it turns out to fail more loudly, that is
# the intended direction.
registries:
  npm-github:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{secrets.GH_PACKAGES_READ_TOKEN}}

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types:
          - minor
          - patch
    # pydantic-core is NOT independently bumpable. `pydantic` pins its core
    # EXACTLY (pydantic==2.13.4 requires pydantic-core==2.46.4), so a PR raising
    # only the core produces a lock pip cannot resolve at all:
    #
    #   ERROR: Cannot install -r requirements-dev-lock.txt (line 1950) and
    #   pydantic-core==2.47.0 because these package versions have conflicting
    #   dependencies.
    #
    # That was PR #113, a 34-package group made unmergeable by one line, and it
    # would have come back every Monday. Ignoring the core does not freeze it:
    # it moves when `pydantic` moves and the lock is RECOMPILED, which is the
    # only way it can move correctly. Same shape as the aiohttp override that
    # shipped inert - dependabot edits one line of a lock, and a lock is a
    # solved system, not a list.
    #
    # The same shape, four more times: #145 #146 #147 #148, all four opened on
    # 2026-07-27 and all four failing every check. Proof that they are not merely
    # broken but IMPOSSIBLE: `make relock UPGRADE=--upgrade` re-solves the whole
    # system with every upgrade allowed, and it holds all four at exactly the
    # versions those PRs try to raise. The resolver, given free rein, refuses them.
    # Asked why:
    #
    #   gunicorn>=24            cognee>=1.2.0 depends on gunicorn>=20.1.0,<24
    #   limits>=5               cognee>=1.2.0 depends on limits>=4.4.1,<5
    #   packaging>=25           limits<5 depends on packaging>=21,<25 (via cognee)
    #   importlib-metadata>=9   litellm 1.83.x depends on importlib-metadata==8.5.0
    #
    # Three of the four are one constraint wearing different hats: `cognee` bounds
    # this graph. Dependabot cannot see any of it, because it reasons per-package
    # against a flat file where every pin in a `uv` output looks direct.
    #
    # Bounded at the CONSTRAINT, not by name. A bare `dependency-name` ignore would
    # also suppress `gunicorn 23.0.0 -> 23.0.1`, so a security patch inside the
    # permitted range would go unproposed - trading a weekly void PR for a silent
    # hole. These ranges reopen the moment the bound moves: raise cognee or litellm,
    # `make relock`, and the pins follow as part of one solution, which is the only
    # way they can move correctly.
    ignore:
      - dependency-name: pydantic-core
      - dependency-name: gunicorn
        versions: [">=24"]
      - dependency-name: limits
        versions: [">=5"]
      - dependency-name: packaging
        versions: [">=25"]
      - dependency-name: importlib-metadata
        versions: [">=9"]
      # ruff is held at 0.15.x by pyproject's dev group, for a reason written
      # there: 0.16 widens ruff's DEFAULT rule set, so taking it turns on new
      # families wholesale and that is a linter upgrade, not a relock. The hold
      # alone was not enough, because #144 arrived as a GROUP and dependabot
      # raised the pyproject bound inside it - so one held package failed every
      # check on a PR that also carried click, mypy and openai. A group is only
      # as mergeable as its most constrained member. Ignored here so the rest of
      # the group can land; lift both this and the pyproject bound together, in
      # the change that decides which of those rule families we want.
      - dependency-name: ruff
        versions: [">=0.16"]
    #
    # THE SAME AGAIN, and now the pattern rather than the instances. Within minutes
    # of the ignores above taking effect dependabot opened #157 and #158, carrying
    # exactly the six packages the previous re-solve had already refused. Every one
    # is TRANSITIVE - none is declared in pyproject - and all six trace to one
    # package bounding the graph:
    #
    #   instructor>=1.15.3    cognee 1.4.0 depends on instructor>=1.9.1,<1.15.3
    #   ladybug>=0.18         cognee 1.4.0 depends on ladybug>=0.16.0,<0.18
    #   rdflib>=7.2.0         cognee 1.4.0 depends on rdflib>=7.1.4,<7.2.0
    #   jiter>=0.14           instructor (bounded above) depends on jiter>=0.6.1,<0.14
    #   rich>=15              instructor (bounded above) depends on rich>=13.7.0,<15.0.0
    #   grpcio-tools>=1.82.1  needs protobuf>=7.35.1, which hatchet-sdk forbids
    #
    # cognee is ALREADY at the latest release (1.4.0), so these are not staleness
    # waiting to be upgraded away - they are what this graph requires today. The
    # bumps are impossible, not merely failing, and they would have returned every
    # Monday indefinitely.
    #
    # Bounds are the upstream constraints, not round numbers, and grpcio-tools was
    # measured rather than guessed: 1.82.0 solves and 1.82.1 does not, so 1.82.0 is
    # still offered. Every one of these reopens by itself the moment its bound moves
    # and the lock is recompiled - which is the only way a derived lock can move.
      - dependency-name: instructor
        versions: [">=1.15.3"]
      - dependency-name: ladybug
        versions: [">=0.18"]
      - dependency-name: rdflib
        versions: [">=7.2.0"]
      - dependency-name: jiter
        versions: [">=0.14"]
      - dependency-name: rich
        versions: [">=15"]
      - dependency-name: grpcio-tools
        versions: [">=1.82.1"]
    #
    # A THIRD round, 2026-08-06, and it is the same cognee bound wearing a new name.
    # #218 raised websockets 15.0.1 -> 17.0 and failed EIGHT checks, which reads like
    # broad breakage until the resolver is asked:
    #
    #   websockets>=16   cognee>=1.2.0 depends on websockets>=15.0.1,<16.0.0
    #
    # The bound is <16, so this ignores >=16 and NOT the >=17 dependabot happened to
    # offer. Pinning at the offered version leaves 16.x to be re-proposed next Monday
    # and refused for the identical reason, which is how a bound becomes a weekly
    # chore. `uv pip compile --upgrade` over the whole graph holds websockets at
    # exactly 15.0.1 with every upgrade allowed: the same impossibility proof as above.
      - dependency-name: websockets
        versions: [">=16"]
    #
    # mcp is bounded for a DIFFERENT and more dangerous reason. The only mcp in this
    # repository is one line of deploy/browser-cli-overrides.txt, and that line is a
    # SECURITY FIX rather than a version. browser-use==0.13.7 pins mcp==1.26.0
    # exactly, which carries PYSEC-2026-3481/3482/3483; the override raises it to
    # 1.28.1 to close all three. Dependabot proposed 2.0.0 against it as #219 AND
    # #221, the same one-line diff twice, because the pip ecosystem is registered at
    # both / and /deploy and that file is reachable from both scans.
    #
    # Taking either is unsatisfiable (browser-use==0.13.7 depends on mcp==1.26.0) and
    # would replace a deliberate advisory closure with a major bump upstream itself
    # tells you to avoid: "if your project is not ready to migrate, keep a <2 upper
    # bound". Bounded at >=2 rather than by name so 1.x security patches still
    # arrive, which is the mechanism that produced 1.28.1 in the first place.
      - dependency-name: mcp
        versions: [">=2"]
    #
    # cognee 1.4.1 REOPENS A SECURITY ADVISORY, which is why it is bounded rather
    # than merely failing. It requires cryptography<50, and cryptography 50.0.0 is
    # what closes PYSEC-2026-3552 - taken on 2026-08-05 for exactly that reason.
    #
    # That is what made #238 unresolvable rather than merely wrong. It arrived as a
    # GROUP of 8, and re-solving the graph properly with all 8 allowed silently
    # pulled cryptography 50.0.0 back to 49.0.0. The lock resolves; the audit then
    # fails. A group is only as mergeable as its most constrained member, and this
    # member's constraint is a live advisory.
    #
    # Measured, not inferred: `uv pip compile --upgrade-package cognee ...
    # --constraint 'cryptography>=50'` holds cognee at 1.4.0. The bound lifts by
    # itself the moment cognee raises its own cryptography ceiling.
      - dependency-name: cognee
        versions: [">=1.4.1"]
    labels:
      - dependencies
      - python

  - package-ecosystem: npm
    directory: /ui
    # ui/.npmrc scopes @wlilley93 at npm.pkg.github.com; without the registry
    # below Dependabot cannot install and updates NOTHING here.
    registries:
      - npm-github
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/London
    open-pull-requests-limit: 5
    groups:
      ui-minor-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - ui

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/London
    open-pull-requests-limit: 5
    groups:
      site-minor-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - site
    # @types/node MAJOR is pinned to the Node CI actually runs (22). Dependabot
    # offered 26 twice; types ahead of the runtime make `tsc` accept a `node:`
    # API that throws, so the green check proves the site COMPILES rather than
    # that it RUNS. This moves when the workflows' node-version does, together,
    # deliberately - see .github/workflows/ci.yml:72,97,121.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
      time: "06:40"
      timezone: Europe/London
    open-pull-requests-limit: 3
    # The twin of the mcp bound in the root pip ecosystem above, and it has to be
    # written twice because deploy/browser-cli-overrides.txt is reachable from BOTH
    # scans. #219 (this ecosystem) and #221 (the root one) were the same one-line
    # diff, opened four minutes apart, against a pin whose whole purpose is to sit
    # where it is. An ignore in only one place halves the noise and fixes nothing.
    ignore:
      - dependency-name: mcp
        versions: [">=2"]
    labels:
      - dependencies
      - python

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Europe/London
    open-pull-requests-limit: 5
    # Grouped, unlike the default, because some actions MUST move in lockstep and
    # arrive un-mergeable otherwise. codeql-action/init and codeql-action/analyze
    # 4.37.0 -> 4.37.3 came as two PRs on 2026-07-27 and each failed with the mirror
    # of the same error: whichever half was bumped ran a config the other half did
    # not understand. Neither could ever go green alone, so both sat open until
    # somebody noticed they were one change wearing two numbers.
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - ci

  # `directory: /` was here and had NEVER produced anything: there is no
  # Dockerfile at the repo root, so every run aborted with
  #   ERROR: No Dockerfiles nor Kubernetes YAML found in /
  # It failed 100% of its runs, silently, because a failed Dependabot job is not
  # a failed CI check and nothing was reading its verdict. The Dockerfiles the
  # repository actually ships live under services/ and deploy/, so it is pointed
  # at the ones that were uncovered.
  - package-ecosystem: docker
    directory: /services/channel_gateway
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    # python MAJOR is pinned to the interpreter this project actually runs. The
    # Dockerfile builds on python:3.12.13-slim-bookworm, pyproject declares
    # requires-python ">=3.12", CI runs 3.12 at all three job sites, and the
    # Linux venv the macOS quality gate uses is 3.12.13 as well. #229 offered
    # 3.14.0, which would have shipped a SERVICE IMAGE on an interpreter no gate
    # has ever executed. Same shape as the node bound below and the /site
    # @types/node bound above: the runtime moves deliberately, in a change that
    # moves the gates with it. 3.12.x patches still arrive, which is where the
    # interpreter CVEs land.
    ignore:
      - dependency-name: python
        update-types:
          - version-update:semver-major
    labels:
      - dependencies
      - containers

  - package-ecosystem: docker
    directory: /services/channel_gateway/whatsapp_bridge
    schedule:
      interval: weekly
      day: monday
      time: "07:05"
      timezone: Europe/London
    open-pull-requests-limit: 5
    # node MAJOR is held on the LTS line. The Dockerfile pins node:22-alpine and
    # 22 is LTS; #234 offered 25, which is an ODD-numbered release and therefore
    # never becomes LTS - it stops receiving fixes when the next current line
    # opens. It went green, which is the point: CI cannot tell you that a
    # runtime is supported for as long as this service will run. Moving a
    # production service off LTS is a decision, not a dependency update. Patches
    # and the next EVEN major both still need a person.
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major
    labels:
      - dependencies
      - containers

  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
      time: "07:15"
      timezone: Europe/London
    open-pull-requests-limit: 5
    # Two runtimes held at the versions the rest of the stack actually runs.
    #
    # postgres: the stack's database is pgvector/pgvector:pg16, pinned by digest
    # in docker-compose.yml. #232 offered postgres 18.3 here, which would have
    # put the deploy image two majors ahead of the data it talks to. A Postgres
    # major is a dump-and-restore with a downtime window, never a lockfile edit.
    #
    # python: same bound as /services/channel_gateway above - 3.12 is what
    # pyproject requires, what CI runs, and what the quality gate's venv is.
    ignore:
      - dependency-name: postgres
        update-types:
          - version-update:semver-major
      - dependency-name: python
        update-types:
          - version-update:semver-major
    labels:
      - dependencies
      - containers

  - package-ecosystem: docker
    directory: /ui
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
      timezone: Europe/London
    open-pull-requests-limit: 3
    # nginx is deliberately pinned to the STABLE branch (1.30.x), not mainline.
    # Measured 2026-07-27: nginx 1.30.4 and 1.31.3 shipped the same day and fix the
    # identical three advisories (CVE-2026-42533, CVE-2026-60005, CVE-2026-56434),
    # so the mainline bump dependabot kept proposing bought no security at all and
    # cost the stable branch's slower-moving surface. Patch updates within 1.30.x
    # still arrive; a branch move needs a person.
    ignore:
      - dependency-name: nginx
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      # node MAJOR is pinned to the Node this project actually runs. ui/Dockerfile
      # builds on node:22.23.1-alpine3.24 and .github/workflows/ci.yml sets
      # node-version "22" at FIVE sites, so #223's jump to 26.5.1 would have built
      # the image on a runtime no gate has ever exercised. This is the same fork the
      # /site ecosystem already records for @types/node, from the other side: there,
      # types ahead of the runtime make tsc accept a `node:` API that throws; here,
      # the runtime itself moves ahead of every check that could catch it.
      #
      # One decision, three files. It moves when ui/Dockerfile and the five
      # node-version lines move together, deliberately, in a change that says so.
      # Patches within 22.x still arrive, which is where the base-image CVEs land.
      - dependency-name: node
        update-types:
          - version-update:semver-major
    labels:
      - dependencies
      - containers

